<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script>
    (function () {
      try {
        var preference = localStorage.getItem('ui-theme');
        if (preference !== 'light' && preference !== 'dark' && preference !== 'system') preference = 'system';
        var isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = preference === 'system' ? (isDark ? 'dark' : 'light') : preference;
        var root = document.documentElement;
        root.dataset.themePreference = preference;
        root.dataset.theme = theme;
        root.style.colorScheme = theme;
        root.classList.toggle('dark', theme === 'dark');
      } catch (error) {
        document.documentElement.dataset.themePreference = 'system';
        document.documentElement.dataset.theme = 'light';
        document.documentElement.style.colorScheme = 'light';
      }
    })();
  </script>

  <style>
    /* 词汇汇总页专属样式：只用设计系统令牌（--w-* 等）和 plain.css 的 ui- 组件，类名统一 vs- 前缀。 */
    html.vs-lock { overflow: hidden; }
    .vs-main { padding: 26px 0 64px 0; }
    .vs-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    .vs-grow { flex: 1 1 auto; }

    /* ---------- 页头 ---------- */
    .vs-back { display: inline-flex; align-items: center; gap: 2px; margin: 0 0 10px -4px; font-size: var(--w-fs-meta); color: var(--w-ink3); text-decoration: none; }
    .vs-back:hover { color: var(--w-ink); }
    .vs-head {
      display: flex; align-items: flex-end; justify-content: space-between; gap: 24px;
      padding-bottom: 24px; margin-bottom: 24px; border-bottom: 1px solid var(--w-line);
    }
    .vs-head__main { min-width: 0; }
    .vs-head__title { margin: 0; font-size: var(--w-fs-title); font-weight: 600; line-height: 1.35; color: var(--w-ink); }
    .vs-head__desc { margin: 6px 0 0 0; font-size: var(--w-fs-ui); color: var(--w-ink2); }
    .vs-head__tools { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }

    /* ---------- 导出菜单 ---------- */
    .vs-menu-wrap { position: relative; }
    .vs-menu {
      position: absolute; top: calc(100% + 6px); right: 0; z-index: 1100; width: 260px; padding: 6px;
      background: var(--w-surface); border: 1px solid var(--w-line); border-radius: var(--w-r-card); box-shadow: var(--w-shadow-lg);
    }
    .vs-menu button {
      width: 100%; display: flex; flex-direction: column; align-items: flex-start; gap: 1px; padding: 9px 12px;
      border: none; border-radius: var(--w-r-inner); background: transparent; text-align: left; cursor: pointer;
    }
    .vs-menu button:hover:not(:disabled), .vs-menu button:focus-visible { background: var(--w-sunken); outline: none; }
    .vs-menu button:disabled { opacity: .55; cursor: not-allowed; }
    .vs-menu b { font-size: var(--w-fs-ui); font-weight: 600; color: var(--w-ink); }
    .vs-menu span { font-size: var(--w-fs-meta); color: var(--w-ink3); }

    /* ---------- 主体：左边文章，右边词 ---------- */
    .vs-body { display: grid; grid-template-columns: var(--rail-w) minmax(0, 1fr); gap: var(--gap-18); align-items: start; }
    .vs-rail {
      position: sticky; top: calc(var(--app-shell-h, 56px) + 16px);
      max-height: calc(100vh - var(--app-shell-h, 56px) - 32px);
      display: flex; flex-direction: column; gap: 12px; min-width: 0;
    }
    .vs-seg {
      height: 40px; flex-shrink: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px;
      border-radius: var(--w-r-chip); background: var(--w-big-track);
    }
    .vs-seg button {
      min-width: 0; padding: 0 4px; border: none; border-radius: var(--w-r-chip); background: transparent;
      font-size: var(--w-fs-meta); color: var(--w-ink2); cursor: pointer; white-space: nowrap; transition: background .15s, color .15s;
    }
    .vs-seg button:hover { color: var(--w-ink); }
    .vs-seg button.active { background: var(--w-surface); color: var(--w-ink); font-weight: 600; box-shadow: 0 0 0 1px var(--w-line); }
    .vs-seg button:focus-visible { outline: none; box-shadow: var(--w-ring); }
    .vs-seg__n { margin-left: 3px; font-weight: 400; color: var(--w-ink3); font-variant-numeric: tabular-nums; }
    .vs-arts { display: flex; flex-direction: column; gap: 4px; min-height: 0; overflow: auto; margin: 0 -4px; padding: 0 4px; }
    .vs-art {
      width: 100%; display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; text-align: left;
      border: 1px solid transparent; border-radius: var(--w-r-card); background: transparent; cursor: pointer;
      transition: background .15s, border-color .15s;
    }
    .vs-art:hover { background: var(--w-sunken); }
    .vs-art:focus-visible { outline: none; box-shadow: var(--w-ring); }
    .vs-art.active { background: var(--w-big-soft); border-color: var(--w-big-line); }
    .vs-art__title {
      font-size: var(--w-fs-ui); line-height: 1.45; color: var(--w-ink); overflow-wrap: anywhere;
      overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    }
    .vs-art__meta { font-size: var(--w-fs-meta); color: var(--w-ink3); font-variant-numeric: tabular-nums; }
    .vs-art.active .vs-art__title { color: var(--w-big); font-weight: 600; }
    .vs-art.active .vs-art__meta { color: var(--w-big); }
    .vs-rail__note { margin: 0 12px; font-size: var(--w-fs-meta); line-height: 1.6; color: var(--w-ink3); }
    .vs-rail__msg { padding: 14px 12px; font-size: var(--w-fs-meta); line-height: 1.7; color: var(--w-ink3); }

    .vs-pane { min-width: 0; }
    .vs-pane__head { height: 40px; display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
    .vs-pane__title { margin: 0; min-width: 0; font-size: var(--w-fs-en); font-weight: 600; color: var(--w-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .vs-pane__count { flex-shrink: 0; font-size: var(--w-fs-meta); color: var(--w-ink3); font-variant-numeric: tabular-nums; }
    .vs-pane__open { flex-shrink: 0; display: inline-flex; align-items: center; gap: 2px; font-size: var(--w-fs-meta); color: var(--w-big); text-decoration: none; }
    .vs-pane__open:hover { text-decoration: underline; }
    .vs-search { position: relative; margin-left: auto; flex-shrink: 0; width: 260px; }
    .vs-search svg { position: absolute; left: 12px; top: 12px; color: var(--w-ink3); pointer-events: none; }
    .vs-search .ui-input { padding-left: 36px; }
    .vs-search .ui-input::-webkit-search-cancel-button { cursor: pointer; }
    .vs-pane__tip { margin: 14px 0 0 0; font-size: var(--w-fs-meta); color: var(--w-ink3); }

    .vs-words { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .vs-word {
      display: flex; flex-direction: column; gap: 4px; min-width: 0; padding: 14px 16px;
      border: 1px solid var(--w-line); border-radius: var(--w-r-card); background: var(--w-surface); cursor: pointer;
      transition: border-color .15s;
    }
    .vs-word:hover { border-color: var(--w-big-line); }
    .vs-word.is-playing { border-color: var(--w-big-line); background: var(--w-big-soft); }
    .vs-word__top { display: flex; align-items: center; gap: 8px; }
    .vs-word__en { flex: 1 1 auto; min-width: 0; font-family: var(--font-en); font-size: var(--w-fs-en); font-weight: 600; line-height: 1.4; color: var(--w-ink); overflow-wrap: anywhere; }
    .vs-word__zh { font-size: var(--w-fs-ui); line-height: 1.6; color: var(--w-ink2); overflow-wrap: anywhere; }
    .vs-word__zh.is-empty { color: var(--w-ink3); }
    .vs-words > .ui-empty { grid-column: 1 / -1; border: 1px dashed var(--w-line); border-radius: var(--w-r-card); }
    .vs-ibtn {
      width: 30px; height: 30px; flex-shrink: 0; padding: 0; display: inline-flex; align-items: center; justify-content: center;
      border: 1px solid var(--w-line); border-radius: var(--w-r-round); background: var(--w-surface); color: var(--w-ink2); cursor: pointer;
      transition: border-color .15s, background .15s, color .15s;
    }
    .vs-ibtn:hover { border-color: var(--w-big-line); background: var(--w-big-soft); color: var(--w-big); }
    .vs-ibtn:focus-visible { outline: none; box-shadow: var(--w-ring); }
    .vs-ibtn:disabled { opacity: .55; cursor: not-allowed; }

    /* ---------- 弹窗（外壳是 plain.css 的 ui-dialog） ---------- */
    .vs-dlg { display: flex; flex-direction: column; overflow: hidden; padding: 0; }
    .vs-dlg:focus { outline: none; }
    .vs-dlg--setup, .vs-dlg--result { width: min(640px, 100%); }
    .vs-dlg--game { width: min(600px, 100%); }
    .vs-dlg--history { width: min(760px, 100%); height: min(700px, calc(100vh - 48px)); }
    .vs-dlg__head { display: flex; align-items: flex-start; gap: 14px; padding: 20px 24px 16px 24px; border-bottom: 1px solid var(--w-line); flex-shrink: 0; }
    .vs-dlg__head > div { flex: 1 1 auto; min-width: 0; }
    .vs-dlg__title { margin: 0; font-size: var(--w-fs-en); font-weight: 600; color: var(--w-ink); }
    .vs-dlg__sub { margin: 2px 0 0 0; font-size: var(--w-fs-meta); color: var(--w-ink3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .vs-dlg__body { flex: 1 1 auto; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 20px; padding: 20px 24px; }
    .vs-dlg__foot { display: flex; align-items: center; gap: 10px; padding: 14px 24px; border-top: 1px solid var(--w-line); flex-shrink: 0; }
    .vs-dlg__summary { flex: 1 1 auto; min-width: 0; font-size: var(--w-fs-meta); color: var(--w-ink2); }
    .vs-dlg__summary b { font-weight: 600; color: var(--w-ink); font-variant-numeric: tabular-nums; }
    .vs-close {
      width: 32px; height: 32px; flex-shrink: 0; padding: 0; display: inline-flex; align-items: center; justify-content: center;
      border: 1px solid var(--w-line); border-radius: var(--w-r-round); background: var(--w-surface); color: var(--w-ink2); cursor: pointer;
    }
    .vs-close:hover { border-color: var(--w-big-line); background: var(--w-big-soft); color: var(--w-big); }
    .vs-close:focus-visible { outline: none; box-shadow: var(--w-ring); }
    .vs-label { font-size: var(--w-fs-meta); color: var(--w-ink2); }
    .vs-block { display: flex; flex-direction: column; gap: 10px; }
    .vs-hint { margin: 0; font-size: var(--w-fs-meta); color: var(--w-ink3); }
    .vs-err { margin: 0; padding: 10px 12px; border: 1px solid var(--w-err-line); border-radius: var(--w-r-inner); background: var(--w-err-soft); color: var(--w-err); font-size: var(--w-fs-meta); }
    .vs-text-btn { height: 40px; padding: 0 6px; border: none; background: transparent; color: var(--w-ink3); font-size: var(--w-fs-ui); cursor: pointer; }
    .vs-text-btn:hover { color: var(--w-ink); }

    /* 开始挑战 */
    .vs-filter { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .vs-filter .vs-label { margin-right: 6px; }
    .vs-filter .ui-chip:disabled { opacity: .55; cursor: not-allowed; }
    .vs-check { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; font-size: var(--w-fs-meta); color: var(--w-ink2); cursor: pointer; }
    .vs-check input, .vs-pick input { width: 16px; height: 16px; margin: 0; flex-shrink: 0; accent-color: var(--w-big); cursor: pointer; }
    .vs-pick { max-height: 280px; overflow: auto; border: 1px solid var(--w-line); border-radius: var(--w-r-inner); }
    .vs-pick__row { min-height: 46px; display: flex; align-items: center; gap: 12px; padding: 6px 14px; cursor: pointer; }
    .vs-pick__row + .vs-pick__row { border-top: 1px solid var(--w-line); }
    .vs-pick__row:hover { background: var(--w-sunken); }
    .vs-pick__row.is-on { background: var(--w-big-soft); }
    .vs-pick__title { flex: 1 1 auto; min-width: 0; font-size: var(--w-fs-ui); color: var(--w-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .vs-pick__n { flex-shrink: 0; width: 56px; text-align: right; font-size: var(--w-fs-meta); color: var(--w-ink3); font-variant-numeric: tabular-nums; }
    .vs-pick__cat { flex-shrink: 0; width: 82px; display: flex; justify-content: flex-end; }
    .vs-pick__cat .ui-tag { padding: 1px 8px; font-weight: 400; }
    .vs-pick .vs-rail__msg { text-align: center; }
    .vs-count { display: flex; align-items: center; gap: 16px; }
    .vs-count .ui-input { width: 76px; flex-shrink: 0; font-variant-numeric: tabular-nums; }
    .vs-count input[type="range"] { flex: 1 1 auto; min-width: 0; accent-color: var(--w-big); }
    .vs-count span { flex-shrink: 0; font-size: var(--w-fs-meta); color: var(--w-ink3); }

    /* 答题 */
    .vs-game__head { display: flex; align-items: center; gap: 12px; padding: 18px 24px 14px 24px; }
    .vs-game__progress { font-size: var(--w-fs-meta); color: var(--w-ink3); font-variant-numeric: tabular-nums; }
    .vs-game__score { margin-left: auto; font-size: var(--w-fs-meta); color: var(--w-ink2); }
    .vs-game__score b { font-weight: 600; color: var(--w-ink); font-variant-numeric: tabular-nums; }
    .vs-timer { display: flex; align-items: center; gap: 12px; padding: 0 24px; }
    .vs-timer__bar { flex: 1 1 auto; height: 6px; border-radius: var(--w-r-chip); background: var(--w-big-track); overflow: hidden; }
    .vs-timer__bar i { display: block; height: 100%; width: 100%; border-radius: var(--w-r-chip); background: var(--w-big); transition: width .25s linear; }
    .vs-timer__num { flex-shrink: 0; width: 40px; text-align: right; font-size: var(--w-fs-meta); color: var(--w-big); font-variant-numeric: tabular-nums; }
    .vs-timer.is-low .vs-timer__bar i { background: var(--w-warn); }
    .vs-timer.is-low .vs-timer__num { color: var(--w-warn); }
    .vs-q { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 34px 24px 28px 24px; text-align: center; }
    .vs-q__hint { font-size: var(--w-fs-meta); color: var(--w-ink3); }
    .vs-q__main { display: flex; align-items: center; justify-content: center; gap: 12px; min-height: 40px; }
    .vs-q__word { font-family: var(--font-en); font-size: var(--w-fs-title); font-weight: 600; line-height: 1.35; color: var(--w-ink); overflow-wrap: anywhere; }
    .vs-q__meaning { font-size: var(--w-fs-title); font-weight: 600; line-height: 1.45; color: var(--w-ink); overflow-wrap: anywhere; }
    .vs-q .vs-ibtn { width: 32px; height: 32px; }
    .vs-opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; padding: 0 24px; }
    .vs-opt {
      min-height: 58px; padding: 10px 14px; display: flex; align-items: center; justify-content: center; gap: 8px;
      border: 1px solid var(--w-line); border-radius: var(--w-r-card); background: var(--w-surface); color: var(--w-ink);
      font-size: var(--w-fs-ui); line-height: 1.5; text-align: center; overflow-wrap: anywhere; cursor: pointer;
      transition: border-color .15s, background .15s, color .15s, opacity .15s;
    }
    .vs-opt.is-en { font-family: var(--font-en); font-size: var(--w-fs-en); }
    .vs-opt:hover:not(:disabled) { border-color: var(--w-big-line); background: var(--w-big-soft); }
    .vs-opt:focus-visible { outline: none; box-shadow: var(--w-ring); }
    .vs-opt:disabled { cursor: default; }
    .vs-opt.is-dim { opacity: .55; }
    .vs-opt.correct { border-color: var(--w-ok-line); background: var(--w-ok-soft); color: var(--w-ok); font-weight: 600; }
    .vs-opt.incorrect { border-color: var(--w-err-line); background: var(--w-err-soft); color: var(--w-err); font-weight: 600; }
    .vs-opt svg { flex-shrink: 0; }
    .vs-q__feedback { min-height: 22px; margin: 14px 24px 0 24px; text-align: center; font-size: var(--w-fs-meta); color: var(--w-ink3); }
    .vs-dlg--game .vs-dlg__foot { margin-top: 22px; }

    /* 结果 */
    .vs-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
    .vs-stat { padding: 14px 16px; border: 1px solid var(--w-line); border-radius: var(--w-r-card); background: var(--w-surface); }
    .vs-stat__num { font-size: var(--w-fs-title); font-weight: 600; line-height: 1.2; color: var(--w-ink); font-variant-numeric: tabular-nums; }
    .vs-stat__unit { margin-left: 2px; font-size: var(--w-fs-meta); font-weight: 400; color: var(--w-ink3); }
    .vs-stat__label { margin-top: 4px; font-size: var(--w-fs-meta); color: var(--w-ink2); }
    .vs-stat.is-main { border-color: var(--w-big-line); background: var(--w-big-soft); }
    .vs-stat.is-main .vs-stat__num, .vs-stat.is-main .vs-stat__label { color: var(--w-big); }
    .vs-list { border: 1px solid var(--w-line); border-radius: var(--w-r-inner); overflow: hidden; }
    .vs-list__row { min-height: 46px; display: flex; align-items: center; gap: 14px; padding: 8px 14px; }
    .vs-list__row + .vs-list__row { border-top: 1px solid var(--w-line); }
    .vs-list__word { flex: 0 0 150px; min-width: 0; font-family: var(--font-en); font-size: var(--w-fs-ui); font-weight: 600; color: var(--w-ink); overflow-wrap: anywhere; }
    .vs-list__meaning { flex: 1 1 auto; min-width: 0; font-size: var(--w-fs-ui); color: var(--w-ink2); overflow-wrap: anywhere; }
    .vs-list__pick { flex-shrink: 0; max-width: 40%; font-size: var(--w-fs-meta); color: var(--w-err); overflow-wrap: anywhere; text-align: right; }
    .vs-list__pick.is-skip { color: var(--w-ink3); }
    .vs-allright { margin: 0; padding: 18px; border: 1px solid var(--w-ok-line); border-radius: var(--w-r-inner); background: var(--w-ok-soft); color: var(--w-ok); text-align: center; font-size: var(--w-fs-ui); }

    /* 记录 */
    .vs-dlg--history .vs-dlg__head { flex-direction: column; align-items: stretch; gap: 10px; padding-bottom: 0; }
    .vs-dlg--history .vs-dlg__head > .vs-dlg__bar { display: flex; align-items: center; gap: 14px; }
    .vs-dlg--history .vs-dlg__head > .vs-tabs { flex: none; }
    .vs-tabs { display: flex; gap: 24px; }
    .vs-tabs button {
      margin-bottom: -1px; padding: 6px 0 10px 0; border: none; border-bottom: 2px solid transparent; background: transparent;
      font-size: var(--w-fs-ui); color: var(--w-ink3); cursor: pointer;
    }
    .vs-tabs button:hover { color: var(--w-ink); }
    .vs-tabs button.active { color: var(--w-ink); font-weight: 600; border-bottom-color: var(--w-big); }
    .vs-tabs button:focus-visible { outline: none; box-shadow: var(--w-ring); }
    .vs-tabs__n { margin-left: 3px; font-size: var(--w-fs-meta); font-weight: 400; color: var(--w-ink3); font-variant-numeric: tabular-nums; }
    .vs-dlg--history .vs-dlg__body { gap: 12px; padding-top: 18px; }
    .vs-rec { padding: 14px 16px; border: 1px solid var(--w-line); border-radius: var(--w-r-card); }
    .vs-rec__top, .vs-rec__bottom { display: flex; align-items: center; gap: 14px; }
    .vs-rec__bottom { margin-top: 6px; }
    .vs-rec__title { flex: 1 1 auto; min-width: 0; font-size: var(--w-fs-ui); font-weight: 600; color: var(--w-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .vs-rec__when { flex-shrink: 0; font-size: var(--w-fs-meta); color: var(--w-ink3); font-variant-numeric: tabular-nums; }
    .vs-rec__line { flex: 1 1 auto; min-width: 0; font-size: var(--w-fs-meta); color: var(--w-ink2); font-variant-numeric: tabular-nums; }
    .vs-rec .ui-btn--sm { height: 30px; padding: 0 12px; }
    .vs-rec__detail { margin-top: 12px; padding: 12px 14px; border-radius: var(--w-r-inner); background: var(--w-sunken); font-size: var(--w-fs-meta); line-height: 1.8; color: var(--w-ink2); }
    .vs-rec__detail .ui-en { font-size: var(--w-fs-meta); color: var(--w-ink); }
    .vs-ww { display: flex; align-items: center; gap: 14px; padding: 10px 16px; }
    .vs-ww + .vs-ww { border-top: 1px solid var(--w-line); }
    .vs-ww__main { flex: 1 1 auto; min-width: 0; }
    .vs-ww__line { display: flex; align-items: baseline; gap: 10px; min-width: 0; }

    .vs-ww__from { font-size: var(--w-fs-meta); color: var(--w-ink3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .vs-ww__times { flex-shrink: 0; width: 64px; text-align: right; font-size: var(--w-fs-meta); font-weight: 600; color: var(--w-err); font-variant-numeric: tabular-nums; }
    .vs-ww .ui-btn--sm { height: 30px; padding: 0 12px; flex-shrink: 0; }
    .vs-table { border: 1px solid var(--w-line); border-radius: var(--w-r-card); overflow: hidden; }
    .vs-table__row { display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr; padding: 10px 16px; font-size: var(--w-fs-ui); font-variant-numeric: tabular-nums; }
    .vs-table__row + .vs-table__row { border-top: 1px solid var(--w-line); }
    .vs-table__row.is-head { padding: 8px 16px; background: var(--w-sunken); font-size: var(--w-fs-meta); color: var(--w-ink3); }
    .vs-table__row .is-soft { color: var(--w-ink2); }
    .vs-para { margin: 0; font-size: var(--w-fs-meta); color: var(--w-ink2); }
    .vs-para b { font-weight: 600; color: var(--w-ink); }

    /* ---------- 提示 ---------- */
    .vs-toasts { position: fixed; left: 50%; bottom: 24px; z-index: 1500; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
    .vs-toasts .ui-toast { pointer-events: auto; max-width: min(520px, calc(100vw - 32px)); }

    /* ---------- 窄屏：只保证不溢出、能点能用 ---------- */
    @media (max-width: 1024px) {

  <div class="vs-toasts" id="toasts" aria-live="polite"></div>

  <script>
    const CATS = ['Reading', 'Listening', 'Writing'];
    const QUESTION_SECONDS = 15;
    const $ = id => document.getElementById(id);

    let allArticles = [];      // /intensive_list 的全部文章
    let activeCat = 'Reading';
    let currentArticle = null; // 右边正在看的文章
    let currentVocab = [];     // 它的高亮；正在加载时是 null
    let vocabSeq = 0;          // 连点两篇时只认最后一次

    const ICONS = {
      play: '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 6h2.5L8.5 3v10L5 10H2.5z"/><path d="M11 5.5a3.5 3.5 0 0 1 0 5"/></svg>',
      jump: '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 11l6-6M6 5h5v5"/></svg>',
      check: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7"/></svg>',
      cross: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg>'
    };

    // 建元素：数据一律走 textContent，不拼 HTML（单词、释义、标题都是用户写的，所有账号共用）
    function h(tag, props, ...kids) {
      const el = document.createElement(tag);
      if (props) {
        Object.keys(props).forEach(k => {
          const v = props[k];
          if (v == null || v === false) return;
          if (k === 'class') el.className = v;
          else if (k === 'text') el.textContent = v;
          else if (k === 'icon') el.insertAdjacentHTML('afterbegin', ICONS[v]);
          else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
          else el.setAttribute(k, v === true ? '' : v);
        });
      }
      kids.flat().forEach(c => {
        if (c == null || c === false) return;
        el.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(String(c)) : c);
      });
      return el;
    }

    function catOf(article) { return CATS.includes(article && article.category) ? article.category : 'Reading'; }
    function wordCount(article) { return Number(article && article.highlight_count) || 0; }
    function withWords(list) { return list.filter(a => wordCount(a) > 0); }
    function articleById(id) { return allArticles.find(a => a.id === id) || null; }
    function pad2(n) { return String(n).padStart(2, '0'); }
    function shortDate(iso) {
      const d = new Date(iso || '');
      return isNaN(d) ? '' : `${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
    }
    function fmtWhen(iso) {
      const d = new Date(iso || '');
      if (isNaN(d)) return '';
      const now = new Date();
      const day = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
      const diff = Math.round((day(now) - day(d)) / 86400000);
      const hm = `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
      if (diff === 0) return `今天 ${hm}`;
      if (diff === 1) return `昨天 ${hm}`;
      if (d.getFullYear() === now.getFullYear()) return `${pad2(d.getMonth() + 1)}-${pad2(d.getDate())} ${hm}`;
      return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
    }
    function readJson(response) {
      return response.json().catch(() => ({ success: false, error: `服务器返回 ${response.status}` }));
    }
    function storeGet(key, fallback) { try { return localStorage.getItem(key) || fallback; } catch (e) { return fallback; } }
    function storeSet(key, value) { try { localStorage.setItem(key, value); } catch (e) {} }

    function toast(message, kind) {
      const item = h('div', { class: 'ui-toast' + (kind ? ' ui-toast--' + kind : ''), role: kind === 'err' ? 'alert' : 'status', text: message });
      $('toasts').appendChild(item);
      setTimeout(() => item.remove(), kind === 'err' ? 4200 : 2600);
    }

    // ==================== 发音 ====================
    // 先放精读划词时生成好的发音（/vocab_audio/<文章>/<词>），没有就用有道词典的发音，都不再调付费 TTS
    const player = new Audio();
    let playing = null;
    player.addEventListener('error', () => { if (playing) nextSource(playing); });
    player.addEventListener('ended', () => stopPlaying());
    function playWord(word, articleId, options) {
      const text = String(word || '').trim().replace(/\s+/g, ' ');
      if (!text) return;
      stopPlaying();
      const sources = [];
      if (articleId) sources.push(`/vocab_audio/${encodeURIComponent(articleId)}/${encodeURIComponent(text.toLowerCase())}`);
      sources.push('https://dict.youdao.com/dictvoice?audio=' + encodeURIComponent(text) + '&type=2');
      playing = { text, sources, index: 0, quiet: !!(options && options.quiet), card: options && options.card };
      if (playing.card) playing.card.classList.add('is-playing');
      nextSource(playing);
    }
    function nextSource(current) {
      if (playing !== current) return;
      if (current.index >= current.sources.length) {
        stopPlaying();
        if (!current.quiet) toast(`没取到「${current.text}」的发音`, 'err');
        return;
      }
      player.src = current.sources[current.index++];
      const p = player.play();
      if (p && p.catch) {
        p.catch(err => {
          // 加载失败由 error 事件换下一个来源；浏览器不让自动播放时安静地停下
          if (playing === current && err && err.name === 'NotAllowedError') stopPlaying();
        });
      }
    }
    function stopPlaying() {
      if (playing && playing.card) playing.card.classList.remove('is-playing');
      playing = null;
    }

    // ==================== 文章与词 ====================
    function loadData() {
      $('articleList').replaceChildren(h('div', { class: 'vs-rail__msg', text: '正在加载文章…' }));
      fetch('/intensive_list')
        .then(r => { if (!r.ok) throw new Error(String(r.status)); return r.json(); })
        .then(d => {
          allArticles = Array.isArray(d.items) ? d.items : [];
          const saved = storeGet('vsCategory', '');
          const firstWithWords = CATS.find(c => withWords(allArticles).some(a => catOf(a) === c));
          setActiveCat(CATS.includes(saved) && withWords(allArticles).some(a => catOf(a) === saved) ? saved : (firstWithWords || 'Reading'));
          initializeChallengeData();
        })
        .catch(() => {
          $('articleList').replaceChildren(h('div', { class: 'vs-rail__msg' },
            '文章列表没加载出来。', h('br'),
            h('button', { type: 'button', class: 'ui-btn ui-btn--sm', style: 'margin-top: 10px', text: '重试', onclick: loadData })));
          renderPaneEmpty('文章列表没加载出来', '刷新一下页面，或者稍后再来。');
        });
    }

    function setActiveCat(cat) {
      if (cat !== activeCat) $('vocabSearch').value = '';
      activeCat = cat;
      storeSet('vsCategory', cat);
      CATS.forEach(c => {
        const tab = $('tab-' + c);
        const n = withWords(allArticles).filter(a => catOf(a) === c).length;
        tab.classList.toggle('active', c === cat);
        tab.setAttribute('aria-selected', String(c === cat));
        tab.querySelector('.vs-seg__n').textContent = allArticles.length ? String(n) : '';
      });
      const list = withWords(allArticles).filter(a => catOf(a) === cat);
      renderArticleList(list);
      const savedId = storeGet('vsArticle', '');
      const pick = list.find(a => a.id === savedId) || list[0];
      if (pick) selectArticle(pick);
      else {
        currentArticle = null;
        currentVocab = [];
        renderPaneEmpty(`${cat} 里还没有划过词的文章`, '在「文章精读」里打开一篇文章，划词、写上释义，词就会汇总到这里。', true);
      }
    }

    function renderArticleList(list) {
      const box = $('articleList');
      if (!list.length) {
        box.replaceChildren(h('div', { class: 'vs-rail__msg', text: '这一类还没有划过词的文章。' }));
      } else {
        box.replaceChildren(...list.map(a => h('button', {
          type: 'button', class: 'vs-art', 'data-id': a.id,
          onclick: () => selectArticle(a)
        },
          h('span', { class: 'vs-art__title', text: a.title || '未命名' }),
          h('span', { class: 'vs-art__meta', text: `${wordCount(a)} 个词` + (shortDate(a.created_at) ? ` · ${shortDate(a.created_at)}` : '') })
        )));
      }
      const hiddenCount = allArticles.filter(a => catOf(a) === activeCat && !wordCount(a)).length;
      $('railNote').hidden = !hiddenCount;
      $('railNote').textContent = `另有 ${hiddenCount} 篇还没高亮过词，不列在这里。`;
    }

    function selectArticle(article) {
      currentArticle = article;
      storeSet('vsArticle', article.id);
      document.querySelectorAll('#articleList .vs-art').forEach(el => el.classList.toggle('active', el.dataset.id === article.id));
      $('vocabTitle').textContent = article.title || '未命名';
      $('vocabSubtitle').textContent = '';
      $('openArticle').href = '/intensive#article-' + encodeURIComponent(article.id);
      $('openArticle').hidden = false;
      $('vocabTip').hidden = true;
      currentVocab = null;
      $('vocabList').replaceChildren(h('div', { class: 'ui-empty' }, h('p', { class: 'ui-empty__text', text: '正在加载这篇的词…' })));
      const seq = ++vocabSeq;
      fetch(`/intensive_article/${encodeURIComponent(article.id)}`)
        .then(readJson)
        .then(d => {
          if (seq !== vocabSeq) return;   // 已经点了别的文章
          if (!d.success) throw new Error(d.error || '加载失败');
          currentVocab = (d.article.highlights || []).slice().sort((a, b) => (a.start || 0) - (b.start || 0));
          renderVocab();
        })
        .catch(() => {
          if (seq !== vocabSeq) return;
          currentVocab = [];
          $('vocabList').replaceChildren(h('div', { class: 'ui-empty' },
            h('p', { class: 'ui-empty__title', text: '这篇的词没加载出来' }),
            h('button', { type: 'button', class: 'ui-btn ui-btn--sm', text: '重试', onclick: () => selectArticle(article) })));
        });
    }

    function renderPaneEmpty(title, text, withLink) {
      $('vocabTitle').textContent = '词汇';
      $('vocabSubtitle').textContent = '';
      $('openArticle').hidden = true;
      $('vocabTip').hidden = true;
      $('vocabList').replaceChildren(h('div', { class: 'ui-empty' },
        h('p', { class: 'ui-empty__title', text: title }),
        h('p', { class: 'ui-empty__text', text: text }),
        withLink ? h('a', { class: 'ui-btn ui-btn--sm', href: '/intensive', text: '去文章精读' }) : null));
    }

    function renderVocab() {
      const q = ($('vocabSearch').value || '').trim().toLowerCase();
      $('vocabSubtitle').textContent = `${currentVocab.length} 个词`;
      const list = q ? currentVocab.filter(v => (v.text || '').toLowerCase().includes(q) || (v.meaning || '').toLowerCase().includes(q)) : currentVocab;
      $('vocabTip').hidden = !list.length;
      if (!currentVocab.length) {
        $('vocabList').replaceChildren(h('div', { class: 'ui-empty' }, h('p', { class: 'ui-empty__title', text: '这篇的高亮都删掉了' })));
        return;
      }
      if (!list.length) {
        $('vocabList').replaceChildren(h('div', { class: 'ui-empty' }, h('p', { class: 'ui-empty__title', text: `没找到「${q}」` })));
        return;
      }
      const article = currentArticle;
      $('vocabList').replaceChildren(...list.map(v => {
        const card = h('div', { class: 'vs-word', 'data-hid': v.id || '' },
          h('div', { class: 'vs-word__top' },
            h('span', { class: 'vs-word__en', text: v.text || '' }),
            h('button', { type: 'button', class: 'vs-ibtn vs-play', icon: 'play', 'aria-label': `听「${v.text || ''}」的发音`, title: '听发音',
              onclick: e => { e.stopPropagation(); playWord(v.text, article.id, { card }); } }),
            h('button', { type: 'button', class: 'vs-ibtn vs-jump', icon: 'jump', 'aria-label': '在新标签页打开原文，滚到这个词', title: '跳到原文',
              onclick: e => { e.stopPropagation(); jumpToArticle(article.id, v.id); } })),
          h('span', { class: 'vs-word__zh' + (v.meaning ? '' : ' is-empty'), text: v.meaning || '（没写释义）' }));
        card.addEventListener('click', () => playWord(v.text, article.id, { card }));
        return card;
      }));
    }

    // 新标签页打开原文：精读页从 sessionStorage 读要滚到的高亮（新标签页会复制一份），
    // 这边稍后删掉，免得这个标签页以后打开精读还自动滚
    function jumpToArticle(articleId, vocabId) {
      try { sessionStorage.setItem('jumpToHighlight', vocabId || ''); } catch (e) {}
      window.open('/intensive#article-' + encodeURIComponent(articleId), '_blank');
      setTimeout(() => { try { sessionStorage.removeItem('jumpToHighlight'); } catch (e) {} }, 1500);
    }

    // ==================== 导出 ====================
    function toggleExportMenu(force) {
      const menu = $('exportMenu');
      const open = force === undefined ? menu.hidden : force;
      if (open) refreshExportMenu();
      menu.hidden = !open;
      $('exportBtn').setAttribute('aria-expanded', String(open));
    }
    function refreshExportMenu() {
      const btns = $('exportMenu').querySelectorAll('button');
      const inCat = withWords(allArticles).filter(a => catOf(a) === activeCat);
      const all = withWords(allArticles);
      btns[0].disabled = !(currentArticle && currentVocab && currentVocab.length);
      $('exportCurrentDesc').textContent = btns[0].disabled ? '先选一篇有词的文章' : `${currentArticle.title || '未命名'} · ${currentVocab.length} 个词`;
      btns[1].disabled = !inCat.length;
      $('exportCategoryDesc').textContent = `${activeCat} · ${inCat.length} 篇`;
      btns[2].disabled = !all.length;
      $('exportAllDesc').textContent = `${all.length} 篇`;
    }
    function exportVocab(type) {
      toggleExportMenu(false);
      if (type === 'current') {
        if (!currentArticle || !currentVocab || !currentVocab.length) return;
        downloadVocab(currentVocab, `${currentArticle.title || '文章'}_词汇.csv`, 0);
        return;
      }
      const list = type === 'category' ? withWords(allArticles).filter(a => catOf(a) === activeCat) : withWords(allArticles);
      if (!list.length) return;
      let failed = 0;
      Promise.all(list.map(a => fetch(`/intensive_article/${encodeURIComponent(a.id)}`)
        .then(readJson)
        .then(d => { if (!d.success) throw new Error(); return d.article.highlights || []; })
        .catch(() => { failed++; return []; })))
        .then(results => downloadVocab(results.flat(), type === 'category' ? `${activeCat}_分类词汇.csv` : '全部词汇.csv', failed));
    }
    function csvCell(value) { return '"' + String(value == null ? '' : value).replace(/"/g, '""') + '"'; }
    function downloadText(filename, text) {
      const blob = new Blob(['﻿' + text], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = h('a', { href: url, download: filename, style: 'display: none' });
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
    }
    function downloadVocab(vocabData, filename, failed) {
      const seen = new Set();
      const unique = vocabData.filter(item => {
        const key = `${item.text}|${item.meaning}`;
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      });
      if (!unique.length) { toast(failed ? '文章没读出来，没导出' : '没有可导出的词', 'err'); return; }
      // 表头和单词本「导入 CSV」认的一样，导出的文件可以直接导进单词本
      downloadText(filename, '词汇,释义\n' + unique.map(v => `${csvCell(v.text)},${csvCell(v.meaning)}`).join('\n') + '\n');
      if (failed) toast(`已导出 ${unique.length} 个词，但有 ${failed} 篇没读出来，导出的不全`, 'err');
      else toast(`已导出 ${unique.length} 个词`, 'ok');
    }

    // ==================== 弹窗 ====================
    const openStack = [];
    function openDialog(id) {
      const box = $(id);
      if (!box.hidden) return;
      box.hidden = false;
      openStack.push({ id, opener: document.activeElement });
      document.documentElement.classList.add('vs-lock');
      box.querySelector('.vs-dlg').focus();
    }
    function closeDialog(id) {
      const box = $(id);
      if (box.hidden) return;
      box.hidden = true;
      const at = openStack.findIndex(x => x.id === id);
      const entry = at >= 0 ? openStack.splice(at, 1)[0] : null;
      if (!openStack.length) document.documentElement.classList.remove('vs-lock');
      if (entry && entry.opener && document.contains(entry.opener) && entry.opener.focus) entry.opener.focus();
    }
    document.querySelectorAll('.ui-dialog-backdrop').forEach(box => {
      box.addEventListener('click', e => {
        if (e.target.closest('[data-close]')) { closeDialog(box.id); return; }
        // 点弹窗外面关掉；答题中不关，免得误点丢了进度
        if (e.target === box && box.id !== 'challengeGameModal') closeDialog(box.id);
      });
    });
    document.addEventListener('keydown', e => {
      if (e.key !== 'Escape') return;
      if (!$('exportMenu').hidden) { toggleExportMenu(false); $('exportBtn').focus(); return; }
      const top = openStack[openStack.length - 1];
      if (top && top.id !== 'challengeGameModal') closeDialog(top.id);
    });

    // ==================== 挑战：选文章 ====================
    let setupFilter = 'all';
    let picked = new Set();
    let challengeBusy = false;

    function setupArticles() { return withWords(allArticles); }
    function openChallengeSetup(preselect) {
      if (preselect) picked = new Set(preselect.filter(id => setupArticles().some(a => a.id === id)));
      else picked = new Set([...picked].filter(id => setupArticles().some(a => a.id === id)));
      setupFilter = 'all';
      $('setupError').hidden = true;
      renderSetup();
      openDialog('challengeSetupModal');
    }
    function visibleSetupArticles() {
      return setupArticles().filter(a => setupFilter === 'all' || catOf(a) === setupFilter);
    }
    function renderSetup() {
      const all = setupArticles();
      const chips = [['all', '全部', all.length]].concat(CATS.map(c => [c, c, all.filter(a => catOf(a) === c).length]));
      $('setupFilters').replaceChildren(...chips.map(([key, label, n]) => h('button', {
        type: 'button', class: 'ui-chip' + (setupFilter === key ? ' is-on' : ''), disabled: key !== 'all' && !n,
        'aria-pressed': String(setupFilter === key), onclick: () => { setupFilter = key; renderSetup(); }
      }, label, ' ', h('span', { class: 'ui-chip__count', text: String(n) }))));

      const list = visibleSetupArticles();
      const box = $('filteredArticles');
      if (!list.length) {
        box.replaceChildren(h('div', { class: 'vs-rail__msg', text: all.length ? '这一类没有划过词的文章' : '还没有划过词的文章。先去「文章精读」里划词、写释义。' }));
      } else {
        box.replaceChildren(...list.map(a => {
          const on = picked.has(a.id);
          const input = h('input', { type: 'checkbox', id: 'article_' + a.id, value: a.id, checked: on });
          input.addEventListener('change', () => toggleArticleSelection(a.id, input.checked));
          return h('label', { class: 'vs-pick__row' + (on ? ' is-on' : ''), for: 'article_' + a.id },
            input,
            h('span', { class: 'vs-pick__title', text: a.title || '未命名', title: a.title || '' }),
            h('span', { class: 'vs-pick__n', text: `${wordCount(a)} 个词` }),
            h('span', { class: 'vs-pick__cat' }, h('span', { class: 'ui-tag', text: catOf(a) })));
        }));
      }
      const pickedHere = list.filter(a => picked.has(a.id)).length;
      const selAll = $('selectAllArticles');
      selAll.disabled = !list.length;
      selAll.checked = !!list.length && pickedHere === list.length;
      selAll.indeterminate = pickedHere > 0 && pickedHere < list.length;
      $('selectAllLabel').textContent = list.length ? `全选这 ${list.length} 篇` : '全选';
      updateChallengeStats();
    }
    function toggleArticleSelection(id, on) {
      if (on) picked.add(id); else picked.delete(id);
      renderSetup();
    }
    function toggleAllArticlesSelection(on) {
      visibleSetupArticles().forEach(a => { if (on) picked.add(a.id); else picked.delete(a.id); });
      renderSetup();
    }
    function clampCount(value) {
      const n = parseInt(value, 10);
      return isNaN(n) ? 20 : Math.min(50, Math.max(5, n));
    }
    function updateChallengeStats() {
      // 词数直接用文章列表里带的高亮数，不用再把每篇整篇下载一遍
      const words = setupArticles().filter(a => picked.has(a.id)).reduce((s, a) => s + wordCount(a), 0);
      const count = clampCount($('challengeWordCount').value);
      $('selectedArticlesCount').textContent = String(picked.size);
      $('availableVocabCount').textContent = String(words);
      $('questionCount').textContent = String(Math.min(count, words));
      const btn = $('startChallengeBtn');
      btn.disabled = !picked.size || challengeBusy;
    }

    async function startVocabChallenge() {
      if (!picked.size || challengeBusy) return;
      const count = clampCount($('challengeWordCount').value);
      $('challengeWordCount').value = count;
      $('wordCountSlider').value = count;
      const ids = setupArticles().filter(a => picked.has(a.id)).map(a => a.id);
      const btn = $('startChallengeBtn');
      challengeBusy = true;
      btn.disabled = true;
      btn.textContent = '正在出题';
      $('setupError').hidden = true;
      try {
        const response = await fetch('/api/vocab_summary_challenge', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ article_ids: ids, word_count: count })
        });
        const data = await readJson(response);
        if (!data.success || !data.challenge || !(data.challenge.vocabulary || []).length) {
          throw new Error(data.error || '出题失败');
        }
        closeDialog('challengeSetupModal');
        startGame(data.challenge, '词汇挑战');
      } catch (error) {
        $('setupError').textContent = error && error.message && !/fetch|network/i.test(error.message) ? error.message : '网络出错，没出成题，再试一次';
        $('setupError').hidden = false;
      } finally {
        challengeBusy = false;
        btn.textContent = '开始挑战';
        updateChallengeStats();
      }
    }

    // ==================== 挑战：答题 ====================
    const game = { challenge: null, answers: [], index: 0, type: '', phase: 'idle', seq: 0, timer: null, deadline: 0, startedAt: 0, correct: 0 };

    function startGame(challenge, title) {
      game.challenge = challenge;
      game.answers = [];
      game.index = 0;
      game.correct = 0;
      game.seq++;
      $('challengeGameTitle').textContent = title;
      openDialog('challengeGameModal');
      showNextQuestion();
    }

    function vocabArticleId(word) {
      const v = (game.challenge && game.challenge.vocabulary || []).find(x => x.word === word);
      return v ? v.article_id : '';
    }

    function showNextQuestion() {
      stopTimer();
      const list = game.challenge.vocabulary;
      if (game.index >= list.length) { finishChallenge(); return; }
      const vocab = list[game.index];
      game.phase = 'asking';
      $('challengeProgress').textContent = `第 ${game.index + 1} / ${list.length} 题`;
      $('challengeCorrect').textContent = String(game.correct);
      $('challengeFeedback').textContent = '';
      $('skipBtn').disabled = false;

      const showWord = Math.random() > 0.5;
      let options, correct;
      if (showWord) {
        game.type = 'word_to_meaning';
        $('challengeHint').textContent = '选出这个词的意思';
        $('challengeQuestion').replaceChildren(
          h('span', { class: 'vs-q__word', text: vocab.word }),
          h('button', { type: 'button', class: 'vs-ibtn', icon: 'play', 'aria-label': '再听一遍', title: '再听一遍',
            onclick: () => playWord(vocab.word, vocab.article_id) }));
        const seq = game.seq, idx = game.index;
        setTimeout(() => { if (game.seq === seq && game.index === idx) playWord(vocab.word, vocab.article_id, { quiet: true }); }, 100);
        correct = vocab.meaning;
        options = [correct].concat(generateWrongOptions(list.filter(v => v.word !== vocab.word), correct, 'meaning'));
      } else {
        game.type = 'meaning_to_word';
        $('challengeHint').textContent = '选出这个意思对应的词';
        $('challengeQuestion').replaceChildren(h('span', { class: 'vs-q__meaning', text: vocab.meaning }));
        correct = vocab.word;
        options = [correct].concat(generateWrongOptions(list.filter(v => v.meaning !== vocab.meaning), correct, 'word'));
      }
      shuffleArray(options);
      $('challengeOptions').replaceChildren(...options.map(option => {
        const btn = h('button', { type: 'button', class: 'vs-opt' + (game.type === 'meaning_to_word' ? ' is-en' : '') },
          h('span', { text: option }));
        btn.dataset.answer = option;
        btn.addEventListener('click', () => selectChallengeOption(option, correct, btn));
        return btn;
      }));
      startQuestionTimer();
    }

    function generateWrongOptions(otherVocab, correctAnswer, type) {
      const pool = [...new Set(otherVocab.map(v => type === 'meaning' ? v.meaning : v.word).filter(o => o && o !== correctAnswer))];
      shuffleArray(pool);
      return pool.slice(0, 3);
    }
    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function startQuestionTimer() {
      game.startedAt = Date.now();
      game.deadline = game.startedAt + QUESTION_SECONDS * 1000;
      const tick = () => {
        const left = Math.max(0, game.deadline - Date.now());
        const secs = Math.ceil(left / 1000);
        $('challengeTimer').textContent = `${secs} 秒`;
        $('challengeTimerBar').style.width = (left / (QUESTION_SECONDS * 10)) + '%';
        $('challengeTimerBox').classList.toggle('is-low', secs <= 5);
        if (left <= 0) skipQuestion(true);
      };
      tick();
      game.timer = setInterval(tick, 250);
    }
    function stopTimer() {
      if (game.timer) { clearInterval(game.timer); game.timer = null; }
    }

    // 显示对错，停一下再进下一题。等待期间按钮都不能点（以前这时点「跳过」会多记一题、跳掉下一题）
    function revealAnswer(correctAnswer, chosenBtn, isCorrect, message, delay) {
      game.phase = 'feedback';
      stopTimer();
      $('skipBtn').disabled = true;
      document.querySelectorAll('#challengeOptions .vs-opt').forEach(btn => {
        btn.disabled = true;
        if (btn.dataset.answer === correctAnswer) {
          btn.classList.add('correct');
          btn.insertAdjacentHTML('afterbegin', ICONS.check);
        } else if (btn === chosenBtn && !isCorrect) {
          btn.classList.add('incorrect');
          btn.insertAdjacentHTML('afterbegin', ICONS.cross);
        } else {
          btn.classList.add('is-dim');
        }
      });
      $('challengeFeedback').textContent = message;
      $('challengeCorrect').textContent = String(game.correct);
      const seq = game.seq, idx = game.index;
      setTimeout(() => {
        if (game.seq !== seq || game.index !== idx || game.phase !== 'feedback') return;
        game.index++;
        showNextQuestion();
      }, delay);
    }

    function answerRecord(vocab, extra) {
      return Object.assign({
        question_index: game.index,
        vocab: { word: vocab.word, meaning: vocab.meaning, article_id: vocab.article_id || '', article_title: vocab.article_title || '', highlight_id: vocab.highlight_id || '' },
        question_type: game.type
      }, extra);
    }

    function selectChallengeOption(selectedOption, correctAnswer, optionElement) {
      if (game.phase !== 'asking') return;
      const vocab = game.challenge.vocabulary[game.index];
      const isCorrect = selectedOption === correctAnswer;
      const timeTaken = Math.min(QUESTION_SECONDS, Math.round((Date.now() - game.startedAt) / 1000));
      game.answers.push(answerRecord(vocab, {
        selected_option: selectedOption, correct_answer: correctAnswer, time_taken: timeTaken, is_correct: isCorrect
      }));
      if (isCorrect) game.correct++;
      else recordWrongWord(vocab, selectedOption, correctAnswer);
      // 中译英的题，答完念一遍正确的词
      if (game.type === 'meaning_to_word') playWord(vocab.word, vocab.article_id, { quiet: true });
      revealAnswer(correctAnswer, optionElement, isCorrect, isCorrect ? '答对了' : '答错了，已记进错词本', isCorrect ? 1200 : 2200);
    }

    function skipQuestion(timeUp) {
      if (game.phase !== 'asking') return;
      const vocab = game.challenge.vocabulary[game.index];
      const correctAnswer = game.type === 'word_to_meaning' ? vocab.meaning : vocab.word;
      game.answers.push(answerRecord(vocab, {
        selected_option: null, correct_answer: correctAnswer, time_taken: QUESTION_SECONDS, is_correct: false, skipped: true
      }));
      recordWrongWord(vocab, '跳过', correctAnswer);
      revealAnswer(correctAnswer, null, false, (timeUp === true ? '时间到' : '跳过了') + '，正确答案已标出，记进错词本', 1800);
    }

    function quitChallenge() {
      if (game.phase === 'idle') return;
      if (!confirm('退出这次挑战？已经答的题不算成绩，答错的词还留在错词本里。')) return;
      game.seq++;
      game.phase = 'idle';
      stopTimer();
      closeDialog('challengeGameModal');
    }

    function finishChallenge() {
      stopTimer();
      game.phase = 'idle';
      const total = game.challenge.vocabulary.length;
      const correctCount = game.answers.filter(a => a.is_correct).length;
      let timeBonus = 0;
      game.answers.forEach(a => { if (a.is_correct && !a.skipped) timeBonus += Math.max(1, 16 - a.time_taken); });
      const ids = game.challenge.article_ids || [];
      const titles = ids.map(id => {
        const a = articleById(id);
        if (a) return a.title || '未命名';
        const v = game.challenge.vocabulary.find(x => x.article_id === id);
        return v && v.article_title ? v.article_title : '';
      }).filter(Boolean);
      const record = {
        id: Date.now().toString(),
        timestamp: new Date().toISOString(),
        type: game.challenge.type === 'review' ? 'review' : 'vocab_summary',
        article_ids: ids,
        article_titles: titles,
        total_questions: total,
        correct_count: correctCount,
        accuracy: Math.round((correctCount / total) * 100),
        score: Math.round((correctCount / total) * 70 + (timeBonus / (total * 15)) * 30),
        time_bonus: timeBonus,
        answers: game.answers
      };
      saveChallengeRecordToBackend(record);
      challengeHistory.unshift(record);
      closeDialog('challengeGameModal');
      showChallengeResult(record);
    }

    // ==================== 挑战：结果 ====================
    let lastResult = null;
    function recordTitle(record) {
      let titles = (record.article_titles || []).filter(Boolean);
      // 以前的记录文章名是空的（开始挑战时选中的文章被清掉了），按文章 ID 补回来
      if (!titles.length) titles = (record.article_ids || []).map(id => (articleById(id) || {}).title).filter(Boolean);
      const text = titles.length ? titles.join('、') : '（文章已删除）';
      return record.type === 'review' ? '错词复习 · ' + text : text;
    }
    function wrongAnswersOf(record) {
      return (record.answers || []).filter(a => !a.is_correct && a.vocab);
    }
    function stat(num, unit, label, main) {
      return h('div', { class: 'vs-stat' + (main ? ' is-main' : '') },
        h('div', { class: 'vs-stat__num' }, String(num), unit ? h('span', { class: 'vs-stat__unit', text: unit }) : null),
        h('div', { class: 'vs-stat__label', text: label }));
    }
    function showChallengeResult(record) {
      lastResult = record;
      $('resultSub').textContent = `${recordTitle(record)} · ${record.total_questions} 题`;
      $('resultSub').title = recordTitle(record);
      $('resultSummary').replaceChildren(
        stat(record.score, '', '得分', true),
        stat(record.accuracy, '%', '正确率'),
        stat(record.correct_count, `/ ${record.total_questions}`, '答对'),
        stat(Math.round(record.time_bonus), '', '时间奖励'));
      const wrong = wrongAnswersOf(record);
      const section = $('wrongWordsSection');
      if (wrong.length) {
        section.replaceChildren(
          h('span', { class: 'vs-label', text: `答错和跳过的 ${wrong.length} 个` }),
          h('div', { class: 'vs-list' }, ...wrong.map(a => h('div', { class: 'vs-list__row' },
            h('span', { class: 'vs-list__word', text: a.vocab.word }),
            h('span', { class: 'vs-list__meaning', text: a.vocab.meaning }),
            h('span', { class: 'vs-list__pick' + (a.skipped ? ' is-skip' : ''), text: a.skipped ? '跳过' : `选了「${a.selected_option}」` })))));
      } else {
        section.replaceChildren(h('p', { class: 'vs-allright', text: '全部答对' }));
      }
      $('reviewWrongBtn').hidden = !wrong.length;
      $('reviewWrongBtn').textContent = `复习这 ${wrong.length} 个`;
      openDialog('challengeResultModal');
    }

    // 用某次挑战里答错的词再出一轮（结果页和挑战记录里的「复习错词」都走这里）
    function reviewWrongOf(record) {
      const seen = new Set();
      const vocab = wrongAnswersOf(record).map(a => a.vocab).filter(v => {
        const key = `${v.word}::${v.meaning}`;
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      });
      if (!vocab.length) { toast('这次挑战没有错词'); return; }
      shuffleArray(vocab);
      closeDialog('challengeResultModal');
      closeDialog('challengeHistoryModal');
      startGame({ id: 'review_' + record.id, type: 'review', vocabulary: vocab, article_ids: record.article_ids || [] }, '错词复习');
    }

    // ==================== 错词本、挑战记录 ====================
    let challengeHistory = [];
    let wrongWordsRecord = {};
    let historyTab = 'recent';
    const openDetails = new Set();

    async function initializeChallengeData() {
      try {
        const records = await fetch('/api/vocab_challenge_records').then(readJson);
        if (records.success) challengeHistory = records.records || [];
        const wrong = await fetch('/api/vocab_wrong_words').then(readJson);
        if (wrong.success) wrongWordsRecord = wrong.wrong_words || {};
      } catch (error) {
        // 后端读不到时，用本机上次存的备份
        try {
          challengeHistory = JSON.parse(storeGet('vocabChallengeHistory', '[]'));
          wrongWordsRecord = JSON.parse(storeGet('vocabWrongWords', '{}'));
        } catch (e) {}
      }
    }

    function recordWrongWord(vocab, selectedOption, correctAnswer) {
      const key = `${vocab.word}::${vocab.meaning}`;
      if (!wrongWordsRecord[key]) {
        wrongWordsRecord[key] = {
          word: vocab.word, meaning: vocab.meaning,
          article_title: vocab.article_title || '', article_id: vocab.article_id || '',
          wrong_count: 0, last_wrong_at: null, wrong_answers: []
        };
      }
      const item = wrongWordsRecord[key];
      item.wrong_count++;
      item.last_wrong_at = new Date().toISOString();
      item.wrong_answers.push({ selected: selectedOption, correct: correctAnswer, timestamp: item.last_wrong_at });
      saveWrongWordsToBackend();
    }

    function openChallengeHistory() {
      openDetails.clear();
      switchHistoryTab('recent');
      openDialog('challengeHistoryModal');
    }
    function switchHistoryTab(tab) {
      historyTab = tab;
      ['recent', 'wrong', 'stats'].forEach(t => {
        const btn = $(t + 'Tab');
        btn.classList.toggle('active', t === tab);
        btn.setAttribute('aria-selected', String(t === tab));
      });
      $('recentTab').querySelector('.vs-tabs__n').textContent = String(challengeHistory.length);
      $('wrongTab').querySelector('.vs-tabs__n').textContent = String(Object.keys(wrongWordsRecord).length);
      const box = $('historyContent');
      box.scrollTop = 0;
      if (tab === 'recent') showRecentChallenges(box);
      else if (tab === 'wrong') showWrongWordsStats(box);
      else showChallengeStats(box);
    }
    function emptyBlock(title, text) {
      return h('div', { class: 'ui-empty' }, h('p', { class: 'ui-empty__title', text: title }), text ? h('p', { class: 'ui-empty__text', text: text }) : null);
    }

    function showRecentChallenges(box) {
      if (!challengeHistory.length) { box.replaceChildren(emptyBlock('还没有挑战记录', '点页面右上角的「开始挑战」做第一次。')); return; }
      box.replaceChildren(...challengeHistory.map(record => {
        const wrong = wrongAnswersOf(record);
        const open = openDetails.has(record.id);
        const answered = (record.answers || []).filter(a => !a.skipped && typeof a.time_taken === 'number');
        const avg = answered.length ? (answered.reduce((s, a) => s + a.time_taken, 0) / answered.length).toFixed(1) : '';
        return h('div', { class: 'vs-rec' },
          h('div', { class: 'vs-rec__top' },
            h('span', { class: 'vs-rec__title', text: recordTitle(record), title: recordTitle(record) }),
            h('span', { class: 'vs-rec__when', text: fmtWhen(record.timestamp) })),
          h('div', { class: 'vs-rec__bottom' },
            h('span', { class: 'vs-rec__line', text: `正确率 ${record.accuracy}% · 得分 ${record.score} · 答对 ${record.correct_count} / ${record.total_questions}` }),
            h('button', { type: 'button', class: 'ui-btn ui-btn--sm', 'aria-expanded': String(open), text: open ? '收起' : '详情',
              onclick: () => { if (open) openDetails.delete(record.id); else openDetails.add(record.id); showRecentChallenges(box); } }),
            h('button', { type: 'button', class: 'ui-btn ui-btn--sm', disabled: !wrong.length, text: wrong.length ? `复习错词 ${wrong.length}` : '没有错词',
              onclick: () => reviewWrongOf(record) })),
          open ? h('div', { class: 'vs-rec__detail' },
            wrong.length
              ? h('div', null, '答错和跳过：', h('span', { class: 'ui-en', text: wrong.map(a => a.vocab.word).join(' · ') }))
              : h('div', { text: '全部答对' }),
            avg ? h('div', { text: `答了的题平均用时 ${avg} 秒` }) : null) : null);
      }));
    }

    function showWrongWordsStats(box) {
      const words = Object.entries(wrongWordsRecord).map(([key, w]) => Object.assign({ key }, w));
      if (!words.length) { box.replaceChildren(emptyBlock('错词本是空的', '挑战里答错或跳过的词会记在这里。')); return; }
      words.sort((a, b) => (b.wrong_count || 0) - (a.wrong_count || 0) || String(b.last_wrong_at).localeCompare(String(a.last_wrong_at)));
      const total = words.reduce((s, w) => s + (w.wrong_count || 0), 0);
      box.replaceChildren(
        h('p', { class: 'vs-para' }, '共 ', h('b', { text: String(words.length) }), ' 个词，累计错 ', h('b', { text: String(total) }), ' 次，错得多的排前面。这些词也会出现在首页「待复习」里。'),
        h('div', { class: 'vs-table' }, ...words.map(w => h('div', { class: 'vs-ww' },
          h('div', { class: 'vs-ww__main' },
            h('div', { class: 'vs-ww__line' },
              h('span', { class: 'vs-ww__word', text: w.word }),
              h('span', { class: 'vs-ww__meaning', text: w.meaning, title: w.meaning })),
            h('div', { class: 'vs-ww__from', text: [w.article_title ? `来自 ${w.article_title}` : '', fmtWhen(w.last_wrong_at)].filter(Boolean).join(' · ') })),
          h('span', { class: 'vs-ww__times', text: `错 ${w.wrong_count || 0} 次` }),
          h('button', { type: 'button', class: 'vs-ibtn', icon: 'play', 'aria-label': `听「${w.word}」的发音`, title: '听发音',
            onclick: () => playWord(w.word, w.article_id || (currentArticle && currentArticle.id)) }),
          h('button', { type: 'button', class: 'ui-btn ui-btn--sm', text: '记住了', title: '从错词本里移出',
            onclick: () => removeFromWrongWords(w.key, w.word) })))));
    }

    function showChallengeStats(box) {
      if (!challengeHistory.length) { box.replaceChildren(emptyBlock('还没有统计', '做过挑战以后，这里会有正确率和每天的记录。')); return; }
      const totalChallenges = challengeHistory.length;
      const totalQuestions = challengeHistory.reduce((s, c) => s + (c.total_questions || 0), 0);
      const totalCorrect = challengeHistory.reduce((s, c) => s + (c.correct_count || 0), 0);
      const avgAccuracy = totalQuestions ? Math.round(totalCorrect / totalQuestions * 100) : 0;
      const avgScore = Math.round(challengeHistory.reduce((s, c) => s + (c.score || 0), 0) / totalChallenges);
      const bestScore = Math.max(...challengeHistory.map(c => c.score || 0));
      const recent = challengeHistory.slice(0, 5);
      const recentAccuracy = Math.round(recent.reduce((s, c) => s + (c.accuracy || 0), 0) / recent.length);
      const daily = {};
      challengeHistory.forEach(c => {
        const d = new Date(c.timestamp);
        if (isNaN(d)) return;
        const key = `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
        const row = daily[key] || (daily[key] = { count: 0, questions: 0, correct: 0 });
        row.count++;
        row.questions += c.total_questions || 0;
        row.correct += c.correct_count || 0;
      });
      const days = Object.keys(daily).sort().reverse().slice(0, 10);
      box.replaceChildren(
        h('div', { class: 'vs-stats' },
          stat(totalChallenges, '', '总挑战次数'), stat(avgAccuracy, '%', '平均正确率'),
          stat(avgScore, '', '平均得分'), stat(bestScore, '', '最高得分')),
        h('p', { class: 'vs-para' }, `最近 ${recent.length} 次平均正确率 `, h('b', { text: recentAccuracy + '%' }),
          ' · 共答 ', h('b', { text: String(totalQuestions) }), ' 题，答对 ', h('b', { text: String(totalCorrect) }), ' 题'),
        h('div', { class: 'vs-table' },
          h('div', { class: 'vs-table__row is-head' }, h('span', { text: '日期' }), h('span', { text: '挑战' }), h('span', { text: '正确率' }), h('span', { text: '答对' })),
          ...days.map(key => {
            const r = daily[key];
            const [y, m, d] = key.split('-');
            return h('div', { class: 'vs-table__row' },
              h('span', { text: `${Number(m)} 月 ${Number(d)} 日` + (Number(y) !== new Date().getFullYear() ? `（${y}）` : '') }),
              h('span', { class: 'is-soft', text: `${r.count} 次` }),
              h('span', { text: r.questions ? Math.round(r.correct / r.questions * 100) + '%' : '—' }),
              h('span', { class: 'is-soft', text: `${r.correct} / ${r.questions}` }));
          })));
    }

    function removeFromWrongWords(key, word) {
      if (!confirm(`把「${word}」移出错词本？`)) return;
      delete wrongWordsRecord[key];
      saveWrongWordsToBackend();
      switchHistoryTab('wrong');
      toast(`已把「${word}」移出错词本`, 'ok');
    }

    function exportChallengeHistory() {
      if (!challengeHistory.length) { toast('还没有挑战记录可以导出', 'err'); return; }
      const rows = challengeHistory.map(c => [
        csvCell(new Date(c.timestamp).toLocaleString('zh-CN')), csvCell(recordTitle(c)),
        c.total_questions, c.correct_count, `${c.accuracy}%`, c.score, Math.round(c.time_bonus || 0)
      ].join(','));
      downloadText(`词汇挑战记录_${new Date().toLocaleDateString('zh-CN').replace(/\//g, '-')}.csv`,
        '挑战时间,文章,题目数,答对数,正确率,得分,时间奖励\n' + rows.join('\n') + '\n');
      toast(`已导出 ${challengeHistory.length} 条挑战记录`, 'ok');
    }

    // ==================== 存到后端（失败时备份在本机） ====================
    async function saveChallengeRecordToBackend(record) {
      try {
        const response = await fetch('/api/vocab_challenge_record', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ challenge_record: record })
        });
        if (!response.ok) throw new Error(String(response.status));
      } catch (error) {
        let local = [];
        try { local = JSON.parse(storeGet('vocabChallengeHistory', '[]')); } catch (e) {}
        local.unshift(record);
        storeSet('vocabChallengeHistory', JSON.stringify(local.slice(0, 50)));
        toast('挑战记录没存到服务器，先存在这台设备上', 'err');
      }
    }
    async function saveWrongWordsToBackend() {
      try {
        const response = await fetch('/api/vocab_wrong_words', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ wrong_words: wrongWordsRecord })
        });
        if (!response.ok) throw new Error(String(response.status));
      } catch (error) {
        storeSet('vocabWrongWords', JSON.stringify(wrongWordsRecord));
      }
    }

    // ==================== 绑定 ====================
    CATS.forEach(c => $('tab-' + c).addEventListener('click', () => { if (c !== activeCat) setActiveCat(c); }));
    $('vocabSearch').addEventListener('input', () => { if (currentArticle && currentVocab) renderVocab(); });  // 还在加载时不画，加载完会按搜索词画
    $('historyBtn').addEventListener('click', openChallengeHistory);
    $('challengeBtn').addEventListener('click', () => openChallengeSetup());
    $('exportBtn').addEventListener('click', e => { e.stopPropagation(); toggleExportMenu(); });
    $('exportMenu').addEventListener('click', e => {
      const btn = e.target.closest('[data-export]');
      if (btn && !btn.disabled) exportVocab(btn.dataset.export);
    });
    document.addEventListener('click', e => {
      if (!$('exportMenu').hidden && !e.target.closest('.vs-menu-wrap')) toggleExportMenu(false);
    });
    $('selectAllArticles').addEventListener('change', e => toggleAllArticlesSelection(e.target.checked));
    $('challengeWordCount').addEventListener('input', e => {
      const n = parseInt(e.target.value, 10);
      if (!isNaN(n)) $('wordCountSlider').value = Math.min(50, Math.max(5, n));
      updateChallengeStats();
    });
    $('challengeWordCount').addEventListener('change', e => { e.target.value = clampCount(e.target.value); updateChallengeStats(); });
    $('wordCountSlider').addEventListener('input', e => { $('challengeWordCount').value = e.target.value; updateChallengeStats(); });
    $('startChallengeBtn').addEventListener('click', startVocabChallenge);
    $('skipBtn').addEventListener('click', () => skipQuestion(false));
    $('quitBtn').addEventListener('click', quitChallenge);
    $('reviewWrongBtn').addEventListener('click', () => { if (lastResult) reviewWrongOf(lastResult); });
    $('restartBtn').addEventListener('click', () => {
      const ids = lastResult ? lastResult.article_ids : null;
      closeDialog('challengeResultModal');
      openChallengeSetup(ids);
    });
    ['recent', 'wrong', 'stats'].forEach(t => $(t + 'Tab').addEventListener('click', () => switchHistoryTab(t)));
    $('exportHistoryBtn').addEventListener('click', exportChallengeHistory);

    // 没登录时导航脚本（app-shell.js）会跳去登录页，这里只管有凭证时加载数据
    if (storeGet('authToken', '')) loadData();
    else $('articleList').replaceChildren(h('div', { class: 'vs-rail__msg', text: '登录后显示你的文章。' }));
  </script>
</body>
</html>
