<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script>
    (function () {
      try {
        var preference = localStorage.getItem('ui-theme');
        if (preference !== 'light' && preference !== 'dark' && preference !== 'system') preference = 'system';
        var isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = preference === 'system' ? (isDark ? 'dark' : 'light') : preference;
        var root = document.documentElement;
        root.dataset.themePreference = preference;
        root.dataset.theme = theme;
        root.style.colorScheme = theme;
        root.classList.toggle('dark', theme === 'dark');
      } catch (error) {
        document.documentElement.dataset.themePreference = 'system';
        document.documentElement.dataset.theme = 'light';
        document.documentElement.style.colorScheme = 'light';
      }
    })();
  </script>

  <style>
    /* 学习交流小天地 · 本页样式（mb- 前缀，配合 plain.css 的 ui- 组件）
       设计稿：Claude Design 画布「学习交流小天地 · 改版」，样式与画布里的 mb.css 一致 */
    body.page-message-board svg { flex-shrink: 0; }
    .mb-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    /* ==================== 页面骨架 ==================== */
    .mb-page { width: 92%; max-width: var(--page-max); margin: 0 auto; }
    .mb-head {
      display: flex; align-items: flex-end; justify-content: space-between; gap: 18px;
      padding: 26px 0 18px 0; border-bottom: 1px solid var(--w-line);
    }
    .mb-head__title { margin: 0; font-size: var(--w-fs-title); font-weight: 600; line-height: 1.35; color: var(--w-ink); display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
    .mb-head__meta { font-size: var(--w-fs-meta); font-weight: 400; color: var(--w-ink3); }
    .mb-head__lede { margin: 6px 0 0 0; font-size: var(--w-fs-ui); color: var(--w-ink2); }
    .mb-layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: var(--gap-18); align-items: start; padding: 22px 0 64px 0; }
    .mb-feed { display: flex; flex-direction: column; gap: var(--gap-12); min-width: 0; }
    .mb-posts { display: flex; flex-direction: column; gap: var(--gap-12); }
    .mb-aside { display: flex; flex-direction: column; gap: var(--gap-12); position: sticky; top: calc(var(--h-appbar) + 18px); }
    .mb-loading { padding: 28px 0; text-align: center; font-size: var(--w-fs-meta); color: var(--w-ink3); }

    /* ==================== 小零件 ==================== */
    .mb-avatar { width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0; background: var(--w-sunken); border: 1px solid var(--w-line); object-fit: cover; }
    .mb-avatar--sm { width: 28px; height: 28px; }
    .mb-avatar--xs { width: 22px; height: 22px; }
    .mb-iconbtn {
      width: var(--h-sm); height: var(--h-sm); padding: 0; flex-shrink: 0;
      display: inline-flex; align-items: center; justify-content: center;
      border: 1px solid transparent; border-radius: var(--w-r-chip); background: transparent;
      color: var(--w-ink3); cursor: pointer; transition: background .15s, color .15s, border-color .15s;
    }
    .mb-iconbtn:hover { background: var(--w-sunken); color: var(--w-ink); }
    .mb-iconbtn--danger:hover { background: var(--w-err-soft); border-color: var(--w-err-line); color: var(--w-err); }
    .mb-iconbtn--round { border-radius: 50%; border-color: var(--w-line); background: var(--w-surface); color: var(--w-ink2); }
    .mb-iconbtn--round:hover { border-color: var(--w-big-line); background: var(--w-big-soft); color: var(--w-big); }
    .mb-meta { font-size: var(--w-fs-meta); color: var(--w-ink3); }
    .mb-btns { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

    /* ==================== 发帖框 ==================== */
    .mb-composer { padding: 18px 20px; }
    .mb-composer.is-open { border-color: var(--w-big-line); }
    .mb-composer__row { display: flex; align-items: center; gap: 12px; }
    .mb-composer__fake {
      flex: 1 1 auto; min-width: 0; height: var(--h-nav); padding: 0 14px; text-align: left;
      border: 1px solid var(--w-line-strong); border-radius: var(--w-r-inner); background: var(--w-surface);
      color: var(--w-ink3); font-size: var(--w-fs-ui); cursor: text; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .mb-composer__fake:hover { border-color: var(--w-big-line); }
    .mb-tools { display: flex; align-items: center; gap: var(--gap-8); flex-wrap: wrap; }
    .mb-composer__body { display: flex; flex-direction: column; gap: 12px; }
    .mb-composer__top { display: flex; gap: 12px; align-items: flex-start; }
    .mb-composer__top > label { flex: 1 1 auto; min-width: 0; }
    .mb-composer__top .ui-textarea { min-height: 108px; }
    .mb-composer__bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-left: 48px; }
    .mb-composer__send { display: flex; align-items: center; gap: 10px; margin-left: auto; }
    .mb-composer__atts { display: flex; flex-direction: column; gap: 8px; padding-left: 48px; }
    .mb-composer__atts:empty, .mb-reply .mb-comment__atts:empty { display: none; }
    .mb-composer__hint { font-size: var(--w-fs-meta); color: var(--w-ink3); }

    /* ==================== 附件块（帖子、评论、发帖框共用） ==================== */
    .mb-att {
      display: flex; align-items: flex-start; gap: 12px;
      padding: 12px 14px; background: var(--w-sunken);
      border: 1px solid var(--w-line); border-radius: var(--w-r-inner);
    }
    .mb-att__ico {
      width: 34px; height: 34px; flex-shrink: 0; border-radius: var(--w-r-chip);
      display: inline-flex; align-items: center; justify-content: center;
      background: var(--w-surface); border: 1px solid var(--w-line); color: var(--w-ink2);
    }
    .mb-att__body { flex: 1 1 auto; min-width: 0; }
    .mb-att__kind { font-size: var(--w-fs-meta); color: var(--w-ink3); line-height: 1.5; }
    .mb-att__title { font-family: var(--font-en); font-size: var(--w-fs-en); font-weight: 600; line-height: 1.45; color: var(--w-ink); overflow-wrap: anywhere; }
    .mb-att__desc { margin-top: 4px; font-family: var(--font-en); font-size: var(--w-fs-ui); line-height: 1.6; color: var(--w-ink2); white-space: pre-line; overflow-wrap: anywhere; }
    .mb-att__actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .mb-att__remove { margin: -4px -6px 0 0; }
    .mb-att--compact { padding: 9px 12px; gap: 10px; }
    .mb-att--compact .mb-att__ico { width: 28px; height: 28px; }
    .mb-att--compact .mb-att__title { font-size: var(--w-fs-ui); }
    .mb-play {
      width: var(--h-sm); height: var(--h-sm); padding: 0; border-radius: 50%; flex-shrink: 0;
      display: inline-flex; align-items: center; justify-content: center;
      border: 1px solid var(--w-big-line); background: var(--w-big-soft); color: var(--w-big); cursor: pointer;
      transition: border-color .15s, background .15s;
    }
    .mb-play:hover { border-color: var(--w-big); }
    .mb-player { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
    .mb-player .ui-progress { flex: 1 1 auto; }
    .mb-player .ui-progress__bar { cursor: pointer; }

    /* 图片 */
    .mb-images { display: grid; gap: 8px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .mb-images--one { grid-template-columns: minmax(0, 440px); }
    .mb-images--small { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .mb-images__btn { padding: 0; border: none; background: none; display: block; position: relative; cursor: zoom-in; border-radius: var(--w-r-inner); min-width: 0; }
    .mb-images__img {
      display: block; width: 100%; height: 168px; object-fit: cover; cursor: zoom-in;
      border: 1px solid var(--w-line); border-radius: var(--w-r-inner); background: var(--w-sunken);
    }
    .mb-images--one .mb-images__img { height: auto; max-height: 360px; }
    .mb-images--small .mb-images__img { height: 110px; }
    .mb-thumbs { display: flex; gap: 14px; flex-wrap: wrap; padding: 8px 0 2px 0; }
    .mb-thumb { position: relative; width: 96px; height: 72px; flex-shrink: 0; }
    .mb-thumb img, .mb-thumb__blank { width: 100%; height: 100%; object-fit: cover; border-radius: var(--w-r-inner); border: 1px solid var(--w-line); display: block; background: var(--w-sunken); }
    .mb-thumb__mask {
      position: absolute; inset: 0; border-radius: var(--w-r-inner); background: var(--w-mask);
      display: flex; align-items: center; justify-content: center; font-size: var(--w-fs-meta); color: var(--w-ink2);
    }
    .mb-thumb__x { position: absolute; top: -8px; right: -8px; width: 24px; height: 24px; border-radius: 50%; padding: 0;
      display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
      background: var(--w-surface); border: 1px solid var(--w-line-strong); color: var(--w-ink2); }
    .mb-thumb__x:hover { color: var(--w-err); border-color: var(--w-err-line); }

    /* 挑战块 */
    .mb-ch { padding: 14px 16px; background: var(--w-sunken); border: 1px solid var(--w-line); border-radius: var(--w-r-inner); }
    .mb-ch--compact { padding: 10px 12px; }
    .mb-ch--compact .mb-ch__title { font-size: var(--w-fs-ui); }
    .mb-ch--compact .mb-ch__foot { margin-top: 8px; padding-top: 8px; }
    .mb-ch__row { display: flex; align-items: flex-start; gap: 10px; }
    .mb-ch__row > div { flex: 1 1 auto; min-width: 0; }
    .mb-ch__top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .mb-ch__title { margin-top: 6px; font-size: var(--w-fs-en); font-weight: 600; line-height: 1.45; color: var(--w-ink); overflow-wrap: anywhere; }
    .mb-ch.is-gone .mb-ch__title { color: var(--w-ink2); }
    .mb-ch__desc { margin-top: 2px; font-size: var(--w-fs-ui); color: var(--w-ink2); white-space: pre-line; overflow-wrap: anywhere; }
    .mb-ch__people { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
    .mb-ch__foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--w-line); }
    .mb-ch.is-gone .mb-ch__foot { border-top: none; padding-top: 0; margin-top: 6px; }
    .mb-ch__mine { font-size: var(--w-fs-ui); color: var(--w-ink2); }
    .mb-ch__mine b { color: var(--w-ink); font-weight: 600; }

    /* ==================== 帖子 ==================== */
    .mb-post { padding: 20px 24px; transition: border-color .3s, box-shadow .3s; }
    .mb-post.is-flash { border-color: var(--w-big-line); box-shadow: var(--w-ring); }
    .mb-post__head { display: flex; align-items: center; gap: 12px; }
    .mb-post__who { flex: 1 1 auto; min-width: 0; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    .mb-post__name { font-size: var(--w-fs-ui); font-weight: 600; color: var(--w-ink); }
    .mb-post__text { margin: 12px 0 0 0; font-size: var(--w-fs-ui); line-height: 1.75; color: var(--w-ink); white-space: pre-wrap; overflow-wrap: anywhere; }
    .mb-post__atts { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
    .mb-post__foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--w-line); }

    /* ==================== 评论 ==================== */
    .mb-comments { margin-top: 12px; padding: 2px 16px; background: var(--w-sunken); border-radius: var(--w-r-inner); }
    .mb-comment { display: flex; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--w-line); }
    .mb-comment:last-child { border-bottom: none; }
    .mb-comment__main { flex: 1 1 auto; min-width: 0; }
    .mb-comment__head { display: flex; align-items: center; gap: 8px; min-height: 28px; }
    .mb-comment__name { font-size: var(--w-fs-ui); font-weight: 600; color: var(--w-ink); }
    .mb-comment__text { margin: 2px 0 0 0; font-size: var(--w-fs-ui); line-height: 1.7; color: var(--w-ink); white-space: pre-wrap; overflow-wrap: anywhere; }
    .mb-comment__atts { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
    .mb-comments .mb-att, .mb-comments .mb-ch { background: var(--w-surface); }
    .mb-comment__del { margin-left: auto; width: 28px; height: 28px; }
    .mb-reply { margin-top: 12px; display: flex; flex-direction: column; gap: 10px; }
    .mb-reply .ui-textarea { min-height: 80px; }
    .mb-reply .mb-comment__atts { margin-top: 0; }
    .mb-reply__bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }

    /* ==================== 右侧栏 ==================== */
    .mb-side { padding: 18px 20px; }
    .mb-side .ui-card__head { margin-bottom: 10px; }
    .mb-side__sub { font-size: var(--w-fs-ui); font-weight: 600; color: var(--w-ink); margin: -2px 0 8px 0; overflow-wrap: anywhere; }
    .mb-side__empty { margin: 0; font-size: var(--w-fs-meta); line-height: 1.7; color: var(--w-ink3); }
    .mb-pending { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--w-line); }
    .mb-pending:first-of-type { border-top: none; padding-top: 2px; }
    .mb-pending__main { flex: 1 1 auto; min-width: 0; }
    .mb-pending__title { display: block; padding: 0; border: none; background: none; text-align: left; cursor: pointer;
      font-size: var(--w-fs-ui); font-weight: 600; color: var(--w-ink); line-height: 1.5; overflow-wrap: anywhere; }
    .mb-pending__title:hover { color: var(--w-big); }
    .mb-rank { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--w-r-inner); }
    .mb-rank.is-me { background: var(--w-big-soft); }
    .mb-rank__no { width: 18px; flex-shrink: 0; text-align: center; font-size: var(--w-fs-meta); font-weight: 600; color: var(--w-ink3); font-variant-numeric: tabular-nums; }
    .mb-rank__no.is-top { color: var(--w-big); }
    .mb-rank__name { flex: 1 1 auto; min-width: 0; font-size: var(--w-fs-ui); color: var(--w-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mb-rank__score { font-size: var(--w-fs-ui); font-weight: 600; color: var(--w-ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .mb-rank__sub { font-size: var(--w-fs-meta); color: var(--w-ink3); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .mb-rank.is-waiting .mb-rank__name { color: var(--w-ink3); }
    .mb-rank.is-waiting .mb-avatar { opacity: .55; }
    .mb-ranklist { display: flex; flex-direction: column; gap: 2px; }
    .mb-howto { font-size: var(--w-fs-meta); line-height: 1.7; color: var(--w-ink2); margin: 0; }
    .mb-howto-title { font-size: var(--w-fs-ui); margin: 0 0 6px 0; }

    /* ==================== 弹窗 ==================== */
    /* 头和底固定，中间滚动：发起挑战这种长表单在矮屏幕上也看得到标题和按钮 */
    .mb-dlg { display: flex; flex-direction: column; overflow: hidden; }
    .mb-dlg:focus { outline: none; }
    .mb-dlg > .ui-dialog__head, .mb-dlg > .ui-dialog__foot { flex-shrink: 0; }
    .mb-dlg > .ui-dialog__body { flex: 1 1 auto; min-height: 0; overflow: auto; }
    .mb-dlg > .ui-dialog__foot { padding-top: 14px; }
    .mb-dialog-wide { width: min(720px, 100%); }
    .mb-dialog-mid { width: min(620px, 100%); }
    .mb-dialog-small { width: min(420px, 100%); }
    .mb-dialog-result { width: min(500px, 100%); }
    .mb-dialog-foot-split { justify-content: space-between; align-items: center; }
    .mb-dialog-text { margin: 0; color: var(--w-ink2); }
    .mb-picker { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 14px; min-height: 340px; }
    .mb-picker__rail { display: flex; flex-direction: column; gap: 2px; padding-right: 14px; border-right: 1px solid var(--w-line); }
    .mb-picker__rail .ui-rail__item { padding: 9px 10px; }
    .mb-picker__list { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
    .mb-picker__empty { padding: 40px 0; text-align: center; font-size: var(--w-fs-meta); color: var(--w-ink3); }
    .mb-topic { border: 1px solid var(--w-line); border-radius: var(--w-r-inner); background: var(--w-surface); }
    .mb-topic.is-open { border-color: var(--w-big-line); }
    .mb-topic__head { width: 100%; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: none; background: none; text-align: left; cursor: pointer; color: var(--w-ink3); }
    .mb-topic__head svg { transition: transform .15s; }
    .mb-topic.is-open .mb-topic__head svg { transform: rotate(180deg); }
    .mb-topic__name { flex: 1 1 auto; min-width: 0; font-family: var(--font-en); font-size: var(--w-fs-ui); font-weight: 600; color: var(--w-ink); overflow-wrap: anywhere; }
    .mb-topic__rows { border-top: 1px solid var(--w-line); padding: 4px 12px; }
    .mb-pick { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--w-line); }
    .mb-pick:last-child { border-bottom: none; }
    .mb-pick--solo { padding: 10px 12px; }
    .mb-pick__main { flex: 1 1 auto; min-width: 0; }
    .mb-pick__q { font-family: var(--font-en); font-size: var(--w-fs-ui); color: var(--w-ink); line-height: 1.5; white-space: pre-line; overflow-wrap: anywhere; }
    .mb-pick__q--cn { font-family: var(--font-cn); font-weight: 600; }
    .mb-checklist { border: 1px solid var(--w-line-strong); border-radius: var(--w-r-inner); max-height: 236px; overflow: auto; padding: 4px 0; }
    .mb-checklist__group { font-size: var(--w-fs-meta); letter-spacing: 1.5px; color: var(--w-ink3); padding: 8px 14px 4px 14px; }
    .mb-check { width: 100%; display: flex; align-items: center; gap: 10px; padding: 8px 14px; border: none; background: none; text-align: left; cursor: pointer; color: inherit; }
    .mb-check:hover { background: var(--w-sunken); }
    .mb-check__box { width: 18px; height: 18px; flex-shrink: 0; border-radius: 4px; border: 1.5px solid var(--w-line-strong); background: var(--w-surface); display: inline-flex; align-items: center; justify-content: center; color: var(--w-on-big); }
    .mb-check.is-on .mb-check__box { background: var(--w-big); border-color: var(--w-big); }
    .mb-check__name { flex: 1 1 auto; min-width: 0; font-family: var(--font-en); font-size: var(--w-fs-ui); color: var(--w-ink); overflow-wrap: anywhere; }
    .mb-check > .mb-meta, .mb-pick .ui-tag, .mb-pick .ui-btn { flex-shrink: 0; white-space: nowrap; }
    .mb-count-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .mb-count-row .ui-input { width: 92px; }
    .mb-people { display: flex; gap: 8px; flex-wrap: wrap; }
    .mb-people .ui-chip { padding: 0 12px 0 6px; }
    .mb-field-err { font-size: var(--w-fs-meta); color: var(--w-err); }

    /* 答题 */
    .mb-quiz { width: min(560px, 100%); }
    .mb-quiz__head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 20px 24px 0 24px; }
    .mb-quiz__head .ui-dialog__title { overflow-wrap: anywhere; }
    .mb-quiz__progress { padding: 12px 24px 0 24px; }
    .mb-quiz__body { padding: 18px 24px 22px 24px; display: flex; flex-direction: column; gap: 14px; }
    .mb-timer { display: flex; align-items: center; gap: 12px; }
    .mb-timer__num { font-size: var(--w-fs-title); font-weight: 600; color: var(--w-ink); font-variant-numeric: tabular-nums; min-width: 28px; }
    .mb-timer__bar { flex: 1 1 auto; height: 4px; border-radius: 2px; background: var(--w-big-track); overflow: hidden; }
    .mb-timer__bar > i { display: block; height: 100%; background: var(--w-big); }
    .mb-timer.is-low .mb-timer__num { color: var(--w-warn); }
    .mb-timer.is-low .mb-timer__bar > i { background: var(--w-warn); }
    .mb-question { padding: 22px 20px; background: var(--w-sunken); border: 1px solid var(--w-line); border-radius: var(--w-r-inner); text-align: center; }
    .mb-question__ask { font-size: var(--w-fs-meta); color: var(--w-ink3); margin-bottom: 6px; }
    .mb-question__word { display: inline-flex; align-items: center; gap: 10px; font-family: var(--font-en); font-size: var(--w-fs-title); font-weight: 600; color: var(--w-ink); overflow-wrap: anywhere; }
    .mb-question__cn { font-size: var(--w-fs-en); font-weight: 600; color: var(--w-ink); overflow-wrap: anywhere; }
    .mb-opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .mb-opt {
      min-height: 56px; padding: 10px 14px; display: flex; align-items: center; gap: 10px; text-align: left;
      border: 1px solid var(--w-line-strong); border-radius: var(--w-r-inner); background: var(--w-surface);
      color: var(--w-ink); font-size: var(--w-fs-ui); cursor: pointer; transition: border-color .15s, background .15s;
    }
    .mb-opt:not(:disabled):hover { border-color: var(--w-big-line); background: var(--w-big-soft); }
    .mb-opt:disabled { cursor: default; }
    .mb-opt__key { width: 20px; height: 20px; flex-shrink: 0; border-radius: 4px; border: 1px solid var(--w-line); display: inline-flex; align-items: center; justify-content: center; font-size: 11px; color: var(--w-ink3); font-variant-numeric: tabular-nums; }
    .mb-opt__text { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
    .mb-opt__text--en { font-family: var(--font-en); font-size: var(--w-fs-en); }
    .mb-opt__mark { font-size: var(--w-fs-meta); font-weight: 600; white-space: nowrap; }
    .mb-opt.is-right { border-color: var(--w-ok-line); background: var(--w-ok-soft); }
    .mb-opt.is-right .mb-opt__mark { color: var(--w-ok); }
    .mb-opt.is-wrong { border-color: var(--w-err-line); background: var(--w-err-soft); }
    .mb-opt.is-wrong .mb-opt__mark { color: var(--w-err); }
    .mb-opt.is-dim { opacity: .55; }
    .mb-quiz__note { font-size: var(--w-fs-meta); color: var(--w-ink3); text-align: center; min-height: 1.65em; }
    .mb-notice { padding: 9px 12px; border-radius: var(--w-r-inner); font-size: var(--w-fs-ui); background: var(--w-warn-soft); color: var(--w-warn); }
    .mb-missed { border: 1px solid var(--w-line); border-radius: var(--w-r-inner); }
    .mb-missed__row { display: flex; align-items: baseline; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--w-line); }
    .mb-missed__row:last-child { border-bottom: none; }
    .mb-missed__word { font-family: var(--font-en); font-size: var(--w-fs-ui); font-weight: 600; color: var(--w-ink); min-width: 110px; overflow-wrap: anywhere; }
    .mb-missed__mean { flex: 1 1 auto; min-width: 0; font-size: var(--w-fs-ui); color: var(--w-ink2); }
    .mb-missed__mine { font-size: var(--w-fs-meta); color: var(--w-err); white-space: nowrap; }
    .mb-stats3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .mb-rank-info__title { font-size: var(--w-fs-en); font-weight: 600; color: var(--w-ink); overflow-wrap: anywhere; }
    .mb-rank-info__desc { color: var(--w-ink2); white-space: pre-line; overflow-wrap: anywhere; }
    .mb-rank-body { border-top: 1px solid var(--w-line); padding-top: 10px; }

    /* 看大图 */
    .mb-lightbox { position: fixed; inset: 0; z-index: 1400; background: var(--w-mask); display: flex; align-items: center; justify-content: center; padding: 40px 80px; }
    .mb-lightbox__img { max-width: 100%; max-height: calc(100vh - 120px); border-radius: var(--w-r-card); border: 1px solid var(--w-line); box-shadow: var(--w-shadow-lg); background: var(--w-surface); display: block; }
    .mb-lightbox__close { position: absolute; top: 20px; right: 24px; width: 44px; height: 44px; }
    .mb-lightbox__nav { position: absolute; top: 50%; margin-top: -22px; width: 44px; height: 44px; }
    .mb-lightbox__count { position: absolute; bottom: 14px; left: 0; right: 0; text-align: center; font-size: var(--w-fs-meta); color: var(--w-ink2); }

    /* 删除确认里的红色主操作 */
    .mb-btn-danger { border-color: var(--w-err-line); background: var(--w-err-soft); color: var(--w-err); font-weight: 600; }
    .mb-btn-danger:hover { border-color: var(--w-err); color: var(--w-err); }

    /* ==================== 窄一点的电脑屏幕 ==================== */
    @media (min-width: 821px) and (max-width: 1080px) {
      .mb-layout { grid-template-columns: minmax(0, 1fr) 280px; }
      .mb-composer__row { flex-wrap: wrap; }
      .mb-composer__fake { flex-basis: calc(100% - 48px); }
      .mb-composer__row > .mb-tools { margin-left: 48px; }
    }

    /* ==================== 手机 ==================== */
    @media (max-width: 820px) {
      .mb-page { width: auto; margin: 0 16px; }
      .mb-head { padding: 18px 0 14px 0; display: block; }
      .mb-layout { display: flex; flex-direction: column; align-items: stretch; gap: var(--gap-12); padding-top: 14px; }
      /* 侧栏拆开：「等你完成」放最上面，「最近的挑战」和算分说明排到帖子后面 */
      .mb-aside { display: contents; }
      #pendingCard { order: -1; }
      #pendingCard.is-empty { display: none; }
      #recentCard { order: 1; }
      #howtoCard { order: 2; }
      .mb-post { padding: 16px; }
      .mb-composer { padding: 14px 16px; }
      .mb-composer__row { flex-wrap: wrap; }
      .mb-composer__row > .mb-avatar, .mb-composer__top > .mb-avatar { display: none; }
      .mb-composer__fake { flex-basis: 100%; }
      .mb-composer__bar, .mb-composer__atts { padding-left: 0; }
      .mb-att { padding: 10px 12px; }
    }
    @media (max-width: 560px) {
      .mb-att:not(.has-remove) { flex-wrap: wrap; }
      .mb-att:not(.has-remove) .mb-att__body { flex-basis: calc(100% - 46px); }
      .mb-att:not(.has-remove) .mb-att__actions { margin-left: 46px; }
      .mb-att--compact:not(.has-remove) .mb-att__body { flex-basis: calc(100% - 38px); }
      .mb-att--compact:not(.has-remove) .mb-att__actions { margin-left: 38px; }
      .mb-images { grid-template-columns: repeat(2, minmax(0, 1fr)); }

      .mb-images--small .mb-images__img { height: 84px; }
      .mb-comments { padding: 2px 12px; }
      body.page-message-board .ui-dialog-backdrop { padding: 12px; }
      body.page-message-board .ui-dialog { max-height: calc(100vh - 24px); }
      body.page-message-board .ui-dialog__head, .mb-quiz__head, .mb-quiz__progress { padding-left: 16px; padding-right: 16px; }
      body.page-message-board .ui-dialog__body, .mb-quiz__body { padding-left: 16px; padding-right: 16px; }
      body.page-message-board .ui-dialog__foot { padding-left: 16px; padding-right: 16px; flex-wrap: wrap; }
      .mb-picker { grid-template-columns: minmax(0, 1fr); min-height: 0; }
      .mb-picker__rail { flex-direction: row; overflow-x: auto; padding: 0 0 10px 0; border-right: none; border-bottom: 1px solid var(--w-line); }
      .mb-picker__rail .ui-rail__item { width: auto; flex-shrink: 0; }
      .mb-opts { grid-template-columns: minmax(0, 1fr); }
      .mb-opt { min-height: 48px; }
      .mb-question { padding: 16px 14px; }
      .mb-stats3 { gap: 8px; }
      .mb-stats3 .ui-stat { padding: 12px; }
      .mb-missed__row { flex-wrap: wrap; gap: 4px 12px; }
      .mb-missed__word { min-width: 0; }
      .mb-rank__sub { display: none; }
      .mb-lightbox { padding: 64px 12px; }
      .mb-lightbox__close { top: 12px; right: 12px; }
      .mb-lightbox__nav { top: auto; bottom: 12px; margin-top: 0; }
      .mb-lightbox__count { bottom: 26px; }
    }
  </style>
</head>
<body class="theme-page page-message-board ui-plain">
  <main class="mb-page">
    <header class="mb-head">
      <div>
        <h1 class="mb-head__title">学习交流小天地 <span class="mb-head__meta ui-num" id="postCount"></span></h1>
        <p class="mb-head__lede">分享录音、精读文章和学习笔记；也能从精读生词里出一套小测，@ 同伴一起比一比。</p>
      </div>
    </header>

    <div class="mb-layout">
      <section class="mb-feed" aria-label="帖子">
        <div class="ui-card mb-composer" id="composer"></div>
        <div class="mb-posts" id="postsList"><div class="mb-loading">正在读取帖子…</div></div>
      </section>

      <aside class="mb-aside" aria-label="单词挑战">
        <section class="ui-card mb-side" id="pendingCard" hidden></section>
        <section class="ui-card mb-side" id="recentCard" hidden></section>
        <section class="ui-card ui-card--sunken mb-side" id="howtoCard">
          <h2 class="ui-card__title mb-howto-title">单词挑战怎么算分</h2>
          <p class="mb-howto">从精读文章里标过释义的生词出题，每题 10 秒。答对得正确分（满分 70），答得越快速度分越高（满分 30）。被 @ 的人打开这一页会看到提醒。</p>
        </section>
      </aside>
    </div>
  </main>

  <script>
  (function () {
    'use strict';

    // ==================== 小工具 ====================
    var ICONS = {
      mic: '<rect x="6" y="2" width="4" height="7" rx="2"></rect><path d="M3.5 7.5a4.5 4.5 0 0 0 9 0M8 12v2"></path>',
      layers: '<path d="M8 2.5 13.5 5.5 8 8.5 2.5 5.5z"></path><path d="M2.5 8.5 8 11.5l5.5-3"></path><path d="M2.5 11 8 14l5.5-3"></path>',
      book: '<path d="M2.5 3.5h4A1.5 1.5 0 0 1 8 5v8a1.5 1.5 0 0 0-1.5-1.5h-4zM13.5 3.5h-4A1.5 1.5 0 0 0 8 5v8a1.5 1.5 0 0 1 1.5-1.5h4z"></path>',
      image: '<rect x="2.5" y="3" width="11" height="10" rx="1.5"></rect><circle cx="6" cy="6.5" r="1.2"></circle><path d="M13.5 10.5 10.5 7.5 4 13"></path>',
      flag: '<path d="M3.5 14V2.5M3.5 3h8.5l-1.8 2.75L12 8.5H3.5"></path>',
      trash: '<path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.6 8.5h5.8l.6-8.5"></path>',
      x: '<path d="M4 4l8 8M12 4l-8 8"></path>',
      comment: '<path d="M13.5 8.5c0 2.5-2.5 4.5-5.5 4.5-.8 0-1.5-.1-2.2-.4L2.5 13.5l1-2.6C2.6 10 2.5 9.3 2.5 8.5c0-2.5 2.5-4.5 5.5-4.5s5.5 2 5.5 4.5z"></path>',
      play: '<path d="M5.5 3.5v9l7-4.5z"></path>',
      pause: '<path d="M5.5 3.5v9M10.5 3.5v9"></path>',
      right: '<path d="M6 3.5 10.5 8 6 12.5"></path>',
      left: '<path d="M10 3.5 5.5 8 10 12.5"></path>',
      down: '<path d="M3.5 6 8 10.5 12.5 6"></path>',
      check: '<path d="M3.5 8.5 6.5 11.5 12.5 4.5"></path>',
      speaker: '<path d="M3 6.2h2.2L8.5 3.5v9L5.2 9.8H3z"></path><path d="M11 5.8a3 3 0 0 1 0 4.4M12.8 4.2a5.2 5.2 0 0 1 0 7.6"></path>'
    };

    function icon(name, size, stroke) {
      var holder = document.createElement('span');
      holder.innerHTML = '<svg width="' + (size || 16) + '" height="' + (size || 16) + '" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="' + (stroke || 1.5) + '" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICONS[name] + '</svg>';
      return holder.firstChild;
    }

    // 所有用户写的内容都走 textContent，不拼 HTML
    function el(tag, props) {
      var node = document.createElement(tag);
      if (props) {
        Object.keys(props).forEach(function (key) {
          var value = props[key];
          if (value === null || value === undefined || value === false) return;
          if (key === 'class') node.className = value;
          else if (key === 'text') node.textContent = value;
          else if (key.slice(0, 2) === 'on') node.addEventListener(key.slice(2), value);
          else node.setAttribute(key, value === true ? '' : value);
        });
      }
      for (var i = 2; i < arguments.length; i++) add(node, arguments[i]);
      return node;
    }
    function add(node, child) {
      if (child === null || child === undefined || child === false) return;
      if (Array.isArray(child)) { child.forEach(function (c) { add(node, c); }); return; }
      node.appendChild(child.nodeType ? child : document.createTextNode(String(child)));
    }
    // 原生 append / replaceChildren 会把 null 变成文字 "null"，本页一律用这两个
    function append(node) {
      for (var i = 1; i < arguments.length; i++) add(node, arguments[i]);
      return node;
    }
    function fill(node) {
      node.replaceChildren();
      for (var i = 1; i < arguments.length; i++) add(node, arguments[i]);
      return node;
    }
    function btn(label, opts) {
      opts = opts || {};
      var cls = 'ui-btn ' + (opts.size === 'md' ? 'ui-btn--md' : 'ui-btn--sm');
      if (opts.kind) cls += ' ' + opts.kind;
      return el('button', { class: cls, type: 'button', onclick: opts.onclick, disabled: opts.disabled, title: opts.title, 'data-autofocus': opts.autofocus },
        opts.icon ? icon(opts.icon) : null, label);
    }

    function toast(message, type) {
      if (window.IELTSUI && window.IELTSUI.toast) {
        window.IELTSUI.toast(message, type === 'err' ? 'error' : type === 'ok' ? 'success' : 'info');
      } else {
        window.alert(message);
      }
    }

    function api(url, options) {
      options = options || {};
      var headers = { 'Authorization': 'Bearer ' + S.token };
      var init = { method: options.method || 'GET', headers: headers };
      if (options.json !== undefined) {
        headers['Content-Type'] = 'application/json';
        init.body = JSON.stringify(options.json);
      } else if (options.form) {
        init.body = options.form;
      }
      return fetch(url, init).then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (data) {
          if (!r.ok || data.success === false) {
            var err = new Error(data.error || ('服务器返回 ' + r.status));
            err.status = r.status;
            throw err;
          }
          return data;
        });
      }, function () {
        var err = new Error('网络连不上');
        err.status = 0;
        throw err;
      });
    }

    function pad2(n) { return (n < 10 ? '0' : '') + n; }
    function monthDay(d) {
      var text = (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日';
      return d.getFullYear() === new Date().getFullYear() ? text : d.getFullYear() + ' 年 ' + text;
    }
    // 帖子时间：刚刚 / N 分钟前 / N 小时前 / N 天前 / 日期
    function relTime(ts) {
      var d = new Date(ts);
      if (isNaN(d)) return '';
      var diff = Date.now() - d.getTime();
      if (diff < 60000) return '刚刚';
      if (diff < 3600000) return Math.floor(diff / 60000) + ' 分钟前';
      if (diff < 86400000) return Math.floor(diff / 3600000) + ' 小时前';
      if (diff < 604800000) return Math.floor(diff / 86400000) + ' 天前';
      return monthDay(d);
    }
    // 成绩时间：一天内说「N 小时前」，再早写到分钟
    function stampTime(ts) {
      var d = new Date(ts);
      if (isNaN(d)) return '';
      if (Date.now() - d.getTime() < 86400000) return relTime(ts);
      return monthDay(d) + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
    }
    function clock(sec) {
      sec = Math.max(0, Math.round(sec || 0));
      return Math.floor(sec / 60) + ':' + pad2(sec % 60);
    }
    function fmtScore(score) {
      var n = Number(score);
      return isFinite(n) ? String(Math.round(n * 10) / 10) : '–';
    }

    // 录音文件夹叫「P1 - Hometown」：前缀是 Part，后面是话题
    function partLabel(folder) {
      var m = /^P([123])\b/i.exec(folder || '');
      return m ? 'Part ' + m[1] : '';
    }
    function topicName(folder) {
      return String(folder || '').replace(/^P[123]\s*[-–—:：_]\s*/i, '').trim() || String(folder || '');
    }
    // 录音文件名末尾是生成时间：xxx_20261020_100000.mp3
    function fileDate(filename) {
      var m = /(\d{4})(\d{2})(\d{2})_(\d{2})(\d{2})(\d{2})\.mp3$/.exec(filename || '');
      if (!m) return '';
      var d = new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5]);
      return monthDay(d) + ' ' + m[4] + ':' + m[5];
    }
    function enc(s) { return encodeURIComponent(s); }
    function avatarUrl(avatar) { return '/static/' + (avatar || 'avatar_admin.svg'); }

    // ==================== 状态 ====================
    var S = {
      token: null,
      me: null,              // {username, display_name, avatar}
      posts: [],
      users: {},             // username -> {display_name, avatar}
      usersList: [],
      comments: {},          // postId -> []
      ch: {},                // challengeId -> 挑战详情，或 {missing:true} / {error:true}
      chReq: {},             // challengeId -> 进行中的请求
      refs: [],              // 帖子和评论里挂的挑战：{id, att, postId, commentId, ts, author}
      openReplies: {},       // postId -> 评论编辑器
      audioData: null,
      articleData: null
    };
    function displayName(username) {
      if (S.me && username === S.me.username) return S.me.display_name || username;
      var u = S.users[username];
      return u ? u.display_name : username;
    }

    // ==================== 登录 ====================
    function checkStoredToken() {
      var tk = localStorage.getItem('authToken');
      if (!tk) return Promise.resolve(false);
      // 只有服务器明确回答"无效"才清掉凭证；断网、服务器重启时的 502 页面说明不了凭证失效，按已登录继续
      var keep = function () {
        S.token = tk;
        try { S.me = JSON.parse(localStorage.getItem('currentUser') || 'null'); } catch (e) { S.me = null; }
        return true;
      };
      return fetch('/verify_token', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: tk }) })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (d && d.valid === false) {
            localStorage.removeItem('authToken');
            localStorage.removeItem('currentUser');
            return false;
          }
          if (d && d.user && !localStorage.getItem('currentUser')) {
            try { localStorage.setItem('currentUser', JSON.stringify(d.user)); } catch (e) {}
          }
          return keep();
        })
        .catch(keep);
    }

    // ==================== 弹窗 ====================
    var dialogs = [];
    function syncScrollLock() {
      document.documentElement.style.overflow = (dialogs.length || lightbox) ? 'hidden' : '';
    }
    function openDialog(opts) {
      var back = el('div', { class: 'ui-dialog-backdrop' });
      var titleId = 'dlg' + Date.now() + Math.floor(Math.random() * 1000);
      var box = el('section', { class: 'ui-dialog mb-dlg ' + (opts.cls || ''), role: opts.role || 'dialog', 'aria-modal': 'true', 'aria-labelledby': opts.title ? titleId : null, 'aria-label': opts.title ? null : opts.label });
      var d = {
        back: back, box: box, closed: false,
        close: function () {
          if (d.closed) return;
          d.closed = true;
          back.remove();
          var i = dialogs.indexOf(d);
          if (i >= 0) dialogs.splice(i, 1);
          syncScrollLock();
          if (opts.onClose) opts.onClose();
          if (d.returnFocus && document.contains(d.returnFocus)) d.returnFocus.focus();
        },
        onEsc: opts.onEsc,
        onKey: opts.onKey
      };
      d.returnFocus = document.activeElement;
      if (opts.title) {
        box.appendChild(el('div', { class: 'ui-dialog__head' },
          el('h2', { class: 'ui-dialog__title', id: titleId, text: opts.title }),
          el('button', { class: 'ui-dialog__close', type: 'button', 'aria-label': '关闭', text: '×', onclick: function () { (d.onEsc || d.close)(); } })));
      }
      append(box, opts.content);
      back.appendChild(box);
      // 按下和松开都在遮罩上才算点空白处，免得从输入框里拖选文字拖出去就关了
      var downOnBack = false;
      back.addEventListener('mousedown', function (e) { downOnBack = e.target === back; });
      back.addEventListener('click', function (e) {
        if (e.target === back && downOnBack && opts.backdropClose !== false) (d.onEsc || d.close)();
      });
      document.body.appendChild(back);
      dialogs.push(d);
      syncScrollLock();
      // 答题框聚焦在框本身：数字键直接作答，「退出」按钮也不会一打开就带着焦点框
      if (opts.focusBox) box.setAttribute('tabindex', '-1');
      var focusTarget = opts.focusBox ? box : box.querySelector('[data-autofocus]') || box.querySelector('input, textarea, button:not(.ui-dialog__close)');
      if (focusTarget) focusTarget.focus({ preventScroll: true });
      return d;
    }
    function confirmDialog(opts) {
      return new Promise(function (resolve) {
        var done = false;
        var finish = function (value) { if (done) return; done = true; d.close(); resolve(value); };
        var d = openDialog({
          title: opts.title, cls: 'mb-dialog-small', role: 'alertdialog',
          content: [
            el('div', { class: 'ui-dialog__body' }, el('p', { class: 'mb-dialog-text', text: opts.text })),
            el('div', { class: 'ui-dialog__foot' },
              btn(opts.cancel || '取消', { size: 'md', onclick: function () { finish(false); } }),
              el('button', { class: 'ui-btn ui-btn--md ' + (opts.danger ? 'mb-btn-danger' : 'ui-btn--primary'), type: 'button', 'data-autofocus': true, text: opts.ok || '确定', onclick: function () { finish(true); } }))
          ],
          onClose: function () { if (!done) { done = true; resolve(false); } }
        });

    }

    document.addEventListener('keydown', function (e) {
      if (lightbox) {
        if (e.key === 'Escape') closeLightbox();
        else if (e.key === 'ArrowLeft') stepLightbox(-1);
        else if (e.key === 'ArrowRight') stepLightbox(1);
        return;
      }
      var top = dialogs[dialogs.length - 1];
      if (!top) return;
      if (e.key === 'Escape') { e.preventDefault(); (top.onEsc || top.close)(); return; }
      if (top.onKey) top.onKey(e);
    });

    // ==================== 看大图 ====================
    var lightbox = null;
    function openLightbox(urls, index) {
      closeLightbox();
      var img = el('img', { class: 'mb-lightbox__img', alt: '大图' });
      var count = el('div', { class: 'mb-lightbox__count ui-num' });
      var box = el('div', { class: 'mb-lightbox', role: 'dialog', 'aria-modal': 'true', 'aria-label': '看大图' }, img,
        el('button', { class: 'mb-iconbtn mb-iconbtn--round mb-lightbox__close', type: 'button', 'aria-label': '关闭', onclick: closeLightbox }, icon('x')));
      var multi = urls.length > 1;
      if (multi) {
        box.appendChild(el('button', { class: 'mb-iconbtn mb-iconbtn--round mb-lightbox__nav', style: 'left: 20px;', type: 'button', 'aria-label': '上一张', onclick: function () { stepLightbox(-1); } }, icon('left')));
        box.appendChild(el('button', { class: 'mb-iconbtn mb-iconbtn--round mb-lightbox__nav', style: 'right: 20px;', type: 'button', 'aria-label': '下一张', onclick: function () { stepLightbox(1); } }, icon('right')));
      }
      box.appendChild(count);
      box.addEventListener('click', function (e) { if (e.target === box) closeLightbox(); });
      lightbox = { box: box, img: img, count: count, urls: urls, index: index, multi: multi, returnFocus: document.activeElement };
      document.body.appendChild(box);
      showLightbox();
      syncScrollLock();
      box.querySelector('.mb-lightbox__close').focus({ preventScroll: true });
    }
    function showLightbox() {
      lightbox.img.src = lightbox.urls[lightbox.index];
      lightbox.count.textContent = lightbox.multi
        ? (lightbox.index + 1) + ' / ' + lightbox.urls.length + ' · Esc 或点空白处关闭，← → 翻页'
        : 'Esc 或点空白处关闭';
    }
    function stepLightbox(step) {
      if (!lightbox || !lightbox.multi) return;
      lightbox.index = (lightbox.index + step + lightbox.urls.length) % lightbox.urls.length;
      showLightbox();
    }
    function closeLightbox() {
      if (!lightbox) return;
      var back = lightbox.returnFocus;
      lightbox.box.remove();
      lightbox = null;
      syncScrollLock();
      if (back && document.contains(back)) back.focus({ preventScroll: true });
    }

    // ==================== 帖子里直接播放录音 ====================
    var player = { audio: null, att: null };
    function stopPlayer() {
      if (player.audio) { player.audio.pause(); player.audio.removeAttribute('src'); player.audio.load(); }
      if (player.att) resetPlayerUi(player.att);
      player.att = null;
    }
    function resetPlayerUi(att) {
      var b = att.querySelector('.mb-play');
      if (b) { fill(b, icon('play')); b.setAttribute('aria-label', b.dataset.label); }
      var row = att.querySelector('.mb-player');
      if (row) row.remove();
    }
    function togglePlay(att, src) {
      if (!player.audio) {
        player.audio = new Audio();
        player.audio.preload = 'auto';
        player.audio.addEventListener('timeupdate', updatePlayerUi);
        player.audio.addEventListener('loadedmetadata', updatePlayerUi);
        player.audio.addEventListener('ended', function () { stopPlayer(); });
        player.audio.addEventListener('error', function () {
          if (player.att && player.audio.getAttribute('src')) { toast('这条录音放不出来，可能已经删掉了', 'err'); stopPlayer(); }
        });
      }
      var a = player.audio;
      var b = att.querySelector('.mb-play');
      if (player.att === att) {
        if (a.paused) { a.play().catch(function () {}); fill(b, icon('pause')); b.setAttribute('aria-label', '暂停'); }
        else { a.pause(); fill(b, icon('play')); b.setAttribute('aria-label', '继续播放'); }
        return;
      }
      stopPlayer();
      player.att = att;
      a.src = src;
      a.play().catch(function () {});
      fill(b, icon('pause'));
      b.setAttribute('aria-label', '暂停');
      var bar = el('div', { class: 'ui-progress__bar', title: '点一下跳到这里' }, el('i', { style: 'width: 0%;' }));
      bar.addEventListener('click', function (e) {
        if (!a.duration) return;
        var r = bar.getBoundingClientRect();
        a.currentTime = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * a.duration;
      });
      att.querySelector('.mb-att__body').appendChild(el('div', { class: 'mb-player' },
        el('div', { class: 'ui-progress' }, bar, el('span', { class: 'ui-progress__num', text: '0:00' }))));
    }
    function updatePlayerUi() {
      if (!player.att) return;
      var a = player.audio;
      var row = player.att.querySelector('.mb-player');
      if (!row) return;
      var pct = a.duration ? (a.currentTime / a.duration) * 100 : 0;
      row.querySelector('.ui-progress__bar > i').style.width = pct + '%';
      row.querySelector('.ui-progress__num').textContent = clock(a.currentTime) + (a.duration && isFinite(a.duration) ? ' / ' + clock(a.duration) : '');
    }

    // ==================== 附件块 ====================
    function audioView(a) {
      var single = a.type === 'single';
      var part = partLabel(a.folder);
      var kind = [single ? '口语录音' : '口语合集'];
      if (part) kind.push(part);
      if (single) { var d = fileDate(a.filename); if (d) kind.push(d); }
      else if (a.file_count) kind.push(a.file_count + ' 条录音');
      // Part 2 的单条录音存的「问题」其实是答案第一行，不当题目显示
      var desc = a.question && !(single && /^P2/i.test(a.folder || '')) ? a.question : '';
      return {
        ico: single ? 'mic' : 'layers', kind: kind.join(' · '), title: topicName(a.folder), desc: desc,
        href: single ? '/speaking#folder=' + enc(a.folder) + '&file=' + enc(a.filename) : '/combined#folder=' + enc(a.folder),
        hrefLabel: single ? '在口语库打开' : '打开合集',
        src: single ? '/audio/' + enc(a.folder) + '/' + enc(a.filename) : '/combined_audio/' + enc(a.folder),
        playLabel: single ? '播放' : '播放合集',
        removeLabel: single ? '移除这条录音' : '移除这个合集'
      };
    }
    function articleView(a) {
      var kind = ['精读文章'];
      if (a.category) kind.push(a.category);
      if (a.highlight_count !== undefined && a.highlight_count !== null) kind.push(a.highlight_count + ' 个生词');
      return {
        ico: 'book', kind: kind.join(' · '), title: a.title || '未命名文章',
        href: '/intensive#article-' + enc(a.id || a.article_id || ''), hrefLabel: '去精读',
        removeLabel: '移除这篇文章'
      };
    }
    // opts: compact / onRemove（编辑器里）
    function attBlock(v, opts) {
      opts = opts || {};
      var att = el('div', { class: 'mb-att' + (opts.compact ? ' mb-att--compact' : '') + (opts.onRemove ? ' has-remove' : '') },
        el('span', { class: 'mb-att__ico' }, icon(v.ico, opts.compact ? 14 : 16)),
        el('div', { class: 'mb-att__body' },
          el('div', { class: 'mb-att__kind', text: v.kind }),
          el('div', { class: 'mb-att__title', text: v.title }),

      if (opts.onRemove) {

        return att;
      }
      var actions = el('div', { class: 'mb-att__actions' });

        var play = el('button', { class: 'mb-play', type: 'button', 'aria-label': v.playLabel, 'data-label': v.playLabel }, icon('play'));
        play.addEventListener('click', function () { togglePlay(att, v.src); });

      actions.appendChild(el('a', { class: 'ui-btn ui-btn--sm', href: v.href, target: '_blank', rel: 'noopener' }, v.hrefLabel, v.ico === 'book' ? icon('right', 14) : null));

    }
    function imagesBlock(images, small) {
      var urls = images.map(function (img) { return '/message_images/' + img.filename; });
      var cls = 'mb-images' + (urls.length === 1 && !small ? ' mb-images--one' : '') + (small ? ' mb-images--small' : '');
      return el('div', { class: cls }, urls.map(function (url, i) {
        return el('button', { class: 'mb-images__btn', type: 'button', 'aria-label': '看大图' + (urls.length > 1 ? ' ' + (i + 1) : ''), onclick: function () { openLightbox(urls, i); } },
          el('img', { class: 'mb-images__img', src: url, alt: urls.length > 1 ? '图片 ' + (i + 1) : '图片', loading: 'lazy' }));

    // ==================== 挑战块 ====================
    function chArticles(ch) {
      var titles = [];
      (ch.vocabulary || []).forEach(function (v) {
        if (v.article_title && titles.indexOf(v.article_title) < 0) titles.push(v.article_title);
      });
      if (!titles.length) return '';
      return '出自 ' + (titles.length > 2 ? titles.slice(0, 2).join('、') + ' 等 ' + titles.length + ' 篇' : titles.join('、'));
    }
    function expectedPeople(ch) {
      var list = [];
      if (ch.creator) list.push(ch.creator);
      (ch.mentioned_users || []).forEach(function (u) { if (list.indexOf(u) < 0) list.push(u); });
      return list;
    }
    function rankedParticipants(ch) {
      var parts = ch.participants || {};
      return Object.keys(parts).map(function (u) { return Object.assign({ username: u }, parts[u]); })
        .sort(function (a, b) { return (b.score || 0) - (a.score || 0); });
    }
    function challengeBlock(ref) {
      var box = el('div', { class: 'mb-ch' + (ref.compact ? ' mb-ch--compact' : ''), 'data-ch-id': ref.id });
      box._ref = ref;
      fillChallenge(box);
      return box;
    }
    function fillChallenge(box) {
      var ref = box._ref;
      var att = ref.att || {};
      var ch = S.ch[ref.id];
      var me = S.me.username;
      fill(box);
      box.classList.toggle('is-gone', !!(ch && ch.missing));
      if (ch && ch.missing) {
        append(box,
          el('div', { class: 'mb-ch__top' }, el('span', { class: 'ui-tag', text: '单词挑战' })),
          el('div', { class: 'mb-ch__title', text: att.title || '单词挑战' }),
          el('div', { class: 'mb-ch__foot' }, el('span', { class: 'mb-meta', text: '这个挑战的题目已经不在了，不能再作答。' })));
        return;
      }
      var info = ch && !ch.error ? ch : null;
      var count = info ? (info.vocabulary || []).length : att.vocabulary_count;
      var topMeta = [];
      if (count) topMeta.push(count + ' 个单词');
      if (info && !ref.compact) { var from = chArticles(info); if (from) topMeta.push(from); }
      append(box, el('div', { class: 'mb-ch__top' },
        el('span', { class: 'ui-tag ui-tag--accent', text: '单词挑战' }),
        topMeta.length ? el('span', { class: 'mb-meta ui-num', text: topMeta.join(' · ') }) : null));
      append(box, el('div', { class: 'mb-ch__title', text: (info && info.title) || att.title || '单词挑战' }));
      var desc = info ? info.description : att.description;
      if (desc) append(box, el('div', { class: 'mb-ch__desc', text: desc }));

      var mentioned = (info ? info.mentioned_users : att.mentioned_users) || [];
      var parts = (info && info.participants) || {};
      if (mentioned.length) {
        append(box, el('div', { class: 'mb-ch__people' },
          el('span', { class: 'mb-meta', text: '邀请：' }),
          mentioned.map(function (u) {
            var done = !!parts[u];
            var name = displayName(u) + (u === me ? '（你）' : '');
            if (!info) return el('span', { class: 'ui-tag', text: name });
            return el('span', { class: 'ui-tag ' + (done ? 'ui-tag--ok' : 'ui-tag--warn'), text: name + ' · ' + (done ? '已完成' : '未完成') });
          })));
      }

      var foot = el('div', { class: 'mb-ch__foot' });
      append(box, foot);
      if (!info) {
        append(foot, el('span', { class: 'mb-meta', text: ch && ch.error ? '挑战状态没读出来' : '正在读取挑战…' }),
          ch && ch.error ? btn('重试', { onclick: function () { loadChallenge(ref.id, true); } }) : null);
        return;
      }
      var rankBtn = btn('看排名', { onclick: function () { showRanking(ref.id); } });
      var mine = parts[me];
      if (mine) {
        var ranked = rankedParticipants(info);
        var place = 0;
        ranked.forEach(function (p, i) { if (p.username === me) place = i + 1; });
        append(foot, el('span', { class: 'mb-ch__mine' }, '你的成绩 ', el('b', { class: 'ui-num', text: fmtScore(mine.score) + ' 分' }),
          ' · 答对 ', el('span', { class: 'ui-num', text: mine.correct_count + ' / ' + mine.total_questions }),
          ranked.length > 1 ? ' · 第 ' + place + ' 名' : ''), rankBtn);
        return;
      }
      var invited = info.creator === me || mentioned.indexOf(me) >= 0;
      var doneCount = Object.keys(parts).length;
      if (invited) {
        append(foot, el('span', { class: 'mb-meta', text: '每题 10 秒，可以中途退出' }),
          el('div', { class: 'mb-btns' }, rankBtn, btn('开始挑战', { kind: 'ui-btn--soft', onclick: function () { startQuiz(ref.id); } })));
      } else {
        append(foot, el('span', { class: 'mb-meta', text: doneCount ? doneCount + ' 人完成' : '还没有人完成' }),
          el('div', { class: 'mb-btns' }, rankBtn, btn('我也做一次', { onclick: function () { startQuiz(ref.id); } })));
      }
    }
    function refreshChallenge(id) {
      document.querySelectorAll('.mb-ch[data-ch-id]').forEach(function (box) {
        if (box.getAttribute('data-ch-id') === id && box._ref) fillChallenge(box);
      });
      renderSidebar();
    }
    function loadChallenge(id, fresh) {
      if (!fresh && S.chReq[id]) return S.chReq[id];
      var req = api('/api/get_challenge/' + enc(id)).then(function (d) {
        S.ch[id] = d.challenge;
      }, function (err) {
        S.ch[id] = (err.status === 404 || err.status === 400) ? { missing: true } : (S.ch[id] && !S.ch[id].error ? S.ch[id] : { error: true });
      }).then(function () {
        refreshChallenge(id);
        return S.ch[id];
      });
      S.chReq[id] = req;
      return req;
    }

    // 帖子和评论里挂的挑战，侧栏「等你完成」「最近的挑战」都从这里算
    function setRefs(postId, commentLevel, refs) {
      S.refs = S.refs.filter(function (r) { return !(r.postId === postId && !!r.commentId === commentLevel); }).concat(refs);
      refs.forEach(function (r) { loadChallenge(r.id); });
    }

    // ==================== 帖子 ====================
    function postParts(post) {
      // 统一成 {text, audios, articles, images, challenge}，兼容几种旧帖子格式
      var c = post.content || {};
      if (post.type === 'mixed_content') {
        return { text: c.text || '', audios: c.audios || [], articles: c.articles || [], images: c.images || [], challenge: c.challenge || null };
      }
      if (post.type === 'image') {
        return { text: c.caption || '', audios: [], articles: [], images: c.filename ? [{ filename: c.filename }] : [], challenge: null };
      }
      if (post.type === 'audio_share') return { text: c.text || '', audios: [c], articles: [], images: [], challenge: null };
      if (post.type === 'article_share') return { text: c.text || '', audios: [], articles: [c], images: [], challenge: null };
      return { text: c.text || '', audios: [], articles: [], images: [], challenge: null };
    }

    function renderPosts() {
      var list = document.getElementById('postsList');
      fill(list);
      updateCount();
      if (!S.posts.length) { list.appendChild(emptyState()); return; }
      S.posts.forEach(function (post) { list.appendChild(postElement(post)); });
    }
    function emptyState() {
      return el('div', { class: 'ui-card ui-empty', id: 'emptyState' },
        el('p', { class: 'ui-empty__title', text: '还没有帖子' }),
        el('p', { class: 'ui-empty__text', text: '分享一条录音、一篇精读文章或一张笔记，大家会在这里看到。' }),
        btn('写第一篇', { size: 'md', kind: 'ui-btn--soft', onclick: function () { composer.expand(); } }));
    }
    function updateCount() {
      document.getElementById('postCount').textContent = S.posts.length ? '共 ' + S.posts.length + ' 篇帖子' : '';
    }

    function postElement(post) {
      var parts = postParts(post);
      var user = post.user || {};
      var mine = S.me && user.username === S.me.username;
      var card = el('article', { class: 'ui-card mb-post', 'data-post-id': post.id });
      card.appendChild(el('div', { class: 'mb-post__head' },
        el('img', { class: 'mb-avatar', src: avatarUrl(user.avatar), alt: '' }),
        el('div', { class: 'mb-post__who' },
          el('span', { class: 'mb-post__name', text: user.display_name || user.username || '同学' }),
          el('span', { class: 'mb-meta', text: relTime(post.timestamp), title: new Date(post.timestamp).toLocaleString() })),
        mine ? el('button', { class: 'mb-iconbtn mb-iconbtn--danger', type: 'button', 'aria-label': '删除帖子', title: '删除帖子', onclick: function () { deletePost(post, parts); } }, icon('trash')) : null));
      if (parts.text) card.appendChild(el('p', { class: 'mb-post__text', text: parts.text }));
      var atts = attachmentList(parts, { postId: post.id, ts: post.timestamp, author: user.username });
      if (atts.length) card.appendChild(el('div', { class: 'mb-post__atts' }, atts));

      var countText = el('span', { class: 'mb-meta', text: '' });
      var replyBtn = el('button', { class: 'ui-btn ui-btn--sm', type: 'button', onclick: function () { toggleReply(post.id); } });
      card.appendChild(el('div', { class: 'mb-post__foot' }, countText, replyBtn));
      card.appendChild(el('div', { class: 'mb-comments', hidden: true }));
      card._parts = { count: countText, reply: replyBtn };
      setReplyButton(card, false);
      updateCommentCount(post.id);
      if (parts.challenge && parts.challenge.id) {
        setRefs(post.id, false, [{ id: parts.challenge.id, att: parts.challenge, postId: post.id, ts: post.timestamp, author: user.username }]);
      }
      return card;
    }
    // 帖子和评论的附件区：录音、文章、图片、挑战
    function attachmentList(parts, ctx) {
      var out = [];
      var compact = !!ctx.commentId;
      parts.audios.forEach(function (a) { if (a && a.folder) out.push(attBlock(audioView(a), { compact: compact })); });
      parts.articles.forEach(function (a) { if (a) out.push(attBlock(articleView(a), { compact: compact })); });
      var imgs = parts.images.filter(function (img) { return img && img.filename; });
      if (imgs.length) out.push(imagesBlock(imgs, compact));
      if (parts.challenge && parts.challenge.id) {
        out.push(challengeBlock({ id: parts.challenge.id, att: parts.challenge, postId: ctx.postId, commentId: ctx.commentId, ts: ctx.ts, author: ctx.author, compact: compact }));
      }
      return out;
    }
    function findPost(postId) {
      var found = null;
      document.querySelectorAll('.mb-post[data-post-id]').forEach(function (n) { if (n.getAttribute('data-post-id') === postId) found = n; });
      return found;
    }

    function deletePost(post, parts) {
      // 后端删帖时会连同下面所有评论、以及帖子和评论里的挑战一起删
      var comments = S.comments[post.id] || [];
      var hasChallenge = !!parts.challenge || comments.some(function (c) { return !!postParts(c).challenge; });
      var text = (comments.length ? '下面的 ' + comments.length + ' 条评论会一起删除。' : '') +
        (hasChallenge ? '其中的单词挑战和大家的成绩也会删除。' : '') + '删除后不能恢复。';
      confirmDialog({
        title: '删除这篇帖子？',
        text: text,
        ok: '删除', danger: true
      }).then(function (ok) {
        if (!ok) return;
        api('/api/messages/' + enc(post.id), { method: 'DELETE' }).then(function () {
          S.posts = S.posts.filter(function (p) { return p.id !== post.id; });
          S.refs = S.refs.filter(function (r) { return r.postId !== post.id; });
          delete S.comments[post.id];
          delete S.openReplies[post.id];
          var card = findPost(post.id);
          if (card) {
            if (player.att && card.contains(player.att)) stopPlayer();
            card.remove();
          }
          if (!S.posts.length) document.getElementById('postsList').appendChild(emptyState());
          updateCount();
          renderSidebar();
          toast('已删除', 'ok');
        }).catch(function (e) { toast('删除失败：' + e.message, 'err'); });
      });
    }

    // ==================== 评论 ====================
    function loadComments(postId) {
      return api('/api/comments/' + enc(postId)).then(function (d) {
        S.comments[postId] = d.comments || [];
        renderComments(postId);
      }).catch(function () { /* 评论没读出来时就不显示，帖子本身照常 */ });
    }
    function renderComments(postId) {
      var card = findPost(postId);
      var comments = S.comments[postId] || [];
      var refs = [];
      if (card) {
        var box = card.querySelector('.mb-comments');
        if (player.att && box.contains(player.att)) stopPlayer();
        fill(box);
        comments.forEach(function (c) {
          box.appendChild(commentElement(c, postId));
          var ch = c.content && c.content.challenge;
          if (ch && ch.id) refs.push({ id: ch.id, att: ch, postId: postId, commentId: c.id, ts: c.timestamp, author: c.user && c.user.username });
        });
        box.hidden = !comments.length;
      }
      updateCommentCount(postId);
      setRefs(postId, true, refs);
      renderSidebar();
    }
    function updateCommentCount(postId) {
      var card = findPost(postId);
      if (!card || !card._parts) return;
      var list = S.comments[postId];
      card._parts.count.textContent = !list ? '' : list.length ? list.length + ' 条评论' : '还没有评论';
    }
    function commentElement(c, postId) {

    // ==================== 编辑器（发帖框和写评论共用） ====================

    function createEditor(opts) {
      var isPost = opts.kind === 'post';

      var send = el('div', { class: 'mb-composer__send' },
        el('button', { class: 'ui-btn ' + (isPost ? 'ui-btn--md' : 'ui-btn--sm'), type: 'button', text: '取消', onclick: function () { opts.onCancel ? opts.onCancel() : closeReply(ed.postId, true); } }),
        ed.sendBtn);
      var label = el('label', null, el('span', { class: 'mb-sr', text: isPost ? '帖子内容' : '评论内容' }), ed.textarea);

      };
      ed.uploading = function () { return ed.images.some(function (img) { return img.status === 'uploading'; }); };
      ed.reset = function () {
        ed.textarea.value = '';
        ed.audios = []; ed.articles = []; ed.challenge = null;
        ed.images.forEach(function (img) { if (img.preview) URL.revokeObjectURL(img.preview); });
        ed.images = [];
        ed.refresh();

      ed.refresh = function () { renderEditor(ed); };

    }
    function renderEditor(ed) {
      var box = ed.attsEl;
      var compact = true;
      fill(box);
      ed.audios.forEach(function (a, i) {

      });
      ed.articles.forEach(function (a, i) {

        box.appendChild(el('div', { class: 'mb-thumbs' }, ed.images.map(function (img) {
          var src = img.status === 'done' ? '/message_images/' + img.filename : img.preview;

          if (src && img.status !== 'done') pic.addEventListener('error', function () { pic.replaceWith(el('div', { class: 'mb-thumb__blank' })); });
          return el('div', { class: 'mb-thumb' }, pic,
            img.status === 'uploading' ? el('div', { class: 'mb-thumb__mask', text: '上传中…' }) : null,
            el('button', { class: 'mb-thumb__x', type: 'button', 'aria-label': '移除这张图片', title: '移除', onclick: function () {
              ed.images.splice(ed.images.indexOf(img), 1);

              ed.refresh();
            } }, icon('x', 12, 1.8)));
        })));
      }
      if (ed.challenge) {
        var c = ed.challenge;
        var meta = [c.vocabulary_count + ' 个单词'];
        if (c.mentioned_users && c.mentioned_users.length) meta.push('邀请 ' + c.mentioned_users.map(displayName).join('、'));
        box.appendChild(el('div', { class: 'mb-ch mb-ch--compact' },
          el('div', { class: 'mb-ch__row' },
            el('div', null,
              el('div', { class: 'mb-ch__top' }, el('span', { class: 'ui-tag ui-tag--accent', text: '单词挑战' }), el('span', { class: 'mb-meta', text: meta.join(' · ') })),
              el('div', { class: 'mb-ch__title', text: c.title })),
            el('button', { class: 'mb-iconbtn mb-att__remove', type: 'button', 'aria-label': '移除这个挑战', title: '移除', onclick: function () {

                .then(function (ok) { if (ok) { ed.challenge = null; ed.refresh(); } });

    }
    function editorContent(ed) {
      return {
        text: ed.textarea.value.trim(),

    function submitEditor(ed) {

      } else {
        var postId = ed.postId;

          done();
          closeReply(postId, false);
          loadComments(postId);

    function addPostToTop(post) {

    // ==================== 发帖框 ====================
    var composer = (function () {
      var box = document.getElementById('composer');

    // ==================== 图片上传 ====================
    var IMAGE_TYPES = ['image/jpeg', 'image/jpg', 'image/png', 'image/gif', 'image/webp', 'image/heic', 'image/heif', 'image/avif'];
    var IMAGE_EXTS = ['jpg', 'jpeg', 'png', 'gif', 'webp', 'heic', 'heif', 'avif'];
    function pickImages(ed) {
      // 上次点开又取消的选择框不会触发 change，留在页面里，这里顺手清掉
      document.querySelectorAll('.mb-file-input').forEach(function (n) { n.remove(); });
      var input = el('input', { class: 'mb-file-input', type: 'file', accept: 'image/*,.heic,.heif', multiple: true, hidden: true });
      input.addEventListener('change', function () {
        var files = Array.prototype.slice.call(input.files || []);
        input.remove();
        var queue = [];
        files.forEach(function (file) {
          var ext = (file.name.split('.').pop() || '').toLowerCase();
          if (IMAGE_TYPES.indexOf(file.type) < 0 && IMAGE_EXTS.indexOf(ext) < 0) {
            toast('「' + file.name + '」不是图片，支持 JPG、PNG、GIF、WebP、HEIC', 'err');
            return;
          }
          if (file.size > 10 * 1024 * 1024) {
            toast('「' + file.name + '」有 ' + (file.size / 1024 / 1024).toFixed(1) + ' MB，单张不能超过 10 MB', 'err');
            return;
          }
          var item = { status: 'uploading', file: file, preview: URL.createObjectURL(file) };
          ed.images.push(item);
          queue.push(item);
        });
        ed.refresh();
        // 一张一张传，服务器要转码压缩，同时传太多容易超时
        queue.reduce(function (chain, item) {
          return chain.then(function () { return uploadImage(ed, item); });
        }, Promise.resolve());
      });
      document.body.appendChild(input);
      input.click();

    function uploadImage(ed, item) {
      if (ed.images.indexOf(item) < 0) return Promise.resolve(); // 传之前就移除了
      var form = new FormData();
      form.append('image', item.file);
      form.append('user_id', S.me.username);
      return api('/api/upload_message_image', { method: 'POST', form: form }).then(function (d) {
        item.status = 'done';
        item.filename = d.filename;
      }).catch(function (e) {
        var i = ed.images.indexOf(item);

    // ==================== 选录音 ====================
    var AUDIO_CATS = [['Part1', 'Part 1'], ['Part2', 'Part 2'], ['Part3', 'Part 3'], ['其他', '其他']];
    function loadAudioData() {
      if (S.audioData) return Promise.resolve(S.audioData);

        fetch('/list_audio').then(function (r) { return r.json(); }).catch(function () { return {}; })

          (res[1][cat] || []).forEach(function (f) { files[f.folder] = f.files || []; });
        });
        S.audioData = { cats: res[0].categories || {}, files: files };
        return S.audioData;
      });
    }
    function sameAudio(a, b) {
      return a.type === b.type && a.folder === b.folder && (a.type === 'combined' || a.filename === b.filename);
    }

      var state = { cat: 'Part1', q: '', open: {}, added: 0 };

      var footNote = el('span', { class: 'mb-meta' });
      var dlg = openDialog({
        title: '选口语录音', cls: 'mb-dialog-wide',
        content: [
          el('div', { class: 'ui-dialog__body' }, search, el('div', { class: 'mb-picker' }, rail, list)),
          el('div', { class: 'ui-dialog__foot mb-dialog-foot-split' }, footNote, btn('完成', { size: 'md', kind: 'ui-btn--primary', onclick: function () { dlg.close(); } }))
        ]
      });
      function matches(topic, q) {
        if (!q) return { topic: true, files: null };
        if (topic.folder.toLowerCase().indexOf(q) >= 0) return { topic: true, files: null };
        var files = (S.audioData.files[topic.folder] || []).filter(function (f) {
          return ((f.question || '') + ' ' + (f.preview || '')).toLowerCase().indexOf(q) >= 0;
        });
        return { topic: files.length > 0, files: files };
      }
      function render() {
        var data = S.audioData;

          var n = (data.cats[c[0]] || []).filter(function (t) { return matches(t, q).topic; }).length;
          rail.appendChild(el('button', { class: 'ui-rail__item' + (state.cat === c[0] ? ' is-active' : ''), type: 'button', onclick: function () { state.cat = c[0]; render(); } },
            el('span', { class: 'ui-rail__name', text: c[1] }), el('span', { class: 'ui-rail__count', text: n })));
        });

        }
        topics.forEach(function (t, idx) {
          var m = matches(t, q);
          var isOpen = state.open[t.folder] !== undefined ? state.open[t.folder] : (!!q || idx === 0);
          var meta = [t.file_count + ' 条录音'];
          if (t.has_combined) meta.push('有合集');
          var topic = el('div', { class: 'mb-topic' + (isOpen ? ' is-open' : '') },
            el('button', { class: 'mb-topic__head', type: 'button', 'aria-expanded': isOpen ? 'true' : 'false', onclick: function () { state.open[t.folder] = !isOpen; render(); } },
              el('span', { class: 'mb-topic__name', text: topicName(t.folder) }),

                [el('div', { class: 'mb-pick__q mb-pick__q--cn', text: '整套合集' }), el('div', { class: 'mb-meta', text: t.file_count + ' 条录音连在一起播放' })],
                { folder: t.folder, file_count: t.file_count, has_combined: t.has_combined, question: t.question || '', type: 'combined' }));
            }
            var files = m.files || data.files[t.folder] || [];
            if (!files.length && !t.has_combined) rows.appendChild(el('div', { class: 'mb-picker__empty', text: '录音列表没读出来' }));
            files.forEach(function (f) {
              var p2 = /^P2/i.test(t.folder);

              var fm = [fileDate(f.name), f.duration ? clock(f.duration) : ''].filter(Boolean).join(' · ');
              rows.appendChild(pickRow(
                [el('div', { class: 'mb-pick__q', text: text }), fm ? el('div', { class: 'mb-meta', text: fm }) : null],
                { folder: t.folder, filename: f.name, question: f.question || '', type: 'single' }));
            });
            topic.appendChild(rows);
          }
          list.appendChild(topic);
        });
        footNote.textContent = state.added ? '已加入 ' + state.added + ' 条 · 可以接着选' : '点「加入」把录音挂到' + (ed.kind === 'post' ? '帖子' : '评论') + '里，可以选多条';
      }

        return el('div', { class: 'mb-pick' }, el('div', { class: 'mb-pick__main' }, mainKids),
          added ? el('span', { class: 'ui-tag ui-tag--ok' }, icon('check', 12, 2), '已加入')
            : btn('加入', { onclick: function () { ed.audios.push(item); state.added++; ed.refresh(); render(); } }));
      }
      search.addEventListener('input', function () { state.q = search.value; state.open = {}; if (S.audioData) render(); });
      loadAudioData().then(function () {
        if (dlg.closed) return;
        // 第一个有内容的分类打开
        var first = AUDIO_CATS.filter(function (c) { return (S.audioData.cats[c[0]] || []).length; })[0];

    // ==================== 选文章 ====================
    var ARTICLE_CATS = ['Reading', 'Listening', 'Writing'];
    function loadArticleData() {
      if (S.articleData) return Promise.resolve(S.articleData);

    }

    // ==================== 答题 ====================
    var Q = null;
    function playWord(word, challengeId) {
      if (!word || !challengeId) return;
      try {
        var a = new Audio('/vocab_audio/challenge_' + enc(challengeId) + '/' + enc(word.trim().toLowerCase()));
        a.play().catch(function () {}); // 发音没生成好就不出声，不打断答题
      } catch (e) {}

    function shuffle(arr) {

      return arr;
    }
    function startQuiz(id) {
      api('/api/get_challenge/' + enc(id)).then(function (d) {
        var ch = d.challenge;

        refreshChallenge(id);
        if (ch.participants && ch.participants[S.me.username]) { showRanking(id); return; }
        if (!ch.vocabulary || !ch.vocabulary.length) { toast('这个挑战没有题目', 'err'); return; }
        stopPlayer();
        buildQuiz(ch);
      }).catch(function (e) {
        if (e.status === 404 || e.status === 400) { S.ch[id] = { missing: true }; refreshChallenge(id); toast('这个挑战的题目已经不在了', 'err'); }
        else toast('打开挑战失败：' + e.message, 'err');

    function buildQuiz(ch) {

      Q.progressBar = el('i', { style: 'width: 0%;' });
      Q.progressNum = el('span', { class: 'ui-progress__num' });
      Q.body = el('div', { class: 'mb-quiz__body' });
      Q.dlg = openDialog({
        label: '单词挑战：' + ch.title, cls: 'mb-quiz', backdropClose: false, focusBox: true,
        content: [
          el('div', { class: 'mb-quiz__head' }, el('h2', { class: 'ui-dialog__title', text: ch.title }), btn('退出', { onclick: askQuit })),
          el('div', { class: 'mb-quiz__progress' }, el('div', { class: 'ui-progress' }, el('div', { class: 'ui-progress__bar' }, Q.progressBar), Q.progressNum)),
          Q.body

        onEsc: askQuit,
        onKey: function (e) {
          if (!Q || Q.answered || e.metaKey || e.ctrlKey || e.altKey) return;
          var n = parseInt(e.key, 10);
          if (n >= 1 && n <= Q.options.length) { e.preventDefault(); choose(n - 1); }

      });
      showQuestion();

    function showQuestion() {
      var ch = Q.ch;

      if (Q.index >= total) { finishQuiz(); return; }
      var vocab = ch.vocabulary[Q.index];
      Q.progressBar.style.width = (Q.index / total * 100) + '%';
      Q.progressNum.textContent = (Q.index + 1) + ' / ' + total;
      // 每题随机：看英文选中文，或看中文选英文；4 个选项（正确 + 3 个干扰）
      var showWord = Math.random() > 0.5;
      var correct = showWord ? vocab.meaning : vocab.word;
      var options = [correct];
      var others = ch.vocabulary.filter(function (v) { return showWord ? v.word !== vocab.word : v.meaning !== vocab.meaning; });
      while (options.length < 4 && others.length > 0) {
        var pick = others[Math.floor(Math.random() * others.length)];
        var val = showWord ? pick.meaning : pick.word;
        if (options.indexOf(val) < 0) options.push(val);
        others.splice(others.indexOf(pick), 1);
      }
      Q.type = showWord ? 'word_to_meaning' : 'meaning_to_word';
      Q.options = shuffle(options);
      Q.correct = correct;
      Q.vocab = vocab;
      Q.answered = false;
      Q.remaining = 10000;

      Q.timerNum = el('span', { class: 'mb-timer__num', text: '10' });
      Q.timerBar = el('i', { style: 'width: 100%;' });
      Q.timerBox = el('div', { class: 'mb-timer' }, Q.timerNum, el('span', { class: 'mb-meta', text: '秒' }), el('div', { class: 'mb-timer__bar' }, Q.timerBar));

        ? el('div', { class: 'mb-question' }, el('div', { class: 'mb-question__ask', text: '选出正确的中文意思' }),
            el('div', { class: 'mb-question__word' }, vocab.word,
              el('button', { class: 'mb-iconbtn mb-iconbtn--round', type: 'button', 'aria-label': '再听一遍', title: '再听一遍', onclick: function () { playWord(vocab.word, ch.id); } }, icon('speaker'))))

      Q.optEls = Q.options.map(function (opt, i) {

          el('span', { class: 'mb-opt__key', text: i + 1 }),

      });
      Q.notice = el('div', { class: 'mb-notice', hidden: true, text: '时间到，这题算答错。' });
      Q.note = el('div', { class: 'mb-quiz__note', text: '点选项或按数字键 1–' + Q.options.length });
      fill(Q.body, Q.timerBox, question, Q.notice, el('div', { class: 'mb-opts' }, Q.optEls), Q.note);

    function runTimer() {

      Q.answers.push({ question_index: Q.index, selected_option: selected, correct_answer: Q.correct, time_taken: timeTaken, is_correct: isCorrect });
      Q.log.push({ word: Q.vocab.word, meaning: Q.vocab.meaning, selected: selected, ok: isCorrect, timeout: false, time: timeTaken });
