          el('div', { class: 'ui-dialog__foot' },
            btn('关闭', { size: 'md', onclick: function () { dlg.close(); } }),
            btn('看排名', { size: 'md', kind: 'ui-btn--primary', autofocus: true, onclick: function () { dlg.close(); showRanking(ch.id); } }))
        ]
      });
    }
    function stat(num, unit, label) {
      return el('div', { class: 'ui-stat' }, el('div', { class: 'ui-stat__num' }, String(num), el('span', { class: 'ui-stat__unit', text: unit })), el('div', { class: 'ui-stat__label', text: label }));
    }

    // ==================== 排名 ====================
    function rankRows(ch, opts) {
      opts = opts || {};
      var me = S.me.username;
      var ranked = rankedParticipants(ch);
      var rows = ranked.map(function (p, i) {
        var isMe = p.username === me;
        var name = el('span', { class: 'mb-rank__name' }, displayName(p.username), isMe ? (opts.small ? '（你）' : el('span', { class: 'ui-tag ui-tag--accent', style: 'margin-left: 6px;', text: '你' })) : null);
        return el('div', { class: 'mb-rank' + (isMe ? ' is-me' : '') },
          el('span', { class: 'mb-rank__no' + (i === 0 ? ' is-top' : ''), text: i + 1 }),
          el('img', { class: 'mb-avatar ' + (opts.small ? 'mb-avatar--xs' : 'mb-avatar--sm'), src: avatarUrl((S.users[p.username] || {}).avatar), alt: '' }),
          name,
          el('span', { class: 'mb-rank__sub ui-num', text: p.correct_count + '/' + p.total_questions + (opts.small ? '' : ' · ' + stampTime(p.completed_at)) }),
          el('span', { class: 'mb-rank__score' }, fmtScore(p.score), opts.small ? null : el('span', { class: 'mb-meta', text: ' 分' })));
      });
      expectedPeople(ch).forEach(function (u) {
        if ((ch.participants || {})[u]) return;
        rows.push(el('div', { class: 'mb-rank is-waiting' },
          el('span', { class: 'mb-rank__no', text: '–' }),
          el('img', { class: 'mb-avatar ' + (opts.small ? 'mb-avatar--xs' : 'mb-avatar--sm'), src: avatarUrl((S.users[u] || {}).avatar), alt: '' }),
          el('span', { class: 'mb-rank__name', text: displayName(u) + (u === me && opts.small ? '（你）' : '') }),
          el('span', { class: 'ui-tag ui-tag--warn', text: opts.small ? '未完成' : '还没做' })));
      });
      return rows;
    }
    function doneSummary(ch) {
      var everyone = expectedPeople(ch);
      Object.keys(ch.participants || {}).forEach(function (u) { if (everyone.indexOf(u) < 0) everyone.push(u); });
      var done = Object.keys(ch.participants || {}).length;
      return everyone.length + ' 人里 ' + done + ' 人完成';
    }
    function showRanking(id) {
      Promise.all([api('/api/get_challenge_ranking/' + enc(id)), loadChallenge(id, true)]).then(function (res) {
        var ch = S.ch[id];
        if (!ch || ch.missing || ch.error) ch = null;
        var info = res[0].challenge || {};
        var count = ch ? (ch.vocabulary || []).length : info.vocabulary_count;
        var meta = [count + ' 个单词'];
        if (ch && ch.creator) meta.push(displayName(ch.creator) + '发起');
        if (ch) meta.push(doneSummary(ch));
        var body = el('div', { class: 'ui-dialog__body', style: 'gap: 12px;' },
          el('div', null,
            el('div', { class: 'mb-rank-info__title', text: info.title || (ch && ch.title) || '单词挑战' }),
            info.description ? el('div', { class: 'mb-rank-info__desc', text: info.description }) : null,
            el('div', { class: 'mb-meta', style: 'margin-top: 2px;', text: meta.join(' · ') })),
          el('div', { class: 'mb-ranklist mb-rank-body' },
            ch ? rankRows(ch) : res[0].ranking.length ? null : el('p', { class: 'mb-side__empty', text: '还没有人完成。' })),
          el('p', { class: 'mb-howto', style: 'color: var(--w-ink3);', text: '总分 = 答对得分（满分 70）+ 速度分（满分 30）。每题 10 秒，答对且越快，速度分越高。' }));
        if (ch && !rankedParticipants(ch).length && !expectedPeople(ch).length) {
          body.querySelector('.mb-ranklist').appendChild(el('p', { class: 'mb-side__empty', text: '还没有人完成。' }));
        }
        var dlg = openDialog({
          title: '排名', cls: 'mb-dialog-result',
          content: [body, el('div', { class: 'ui-dialog__foot' }, btn('关闭', { size: 'md', onclick: function () { dlg.close(); } }))]
        });
      }).catch(function (e) {
        if (e.status === 404) { S.ch[id] = { missing: true }; refreshChallenge(id); toast('这个挑战的题目已经不在了', 'err'); }
        else toast('排名没读出来：' + e.message, 'err');
      });
    }

    // ==================== 右侧栏 ====================
    function uniqueRefs() {
      var seen = {};
      return S.refs.slice().sort(function (a, b) { return String(b.ts).localeCompare(String(a.ts)); })
        .filter(function (r) { if (seen[r.id]) return false; seen[r.id] = true; return true; });
    }
    function goToRef(ref) {
      var card = findPost(ref.postId);
      if (!card) return;
      var target = card;
      card.querySelectorAll('.mb-ch[data-ch-id]').forEach(function (n) { if (n.getAttribute('data-ch-id') === ref.id) target = n; });
      target.scrollIntoView({ behavior: 'smooth', block: 'center' });
      card.classList.add('is-flash');
      setTimeout(function () { card.classList.remove('is-flash'); }, 3000);
    }
    var sidebarQueued = false;
    function renderSidebar() {
      if (sidebarQueued) return;
      sidebarQueued = true;
      requestAnimationFrame(function () { sidebarQueued = false; drawSidebar(); });
    }
    function drawSidebar() {
      var me = S.me.username;
      var refs = uniqueRefs();
      // 等你完成：自己发起的、或 @ 了自己的，还没做——帖子和评论里的都算
      var pending = refs.filter(function (r) {
        var ch = S.ch[r.id];
        if (!ch || ch.missing || ch.error) return false;
        var involved = ch.creator === me || (ch.mentioned_users || []).indexOf(me) >= 0;
        return involved && !(ch.participants || {})[me];
      });
      var pCard = document.getElementById('pendingCard');
      fill(pCard, el('div', { class: 'ui-card__head' }, el('h2', { class: 'ui-card__title', text: '等你完成的挑战' }),
        pending.length ? el('span', { class: 'ui-card__note ui-num', text: pending.length }) : null));
      if (!pending.length) {
        pCard.appendChild(el('p', { class: 'mb-side__empty', text: '暂时没有。别人发起挑战时 @ 你，会出现在这里。' }));
      }
      pending.forEach(function (r) {
        var ch = S.ch[r.id];
        var who = ch.creator === me ? '你发起的' : displayName(ch.creator) + ' 邀请你';
        pCard.appendChild(el('div', { class: 'mb-pending' },
          el('div', { class: 'mb-pending__main' },
            el('button', { class: 'mb-pending__title', type: 'button', text: ch.title, title: '跳到这个挑战', onclick: function () { goToRef(r); } }),
            el('div', { class: 'mb-meta', text: [who, (ch.vocabulary || []).length + ' 个单词', relTime(r.ts)].join(' · ') })),
          btn('开始', { kind: 'ui-btn--soft', onclick: function () { startQuiz(r.id); } })));
      });
      pCard.hidden = !S.loaded;
      pCard.classList.toggle('is-empty', !pending.length);

      // 最近的挑战：最新一个还在的挑战，小排名
      var rCard = document.getElementById('recentCard');
      var recent = refs.filter(function (r) { var ch = S.ch[r.id]; return ch && !ch.missing && !ch.error; })[0];
      rCard.hidden = !recent;
      if (!recent) { fill(rCard); return; }
      var ch = S.ch[recent.id];
      var rows = rankRows(ch, { small: true });
      var more = rows.length > 6 ? rows.length - 6 : 0;
      fill(rCard,
        el('div', { class: 'ui-card__head' }, el('h2', { class: 'ui-card__title', text: '最近的挑战' }), el('span', { class: 'ui-card__note', text: doneSummary(ch) })),
        el('div', { class: 'mb-side__sub', text: ch.title }),
        el('div', { class: 'mb-ranklist' }, rows.slice(0, 6), rows.length ? null : el('p', { class: 'mb-side__empty', text: '还没有人完成。' })),
        more ? el('div', { class: 'mb-meta', style: 'padding: 4px 10px 0 10px;', text: '还有 ' + more + ' 人，看完整排名' }) : null,
        el('div', { class: 'mb-btns', style: 'margin-top: 12px;' },
          btn('完整排名', { onclick: function () { showRanking(recent.id); } }),
          btn('去帖子', { onclick: function () { goToRef(recent); } })));
    }

    // ==================== 启动 ====================
    function loadPosts() {
      var list = document.getElementById('postsList');
      return api('/api/messages').then(function (d) {
        S.posts = d.messages || [];
        S.refs = [];
        renderPosts();
        return Promise.all(S.posts.map(function (p) { return loadComments(p.id); }));
      }).catch(function (e) {
        fill(list, el('div', { class: 'ui-card ui-empty' },
          el('p', { class: 'ui-empty__title', text: '帖子没读出来' }),
          el('p', { class: 'ui-empty__text', text: e.message }),
          btn('重试', { size: 'md', onclick: loadPosts })));
      });
    }
    function init() {
      if (!S.me || !S.me.username) {
        // 登录信息缺了用户资料：重新登录拿一份
        window.location.href = '/login';
        return;
      }
      composer.build();
      api('/api/get_users_list').then(function (d) {
        S.usersList = d.users || [];
        S.usersList.forEach(function (u) { S.users[u.username] = u; });
      }).catch(function () {}).then(function () {
        return loadPosts();
      }).then(function () {
        S.loaded = true;
        renderSidebar();
      });
    }

    function start() {
      checkStoredToken().then(function (valid) {
        if (!valid) { window.location.href = '/login'; return; }
        init();
      });
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
    else start();
  })();
  </script>
</body>
</html>
