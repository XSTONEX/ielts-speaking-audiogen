<!-- 设计稿：https://claude.ai/artifact/MhSvUwJm3kfprXehaKM2nu 「登录 · 词汇汇总 · 改版」。改样式先改画布，再改这个文件。 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <script>
        (function () {
            try {
                var preference = localStorage.getItem('ui-theme');
                if (preference !== 'light' && preference !== 'dark' && preference !== 'system') preference = 'system';
                var isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                var theme = preference === 'system' ? (isDark ? 'dark' : 'light') : preference;
                var root = document.documentElement;
                root.dataset.themePreference = preference;
                root.dataset.theme = theme;
                root.style.colorScheme = theme;
                root.classList.toggle('dark', theme === 'dark');
            } catch (error) {
                document.documentElement.dataset.themePreference = 'system';
                document.documentElement.dataset.theme = 'light';
                document.documentElement.style.colorScheme = 'light';
            }
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 · IELTS Lab</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
    <link rel="stylesheet" href="/static/theme.css?v=20261031b">
    <link rel="stylesheet" href="/static/plain.css?v=20261031">
    <script src="/static/theme.js?v=20260919" defer></script>
    <style>
        /* 登录页专属样式：只用设计系统令牌（--w-* 等）和 plain.css 的 ui- 组件，类名统一 lg- 前缀。
           没有导航栏（app-shell.js 在 /login 不画导航），整页只有中间一张卡片。 */
        .lg-wrap {
            min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 48px 16px;
        }
        .lg-brand { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; font-size: var(--w-fs-en); font-weight: 600; color: var(--w-ink); }
        .lg-brand__mark {
            width: 32px; height: 32px; border-radius: var(--w-r-chip); background: var(--w-big); color: var(--w-on-big);
            display: inline-flex; align-items: center; justify-content: center; font-size: var(--w-fs-meta); font-weight: 600;
        }
        .lg-card {
            width: 100%; max-width: 400px; padding: 30px 32px 26px 32px;
            border: 1px solid var(--w-line); border-radius: var(--w-r-card); background: var(--w-surface);
        }
        .lg-title { margin: 0; font-size: var(--w-fs-title); font-weight: 600; line-height: 1.35; color: var(--w-ink); }
        .lg-sub { margin: 4px 0 22px 0; font-size: var(--w-fs-meta); color: var(--w-ink3); }
        .lg-msg { margin-bottom: 16px; padding: 10px 12px; border-radius: var(--w-r-inner); font-size: var(--w-fs-meta); }
        .lg-msg--err { border: 1px solid var(--w-err-line); background: var(--w-err-soft); color: var(--w-err); }
        .lg-msg--ok { border: 1px solid var(--w-ok-line); background: var(--w-ok-soft); color: var(--w-ok); }
        .lg-form { display: flex; flex-direction: column; gap: 16px; margin: 0; }
        .lg-form .ui-input { height: 44px; }
        .lg-pw { position: relative; display: block; }
        .lg-pw .ui-input { padding-right: 44px; }
        .lg-eye {
            position: absolute; top: 6px; right: 6px; width: 32px; height: 32px; padding: 0;
            display: inline-flex; align-items: center; justify-content: center;
            border: none; border-radius: var(--w-r-chip); background: transparent; color: var(--w-ink3); cursor: pointer;
            transition: background .15s, color .15s;
        }
        .lg-eye:hover { background: var(--w-sunken); color: var(--w-ink); }
        .lg-eye:focus-visible { outline: none; box-shadow: var(--w-ring); }
        .lg-eye .lg-eye__off { display: none; }
        .lg-eye[aria-pressed="true"] .lg-eye__on { display: none; }
        .lg-eye[aria-pressed="true"] .lg-eye__off { display: inline; }
        .lg-submit { width: 100%; margin-top: 6px; font-weight: 600; }
        .lg-spin {
            width: 14px; height: 14px; flex: none; border: 2px solid currentColor; border-right-color: transparent;
            border-radius: 50%; animation: lg-spin .8s linear infinite;
        }
        @keyframes lg-spin { to { transform: rotate(360deg); } }
        .lg-foot { margin: 18px 0 0 0; padding-top: 16px; border-top: 1px solid var(--w-line); text-align: center; font-size: var(--w-fs-meta); color: var(--w-ink3); }
        @media (max-width: 480px) {
            .lg-wrap { justify-content: flex-start; padding-top: 40px; }
            .lg-card { padding: 24px 20px 20px 20px; }
        }
    </style>
</head>
<body class="theme-page page-login ui-plain">
    <div class="lg-wrap">
        <div class="lg-brand"><span class="lg-brand__mark" aria-hidden="true">IL</span>IELTS Lab</div>

        <main class="lg-card">
            <h1 class="lg-title">登录</h1>
            <p class="lg-sub">登录后接着上次的练习。</p>

            <div id="errorMessage" class="lg-msg lg-msg--err" role="alert" hidden></div>
            <div id="successMessage" class="lg-msg lg-msg--ok" role="status" hidden></div>

            <form id="loginForm" class="lg-form" novalidate>
                <label class="ui-field">
                    <span class="ui-field__label">用户名</span>
                    <input type="text" id="username" class="ui-input" autocomplete="username" autocapitalize="none" spellcheck="false" required>
                </label>
                <label class="ui-field">
                    <span class="ui-field__label">密码</span>
                    <span class="lg-pw">
                        <input type="password" id="password" class="ui-input" autocomplete="current-password" required>
                        <button type="button" id="togglePassword" class="lg-eye" aria-label="显示密码" aria-pressed="false">
                            <svg class="lg-eye__on" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.5 8S4 3.5 8 3.5 14.5 8 14.5 8 12 12.5 8 12.5 1.5 8 1.5 8z"/><circle cx="8" cy="8" r="2"/></svg>
                            <svg class="lg-eye__off" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.5 8S4 3.5 8 3.5 14.5 8 14.5 8 12 12.5 8 12.5 1.5 8 1.5 8z"/><circle cx="8" cy="8" r="2"/><path d="M2.5 13.5l11-11"/></svg>
                        </button>
                    </span>
                </label>
                <button type="submit" id="loginBtn" class="ui-btn ui-btn--primary lg-submit">
                    <span class="lg-spin" id="loadingSpinner" hidden></span>
                    <span id="loginBtnText">登录</span>
                </button>
            </form>

            <p class="lg-foot">还没有账号？请找管理员开通。</p>
        </main>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        const loginBtnText = document.getElementById('loginBtnText');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        const togglePassword = document.getElementById('togglePassword');

        // 登录完回哪一页：地址里的 ?next=，否则是把你送到登录页的那一页（各页面没登录时都是
        // 直接跳 /login，浏览器会把来源页放在 document.referrer 里），都没有才回首页。
        // 只认本站的路径，防止被人拿登录页做跳板跳到别的网站。
        function samePath(raw) {
            if (!raw) return '';
            try {
                const url = new URL(raw, window.location.origin);
                if (url.origin !== window.location.origin || url.pathname === '/login') return '';
                return url.pathname + url.search + url.hash;
            } catch (e) {
                return '';
            }
        }
        function landingPage() {
            let next = '';
            try { next = new URLSearchParams(window.location.search).get('next') || ''; } catch (e) {}
            // ?next= 只接受以单个 / 开头的站内路径（//evil.com 这种会被当成别的网站）
            if (next && (!next.startsWith('/') || next.startsWith('//') || next.includes('\\'))) next = '';
            return samePath(next) || samePath(document.referrer) || '/';
        }
        function goOn() {
            window.location.href = landingPage();
        }

        // 已经登录的人打开登录页：直接放行
        function checkStoredToken() {
            let storedToken = null;
            try { storedToken = localStorage.getItem('authToken'); } catch (e) {}
            if (!storedToken) return Promise.resolve(false);
            return fetch('/verify_token', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: storedToken })
            })
                .then(res => res.json())
                .then(data => {
                    if (data && data.valid === true) {
                        goOn();
                        return true;
                    }
                    // 只有服务器明确回答"无效"才清掉凭证；其它情况（比如 503）留在登录页，凭证不动
                    if (data && data.valid === false) {
                        try { localStorage.removeItem('authToken'); } catch (e) {}
                    }
                    return false;
                })
                // 断网、服务器重启时的 502 页面：说明不了凭证失效，留在登录页，凭证不动
                .catch(() => false);
        }

        function showMessage(message, isError = true) {
            hideMessages();
            const box = isError ? errorMessage : successMessage;
            box.textContent = message;
            box.hidden = false;
        }
        function hideMessages() {
            errorMessage.hidden = true;
            successMessage.hidden = true;
        }

        function setLoading(loading) {
            loginBtn.disabled = loading;
            loadingSpinner.hidden = !loading;
            loginBtnText.textContent = loading ? '正在登录' : '登录';
        }

        function login(username, password) {
            setLoading(true);
            hideMessages();
            fetch('/user_login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: username, password: password })
            })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        try {
                            localStorage.setItem('authToken', data.token);
                            localStorage.setItem('currentUser', JSON.stringify(data.user));
                        } catch (e) {
                            showMessage('浏览器不让保存登录状态（可能是无痕模式），换个窗口再试');
                            setLoading(false);
                            return;
                        }
                        showMessage(`欢迎，${data.user.display_name}`, false);
                        setTimeout(goOn, 500);
                        // 跳走之前按钮保持「正在登录」，免得又点一次
                        return;
                    }
                    showMessage(data.error === '用户名或密码错误' ? '用户名或密码不对，再试一次。' : (data.error || '登录失败，请检查用户名和密码'));
                    setLoading(false);
                })
                .catch(err => {
                    console.error('登录错误:', err);
                    showMessage('网络出错，没连上服务器，稍后再试');
                    setLoading(false);
                });
        }

        loginForm.addEventListener('submit', function (e) {
            e.preventDefault();
            if (loginBtn.disabled) return;
            const username = usernameInput.value.trim();
            // 密码原样发送：首尾的空格也是密码的一部分
            const password = passwordInput.value;
            if (!username || !password) {
                showMessage(!username ? '请输入用户名' : '请输入密码');
                (!username ? usernameInput : passwordInput).focus();
                return;
            }
            login(username, password);
        });

        togglePassword.addEventListener('click', function () {
            const show = passwordInput.type === 'password';
            passwordInput.type = show ? 'text' : 'password';
            togglePassword.setAttribute('aria-pressed', String(show));
            togglePassword.setAttribute('aria-label', show ? '隐藏密码' : '显示密码');
            passwordInput.focus();
        });

        checkStoredToken().then(hasValidToken => {
            if (!hasValidToken && !usernameInput.value) usernameInput.focus();
        });
    </script>
</body>
</html>
