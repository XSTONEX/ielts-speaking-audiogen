        // 智能选词（覆盖率 + 收藏加权），和原来的算法一致
        function selectChallengeWords(allWords, count, favorFavorites) {
            if (allWords.length === 0) return [];
            if (allWords.length <= count) return shuffle(allWords);
            const weighted = allWords.map(word => {
                const cov = coverage[word.id] || { appear_count: 0, last_appeared: null };
                let weight = Math.max(1, 10 - (cov.appear_count || 0));
                if (cov.last_appeared) {
                    const days = (Date.now() - new Date(cov.last_appeared).getTime()) / (1000 * 60 * 60 * 24);
                    weight *= Math.min(3, 1 + days * 0.1);
                }
                if (favorFavorites && word.is_favorited) weight *= 2.5;
                return { word: word, weight: weight };
            });
            const picked = [];
            const available = weighted.slice();
            for (let i = 0; i < count && available.length > 0; i++) {
                const totalWeight = available.reduce((sum, item) => sum + item.weight, 0);
                let r = Math.random() * totalWeight;
                let index = 0;
                for (let j = 0; j < available.length; j++) {
                    r -= available[j].weight;
                    if (r <= 0) { index = j; break; }
                }
                picked.push(available.splice(index, 1)[0].word);
            }
            return picked;
        }

        // 出题：一半看词选义（自动读一遍），一半看义选词；干扰项按显示的文字去重，
        // 同一个词出现在两个子分类时也不会出现两个一样的选项
        function generateQuestions(selected, pool) {
            const norm = s => String(s || '').trim().toLowerCase();
            return selected.map(word => {
                const type = Math.random() < 0.5 ? 'word_to_meaning' : 'meaning_to_word';
                const shown = w => type === 'word_to_meaning' ? norm(w.meaning) : norm(w.word);
                const seen = new Set([shown(word)]);
                const wrong = [];
                shuffle(pool.filter(w => w.id !== word.id && norm(w.meaning) !== '' && norm(w.word) !== norm(word.word)))
                    .forEach(w => {
                        if (wrong.length >= 3 || seen.has(shown(w))) return;
                        seen.add(shown(w));
                        wrong.push(w);
                    });
                return { word: word, type: type, options: shuffle([word].concat(wrong)), isCorrect: null };
            });
        }

        // ==================== 单词挑战：答题 ====================

        const qz = { back: $('dlgQuiz'), count: $('qCount'), bar: $('qBar'), prompt: $('qPrompt'), question: $('qQuestion'), options: $('qOptions'), foot: $('qFoot') };
        let quiz = null;   // { settings, questions, index, correct, wrong, answered, timers }

        function later(session, ms, fn) {
            const timer = setTimeout(() => { if (quiz === session) fn(); }, ms);
            session.timers.push(timer);
        }

        function clearQuizTimers(session) {
            session.timers.forEach(clearTimeout);
            session.timers = [];
        }

        function startQuiz(settings, pool) {
            const picked = selectChallengeWords(pool, settings.count, settings.favor);
            quiz = { settings: settings, questions: generateQuestions(picked, pool), index: 0, correct: 0, wrong: [], answered: false, timers: [] };
            // 焦点放在弹窗本身：1–4 键照样能答，× 按钮上不会挂着一个焦点框
            openDialog(qz.back, { onCancel: confirmExitQuiz, returnFocus: els.challengeBtn, focus: $('qDialog') });
            showQuestion();
        }

        function showQuestion() {
            const session = quiz;
            const q = session.questions[session.index];
            const total = session.questions.length;
            session.answered = false;
            qz.count.textContent = '第 ' + (session.index + 1) + ' / ' + total + ' 题';
            qz.bar.style.width = ((session.index + 1) / total * 100) + '%';
            const toMeaning = q.type === 'word_to_meaning';
            qz.prompt.textContent = toMeaning ? '选出它的意思' : '选出对应的单词';
            qz.question.innerHTML = toMeaning
                ? '<span class="vb-quiz-word">' + esc(q.word.word) + '</span><button type="button" class="vb-replay" data-replay aria-label="再听一遍" title="再听一遍">' + ICON_SPEAKER_LG + '</button>'
                : '<span class="vb-quiz-mean">' + esc(q.word.meaning || '暂无释义') + '</span>';
            qz.options.innerHTML = q.options.map((option, i) => {
                const text = toMeaning ? (option.meaning || '暂无释义') : option.word;
                return '<button type="button" class="vb-option' + (toMeaning ? '' : ' is-en') + '" data-index="' + i + '">' +
                    '<span class="vb-option__key">' + (i + 1) + '</span><span class="vb-option__text">' + esc(text) + '</span></button>';
            }).join('');
            // 手机上没有数字键，不提
            qz.foot.textContent = isPhone() ? '' : '可以按 1–' + q.options.length + ' 键作答';
            if (toMeaning) later(session, 300, () => playWord(q.word, { quiet: true }));
        }

        function answer(index) {
            const session = quiz;
            if (!session || session.answered) return;
            const q = session.questions[session.index];
            const chosen = q.options[index];
            if (!chosen) return;
            session.answered = true;
            q.isCorrect = chosen.id === q.word.id;
            if (q.isCorrect) session.correct++; else session.wrong.push(q.word);
            qz.options.querySelectorAll('.vb-option').forEach((btn, i) => {
                btn.disabled = true;
                const option = q.options[i];
                if (option.id === q.word.id) {
                    btn.classList.add('is-right');
                    btn.insertAdjacentHTML('beforeend', '<span class="ui-tag ui-tag--ok">' + (q.isCorrect ? '答对了' : '正确答案') + '</span>');
                } else if (i === index) {
                    btn.classList.add('is-wrong');
                    btn.insertAdjacentHTML('beforeend', '<span class="ui-tag ui-tag--err">你的选择</span>');
                } else {
                    btn.classList.add('is-dim');
                }
            });
            qz.foot.textContent = session.index + 1 < session.questions.length ? '马上进入下一题' : '马上出结果';
            // 看义选词：答完读一遍正确的单词
            if (q.type === 'meaning_to_word') later(session, 500, () => playWord(q.word, { quiet: true }));
            later(session, 1500, nextQuestion);
        }

        function nextQuestion() {
            quiz.index++;
            if (quiz.index >= quiz.questions.length) finishQuiz(); else showQuestion();
        }

        async function confirmExitQuiz() {
            const session = quiz;
            if (!session) { closeDialog(qz.back); return; }
            // 确认框开着时暂停自动下一题，免得在后面悄悄跳题或弹出结果
            clearQuizTimers(session);
            const ok = await confirmDialog({ title: '退出这次挑战？', text: '已经答的题不会记录，下次出题也不受这次影响。', okText: '退出挑战', cancelText: '继续答题' });
            if (quiz !== session) return;
            if (ok) {
                endQuiz();
            } else if (session.answered) {
                later(session, 600, nextQuestion);
            }
        }

        function endQuiz() {
            if (quiz) clearQuizTimers(quiz);
            quiz = null;
            stopPlayback();
            closeDialog(qz.back);
        }

        qz.options.addEventListener('click', e => {
            const btn = e.target.closest('.vb-option');
            if (btn && !btn.disabled) answer(parseInt(btn.dataset.index, 10));
        });

        qz.question.addEventListener('click', e => {
            if (e.target.closest('[data-replay]') && quiz) {
                audioUnlocked = true;
                playWord(quiz.questions[quiz.index].word);
            }
        });

        // ==================== 单词挑战：结果 ====================

        const rs = { back: $('dlgResult'), title: $('rTitle'), right: $('rRight'), wrong: $('rWrong'), wrongBox: $('rWrongBox'), rate: $('rRate'), review: $('rReview'), summary: $('rSummary'), again: $('rAgain') };
        let resultWords = [];

        async function finishQuiz() {
            const session = quiz;
            clearQuizTimers(session);
            quiz = null;
            closeDialog(qz.back);

            const total = session.questions.length;
            const wrong = total - session.correct;
            const s = session.settings;
            rs.title.textContent = '挑战完成 · ' + scopeLabel(s.scope, s.category, s.subId);
            rs.right.textContent = session.correct;
            rs.wrong.textContent = wrong;
            rs.wrongBox.classList.toggle('is-low', wrong > 0);
            rs.rate.textContent = total ? Math.round(session.correct / total * 100) : 0;
            resultWords = session.wrong;
            if (resultWords.length) {
                rs.review.hidden = false;
                rs.review.innerHTML = '<div class="vb-review__head"><span>需要复习</span><span class="ui-num">' + resultWords.length + ' 个</span></div>' +
                    resultWords.map((w, i) => '<div class="vb-review__row"><span class="vb-review__word">' + esc(w.word) + '</span>' +
                        '<span class="vb-review__mean">' + esc(w.meaning || '暂无释义') + '</span>' +
                        '<button type="button" class="vb-act" data-index="' + i + '" aria-label="播放 ' + esc(w.word) + ' 的发音" title="播放发音">' + ICON_SPEAKER_LG + '</button></div>').join('');
            } else {
                rs.review.hidden = true;
                rs.review.innerHTML = '';
            }
            rs.summary.textContent = '正在记进挑战记录…';
            openDialog(rs.back, { returnFocus: els.challengeBtn, focus: rs.again });

            const results = session.questions.map(q => ({ word_id: q.word.id, is_correct: q.isCorrect }));
            try {
                await api('/api/vocabulary/challenge/record', jsonOptions('POST', {
                    results: results,
                    scope: s.scope,
                    category: s.category,
                    subcategory_id: s.subId
                }, userHeaders()));
                rs.summary.textContent = (resultWords.length ? '' : '全部答对。') + '这 ' + total + ' 个词已记进挑战记录，下次会优先出没考过的词。';
                loadCoverage();
            } catch (error) {
                rs.summary.textContent = '挑战记录没存上（' + error.message + '），下次出题不受这次影响。';
            }
        }

        rs.review.addEventListener('click', e => {
            const btn = e.target.closest('[data-index]');
            if (btn) {
                audioUnlocked = true;
                playWord(resultWords[parseInt(btn.dataset.index, 10)]);
            }
        });

        rs.again.addEventListener('click', () => {
            closeDialog(rs.back);
            openChallenge(lastChallenge);
        });

        // ==================== 键盘 ====================

        function isTyping(target) {
            return !!(target && target.closest && target.closest('input, textarea, select, [contenteditable=""], [contenteditable="true"]'));
        }

        document.addEventListener('keydown', e => {
            const top = topDialog();
            if (top) {
                if (e.key === 'Escape') {
                    e.preventDefault();
                    cancelDialog(top.back);
                } else if (e.key === 'Tab') {
                    trapTab(e);
                } else if (top.back === qz.back && quiz && !e.ctrlKey && !e.metaKey && !e.altKey && /^[1-9]$/.test(e.key)) {
                    e.preventDefault();
                    answer(parseInt(e.key, 10) - 1);
                }
                return;
            }
            // H 切换隐藏释义：打字时、按着修饰键时、输入法组字时都不触发
            if ((e.key === 'h' || e.key === 'H') && !e.ctrlKey && !e.metaKey && !e.altKey && !e.isComposing && !isTyping(e.target) && vocab) {
                e.preventDefault();
                toggleMeanings();
            }
        });

        // ==================== 启动 ====================

        els.importBtn.addEventListener('click', openImport);
        els.emptyImport.addEventListener('click', openImport);
        els.exportBtn.addEventListener('click', openExport);
        els.challengeBtn.addEventListener('click', () => openChallenge(null));
        els.pChallenge.addEventListener('click', () => openChallenge(null));

        // 手机键盘：iOS 弹键盘时布局视口不变，只有 visualViewport 变矮（还可能往下挪）。
        // 把看得见的那块的上下边算成变量，面板的遮罩就收在键盘上面，输入框和「添加」按钮不会被盖住
        const vv = window.visualViewport;
        function syncViewport() {
            const root = document.documentElement.style;
            if (!vv || !isPhone()) {
                root.removeProperty('--vb-vv-top');
                root.removeProperty('--vb-kb');
                return;
            }
            const top = Math.max(0, Math.round(vv.offsetTop));
            const kb = Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop));
            root.setProperty('--vb-vv-top', top + 'px');
            root.setProperty('--vb-kb', kb + 'px');
        }
        if (vv) {
            vv.addEventListener('resize', syncViewport);
            vv.addEventListener('scroll', syncViewport);
        }

        // 窗口在手机 / 桌面宽度之间来回拉：手机加词面板只在手机布局里有意义；查找框换到对应布局里那一个
        const onLayoutChange = () => {
            syncViewport();
            if (!isPhone() && addSheetOpen()) closeDialog(els.addSheet);
            if (isPhone() && searchText) {
                els.rail.classList.add('is-searching');
                els.pSearch.value = els.search.value;
            }
            if (vocab) render();
        };
        if (phoneMq.addEventListener) phoneMq.addEventListener('change', onLayoutChange);
        else if (phoneMq.addListener) phoneMq.addListener(onLayoutChange);
        syncViewport();

        loadPrefs();
        loadVocabulary();
        loadCoverage();
    })();
    </script>
</body>
