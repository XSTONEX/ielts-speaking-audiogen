<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <script>
        (function () {
            try {
                var preference = localStorage.getItem('ui-theme');
                if (preference !== 'light' && preference !== 'dark' && preference !== 'system') preference = 'system';
                var isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                var theme = preference === 'system' ? (isDark ? 'dark' : 'light') : preference;
                var root = document.documentElement;
                root.dataset.themePreference = preference;
                root.dataset.theme = theme;
                root.style.colorScheme = theme;
                root.classList.toggle('dark', theme === 'dark');
            } catch (error) {
                document.documentElement.dataset.themePreference = 'system';
                document.documentElement.dataset.theme = 'light';
                document.documentElement.style.colorScheme = 'light';
            }
        })();
    </script>

    <style>
        /* 单词本页面专属样式：只用设计系统令牌（--w-* 等）和 plain.css 的 ui- 组件，页面类名统一 vb- 前缀。
           设计稿：Claude Design 画布「单词本 · 改版」，project/vocab.css 与这里一致。 */
        html.vb-lock { overflow: hidden; }
        .vb-shell { padding-bottom: 80px; }
        .vb-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
        .vb-kbd {
            display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; padding: 0 5px;
            border: 1px solid var(--w-line-strong); border-radius: 4px; background: var(--w-surface);
            font-family: var(--font-en); font-size: var(--w-fs-meta); line-height: 1; color: var(--w-ink3);
        }

        /* ---------- 页头 ---------- */
        .vb-head__desc { margin: 6px 0 0 0; font-size: var(--w-fs-ui); color: var(--w-ink2); }

        /* ---------- 目录栏 ---------- */
        .vb-rail-col { border-right: 1px solid var(--w-line); min-width: 0; }
        .vb-rail {
            position: sticky; top: var(--app-shell-h); max-height: calc(100vh - var(--app-shell-h)); overflow-y: auto;
            border-right: none;
        }
        .vb-cats { display: flex; flex-direction: column; gap: 3px; }
        .vb-subhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 16px 0 6px 0; padding-right: 2px; }
        .vb-subhead .ui-rail__label { margin: 0; }
        .vb-subhead__tools { display: flex; align-items: center; gap: 2px; }
        .vb-tool {
            height: 28px; min-width: 28px; padding: 0 7px; display: inline-flex; align-items: center; justify-content: center; gap: 4px;
            border: none; border-radius: var(--w-r-chip); background: transparent; color: var(--w-ink3);
            font-size: var(--w-fs-meta); white-space: nowrap; cursor: pointer; transition: background .15s, color .15s;
        }
        .vb-tool:hover { background: var(--w-sunken); color: var(--w-ink); }
        .vb-subs { display: flex; flex-direction: column; gap: 3px; }
        .vb-subs .ui-rail__item { align-items: flex-start; padding: 9px 12px; }
        .vb-subs .ui-rail__name { line-height: 1.45; overflow-wrap: anywhere; }
        .vb-subs .ui-rail__count { line-height: 1.45; padding-top: 2px; }
        .vb-sub-toggle { display: none; }

        /* ---------- 主区域 ---------- */
        .vb-main-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 16px; }
        .vb-main-title { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 12px; min-width: 0; margin: 0; font-size: var(--w-fs-title); font-weight: 600; color: var(--w-ink); overflow-wrap: anywhere; }
        .vb-main-stat { font-size: var(--w-fs-meta); font-weight: 400; color: var(--w-ink3); }
        .vb-main-tools { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
        .vb-status { padding: 56px 20px; text-align: center; font-size: var(--w-fs-ui); color: var(--w-ink3); }
        .vb-status .ui-btn { margin-top: 14px; }

        /* 快速加词 */
        .vb-add {
            display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.35fr) auto; gap: 10px; align-items: center;
            padding: 14px 16px; background: var(--w-surface); border: 1px solid var(--w-line); border-radius: var(--w-r-card);
        }
        .vb-add .ui-btn { height: var(--h-nav); }
        .vb-add__hint { grid-column: 1 / -1; margin: -2px 0 0 0; font-size: var(--w-fs-meta); color: var(--w-ink3); overflow-wrap: anywhere; }
        .vb-add__hint.is-warn { color: var(--w-warn); }

        /* 工具条：排序 / 收藏置顶 / 隐藏释义 / 查找 */
        .vb-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 16px 0 14px 0; }
        .vb-sort { display: inline-flex; align-items: center; gap: 8px; font-size: var(--w-fs-meta); color: var(--w-ink3); }
        .vb-sort .ui-select { width: auto; height: var(--h-sm); font-size: var(--w-fs-meta); padding-left: 12px; color: var(--w-ink); }
        .vb-toolbar .ui-chip { padding: 0 12px; }
        .vb-toolbar .ui-chip:disabled { opacity: .55; cursor: not-allowed; }
        .vb-search { position: relative; margin-left: auto; width: 230px; }
        .vb-search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--w-ink3); pointer-events: none; }
        .vb-search .ui-input { height: var(--h-sm); padding-left: 33px; font-size: var(--w-fs-meta); }
        .vb-count-line { margin: 0 0 10px 0; font-size: var(--w-fs-meta); color: var(--w-ink3); }

        /* 单词卡 */
        .vb-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: var(--gap-12); }
        .vb-card {
            display: flex; flex-direction: column; gap: 4px; min-width: 0;
            padding: 13px 14px 8px 16px; background: var(--w-surface);
            border: 1px solid var(--w-line); border-radius: var(--w-r-card);
            cursor: pointer; transition: border-color .15s, background .15s;
        }
        .vb-card:hover { border-color: var(--w-big-line); }
        .vb-card.is-playing { border-color: var(--w-big-line); background: var(--w-big-soft); }
        .vb-word {
            align-self: flex-start; display: inline-flex; align-items: center; gap: 7px; max-width: 100%;
            padding: 0; border: none; background: transparent; cursor: pointer; text-align: left;
            font-family: var(--font-en); font-size: var(--w-fs-en); font-weight: 600; line-height: 1.45; color: var(--w-ink);
            overflow-wrap: anywhere;
        }
        .vb-word svg { flex-shrink: 0; color: var(--w-ink3); opacity: 0; transition: opacity .15s, color .15s; }
        .vb-card:hover .vb-word svg, .vb-word:focus-visible svg { opacity: 1; }
        .vb-card.is-playing .vb-word svg { opacity: 1; color: var(--w-big); }
        .vb-meaning { margin: 0; font-size: var(--w-fs-ui); line-height: 1.6; color: var(--w-ink2); overflow-wrap: anywhere; }
        .vb-meaning.is-empty { color: var(--w-ink3); }
        /* 隐藏释义：用一条底色块盖住，长度和原文一样；悬停或点一下单张才显示 */
        .vb-meaning.is-masked > span {
            color: transparent; background: var(--w-big-track); border-radius: 4px;
            -webkit-box-decoration-break: clone; box-decoration-break: clone; user-select: none; -webkit-user-select: none;
        }
        .vb-card:hover .vb-meaning.is-masked > span, .vb-meaning.is-masked.is-peek > span {
            color: var(--w-ink2); background: transparent;
        }
        .vb-card__foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: auto; padding-top: 2px; min-height: 30px; }
        .vb-date { font-size: var(--w-fs-meta); color: var(--w-ink3); white-space: nowrap; }
        .vb-acts { display: flex; align-items: center; gap: 2px; }
        .vb-act {
            width: 30px; height: 30px; padding: 0; display: inline-flex; align-items: center; justify-content: center;
            border: none; border-radius: var(--w-r-chip); background: transparent; color: var(--w-ink3);
            cursor: pointer; transition: background .15s, color .15s, opacity .15s;
        }
        .vb-act:hover { background: var(--w-sunken); color: var(--w-ink); }
        .vb-act.is-on { color: var(--w-big); }
        /* 编辑、删除按钮在星标左边，平时透明但占着位置，星标一直在右下角不挪动 */
        .vb-act--del, .vb-act--edit { opacity: 0; }
        .vb-card:hover .vb-act--del, .vb-act--del:focus-visible, .vb-card:hover .vb-act--edit, .vb-act--edit:focus-visible { opacity: 1; }
        .vb-act--del:hover { background: var(--w-err-soft); color: var(--w-err); }
        @media (hover: none) { .vb-act--del, .vb-act--edit, .vb-word svg { opacity: 1; } }

        /* ---------- 弹窗里的表单块 ---------- */
        .vb-row2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
        .vb-drop {
            width: 100%; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center;
            padding: 22px 16px; border: 1px dashed var(--w-line-strong); border-radius: var(--w-r-inner);
            background: var(--w-sunken); color: var(--w-ink2); font: inherit; cursor: pointer; transition: border-color .15s, background .15s;
        }
        .vb-drop:hover, .vb-drop.is-over { border-color: var(--w-big-line); background: var(--w-big-soft); }
        .vb-drop strong { color: var(--w-ink); font-weight: 600; overflow-wrap: anywhere; }
        .vb-drop__sub { font-size: var(--w-fs-meta); }
        .vb-drop .vb-link { color: var(--w-big); font-weight: 600; }
        .vb-sample {
            margin: 0; padding: 10px 14px; border: 1px solid var(--w-line); border-radius: var(--w-r-inner); background: var(--w-sunken);
            font-family: var(--font-en); font-size: var(--w-fs-meta); line-height: 1.7; color: var(--w-ink2); white-space: pre; overflow-x: auto;
        }
        .vb-checks { display: flex; flex-wrap: wrap; gap: 10px 18px; }
        .vb-check { display: inline-flex; align-items: center; gap: 7px; font-size: var(--w-fs-ui); color: var(--w-ink); cursor: pointer; }
        .vb-check input { width: 16px; height: 16px; margin: 0; accent-color: var(--w-big); }
        .vb-check.is-locked { color: var(--w-ink3); cursor: default; }
        .vb-chips { display: flex; flex-wrap: wrap; gap: 8px; }
        .vb-summary { margin: 0; font-size: var(--w-fs-meta); color: var(--w-ink2); }
        .vb-summary b { font-weight: 600; color: var(--w-ink); font-variant-numeric: tabular-nums; }
        .vb-summary.is-warn { color: var(--w-warn); }
        .vb-dialog-text { margin: 0; font-size: var(--w-fs-ui); line-height: 1.7; color: var(--w-ink2); overflow-wrap: anywhere; }
        .vb-btn-danger { background: var(--w-err); border-color: transparent; color: var(--w-surface); font-weight: 600; }
        .vb-btn-danger:hover { background: var(--w-err); border-color: transparent; color: var(--w-surface); opacity: .9; }
        .ui-dialog__title { overflow-wrap: anywhere; }
        .vb-dialog--wide { width: min(640px, 100%); }
        /* 编辑单词：单词框下面的提示，重复 / 空着 / 没存上时变成警告色 */
        .vb-edit .ui-field__hint { overflow-wrap: anywhere; }
        .vb-edit .ui-field__hint.is-warn { color: var(--w-warn); }

        /* ---------- 挑战：答题 ---------- */
        #qDialog:focus { outline: none; }
        .vb-quiz-head { display: flex; align-items: center; gap: 14px; padding: 18px 20px 0 24px; }
        .vb-quiz-head .ui-progress { flex-grow: 1; }
        .vb-quiz-count { font-size: var(--w-fs-meta); color: var(--w-ink2); white-space: nowrap; }
        .vb-quiz-body { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 30px 24px 22px 24px; }
        .vb-quiz-prompt { font-size: var(--w-fs-meta); letter-spacing: 2px; color: var(--w-ink3); }
        .vb-quiz-q { display: flex; align-items: center; justify-content: center; gap: 12px; min-height: 52px; text-align: center; max-width: 100%; }
        .vb-quiz-word { font-family: var(--font-en); font-size: var(--w-fs-title); font-weight: 600; color: var(--w-ink); overflow-wrap: anywhere; min-width: 0; }
        .vb-quiz-mean { font-size: var(--w-fs-title); font-weight: 600; color: var(--w-ink); overflow-wrap: anywhere; min-width: 0; }
        .vb-replay {
            width: 38px; height: 38px; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; padding: 0;
            border: 1px solid var(--w-line); border-radius: var(--w-r-round); background: var(--w-surface); color: var(--w-ink2); cursor: pointer;
            transition: border-color .15s, background .15s, color .15s;
        }
        .vb-replay:hover { border-color: var(--w-big-line); background: var(--w-big-soft); color: var(--w-big); }
        .vb-options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; width: 100%; margin-top: 6px; }
        .vb-option {
            display: flex; align-items: center; gap: 12px; min-height: 62px; padding: 12px 16px; text-align: left;
            border: 1px solid var(--w-line); border-radius: var(--w-r-card); background: var(--w-surface);
            font-size: var(--w-fs-ui); line-height: 1.5; color: var(--w-ink); cursor: pointer; transition: border-color .15s, background .15s, opacity .15s;
        }
        .vb-option.is-en { font-family: var(--font-en); font-size: var(--w-fs-en); font-weight: 600; }
        .vb-option:hover { border-color: var(--w-big-line); }
        .vb-option__key {
            width: 24px; height: 24px; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center;
            border-radius: var(--w-r-chip); background: var(--w-sunken); font-family: var(--font-en); font-size: var(--w-fs-meta); font-weight: 400; color: var(--w-ink3);
        }
        .vb-option__text { flex-grow: 1; min-width: 0; overflow-wrap: anywhere; }
        .vb-option .ui-tag { flex-shrink: 0; font-family: var(--font-cn); }
        .vb-option.is-right { border-color: var(--w-ok-line); background: var(--w-ok-soft); }
        .vb-option.is-wrong { border-color: var(--w-err-line); background: var(--w-err-soft); }
        .vb-option.is-dim { opacity: .55; }
        .vb-option:disabled { cursor: default; color: var(--w-ink); }
        .vb-quiz-foot { margin: 0; font-size: var(--w-fs-meta); color: var(--w-ink3); text-align: center; }

        /* ---------- 挑战：结果 ---------- */
        .vb-stats3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        .vb-review { border: 1px solid var(--w-line); border-radius: var(--w-r-card); overflow: hidden; }
        .vb-review__head { display: flex; justify-content: space-between; padding: 10px 14px; background: var(--w-sunken); font-size: var(--w-fs-meta); color: var(--w-ink2); }
        .vb-review__row { display: flex; align-items: center; gap: 12px; padding: 9px 10px 9px 14px; border-top: 1px solid var(--w-line); }
        .vb-review__word { font-family: var(--font-en); font-size: var(--w-fs-en); font-weight: 600; color: var(--w-ink); overflow-wrap: anywhere; }
        .vb-review__mean { flex-grow: 1; min-width: 0; font-size: var(--w-fs-ui); color: var(--w-ink2); overflow-wrap: anywhere; }

        /* ---------- 只在手机上出现的东西（桌面一律不显示，桌面布局不受影响） ---------- */
        .vb-more-btn, .vb-prow, .vb-pbar, .vb-add__head, .vb-act--more, .vb-only-phone { display: none; }
        /* 手机面板（子分类 / 排序 / 操作菜单）里的行，只在手机上打开 */
        .vb-sheet-tools { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: var(--w-fs-meta); color: var(--w-ink3); }
        .vb-sheet-tools .vb-tool { height: 40px; padding: 0 12px; margin-right: -8px; font-size: var(--w-fs-meta); color: var(--w-ink2); }
        .vb-rows { display: flex; flex-direction: column; margin: 0 -8px; }
        .vb-row { display: flex; align-items: stretch; min-width: 0; }
        .vb-row + .vb-row { border-top: 1px solid var(--w-line); }
        .vb-row__main, .vb-actitem {
            flex: 1 1 auto; min-width: 0; min-height: 48px; display: flex; align-items: center; gap: 12px; padding: 8px;
            border: none; border-radius: var(--w-r-inner); background: transparent; color: var(--w-ink);
            font-size: var(--w-fs-ui); line-height: 1.45; text-align: left; cursor: pointer;
        }
        .vb-row__main:hover, .vb-actitem:hover, .vb-row__more:hover { background: var(--w-sunken); }
        .vb-row__name { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
        .vb-row__count { font-size: var(--w-fs-meta); color: var(--w-ink3); font-variant-numeric: tabular-nums; white-space: nowrap; }
        .vb-row__check { width: 18px; flex-shrink: 0; display: inline-flex; color: var(--w-big); }
        .vb-row.is-on .vb-row__name { color: var(--w-big); font-weight: 600; }
        .vb-row__more {
            width: 44px; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; padding: 0;
            border: none; border-radius: var(--w-r-inner); background: transparent; color: var(--w-ink3); cursor: pointer;
        }
        .vb-actitem svg { flex-shrink: 0; color: var(--w-ink3); }
        .vb-actitem.is-danger, .vb-actitem.is-danger svg { color: var(--w-err); }
        .vb-actitem:disabled { opacity: .5; cursor: not-allowed; }
        .vb-actsheet__desc { margin: -6px 0 0 0; font-size: var(--w-fs-ui); line-height: 1.6; color: var(--w-ink2); overflow-wrap: anywhere; white-space: pre-line; }
        .vb-actsheet .ui-dialog__title.ui-en { font-family: var(--font-en); }
        .vb-switchrow {
            display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; padding: 8px 0; margin-top: 4px;
            border: none; border-top: 1px solid var(--w-line); background: transparent; color: var(--w-ink); text-align: left; cursor: pointer;
            font-size: var(--w-fs-ui);
        }
        .vb-switchrow__text { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
        .vb-switchrow__text small { font-size: var(--w-fs-meta); color: var(--w-ink3); }
        .vb-switch { position: relative; width: 44px; height: 26px; flex-shrink: 0; border-radius: 13px; background: var(--w-line-strong); transition: background .15s; }
        .vb-switch::after { content: ''; position: absolute; left: 3px; top: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--w-surface); transition: transform .15s; box-shadow: 0 1px 2px rgba(0, 0, 0, .2); }
        .vb-switchrow[aria-checked="true"] .vb-switch { background: var(--w-big); }
        .vb-switchrow[aria-checked="true"] .vb-switch::after { transform: translateX(18px); }
        .vb-switchrow:disabled { opacity: .5; cursor: not-allowed; }

        /* ---------- 手机 / 竖屏平板（≤ 820px）：一套 DOM。
           页头一行（标题 + ⋯）；分类 + 子分类 + 查找 + 排序收成吸顶的一条；单词卡一行两张；
           遮释义 / 加词 / 单词挑战放在底部操作条；加词、子分类、排序、导入导出都进面板 ---------- */
        @media (max-width: 820px), (max-height: 540px) and (pointer: coarse) {
            :root { --vb-pbar-h: 65px; }
            body.vb-ready { --ui-bottom-bar-h: var(--vb-pbar-h); }
            .vb-page { --gutter: 0px; }
            .vb-shell { width: auto; margin: 0 16px; padding-bottom: calc(var(--vb-pbar-h) + 24px + env(safe-area-inset-bottom)); }
            .vb-only-desk { display: none; }
            .vb-only-phone { display: inline; }

            /* 页头：只留标题和一个 ⋯（导入、导出、管理子分类）。说明里的 H 键提示在手机上没用 */
            .vb-page .ui-head { flex-wrap: nowrap; padding: 10px 0 4px 0; border-bottom: none; }
            .vb-head__desc { display: none; }
            /* 说明收起来了，卡片上也没放小喇叭，在标题后面用一小句话告诉第一次来的人点单词能听 */
            .vb-head__tip { margin-left: -5px; white-space: nowrap; }
            body:not(.vb-ready) .vb-head__tip { display: none; }
            .vb-page .ui-head__tools > .ui-btn { display: none; }
            .vb-more-btn {
                display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; margin-right: -10px; padding: 0;
                border: none; border-radius: var(--w-r-chip); background: transparent; color: var(--w-ink2); cursor: pointer;
            }
            body:not(.vb-ready) .vb-more-btn { visibility: hidden; }

            /* 吸顶条：分类分段 + [子分类 ▾][查找][排序]，滚到列表深处也能换子分类、查词 */

        function toast(message, type) {
            if (window.IELTSUI && window.IELTSUI.toast) window.IELTSUI.toast(message, type || 'success');
        }

        async function api(url, options) {
            let response;
            try {
                response = await fetch(url, options);
            } catch (error) {
                throw new Error('网络错误：' + error.message);
            }
            let body = null;
            try { body = await response.json(); } catch (error) { body = null; }
            if (!response.ok || !body || body.success === false) {
                throw new Error((body && body.error) || ('服务器返回 ' + response.status));
            }
            return body;
        }

        function jsonOptions(method, payload, extraHeaders) {
            return {
                method: method,
                headers: Object.assign({ 'Content-Type': 'application/json' }, extraHeaders || {}),
                body: JSON.stringify(payload)
            };
        }

        // 挑战接口按 X-Current-User 区分用户。请求头只能放 ISO-8859-1 字符，
        // 整个 currentUser（含中文显示名）放进去浏览器会直接拒绝发请求，所以只带用户名
        function userHeaders() {
            let raw = null;
            try { raw = localStorage.getItem('currentUser'); } catch (error) { raw = null; }
            if (!raw) return {};
            let name = raw;
            if (raw.charAt(0) === '{') {
                try { name = (JSON.parse(raw) || {}).username; } catch (error) { name = null; }
            }
            if (typeof name !== 'string' || !/^[\x20-\x7e]+$/.test(name)) return {};
            return { 'X-Current-User': raw.charAt(0) === '{' ? JSON.stringify({ username: name }) : name };
        }

        function shuffle(list) {
            const out = list.slice();
            for (let i = out.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                const t = out[i]; out[i] = out[j]; out[j] = t;
            }
            return out;
        }

        function shortDate(value) {
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return '';
            const sameYear = date.getFullYear() === new Date().getFullYear();
            return date.toLocaleDateString('zh-CN', sameYear ? { month: 'long', day: 'numeric' } : { year: 'numeric', month: 'long', day: 'numeric' });
        }

        function exportDate(value) {
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return '';
            return date.toLocaleDateString('zh-CN', { year: 'numeric', month: 'short', day: 'numeric' });
        }

        function fileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return Math.max(1, Math.round(bytes / 1024)) + ' KB';
            return (bytes / 1024 / 1024).toFixed(1) + ' MB';
        }

        // 自然排序，专门处理 Chapter 格式："Chapter12饮食健康" 按数字 12 排
        function naturalSort(a, b) {
            const chapterRegex = /chapter(\d+)/i;
            const matchA = a.match(chapterRegex);
            const matchB = b.match(chapterRegex);
            if (matchA && matchB) return parseInt(matchA[1], 10) - parseInt(matchB[1], 10);
            if (matchA && !matchB) return -1;
            if (!matchA && matchB) return 1;

            const chunkRegex = /(\d+|\D+)/g;
            const chunksA = a.toLowerCase().match(chunkRegex) || [];
            const chunksB = b.toLowerCase().match(chunkRegex) || [];
            for (let i = 0; i < Math.max(chunksA.length, chunksB.length); i++) {
                const chunkA = chunksA[i] || '';
                const chunkB = chunksB[i] || '';
                const numA = parseInt(chunkA, 10);
                const numB = parseInt(chunkB, 10);
                if (!isNaN(numA) && !isNaN(numB)) {
                    if (numA !== numB) return numA - numB;
                } else {
                    const comparison = chunkA.localeCompare(chunkB);
                    if (comparison !== 0) return comparison;
                }
            }
            return 0;
        }

        // ==================== 偏好 ====================

        function applySortType(type) {
            if (typeof type !== 'string') return;
            const base = type.endsWith('-pure') ? type.slice(0, -5) : type;
            if (SORTS_WITH_FAV.includes(base)) {
                sortBase = base;
                favFirst = base === type;
            } else if (SORTS_PURE_ONLY.includes(type)) {
                sortBase = type;
            }
            // 'audio-first'（发音全部改用有道后没有意义）和不认识的值都回到默认的「新→旧 + 收藏置顶」
        }

        function sortType() {
            if (SORTS_PURE_ONLY.includes(sortBase)) return sortBase;
            return favFirst ? sortBase : sortBase + '-pure';
        }

        function loadPrefs() {
            let prefs = {};
            try { prefs = JSON.parse(localStorage.getItem(PREFS_KEY) || '{}') || {}; } catch (error) { prefs = {}; }
            if (CAT_NAME[prefs.category]) currentCategory = prefs.category;
            if (typeof prefs.subcategory === 'string') currentSubcategory = prefs.subcategory;
            applySortType(prefs.sortType);
            if (prefs.subcategorySortOrder && typeof prefs.subcategorySortOrder === 'object') subcategorySortOrder = prefs.subcategorySortOrder;
            if (typeof prefs.meaningsVisible === 'boolean') meaningsVisible = prefs.meaningsVisible;
        }

        function savePrefs() {
            try {
                localStorage.setItem(PREFS_KEY, JSON.stringify({
                    category: currentCategory,
                    subcategory: currentSubcategory,
                    sortType: sortType(),
                    subcategorySortOrder: subcategorySortOrder,
                    meaningsVisible: meaningsVisible
                }));
            } catch (error) { /* 无痕模式等存不了就算了 */ }
        }

        // ==================== 数据 ====================

        function catData(category) {
            const categories = (vocab && vocab.categories) || {};
            return categories[category] || { subcategories: {} };
        }

        function subEntries(category) {
            const order = subcategorySortOrder[category] === 'desc' ? -1 : 1;
            return Object.entries(catData(category).subcategories || {})
                .sort((a, b) => order * naturalSort(a[1].name || '', b[1].name || ''));
        }

        function defaultSub(category) {
            const entries = subEntries(category);
            return entries.length ? entries[0][0] : null;
        }

        function currentSub() {
            return (catData(currentCategory).subcategories || {})[currentSubcategory] || null;
        }

        function ensureCurrentSub() {
            if (!currentSub()) currentSubcategory = defaultSub(currentCategory);
        }

        function countWords(category) {
            return Object.values(catData(category).subcategories || {}).reduce((n, s) => n + s.words.length, 0);
        }

        function findWord(id) {
            for (const c of CATS) {
                const subs = catData(c.key).subcategories || {};
                for (const subId of Object.keys(subs)) {
                    const list = subs[subId].words;
                    const index = list.findIndex(w => w.id === id);
                    if (index !== -1) return { word: list[index], list: list, index: index, category: c.key, subId: subId };
                }
            }
            return null;
        }

        // 某个范围里的单词（导出、挑战共用）：子分类按目录栏顺序，子分类内保持存储顺序
        function scopeItems(scope, category, subId) {
            const items = [];
            const categories = scope === 'all' ? CATS.map(c => c.key) : [category];
            categories.forEach(cat => {
                subEntries(cat).forEach(([id, sub]) => {
                    if (scope === 'subcategory' && id !== subId) return;
                    sub.words.forEach(w => items.push({ word: w, category: cat, subName: sub.name }));
                });
            });
            return items;
        }

        function scopeLabel(scope, category, subId) {
            if (scope === 'all') return '全部单词';
            if (scope === 'category') return CAT_NAME[category] || category;
            const sub = (catData(category).subcategories || {})[subId];
            return sub ? sub.name : '';
        }

        async function loadVocabulary() {
            try {
                const result = await api('/api/vocabulary');
                vocab = result.data || { categories: {} };
                ensureCurrentSub();
                els.status.hidden = true;
                els.content.hidden = false;
                // 手机上吸顶条、底部操作条和页头 ⋯ 等数据到了才出现（加载中 / 出错时不显示空的下拉和点不动的按钮）
                document.body.classList.add('vb-ready');
                render();
            } catch (error) {
                if (vocab) {
                    toast('单词本没刷新出来：' + error.message, 'error');
                    return;
                }
                els.content.hidden = true;
                els.status.hidden = false;
                els.status.textContent = '单词本没加载出来：' + error.message;
                const retry = document.createElement('button');
                retry.type = 'button';
                retry.className = 'ui-btn ui-btn--md';
                retry.textContent = '重新加载';
                retry.addEventListener('click', () => { els.status.textContent = '正在加载单词本…'; loadVocabulary(); });
                els.status.appendChild(document.createElement('br'));
                els.status.appendChild(retry);
            }
        }

        async function loadCoverage() {
            try {
                const result = await api('/api/vocabulary/challenge/coverage', { headers: userHeaders() });
                coverage = result.data || {};
            } catch (error) {
                coverage = {};
            }
        }

        // ==================== 渲染 ====================

        function render() {
            if (!vocab) return;
            ensureCurrentSub();
            const total = CATS.reduce((n, c) => n + countWords(c.key), 0);
            els.total.textContent = '共 ' + total + ' 词';
            renderRail();
            renderMain();
        }

        function renderRail() {
            els.cats.innerHTML = CATS.map(c => {
                const on = c.key === currentCategory;
                return '<button type="button" class="ui-rail__item' + (on ? ' is-active' : '') + '" data-cat="' + c.key + '"' + (on ? ' aria-current="true"' : '') + '>' +
                    '<span class="ui-rail__name">' + c.name + '</span><span class="ui-rail__count ui-num">' + countWords(c.key) + '</span></button>';
            }).join('');

            els.subs.innerHTML = subEntries(currentCategory).map(([id, sub]) => {
                const on = id === currentSubcategory;
                return '<button type="button" class="ui-rail__item' + (on ? ' is-active' : '') + '" data-sub="' + esc(id) + '"' + (on ? ' aria-current="true"' : '') + '>' +
                    '<span class="ui-rail__name">' + esc(sub.name) + '</span><span class="ui-rail__count ui-num">' + sub.words.length + '</span></button>';
            }).join('');

            const desc = subcategorySortOrder[currentCategory] === 'desc';
            els.subSort.innerHTML = (desc ? 'Z–A ' : 'A–Z ') + ICON_SORT;
            els.subSort.setAttribute('aria-label', '子分类按名称排序，现在是 ' + (desc ? 'Z 到 A' : 'A 到 Z') + '，点一下反过来');
            els.subSort.title = desc ? '现在 Z→A，点一下改成 A→Z' : '现在 A→Z，点一下改成 Z→A';

            const sub = currentSub();
            els.subToggleName.textContent = sub ? sub.name : '没有子分类';
            els.subToggleCount.textContent = sub ? sub.words.length + ' 词' : '';
            els.subToggle.setAttribute('aria-label', sub
                ? '子分类：' + sub.name + '，' + sub.words.length + ' 个单词。点一下换子分类或管理子分类'
                : '这个分类还没有子分类，点一下新建');
            if (!subsDlg.back.hidden) renderSubsSheet();
        }

        // 手机底部操作条和排序按钮的状态
        function renderPhoneBar() {
            const sub = currentSub();
            els.pHide.classList.toggle('is-on', !meaningsVisible);
            els.pHide.setAttribute('aria-pressed', meaningsVisible ? 'false' : 'true');
            els.pHideLabel.textContent = meaningsVisible ? '遮释义' : '已遮住';
            els.pAdd.disabled = !sub;
            const label = (els.sort.querySelector('option[value="' + sortBase + '"]') || {}).textContent || '';
            const fav = favFirst && !SORTS_PURE_ONLY.includes(sortBase);
            els.sortBtn.setAttribute('aria-label', '排序：' + label + (fav ? '，收藏置顶' : ''));
            els.sortBtn.classList.toggle('is-on', sortBase !== 'newest' || !favFirst);
        }

        function renderMain() {
            const sub = currentSub();
            const words = sub ? sub.words : [];
            const favCount = words.filter(w => w.is_favorited).length;
            els.subName.textContent = sub ? sub.name : '没有子分类';
            els.subStat.textContent = words.length + ' 词' + (favCount ? ' · 收藏 ' + favCount : '');
            els.renameBtn.disabled = !sub;
            els.deleteSubBtn.disabled = !sub;
            els.word.disabled = !sub;
            els.meaning.disabled = !sub;
            els.addBtn.disabled = !sub;
            updateAddHint();

            const isEmpty = words.length === 0;
            els.empty.hidden = !isEmpty;
            els.list.hidden = isEmpty;
            els.emptyTitle.textContent = sub ? '「' + sub.name + '」还没有单词' : '这个分类还没有子分类';
            // 手机的空状态：加词在底部面板里，不是「上面」
            els.emptyPhoneText.textContent = sub ? '点「加词」一个个加，也可以从 CSV 文件批量导入。' : '先新建一个子分类，再往里面加词。';
            els.emptyAdd.textContent = sub ? '加词' : '新建子分类';
            els.emptyImport.hidden = !sub && isPhone();
            els.addTitle.textContent = sub ? '加到「' + sub.name + '」' : '加词';
            renderPhoneBar();
            if (!isEmpty) {
                renderToolbar();
                renderGrid();
            }
        }

        function renderToolbar() {
            els.sort.value = sortBase;
            const pureOnly = SORTS_PURE_ONLY.includes(sortBase);
            els.favFirst.disabled = pureOnly;
            els.favFirst.classList.toggle('is-on', favFirst && !pureOnly);
            els.favFirst.setAttribute('aria-pressed', favFirst && !pureOnly ? 'true' : 'false');
            els.favFirst.title = pureOnly ? '按长度和随机排序时不分收藏' : (favFirst ? '收藏的单词排在前面' : '收藏的单词不单独排前面');
            els.hide.classList.toggle('is-on', !meaningsVisible);
            els.hide.setAttribute('aria-pressed', meaningsVisible ? 'false' : 'true');
            els.hideLabel.textContent = meaningsVisible ? '隐藏释义' : '释义已隐藏';
            renderPhoneBar();
        }

        function randomKey(id) {
            if (!randomKeys.has(id)) randomKeys.set(id, Math.random());
            return randomKeys.get(id);
        }

        const BASE_COMPARE = {
            'newest': (a, b) => new Date(b.created_at) - new Date(a.created_at),
            'oldest': (a, b) => new Date(a.created_at) - new Date(b.created_at),
            'alphabetical': (a, b) => a.word.toLowerCase().localeCompare(b.word.toLowerCase()),
            'reverse-alphabetical': (a, b) => b.word.toLowerCase().localeCompare(a.word.toLowerCase()),
            'length-asc': (a, b) => a.word.length - b.word.length,
            'length-desc': (a, b) => b.word.length - a.word.length,
            'random': (a, b) => randomKey(a.id) - randomKey(b.id)
        };

        function sortedWords(words) {
            const compare = BASE_COMPARE[sortBase] || BASE_COMPARE.newest;
            const favorites = favFirst && !SORTS_PURE_ONLY.includes(sortBase);
            return words.slice().sort((a, b) => {
                if (favorites) {
                    const f = (b.is_favorited ? 1 : 0) - (a.is_favorited ? 1 : 0);
                    if (f !== 0) return f;
                }
                return compare(a, b);
            });
        }

        function cardHtml(w) {
            const meaning = (w.meaning || '').trim();
            const fav = !!w.is_favorited;
            return '<article class="vb-card' + (playing && playing.id === w.id ? ' is-playing' : '') + '" data-id="' + esc(w.id) + '">' +
                '<button type="button" class="vb-word" data-act="play" aria-label="播放 ' + esc(w.word) + ' 的发音">' + esc(w.word) + ICON_SPEAKER + '</button>' +
                '<p class="vb-meaning' + (meaning ? '' : ' is-empty') + (meaningsVisible ? '' : ' is-masked') + '" data-act="peek"><span>' + esc(meaning || '暂无释义') + '</span></p>' +
                '<div class="vb-card__foot"><span class="vb-date">' + esc(shortDate(w.created_at)) + '</span><span class="vb-acts">' +
                // 手机上没有悬停：删除等不常用的操作收进右上角的 ⋯（桌面不显示）
                '<button type="button" class="vb-act vb-act--more" data-act="more" aria-haspopup="dialog" aria-label="更多操作：' + esc(w.word) + '">' + ICON_MORE + '</button>' +
                '<button type="button" class="vb-act vb-act--edit" data-act="edit" aria-haspopup="dialog" aria-label="编辑 ' + esc(w.word) + '" title="编辑">' + ICON_EDIT_SM + '</button>' +
                '<button type="button" class="vb-act vb-act--del" data-act="delete" aria-label="删除 ' + esc(w.word) + '" title="删除">' + ICON_TRASH + '</button>' +
                '<button type="button" class="vb-act vb-act--fav' + (fav ? ' is-on' : '') + '" data-act="fav" aria-pressed="' + fav + '" aria-label="' + (fav ? '取消收藏 ' : '收藏 ') + esc(w.word) + '" title="' + (fav ? '取消收藏' : '收藏') + '">' + (fav ? ICON_STAR_ON : ICON_STAR_OFF) + '</button>' +
                '</span></div></article>';
        }

        function renderGrid() {
            const sub = currentSub();
            let words = sortedWords(sub ? sub.words : []);
            const query = searchText.toLowerCase();
            if (query) {
                words = words.filter(w => w.word.toLowerCase().includes(query) || (w.meaning || '').toLowerCase().includes(query));
                els.countLine.hidden = false;
                els.countLine.textContent = words.length ? '找到 ' + words.length + ' 个' : '这个子分类里没有包含「' + searchText + '」的单词';
            } else {
                els.countLine.hidden = true;
            }
            els.grid.innerHTML = words.map(cardHtml).join('');
        }

        // 重新渲染后把焦点还给同一张卡上的同一个按钮
        function refocus(id, selector) {
            const card = els.grid.querySelector('[data-id="' + CSS.escape(id) + '"]');
            const target = card && card.querySelector(selector);
            if (target) target.focus({ preventScroll: true });
        }

        let addNote = null;   // 手机加词面板里最近一次的结果：{ text, ok }，开始输入下一个词就换回普通提示

        function updateAddHint() {
            const sub = currentSub();
            const typed = els.word.value.trim();
            const dup = !!(typed && sub && sub.words.some(w => w.word.toLowerCase() === typed.toLowerCase()));
            const phone = isPhone();
            if (typed || !phone) addNote = null;
            els.addHint.classList.toggle('is-warn', dup || !!(addNote && !addNote.ok));
            els.addHint.classList.toggle('is-ok', !dup && !!(addNote && addNote.ok));
            if (dup) {
                els.addHint.textContent = '「' + typed + '」已经在这个子分类里了，不能重复添加';
            } else if (addNote) {
                els.addHint.textContent = addNote.text;
            } else if (sub) {
                els.addHint.textContent = phone ? '释义可以先不填，加完点单词就能听发音' : '回车添加到「' + sub.name + '」，加完点单词就能听有道发音';
            } else {
                els.addHint.textContent = phone ? '先新建一个子分类，再往里面加词' : '先在左边新建一个子分类，再往里面加词';
            }
        }

        // ==================== 发音（有道词典，点的时候实时取） ====================

        const audio = new Audio();
        audio.preload = 'auto';
        let playing = null;   // { id, word, sources, index, quiet }

        function markPlaying(id, on) {
            const card = els.grid.querySelector('[data-id="' + CSS.escape(id) + '"]');
            if (card) card.classList.toggle('is-playing', on);
        }

        function stopPlayback() {
            if (!playing) return;
            const done = playing;
            playing = null;
            markPlaying(done.id, false);
            audio.pause();
        }

        function playWord(word, options) {
            const opts = options || {};
            stopPlayback();
            const text = String(word.word || '').trim().replace(/\s+/g, ' ');
            if (!text) return;
            const sources = ['https://dict.youdao.com/dictvoice?audio=' + encodeURIComponent(text) + '&type=2'];
            // 有道没有的词（拼错的、生造的）退回以前用 TTS 生成过的音频
            if (word.audio_generated) sources.push('/vocabulary_audio/' + encodeURIComponent(word.id));
            playing = { id: word.id, word: text, sources: sources, index: 0, quiet: !!opts.quiet };
            markPlaying(word.id, true);
            nextSource();
        }

        function nextSource() {
            const current = playing;
            if (!current) return;
            if (current.index >= current.sources.length) {
                playing = null;
                markPlaying(current.id, false);
                if (!current.quiet) toast('没取到「' + current.word + '」的发音，有道词典里可能没有这个词', 'error');
                return;
            }
            audio.src = current.sources[current.index++];
            const promise = audio.play();
            if (promise && promise.catch) {
                promise.catch(error => {
                    // 加载失败由 error 事件换下一个来源；浏览器不让自动播放时就安静地停下
                    if (playing === current && error && error.name === 'NotAllowedError') {
                        playing = null;
                        markPlaying(current.id, false);
                    }
                });
            }
        }

        audio.addEventListener('error', () => { if (playing) nextSource(); });
        audio.addEventListener('ended', () => {
            if (!playing) return;
            const done = playing;
            playing = null;
            markPlaying(done.id, false);
        });

        // iOS / iPad 的 Safari 只让「在手指点的那一下里调用过 play()」的音频元素以后自己播放。
        // 挑战里「看单词选释义」是在定时器里自动读的，所以点「开始挑战」时，如果这个 audio 还没被点过，
        // 先在这一下里静音播一小段把它解锁（整页只有这一个 audio，解锁一次以后都能自动读）
        const SILENT_WAV = 'data:audio/wav;base64,UklGRkQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YSAAAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgA==';
        let audioUnlocked = false;

        function unlockAudio() {
            if (audioUnlocked || playing) return;
            audioUnlocked = true;
            try {
                audio.src = SILENT_WAV;
                const promise = audio.play();
                if (promise && promise.catch) promise.catch(() => {});
            } catch (error) { /* 解锁不了就算了，再听一遍按钮照样能播 */ }
        }

        // ==================== 弹窗 ====================

        const dialogStack = [];   // { back, onCancel, returnFocus }

        function topDialog() { return dialogStack[dialogStack.length - 1] || null; }

        // 手机加词面板就是页面里那个表单的外层，不能用 hidden 藏（桌面上它一直显示），用 is-open 开关
        function setLayerShown(back, on) {
            if (back === els.addSheet) {
                back.classList.toggle('is-open', on);
                if (!on) back.style.zIndex = '';
            } else {
                back.hidden = !on;
            }
        }

        function openDialog(back, options) {
            const opts = options || {};
            if (dialogStack.some(d => d.back === back)) return;
            setLayerShown(back, true);
            back.style.zIndex = String(1300 + dialogStack.length * 2);
            dialogStack.push({ back: back, onCancel: opts.onCancel || null, returnFocus: opts.returnFocus || document.activeElement });
            document.documentElement.classList.add('vb-lock');
            const target = opts.focus || back.querySelector('input:not([type=hidden]):not([type=file]):not([disabled]), select, .ui-btn--primary');
            if (target) target.focus({ preventScroll: true });
            layersChanged();
        }

        function closeDialog(back) {
            const index = dialogStack.findIndex(d => d.back === back);
            if (index === -1) return;
            const entry = dialogStack.splice(index, 1)[0];
            setLayerShown(back, false);
            if (!dialogStack.length) document.documentElement.classList.remove('vb-lock');
            const focus = entry.returnFocus;
            if (focus && focus.focus && document.contains(focus) && focus.getClientRects().length) focus.focus({ preventScroll: true });
            layersChanged();
        }

        // 手机上的返回（iOS 边缘右滑 / 安卓返回键）先关最上面那层面板，而不是离开单词本：
        // 有面板开着时历史里多压一条记录；用户按返回就关掉最上面一层（还有别的层开着就再压一条），
        // 用界面上的按钮关掉最后一层时，自己把那条记录退掉。开关在同一轮里连着发生（关一个开另一个）只算一次
        let histEntry = false;   // 历史里是不是压着我们的那条
        let histIgnore = 0;      // 自己 history.back() 引起的 popstate 要跳过几次
        let histTimer = null;

        function layersChanged() {
            clearTimeout(histTimer);
            histTimer = setTimeout(() => {
                if (dialogStack.length && !histEntry) {
                    if (!isPhone()) return;
                    // 退回这条记录时浏览器默认会把页面滚回压记录那一刻的位置（面板里换了子分类、删了词以后就跳错地方），
                    // 所以压之前先改成不自动恢复滚动，退回来以后再改回去（刷新页面时照样记得滚到哪）
                    history.scrollRestoration = 'manual';
                    history.pushState({ vbLayer: true }, '');
                    histEntry = true;
                } else if (!dialogStack.length && histEntry) {
                    histEntry = false;
                    histIgnore++;
                    history.back();
                }
            }, 0);
        }

        window.addEventListener('popstate', () => {
            setTimeout(() => { if (!histEntry) history.scrollRestoration = 'auto'; }, 0);
            if (histIgnore) { histIgnore--; return; }
            if (!histEntry) return;
            histEntry = false;
            const top = topDialog();
            if (top) cancelDialog(top.back);
            layersChanged();
        });

        function cancelDialog(back) {
            const entry = dialogStack.find(d => d.back === back);
            if (!entry) return;
            if (entry.onCancel) entry.onCancel(); else closeDialog(back);
        }

        document.querySelectorAll('.ui-dialog-backdrop').forEach(back => {
            let downOnBackdrop = false;
            back.addEventListener('mousedown', e => { downOnBackdrop = e.target === back; });
            back.addEventListener('click', e => {
                // 只在遮罩上按下又松开才算点遮罩，在输入框里拖选文字拖到外面不会误关
                if (e.target === back && downOnBackdrop && topDialog() && topDialog().back === back) cancelDialog(back);
            });
            back.querySelectorAll('[data-close]').forEach(btn => btn.addEventListener('click', () => cancelDialog(back)));
        });

        function trapTab(e) {
            const top = topDialog();
            if (!top) return;
            const focusables = Array.from(top.back.querySelectorAll('button, input, select, textarea, [tabindex]:not([tabindex="-1"])'))
                .filter(el => !el.disabled && el.type !== 'file' && el.getClientRects().length);
            if (!focusables.length) return;
            const first = focusables[0];
            const last = focusables[focusables.length - 1];
            if (!top.back.contains(document.activeElement)) {
                e.preventDefault();
                first.focus();
            } else if (e.shiftKey && document.activeElement === first) {
                e.preventDefault();
                last.focus();
            } else if (!e.shiftKey && document.activeElement === last) {
                e.preventDefault();
                first.focus();
            }
        }

        const confirmEls = { back: $('dlgConfirm'), title: $('cfTitle'), text: $('cfText'), ok: $('cfOk'), cancel: $('cfCancel') };

        function confirmDialog(options) {
            return new Promise(resolve => {
                let settled = false;
                const finish = (value) => {
                    if (settled) return;
                    settled = true;
                    confirmEls.ok.onclick = null;
                    confirmEls.cancel.onclick = null;
                    closeDialog(confirmEls.back);
                    resolve(value);
                };
                confirmEls.title.textContent = options.title;
                confirmEls.text.textContent = options.text;
                confirmEls.ok.textContent = options.okText || '删除';
                confirmEls.cancel.textContent = options.cancelText || '取消';
                confirmEls.ok.onclick = () => finish(true);
                confirmEls.cancel.onclick = () => finish(false);
                openDialog(confirmEls.back, { onCancel: () => finish(false), focus: confirmEls.cancel });
            });
        }

        function fillCategorySelect(select, value) {
            select.innerHTML = CATS.map(c => '<option value="' + c.key + '">' + c.name + '</option>').join('');
            select.value = CAT_NAME[value] ? value : currentCategory;
        }

        function fillSubSelect(select, category, value) {
            const entries = subEntries(category);
            select.innerHTML = entries.map(([id, sub]) => '<option value="' + esc(id) + '">' + esc(sub.name) + '</option>').join('');
            if (entries.some(([id]) => id === value)) select.value = value;
            select.disabled = !entries.length;
        }

        function setSeg(group, value) {
            group.querySelectorAll('[data-value]').forEach(btn => {
                const on = btn.dataset.value === String(value);
                btn.classList.toggle('is-on', on);
                btn.setAttribute('aria-pressed', on ? 'true' : 'false');
            });
        }

        function setBusy(button, busy, text) {
            if (busy) {
                button.dataset.label = button.textContent;
                button.textContent = text;
                button.disabled = true;
            } else if (button.dataset.label) {
                button.textContent = button.dataset.label;
                delete button.dataset.label;
                button.disabled = false;
            }
        }

        // ==================== 目录栏 ====================

        function selectCategory(category) {
            if (!CAT_NAME[category]) return;
            currentCategory = category;
            currentSubcategory = defaultSub(category);
            resetListView();
            savePrefs();
            render();
            scrollListTop();

        function resetListView() {
            searchText = '';

        // 手机：在列表深处换了分类 / 子分类 / 查找时，回到新列表的开头（吸顶条正好贴在顶上，页头不重新露出来）
        function scrollListTop() {
            if (!isPhone() || !els.dir) return;
            const stuckTop = parseFloat(getComputedStyle(els.railCol).top) || 0;
            const target = Math.max(0, Math.round(els.dir.getBoundingClientRect().top + window.scrollY - stuckTop));
            if (window.scrollY > target) window.scrollTo(0, target);
        }

        els.cats.addEventListener('click', e => {

            if (btn) selectCategory(btn.dataset.cat);

        els.subs.addEventListener('click', e => {

        function toggleSubOrder() {

        // ==================== 手机：子分类面板 ====================

        const subsDlg = { back: $('dlgSubs'), title: $('subsTitle'), count: $('subsCount'), sort: $('subsSort'), list: $('subsList'), add: $('subsNew') };

        function renderSubsSheet() {
            const entries = subEntries(currentCategory);
            subsDlg.title.textContent = CAT_NAME[currentCategory] + ' · 子分类';
            subsDlg.count.textContent = entries.length ? entries.length + ' 个子分类' : '还没有子分类';
            const desc = subcategorySortOrder[currentCategory] === 'desc';
            subsDlg.sort.innerHTML = (desc ? 'Z–A ' : 'A–Z ') + ICON_SORT;
            subsDlg.sort.setAttribute('aria-label', '子分类按名称排序，现在是 ' + (desc ? 'Z 到 A' : 'A 到 Z') + '，点一下反过来');
            subsDlg.sort.hidden = entries.length < 2;
            subsDlg.list.innerHTML = entries.map(([id, sub]) => {

        function openSubActions(category, subId, opener) {

                items: [
                    { label: '重命名', icon: ICON_EDIT, run: () => openSubDialog('rename', category, subId) },
                    { label: '删除这个子分类', icon: ICON_TRASH, danger: true, run: () => deleteSub(category, subId) }

        // ==================== 手机：操作菜单（页头 ⋯、单词卡 ⋯、子分类 ⋯） ====================

        const actDlg = { back: $('dlgActions'), title: $('actTitle'), desc: $('actDesc'), list: $('actList'), items: [] };

        // 操作菜单里的图标统一 18px
        const icon18 = svg => svg.replace(/width="1[56]" height="1[56]"/, 'width="18" height="18"');

        function openActions(options) {
            actDlg.items = options.items;
            actDlg.title.textContent = options.title;
            actDlg.title.classList.toggle('ui-en', !!options.en);
            actDlg.desc.textContent = options.desc || '';
            actDlg.desc.hidden = !options.desc;
            actDlg.list.innerHTML = options.items.map((item, i) =>
                '<div class="vb-row"><button type="button" class="vb-actitem' + (item.danger ? ' is-danger' : '') + '" data-i="' + i + '"' + (item.disabled ? ' disabled' : '') + '>' +
                icon18(item.icon || '') + '<span>' + esc(item.label) + '</span></button></div>').join('');
            openDialog(actDlg.back, { focus: actDlg.list.querySelector('.vb-actitem:not(:disabled)'), returnFocus: options.returnFocus });
        }

        actDlg.list.addEventListener('click', e => {
            const btn = e.target.closest('[data-i]');
            if (!btn || btn.disabled) return;
            const item = actDlg.items[parseInt(btn.dataset.i, 10)];
            // 先关菜单再做事：删除确认、重命名等会接着弹出新的面板
            closeDialog(actDlg.back);
            if (item && item.run) item.run();

        function openMoreMenu() {
            if (!vocab) return;
            const sub = currentSub();
            const items = [
                { label: '导入 CSV', icon: ICON_UPLOAD, run: openImport },

                { label: '新建子分类', icon: ICON_PLUS, run: () => openSubDialog('new') }
            ];
            if (sub) {
                items.push({ label: '重命名「' + sub.name + '」', icon: ICON_EDIT, run: () => openSubDialog('rename') });
                items.push({ label: '删除「' + sub.name + '」', icon: ICON_TRASH, danger: true, run: () => deleteSub() });
            }
            openActions({ title: '更多操作', items: items, returnFocus: els.moreBtn });
        }

        function openWordActions(id, opener) {
            const hit = findWord(id);
            if (!hit) return;
            const w = hit.word;
            const fav = !!w.is_favorited;
            openActions({
                title: w.word,
                en: true,
                // 遮住释义自测时不在菜单里把释义露出来
                desc: meaningsVisible ? ((w.meaning || '').trim() || '暂无释义') : '',
                returnFocus: opener,
                items: [
                    { label: '播放发音', icon: ICON_SPEAKER_LG, run: () => { audioUnlocked = true; playWord(w); } },
                    { label: fav ? '取消收藏' : '收藏', icon: fav ? ICON_STAR_ON : ICON_STAR_OFF, run: () => toggleFavorite(id) },
                    { label: '编辑', icon: ICON_EDIT, run: () => openEditWord(id, opener) },
                    { label: '删除这个单词', icon: ICON_TRASH, danger: true, run: () => deleteWord(id) }
                ]
            });
        }

        els.moreBtn.addEventListener('click', openMoreMenu);

        // ==================== 手机：排序面板 ====================

        const sortDlg = { back: $('dlgSort'), list: $('sortList'), fav: $('sortFav'), favHint: $('sortFavHint') };

        function renderSortSheet() {
            sortDlg.list.innerHTML = Array.from(els.sort.options).map(option => {
                const on = option.value === sortBase;
                return '<div class="vb-row' + (on ? ' is-on' : '') + '"><button type="button" class="vb-row__main" role="radio" aria-checked="' + on + '" data-sort="' + option.value + '">' +
                    '<span class="vb-row__check">' + (on ? ICON_CHECK : '') + '</span><span class="vb-row__name">' + esc(option.textContent) + '</span></button></div>';
            }).join('');
            const pureOnly = SORTS_PURE_ONLY.includes(sortBase);
            sortDlg.fav.disabled = pureOnly;
            sortDlg.fav.setAttribute('aria-checked', favFirst && !pureOnly ? 'true' : 'false');
            sortDlg.favHint.textContent = pureOnly ? '按长度和随机排序时不分收藏' : '收藏的单词排在最前面';
        }

        els.sortBtn.addEventListener('click', () => {
            if (!vocab) return;
            renderSortSheet();
            openDialog(sortDlg.back, { focus: sortDlg.list.querySelector('[aria-checked="true"]'), returnFocus: els.sortBtn });
        });

        // 选一种排序就关面板；「收藏置顶」开关就地切换，不关
        sortDlg.list.addEventListener('click', e => {
            const btn = e.target.closest('[data-sort]');
            if (!btn) return;
            setSort(btn.dataset.sort);
            closeDialog(sortDlg.back);
        });

        sortDlg.fav.addEventListener('click', () => {
            if (sortDlg.fav.disabled) return;
            toggleFavFirst();
            renderSortSheet();
        });

        // ==================== 手机：查找 ====================

        function enterSearch() {
            els.rail.classList.add('is-searching');
            els.pSearch.value = searchText;
            els.pSearch.focus();
            scrollListTop();
        }

        function exitSearch() {
            els.rail.classList.remove('is-searching');
            els.pSearch.value = '';
            if (searchText) {
                searchText = '';
                els.search.value = '';
                renderGrid();
            }
        }

        els.searchBtn.addEventListener('click', enterSearch);
        els.pSearchCancel.addEventListener('click', exitSearch);
        els.pSearch.addEventListener('input', () => {
            els.search.value = els.pSearch.value;
            searchText = els.pSearch.value.trim();
            renderGrid();
            scrollListTop();
        });
        // 键盘上的「搜索」键：收起键盘，看结果
        els.pSearch.addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); els.pSearch.blur(); }
            if (e.key === 'Escape') { e.stopPropagation(); exitSearch(); els.searchBtn.focus(); }
        });

        // ==================== 子分类：新建 / 重命名 / 删除 ====================

        const subDlg = { back: $('dlgSub'), form: $('dlgSubForm'), title: $('dlgSubTitle'), label: $('dlgSubLabel'), name: $('dlgSubName'), hint: $('dlgSubHint'), ok: $('dlgSubOk'), mode: 'new' };

        // 默认是当前子分类；手机子分类面板里可以对任意一个子分类重命名
        function openSubDialog(mode, category, subId) {
            const cat = category || currentCategory;
            const id = category ? subId : currentSubcategory;
            const sub = (catData(cat).subcategories || {})[id] || null;
            if (mode === 'rename' && !sub) return;
            subDlg.mode = mode;
            subDlg.category = cat;
            subDlg.subId = id;
            subDlg.title.textContent = mode === 'new' ? '新建子分类' : '重命名子分类';
            subDlg.label.textContent = mode === 'new' ? '名称' : '新名称';
            subDlg.hint.textContent = mode === 'new'
                ? '建在「' + CAT_NAME[cat] + '」下面，名称不能和已有的子分类重复。'
                : '单词和收藏都不受影响。';
            subDlg.ok.textContent = mode === 'new' ? '新建' : '保存';
            subDlg.name.value = mode === 'new' ? '' : sub.name;
            openDialog(subDlg.back, { focus: subDlg.name });
            if (mode === 'rename') subDlg.name.select();
        }

        subDlg.form.addEventListener('submit', async e => {
            e.preventDefault();
            const name = subDlg.name.value.trim();
            if (!name) {
                toast('子分类名称不能为空', 'error');
                subDlg.name.focus();
                return;
            }
            const category = subDlg.category;
            setBusy(subDlg.ok, true, subDlg.mode === 'new' ? '新建中…' : '保存中…');
            try {
                if (subDlg.mode === 'new') {
                    const result = await api('/api/vocabulary/subcategories', jsonOptions('POST', { category: category, name: name }));
                    catData(category).subcategories[result.data.id] = { name: result.data.name, created_at: result.data.created_at, words: [] };
                    closeDialog(subDlg.back);
                    currentCategory = category;
                    selectSub(result.data.id);
                    toast('已新建「' + result.data.name + '」', 'success');
                } else {
                    const subId = subDlg.subId;
                    await api('/api/vocabulary/subcategories/' + encodeURIComponent(category) + '/' + encodeURIComponent(subId), jsonOptions('PUT', { name: name }));
                    const sub = catData(category).subcategories[subId];
                    if (sub) sub.name = name;
                    closeDialog(subDlg.back);
                    render();
                    toast('已改名为「' + name + '」', 'success');
                }
            } catch (error) {
                toast(error.message, 'error');
            } finally {
                setBusy(subDlg.ok, false);
            }
        });

        // 默认删当前子分类；手机子分类面板里可以删任意一个
        async function deleteSub(cat, id) {
            const category = cat || currentCategory;
            const subId = cat ? id : currentSubcategory;
            const sub = (catData(category).subcategories || {})[subId];
            if (!sub) return;
            const ok = await confirmDialog({
                title: '删除子分类「' + sub.name + '」？',
                text: sub.words.length
                    ? '里面的 ' + sub.words.length + ' 个单词会一起删除，删除后不能恢复。需要的话先用「导出」备份一份。'
                    : '这个子分类是空的，删除后不能恢复。',
                okText: '删除子分类'
            });
            if (!ok) return;
            try {
                await api('/api/vocabulary/subcategories/' + encodeURIComponent(category) + '/' + encodeURIComponent(subId), { method: 'DELETE' });
                delete catData(category).subcategories[subId];
                if (currentCategory === category && currentSubcategory === subId) {
                    currentSubcategory = defaultSub(category);
                    resetListView();
                }
                savePrefs();
                render();
                toast('已删除「' + sub.name + '」', 'success');
            } catch (error) {
                toast(error.message, 'error');
            }
        }

        els.subNew.addEventListener('click', () => openSubDialog('new'));
        els.renameBtn.addEventListener('click', () => openSubDialog('rename'));
        els.deleteSubBtn.addEventListener('click', () => deleteSub());

        // ==================== 加词 ====================

        els.word.addEventListener('input', updateAddHint);

        els.addForm.addEventListener('keydown', e => {
            // Ctrl / Cmd + 回车也能添加（原来的快捷键）
            if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && !e.isComposing) {
                e.preventDefault();
                if (els.addForm.requestSubmit) els.addForm.requestSubmit(); else els.addForm.dispatchEvent(new Event('submit', { cancelable: true }));
                return;
            }
            // 手机：单词框里按键盘的「下一项」跳到释义框，不直接提交（以前一回车就把没填释义的词加进去了）；
            // 释义框里按「完成」才添加。桌面上回车照旧直接添加
            if (e.key === 'Enter' && e.target === els.word && isPhone() && !e.isComposing && e.keyCode !== 229) {
                e.preventDefault();
                els.meaning.focus();
            }
        });

        const addSheetOpen = () => els.addSheet.classList.contains('is-open');

        // 手机加词面板开着时，结果写在面板里（提示条浮在面板上会挡住输入框和「添加」）
        function addFeedback(text, ok) {
            if (addSheetOpen()) {
                addNote = { text: text, ok: ok };
                updateAddHint();

                toast(text, ok ? 'success' : 'error');

        els.addForm.addEventListener('submit', async e => {
            e.preventDefault();
            const sub = currentSub();
            const word = els.word.value.trim();

            if (!sub) return;
            if (!word) {
                addFeedback('先输入单词', false);

            const subId = currentSubcategory;
            els.addBtn.disabled = true;
            try {
                const result = await api('/api/vocabulary/add', jsonOptions('POST', { category: category, subcategory_id: subId, word: word, meaning: meaning }));
                const target = catData(category).subcategories[subId];
                if (target) target.words.push(result.data);
                els.word.value = '';
                els.meaning.value = '';
                searchText = '';
                els.search.value = '';
                els.pSearch.value = '';
                els.rail.classList.remove('is-searching');
                render();
                els.word.focus();
                // 手机面板加完不关，接着加下一个
                addFeedback(addSheetOpen() ? '已添加「' + result.data.word + '」✓ 接着输入下一个' : '已添加「' + result.data.word + '」', true);
            } catch (error) {
                addFeedback(error.message, false);

                els.addBtn.disabled = !currentSub();

        // ==================== 编辑单词 ====================
        // 以前拼错一个字母只能删了重加，收藏和挑战记录跟着丢。现在原地改：id 不变，卡片就地刷新、页面不跳

        const ed = { back: $('dlgEdit'), form: $('edForm'), word: $('edWord'), meaning: $('edMeaning'), hint: $('edHint'), ok: $('edOk'), id: null, initialMeaning: '', error: '' };

        // CSV 导进来的释义可能有换行，单行输入框放不下：显示成空格；没改释义就不提交，原文原样留着
        const oneLine = s => String(s || '').replace(/\s*[\r\n]+\s*/g, ' ').trim();

        // 改成同一个子分类里别的词（不分大小写）：和加词一样不让重复
        function editDup() {
            const hit = ed.id ? findWord(ed.id) : null;
            const typed = ed.word.value.trim().toLowerCase();
            return !!(hit && typed && hit.list.some(w => w.id !== ed.id && w.word.toLowerCase() === typed));
        }

        function updateEditHint() {
            const typed = ed.word.value.trim();
            const dup = editDup();
            const warn = dup || !!ed.error;
            ed.hint.textContent = dup ? '「' + typed + '」已经在这个子分类里了，不能重复' : (ed.error || '改拼写不影响收藏和挑战记录');

            ed.word.value = hit.word.word;
            ed.meaning.value = ed.initialMeaning;
            updateEditHint();
            openDialog(ed.back, { focus: ed.word, returnFocus: opener });
            // 光标放到单词末尾，改错字不用先点一下
            try { ed.word.setSelectionRange(ed.word.value.length, ed.word.value.length); } catch (error) { /* 不支持就算了 */ }

        // ==================== 导出 ====================

        const exp = {

            formatHint: $('expFormatHint'), summary: $('expSummary'), ok: $('expOk'),
            scope: 'subcategory', format: 'csv'
        };
        const FORMAT_HINTS = {
            csv: 'CSV 用 Excel 直接打开不乱码，也能原样导回单词本。',
            txt: '每行一个单词，适合打印或贴到笔记里。',

        function exportPlan() {
            const scope = exp.scope;
            const category = exp.cat.value;
            const subId = exp.sub.value;
            const items = scopeItems(scope, category, subId);
            let name;
            if (scope === 'subcategory') {
                const sub = (catData(category).subcategories || {})[subId];
                name = category + '_' + (sub ? sub.name : '') + '_单词';
            } else if (scope === 'category') {
                name = category + '_分类_单词';

            return { items: items, filename: name + '.' + exp.format };

        function updateExport() {
            setSeg(exp.scopeSeg, exp.scope);
            setSeg(exp.formatSeg, exp.format);
            exp.where.hidden = exp.scope === 'all';

            const plan = exportPlan();
            exp.summary.innerHTML = plan.items.length
                ? '将导出 <b>' + plan.items.length + '</b> 个单词 · 文件名 ' + esc(plan.filename)

        function openExport() {

        exp.sub.addEventListener('change', updateExport);

        function csvCell(value) {
            return '"' + String(value == null ? '' : value).replace(/"/g, '""') + '"';
        }

        function buildExport(items, format, fields) {
            if (format === 'json') {
                return JSON.stringify({
                    export_time: new Date().toISOString(),
                    word_count: items.length,
                    words: items.map(item => {
                        const data = { word: item.word.word };
                        if (fields.meaning) data.meaning = item.word.meaning;
                        if (fields.category) data.category = item.category;
                        if (fields.subcategory) data.subcategory = item.subName;
                        if (fields.date) data.created_at = item.word.created_at;
                        return data;
                    })
                }, null, 2);
            }
            if (format === 'txt') {
                let content = '导出时间: ' + new Date().toLocaleString('zh-CN') + '\n';
                content += '导出单词数量: ' + items.length + '\n\n';
                items.forEach((item, index) => {
                    content += (index + 1) + '. ' + item.word.word;
                    if (fields.meaning && item.word.meaning) content += ' - ' + item.word.meaning;
                    if (fields.category) content += ' [' + (CAT_NAME[item.category] || item.category) + ']';
                    if (fields.subcategory) content += ' [' + item.subName + ']';
                    if (fields.date) content += ' (' + exportDate(item.word.created_at) + ')';
                    content += '\n';
                });
                return content;
            }
            // CSV：带 BOM（Excel 打开不乱码），双引号按 CSV 规则写成两个
            const headers = ['单词'];
            if (fields.meaning) headers.push('词义');
            if (fields.category) headers.push('分类');
            if (fields.subcategory) headers.push('子分类');
            if (fields.date) headers.push('添加日期');
            const lines = [headers.join(',')];
            items.forEach(item => {
                const row = [csvCell(item.word.word)];
                if (fields.meaning) row.push(csvCell(item.word.meaning || ''));
                if (fields.category) row.push(csvCell(CAT_NAME[item.category] || item.category));
                if (fields.subcategory) row.push(csvCell(item.subName));
                if (fields.date) row.push(csvCell(exportDate(item.word.created_at)));
                lines.push(row.join(','));
            });
            return '﻿' + lines.join('\r\n') + '\r\n';
        }

        function downloadFile(content, filename, mimeType) {
            const blob = new Blob([content], { type: mimeType });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = filename;
            link.style.display = 'none';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            setTimeout(() => URL.revokeObjectURL(url), 2000);
        }

        let lastChallenge = null;   // 上次的设置，「再来一次」原样带上

        function challengePool() {

        function updateChallenge() {

            ch.summary.classList.toggle('is-warn', pool.length < 4);
            if (!pool.length) {
                ch.summary.textContent = '这个范围还没有单词。';

        function openChallenge(settings) {

            lastChallenge = settings;
