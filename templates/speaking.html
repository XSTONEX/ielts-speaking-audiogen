<script>
(function () {
  'use strict';

  // ==================== 小工具 ====================
  var $ = function (id) { return document.getElementById(id); };
  var ICON = {
    play: '<svg width="12" height="14" viewBox="0 0 12 14" fill="currentColor" aria-hidden="true"><path d="M1 1.5v11l10-5.5z"></path></svg>',
    pause: '<svg width="12" height="14" viewBox="0 0 12 14" fill="currentColor" aria-hidden="true"><path d="M1.5 1.5h3v11h-3zM7.5 1.5h3v11h-3z"></path></svg>',
    chevron: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5"></path></svg>',
    down: '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 6 8 10.5 12.5 6"></path></svg>',
    up: '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 10 8 5.5 12.5 10"></path></svg>',
    plus: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10"></path></svg>',
    trash: '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 4h11M6 4V2.5h4V4M4 4l.7 9.5h6.6L12 4"></path></svg>',
    check: '<svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.5 6.5 12 13 4.5"></path></svg>',
    moon: '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M13.5 9.5A6 6 0 0 1 6.5 2.5a6 6 0 1 0 7 7z"></path></svg>',
    sun: '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="3.2"></circle><path d="M8 1.5v1.6M8 12.9v1.6M1.5 8h1.6M12.9 8h1.6M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M12.6 3.4l-1.1 1.1M4.5 11.5l-1.1 1.1"></path></svg>',
    // 手机菜单里用的图标
    edit: '<svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.5 2.5l3 3L6 13H3v-3z"></path></svg>',
    expand: '<svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h10M3 8h10M3 12h6"></path></svg>',
    layers: '<svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2 2 5l6 3 6-3zM2 8l6 3 6-3M2 11l6 3 6-3"></path></svg>',
    gear: '<svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 4h11M2.5 8h11M2.5 12h11"></path><circle cx="5" cy="4" r="1.3" fill="currentColor"></circle><circle cx="11" cy="8" r="1.3" fill="currentColor"></circle><circle cx="7" cy="12" r="1.3" fill="currentColor"></circle></svg>',
    plusLg: '<svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10"></path></svg>',
    trashLg: '<svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 4h11M6 4V2.5h4V4M4 4l.7 9.5h6.6L12 4"></path></svg>'
  };

  function esc(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function toast(message, type) {
    if (window.IELTSUI && window.IELTSUI.toast) window.IELTSUI.toast(message, type);
  }
  function fmtTime(seconds) {
    if (!seconds || !isFinite(seconds)) return '0:00';
    var total = Math.round(seconds);
    return Math.floor(total / 60) + ':' + String(total % 60).padStart(2, '0');
  }
  function fmtLong(seconds) {
    if (!seconds) return '0 分';
    var mins = Math.round(seconds / 60);
    if (mins < 60) return mins + ' 分';
    return Math.floor(mins / 60) + ' 小时 ' + (mins % 60) + ' 分';
  }
  function fmtAgo(epochSeconds) {
    if (!epochSeconds) return '';
    var days = Math.floor((Date.now() / 1000 - epochSeconds) / 86400);
    if (days <= 0) return '今天';
    if (days === 1) return '昨天';
    if (days < 30) return days + ' 天前';
    if (days < 365) return Math.floor(days / 30) + ' 个月前';
    return Math.floor(days / 365) + ' 年前';
  }
  function fmtDate(epochSeconds) {
    if (!epochSeconds) return '';
    var d = new Date(epochSeconds * 1000);
    return (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日';
  }
  function debounce(fn, wait) {
    var timer = null;
    return function () {
      var args = arguments, self = this;
      clearTimeout(timer);
      timer = setTimeout(function () { fn.apply(self, args); }, wait);
    };
  }
  function partOf(folder) {
    if (/^P1/.test(folder)) return 'Part1';
    if (/^P2/.test(folder)) return 'Part2';
    if (/^P3/.test(folder)) return 'Part3';
    return '其他';
  }
  var PART_BADGE = { Part1: ['p1', 'P1'], Part2: ['p2', 'P2'], Part3: ['p3', 'P3'], '其他': ['other', '其他'] };
  var PART_LABEL = { Part1: 'Part 1', Part2: 'Part 2', Part3: 'Part 3', '其他': '其他' };
  var SORT_LABEL = { recent: '最近使用', name: '按话题名', count: '音频最多' };
  // 超过这个字数的原文在手机上不在列表里展开，改用全屏阅读
  var LONG_TEXT = 600;
  function badge(part, long) {
    var info = PART_BADGE[part] || PART_BADGE['其他'];
    var text = long && part !== '其他' ? part.toUpperCase().replace('PART', 'PART ') : info[1];
    return '<span class="sp-badge sp-badge--' + info[0] + '">' + esc(text) + '</span>';
  }
  // 手机 / 桌面的分界和 CSS 一致；跨过分界时整页按另一套重画（见文件末尾的 change 监听）
  var PHONE = window.IELTSPhone.mq; // 窄屏或横着拿的手机，见 static/theme.js
  function isMobile() { return PHONE.matches; }

  // ==================== 状态 ====================
  var state = {
    topics: [],
    view: 'library',
    topicKey: null,
    query: '',
    partFilter: 'all',
    sort: 'recent',
    manage: false,
    expanded: null,
    textCache: {},
    queue: [],
    composerOpen: false,
    suggestOpen: false,
    busy: false,
    player: { folder: null, file: null, list: [], index: -1, rate: 1, playing: false },
    // 下面是手机专用的状态
    openClips: {},      // 同时展开的几条（桌面仍然一次只展开一条，用 expanded）
    autoOpenKey: null,  // 连播时自动展开的那一条，换到下一条时收回去
    cueOpen: false,     // Part 2 题卡是否展开
    fpOpen: false,      // 完整播放器
    readerKey: null,    // 正在全屏阅读的那一条
    hits: null,         // 最近一次原文搜索的结果，播放状态变了要重画
    listError: false
  };

  var audio = $('audioEl');

  function topicByKey(key) {
    for (var i = 0; i < state.topics.length; i++) {
      if (state.topics[i].folder === key) return state.topics[i];
    }
    return null;
  }
  function fileInfo(folder, name) {
    var topic = topicByKey(folder);
    if (!topic) return null;
    for (var i = 0; i < topic.files.length; i++) {
      if (topic.files[i].name === name) return topic.files[i];
    }
    return null;
  }
  function asksQuestion(topic) { return !!topic && (topic.part === 'Part1' || topic.part === 'Part3'); }
  // 一条音频叫什么：Part 1 / 3 用它的问题，其余用答案开头
  function clipTitle(topic, file) {
    if (!file) return '';
    if (asksQuestion(topic) && file.question) return file.question;
    return file.preview || file.question || file.name;
  }
  // 话题卡片 / 删除确认里用的一句话：问题，或者答案的前 8 个词
  function clipLabel(topic, file) {
    if (!file) return '';
    if (asksQuestion(topic) && file.question) return file.question;
    var words = String(file.preview || file.question || file.name).split(/\s+/);
    return words.slice(0, 8).join(' ') + (words.length > 8 ? '…' : '');
  }
  // Part 1 / 3 的原文首行就是问题；手机上问题已经单独显示，展开的全文里不再重复
  function answerOnly(text, question) {
    if (!question) return text;
    var lines = String(text).split('\n');
    if (lines[0].trim() !== question.trim()) return text;
    return lines.slice(1).join('\n').replace(/^\s+/, '');
  }
  function isTopicPlaying(folder) { return state.player.folder === folder && state.player.playing; }
  function isClipPlaying(folder, file) {
    return state.player.folder === folder && state.player.file === file && state.player.playing;
  }
  // 把命中的词包成 <mark>（先转义再包，大小写不敏感）
  function highlight(text, query) {
    var safe = esc(text);
    var q = esc(query.trim());
    if (!q) return safe;
    var lower = safe.toLowerCase(), needle = q.toLowerCase(), out = '', from = 0, at;
    while ((at = lower.indexOf(needle, from)) >= 0) {
      out += safe.slice(from, at) + '<mark>' + safe.slice(at, at + q.length) + '</mark>';
      from = at + q.length;
    }
    return out + safe.slice(from);
  }

  // ==================== 数据 ====================
  function loadTopics() {
    return fetch('/list_audio').then(function (r) { return r.json(); }).then(function (data) {
      var topics = [];
      ['Part1', 'Part2', 'Part3', '其他'].forEach(function (part) {
        (data[part] || []).forEach(function (item) {
          topics.push({
            folder: item.folder,
            part: part,
            question: item.question || null,
            files: item.files || [],
            duration: item.duration || 0,
            latest: item.latest || item.ctime || 0,
            ctime: item.ctime || 0
          });
        });
      });
      state.topics = topics;
      return topics;
    });
  }

  // ==================== 渲染：音频库 ====================
  function visibleTopics() {
    var query = state.query.trim().toLowerCase();
    var list = state.topics.filter(function (t) {
      if (state.partFilter !== 'all' && t.part !== state.partFilter) return false;
      if (!query) return true;
      return t.folder.toLowerCase().indexOf(query) >= 0 ||
             (t.question || '').toLowerCase().indexOf(query) >= 0;
    });
    if (state.sort === 'name') {
      list.sort(function (a, b) { return a.folder.localeCompare(b.folder, 'zh'); });
    } else if (state.sort === 'count') {
      list.sort(function (a, b) { return b.files.length - a.files.length; });
    } else {
      list.sort(function (a, b) { return b.latest - a.latest; });
    }
    return list;
  }

  function renderStats() {
    var clips = 0, seconds = 0;
    state.topics.forEach(function (t) { clips += t.files.length; seconds += t.duration; });
    $('libStats').textContent = state.topics.length + ' 个话题 · ' + clips + ' 条音频 · 共 ' + fmtLong(seconds);
  }

  function renderChips() {
    var counts = { all: state.topics.length, Part1: 0, Part2: 0, Part3: 0, '其他': 0 };
    state.topics.forEach(function (t) { counts[t.part] += 1; });
    var defs = [['all', '全部'], ['Part1', 'Part 1'], ['Part2', 'Part 2'], ['Part3', 'Part 3'], ['其他', '其他']];
    var html = defs.map(function (d) {
      return '<button type="button" class="sp-chip' + (state.partFilter === d[0] ? ' is-active' : '') +
        '" data-action="filter" data-part="' + esc(d[0]) + '">' + esc(d[1]) + ' · ' + counts[d[0]] + '</button>';
    }).join('');
    if (!isMobile()) { $('partChips').innerHTML = html; return; }
    // 手机：外层吸顶不滚，里层横向滚；重画时保住横向滚动位置，右边没滚到头时有渐隐提示
    var old = $('chipTrack');
    var left = old ? old.scrollLeft : 0;
    $('partChips').innerHTML = '<div class="sp-chips__track" id="chipTrack">' + html + '</div>';
    var track = $('chipTrack');
    track.scrollLeft = left;
    track.addEventListener('scroll', updateChipFade, { passive: true });
    updateChipFade();
  }
  function updateChipFade() {
    var track = $('chipTrack');
    if (track) track.classList.toggle('is-end', track.scrollLeft + track.clientWidth >= track.scrollWidth - 2);
  }

  function renderRecent() {
    var searching = !!state.query.trim();
    var section = $('recentSection');
    if (searching) { section.hidden = true; return; }
    if (isMobile()) { renderRecentPhone(section); return; }
    var recent = state.topics.slice().sort(function (a, b) { return b.latest - a.latest; }).slice(0, 3);
    if (!recent.length) { section.hidden = true; return; }
    section.hidden = false;
    $('recentGrid').innerHTML = recent.map(function (t) {
      var playing = isTopicPlaying(t.folder);
      return '<div class="sp-card sp-recent" data-action="open-topic" data-folder="' + esc(t.folder) + '" role="button" tabindex="0">' +
        '<div class="sp-row">' + badge(t.part, true) + '<span class="sp-grow"></span>' +
        '<span class="sp-hint">' + esc(fmtAgo(t.latest)) + '</span></div>' +
        '<div class="sp-recent__name sp-truncate">' + esc(displayName(t)) + '</div>' +
        '<div class="sp-row"><span class="sp-hint sp-num">' + t.files.length + ' 条 · ' + fmtTime(t.duration) + '</span>' +
        '<span class="sp-grow"></span>' +
        '<button type="button" class="sp-btn sp-btn--sm" data-action="play-topic" data-folder="' + esc(t.folder) + '">' +
        (playing ? ICON.pause + ' 暂停' : ICON.play + ' 连播') + '</button></div>' +
        '</div>';
    }).join('');
  }

  // 手机：两列小卡片，最多 4 个；选了某个 Part 时整块收起，把屏幕让给筛出来的列表
  function renderRecentPhone(section) {
    if (state.partFilter !== 'all') { section.hidden = true; return; }
    var recent = state.topics.slice().sort(function (a, b) { return b.latest - a.latest; }).slice(0, 4);
    if (!recent.length) { section.hidden = true; return; }
    section.hidden = false;
    $('recentGrid').innerHTML = recent.map(function (t) {
      return '<div class="sp-rchip">' +
        '<button type="button" class="sp-rchip__open" data-action="open-topic" data-folder="' + esc(t.folder) + '">' +
        '<span class="sp-rchip__name">' + esc(displayName(t)) + '</span>' +
        '<span class="sp-rchip__meta">' + esc(PART_BADGE[t.part][1] + ' · ' + fmtAgo(t.latest)) + '</span></button>' +
        topicPlayButton('sp-rchip__play', t) + '</div>';
    }).join('');
  }

  function topicPlayButton(cls, t) {
    var playing = isTopicPlaying(t.folder);
    return '<button type="button" class="' + cls + (playing ? ' is-playing' : '') + '" data-action="play-topic" data-folder="' +
      esc(t.folder) + '" aria-label="' + (playing ? '暂停 ' : '连播 ') + esc(displayName(t)) + '">' +
      (playing ? ICON.pause : ICON.play) + '</button>';
  }

  function displayName(topic) {
    return topic.folder.replace(/^P[123]\s*-\s*/, '').trim() || topic.folder;
  }

  function renderTopicList() {
    if (isMobile()) { renderTopicListPhone(); return; }
    $('topicList').parentNode.hidden = false;
    var list = visibleTopics();
    $('topicsLabel').textContent = state.query.trim() ? '话题名命中' : '全部话题';
    $('topicsCount').textContent = list.length + ' 个话题';
    if (!list.length) {
      $('topicList').innerHTML = '<div class="sp-empty">' +
        (state.query.trim() ? '没有话题名匹配「' + esc(state.query.trim()) + '」' : '还没有音频，先在上面生成一条吧') + '</div>';
      return;
    }
    $('topicList').innerHTML = list.map(function (t) {
      var sub = t.part === 'Part2' && t.question
        ? t.question
        : t.files.length + ' 条音频 · 最早 ' + fmtDate(t.ctime);
      var playing = isTopicPlaying(t.folder);
      return '<button type="button" class="sp-list__row" data-action="open-topic" data-folder="' + esc(t.folder) + '">' +
        '<span class="sp-badge sp-badge--' + PART_BADGE[t.part][0] + '" style="width:54px;">' + esc(PART_BADGE[t.part][1]) + '</span>' +
        '<span class="sp-grow"><span class="sp-list__name sp-truncate" style="display:block;">' + esc(displayName(t)) + '</span>' +
        '<span class="sp-list__sub sp-truncate" style="display:block;">' + esc(sub) + '</span></span>' +
        '<span class="sp-list__meta sp-num">' + t.files.length + ' 条 · ' + fmtTime(t.duration) + '</span>' +
        '<span class="sp-icon-btn" data-action="play-topic" data-folder="' + esc(t.folder) + '" role="button" tabindex="0" aria-label="' +
        (playing ? '暂停 ' : '连播 ') + esc(displayName(t)) + '">' + (playing ? ICON.pause : ICON.play) + '</span>' +
        '<span style="color:var(--sp-ink-4);display:inline-flex;">' + ICON.chevron + '</span>' +
        '</button>';
    }).join('');
  }

  // 手机：一行两张卡片。卡片本身是「打开话题」按钮，连播按钮是它旁边的兄弟元素（不嵌套，读屏能分开读）
  function renderTopicListPhone() {
    var list = visibleTopics();
    var query = state.query.trim();
    // 搜索时话题名一个都没对上、又会去搜原文（≥2 个字）：整块收起，把位置让给原文命中
    $('topicList').parentNode.hidden = !!query && query.length >= 2 && !list.length && !state.listError;
    $('topicsLabel').textContent = query ? '话题名命中'
      : (state.partFilter === 'all' ? '全部话题' : PART_LABEL[state.partFilter] + ' 话题');
    $('topicsCount').textContent = list.length + ' 个 · ' + SORT_LABEL[state.sort];
    if (state.listError) {
      $('topicList').innerHTML = '<div class="sp-state"><b>列表没加载出来</b><span>检查一下网络，再试一次</span>' +
        '<button type="button" class="sp-btn sp-btn--primary" data-action="reload-list">重试</button></div>';
      return;
    }
    if (!list.length) {
      var html;
      if (query) html = '<span>没有话题名匹配「' + esc(query) + '」</span>';
      else if (!state.topics.length) {
        html = '<b>还没有音频</b><span>粘贴一段英文，生成第一条朗读</span>' +
          '<button type="button" class="sp-btn sp-btn--primary" data-action="new-first">' + ICON.plus + ' 新建第一条</button>';
      } else html = '<span>' + esc(PART_LABEL[state.partFilter]) + ' 还没有话题</span>';
      $('topicList').innerHTML = '<div class="sp-state">' + html + '</div>';
      return;
    }
    $('topicList').innerHTML = list.map(function (t) {
      var playing = isTopicPlaying(t.folder);
      return '<div class="sp-tcard' + (playing ? ' is-playing' : '') + '">' +
        '<button type="button" class="sp-tcard__open" data-action="open-topic" data-folder="' + esc(t.folder) + '">' +
        '<span class="sp-tcard__name"><span class="sp-badge sp-badge--' + PART_BADGE[t.part][0] + '">' + esc(PART_BADGE[t.part][1]) + '</span>' +
        esc(displayName(t)) + '</span>' +
        '<span class="sp-tcard__meta sp-num">' + t.files.length + ' 条 · ' + fmtTime(t.duration) + '</span></button>' +
        topicPlayButton('sp-tcard__play', t) + '</div>';
    }).join('');
  }

  var runTextSearch = debounce(function (query) {
    if (query.length < 2) { $('hitsSection').hidden = true; return; }
    fetch('/search_audio?q=' + encodeURIComponent(query)).then(function (r) { return r.json(); }).then(function (data) {
      if (data.query !== state.query.trim()) return;
      state.hits = { query: query, results: data.results || [], truncated: data.truncated };
      renderHits();
    }).catch(function () { $('hitsSection').hidden = true; });
  }, 300);

  function renderHits() {
    var hits = state.hits;
    if (!hits || hits.query !== state.query.trim()) return;
    var results = hits.results;
    $('hitsSection').hidden = false;
    $('hitsLabel').textContent = '原文命中 · ' + results.length + (hits.truncated ? '+' : '') + ' 条';
    if (!results.length) {
      $('hitsList').innerHTML = '<div class="sp-empty">没有音频的原文包含「' + esc(hits.query) + '」</div>';
      return;
    }
    if (isMobile()) { $('hitsList').innerHTML = results.map(function (hit) { return hitRowPhone(hit, hits.query); }).join(''); return; }
    $('hitsList').innerHTML = results.map(function (hit) {
      return '<button type="button" class="sp-list__row" data-action="open-clip" data-folder="' + esc(hit.folder) +
        '" data-file="' + esc(hit.filename) + '">' +
        '<span class="sp-badge sp-badge--' + PART_BADGE[partOf(hit.folder)][0] + '" style="width:54px;">' +
        esc(PART_BADGE[partOf(hit.folder)][1]) + '</span>' +
        '<span class="sp-grow"><span class="sp-list__name sp-truncate" style="display:block;">' + esc(hit.folder) + '</span>' +
        '<span class="sp-list__sub sp-en" style="display:block;">' + esc(hit.snippet) + '</span></span>' +
        '<span style="color:var(--sp-ink-4);display:inline-flex;">' + ICON.chevron + '</span></button>';
    }).join('');
  }

  // 手机：话题名（不带「P1 -」）、这一条的问题、命中的那句（高亮），右边直接播放
  function hitRowPhone(hit, query) {
    var topic = topicByKey(hit.folder);
    var part = partOf(hit.folder);
    var file = fileInfo(hit.folder, hit.filename);
    var question = asksQuestion(topic) && file && file.question ? file.question : '';
    var playing = isClipPlaying(hit.folder, hit.filename);
    return '<div class="sp-hit">' +
      '<button type="button" class="sp-hit__open" data-action="open-clip" data-folder="' + esc(hit.folder) + '" data-file="' + esc(hit.filename) + '">' +
      '<span class="sp-hit__title"><span class="sp-badge sp-badge--' + PART_BADGE[part][0] + '">' + esc(PART_BADGE[part][1]) + '</span>' +
      '<span class="sp-truncate">' + esc(topic ? displayName(topic) : hit.folder) + '</span></span>' +
      (question ? '<span class="sp-hit__q">' + esc(question) + '</span>' : '') +
      '<span class="sp-hit__snip">' + highlight(hit.snippet, query) + '</span></button>' +
      '<button type="button" class="sp-hit__play' + (playing ? ' is-playing' : '') + '" data-action="play-clip" data-folder="' + esc(hit.folder) +
      '" data-file="' + esc(hit.filename) + '" aria-label="' + (playing ? '暂停这一条' : '播放这一条') + '">' + (playing ? ICON.pause : ICON.play) + '</button>' +
      '</div>';
  }

  function renderLibrary() {
    renderStats();
    renderChips();
    renderRecent();
    renderTopicList();
  }

  // ==================== 渲染：话题详情 ====================
  function renderTopic() {
    var topic = topicByKey(state.topicKey);
    if (!topic) { showLibrary(); return; }
    if (isMobile()) { renderTopicPhone(topic); return; }
    var current = state.player;

    $('topicHead').innerHTML =
      '<div class="sp-topic-head"><div class="sp-grow">' +
      badge(topic.part, true) +
      '<h1 class="sp-h1" style="margin-top:7px;">' + esc(displayName(topic)) + '</h1>' +
      '<p class="sp-sub sp-num">' + topic.files.length + ' 条音频 · ' + fmtTime(topic.duration) +
      ' · 最近生成 ' + esc(fmtAgo(topic.latest)) + '</p>' +
      '</div></div>';

    if (topic.part === 'Part2') {
      $('topicQuestion').innerHTML =
        '<section class="sp-question"><div class="sp-grow">' +
        '<span class="sp-question__label">题卡问题</span>' +
        '<p class="sp-question__text">' + (topic.question ? esc(topic.question) : '<span style="color:var(--sp-ink-4);">还没填</span>') + '</p>' +
        '</div><button type="button" class="sp-btn sp-btn--sm" data-action="edit-question">' +
        (topic.question ? '编辑' : '填写') + '</button></section>';
    } else {
      $('topicQuestion').innerHTML = '';
    }

    var playingHere = current.folder === topic.folder && current.playing;
    $('topicToolbar').innerHTML =
      '<button type="button" class="sp-btn sp-btn--primary" data-action="play-topic" data-folder="' + esc(topic.folder) + '">' +
      (playingHere ? ICON.pause : ICON.play) + (playingHere ? ' 暂停' : ' 连续播放 ' + topic.files.length + ' 条') + '</button>' +
      '<button type="button" class="sp-btn" data-action="add-here">' + ICON.plus + ' 添加音频到这个话题</button>' +
      '<button type="button" class="sp-btn sp-btn--ghost" data-action="toggle-manage">' + ICON.trash +
      (state.manage ? ' 退出管理' : ' 管理') + '</button>' +
      '<span class="sp-grow"></span>' +
      // 带上 #folder=，合集页会直接定位到这个话题
      '<a class="sp-hint" href="/combined#folder=' + encodeURIComponent(topic.folder) + '" style="color:var(--sp-ink-3);">合集播放页 →</a>';

    var rows = topic.files.map(function (file, index) {
      var key = topic.folder + '__' + file.name;
      var isCurrent = current.folder === topic.folder && current.file === file.name;
      var isExpanded = state.expanded === key;
      var showQuestion = (topic.part === 'Part1' || topic.part === 'Part3') && file.question;
      var html = '<div class="sp-clip' + (isCurrent ? ' is-current' : '') + '" data-clip="' + esc(key) + '">';
      if (showQuestion) {
        html += '<div class="sp-clip__q">' + esc(file.question) + '</div>';
      }
      html += '<div class="sp-clip__row">' +
        '<span class="sp-clip__index sp-num">' + String(index + 1).padStart(2, '0') + '</span>' +
        '<button type="button" class="sp-play' + (isCurrent && current.playing ? ' is-playing' : '') +
        '" data-action="play-clip" data-folder="' + esc(topic.folder) + '" data-file="' + esc(file.name) +
        '" aria-label="播放第 ' + (index + 1) + ' 条">' + (isCurrent && current.playing ? ICON.pause : ICON.play) + '</button>' +
        '<span class="sp-grow"><span class="sp-clip__title sp-truncate" style="display:block;">' +
        esc(file.preview || file.question || file.name) + '</span>' +
        '<span class="sp-clip__meta sp-num" style="display:block;">' + fmtTime(file.duration) + ' · ' + esc(fmtDate(file.ctime)) +
        (isCurrent && current.playing ? ' · 正在播放' : '') + '</span></span>';
      if (state.manage) {
        html += '<button type="button" class="sp-icon-btn sp-icon-btn--danger" data-action="delete-clip" data-folder="' +
          esc(topic.folder) + '" data-file="' + esc(file.name) + '" aria-label="删除第 ' + (index + 1) + ' 条音频">' + ICON.trash + '</button>';
      }
      html += '<button type="button" class="sp-icon-btn sp-icon-btn--plain" data-action="toggle-text" data-key="' + esc(key) +
        '" aria-label="' + (isExpanded ? '收起全文' : '展开全文') + '">' + (isExpanded ? ICON.up : ICON.down) + '</button>' +
        '</div>';
      if (isExpanded) {
        var text = state.textCache[key];
        html += '<div class="sp-clip__body">' +
          '<p class="sp-clip__text">' + (text === undefined ? '加载中…' : esc(text)) + '</p>' +
          '<div class="sp-row">' +
          '<button type="button" class="sp-btn sp-btn--sm" data-action="copy-text" data-key="' + esc(key) + '">复制原文</button>' +
          '<a class="sp-btn sp-btn--sm" href="/audio/' + encodeURIComponent(topic.folder) + '/' + encodeURIComponent(file.name) +
          '" download style="text-decoration:none;">下载 MP3</a>' +
          '</div></div>';
      }
      html += '</div>';
      return html;
    });

    $('clipList').innerHTML = rows.length ? rows.join('') : '<div class="sp-empty">这个话题下还没有音频</div>';

    if (state.manage) {
      $('clipList').insertAdjacentHTML('afterend', '');
    }
    renderTopicDangerZone(topic);
  }

  // 手机版话题页：顶栏（返回 / 标题 / ⋯）、可折叠的题卡、一条一行的音频（点中间展开全文，可同时展开多条），
  // 「连续播放 / 添加」放到底部操作条，其余操作都在 ⋯ 里
  function renderTopicPhone(topic) {
    var current = state.player;
    $('topbarTitle').textContent = displayName(topic);
    $('topicHead').innerHTML =
      '<div class="sp-topic-head"><div class="sp-grow">' + badge(topic.part, true) +
      '<h1 class="sp-h1" style="margin-top:7px;">' + esc(displayName(topic)) + '</h1>' +
      '<p class="sp-sub sp-num">' + topic.files.length + ' 条音频 · ' + fmtTime(topic.duration) +
      ' · 最近生成 ' + esc(fmtAgo(topic.latest)) + '</p></div></div>';

    if (topic.part === 'Part2') {
      if (topic.question) {
        var long = topic.question.split('\n').length > 3 || topic.question.length > 110;
        $('topicQuestion').innerHTML = '<section class="sp-question sp-cue' + (state.cueOpen ? ' is-open' : '') + '">' +
          '<span class="sp-question__label">题卡问题</span>' +
          '<p class="sp-question__text">' + esc(topic.question) + '</p>' +
          (long ? '<button type="button" class="sp-cue__toggle" data-action="toggle-cue" aria-expanded="' + state.cueOpen + '">' +
            (state.cueOpen ? '收起' : '展开全部') + '</button>' : '<span style="height:6px;"></span>') +
          '</section>';
      } else {
        $('topicQuestion').innerHTML = '<section class="sp-question sp-cue">' +
          '<span class="sp-question__label">题卡问题</span>' +
          '<p class="sp-question__text" style="color:var(--sp-ink-4);">还没填</p>' +
          '<button type="button" class="sp-cue__toggle" data-action="edit-question">填写题卡问题</button></section>';
      }
    } else {
      $('topicQuestion').innerHTML = '';
    }

    $('topicToolbar').innerHTML = state.manage
      ? '<div class="sp-managebar"><span class="sp-grow">管理中 · 点右边的垃圾桶删单条</span>' +
        '<button type="button" class="sp-btn sp-btn--sm" data-action="toggle-manage">完成</button></div>'
      : '';

    var total = topic.files.length;
    var rows = topic.files.map(function (file, index) {
      var key = topic.folder + '__' + file.name;
      var isCurrent = current.folder === topic.folder && current.file === file.name;
      var playingThis = isCurrent && current.playing;
      var open = !!state.openClips[key];
      var question = asksQuestion(topic) && file.question ? file.question : '';
      var keyAttrs = ' data-key="' + esc(key) + '" data-folder="' + esc(topic.folder) + '" data-file="' + esc(file.name) + '"';
      var html = '<div class="sp-clip sp-clip--ph' + (isCurrent ? ' is-current' : '') + (open ? ' is-open' : '') + '" data-clip="' + esc(key) + '">' +
        '<div class="sp-clip__row">' +
        '<button type="button" class="sp-play' + (playingThis ? ' is-playing' : '') + '" data-action="play-clip" data-folder="' +
        esc(topic.folder) + '" data-file="' + esc(file.name) + '" aria-label="' + (playingThis ? '暂停' : '播放') + '第 ' + (index + 1) + ' 条">' +
        (playingThis ? ICON.pause : ICON.play) + '</button>' +
        '<button type="button" class="sp-clip__main" data-action="toggle-text"' + keyAttrs + ' aria-expanded="' + open + '">' +
        (question ? '<span class="sp-clip__qtext">' + esc(question) + '</span>' : '') +
        '<span class="sp-clip__ans">' + esc(file.preview || (question ? '' : file.question) || file.name) + '</span>' +
        '<span class="sp-clip__meta sp-num">' + (index + 1) + ' / ' + total + ' · ' + fmtTime(file.duration) +
        (playingThis ? ' · 正在播放' : '') + '</span></button>' +
        (state.manage
          ? '<button type="button" class="sp-icon-btn sp-icon-btn--danger" data-action="delete-clip" data-folder="' + esc(topic.folder) +
            '" data-file="' + esc(file.name) + '" aria-label="删除第 ' + (index + 1) + ' 条音频">' + ICON.trash + '</button>'
          : '<span class="sp-clip__chev" data-action="toggle-text"' + keyAttrs + ' aria-hidden="true">' + (open ? ICON.up : ICON.down) + '</span>') +
        '</div>';
      if (open) {
        var text = state.textCache[key];
        html += '<div class="sp-clip__body">' +
          '<p class="sp-clip__text">' + (text === undefined ? '加载中…' : esc(answerOnly(text, question))) + '</p>' +
          '<div class="sp-clip__actions">' +
          '<button type="button" class="sp-btn sp-btn--sm" data-action="copy-text" data-key="' + esc(key) + '">复制原文</button>' +
          '<a class="sp-btn sp-btn--sm" href="/audio/' + encodeURIComponent(topic.folder) + '/' + encodeURIComponent(file.name) +
          '" download style="text-decoration:none;">下载 MP3</a>' +
          '<span class="sp-grow"></span>' +
          '<button type="button" class="sp-btn sp-btn--sm sp-btn--ghost" data-action="toggle-text"' + keyAttrs + '>' + ICON.up + ' 收起</button>' +
          '</div></div>';
      }
      return html + '</div>';
    });
    $('clipList').innerHTML = rows.length ? rows.join('') : '<div class="sp-empty">这个话题下还没有音频</div>';
    var danger = $('topicDanger');
    if (danger) danger.remove();
    renderActionBar();
  }

  function renderTopicDangerZone(topic) {
    var existing = $('topicDanger');
    if (existing) existing.remove();
    if (!state.manage) return;
    var box = document.createElement('div');
    box.id = 'topicDanger';
    box.style.marginTop = '14px';
    box.innerHTML = '<button type="button" class="sp-btn sp-btn--danger" style="width:100%;" data-action="delete-folder">' +
      ICON.trash + ' 删除整个话题（' + topic.files.length + ' 条音频）</button>';
    $('viewTopic').appendChild(box);
  }

  // 手机话题页的底部操作条：没在放音频时「连续播放 + 添加」；管理时「删除整个话题 + 完成」（在迷你播放条上面）
  function renderActionBar() {
    var bar = $('topicActions');
    var topic = state.view === 'topic' ? topicByKey(state.topicKey) : null;
    var show = isMobile() && !!topic && (state.manage || !state.player.file);
    bar.hidden = !show;
    if (show) {
      bar.innerHTML = state.manage
        ? '<button type="button" class="sp-btn sp-btn--danger" data-action="delete-folder">' + ICON.trash +
          ' 删除整个话题（' + topic.files.length + ' 条）</button>' +
          '<button type="button" class="sp-btn" data-action="toggle-manage">完成</button>'
        : '<button type="button" class="sp-btn sp-btn--primary" data-action="play-topic" data-folder="' + esc(topic.folder) + '">' +
          ICON.play + ' 连续播放 ' + topic.files.length + ' 条</button>' +
          '<button type="button" class="sp-btn" data-action="add-here">' + ICON.plus + ' 添加</button>';
    }
    updateBottomStack();
  }

  // ==================== 手机：底部一摞的高度 ====================
  // 迷你播放条、话题页操作条、浮动按钮加起来有多高。写进 --ui-bottom-bar-h：提示条浮在它上面，
  // 页面底部留白也按它算。--sp-player-h 是播放条自己的高度，操作条和浮动按钮叠在它上面。
  var safeProbe = document.createElement('div');
  safeProbe.style.cssText = 'position:fixed;left:0;bottom:0;width:0;height:0;visibility:hidden;padding-bottom:env(safe-area-inset-bottom);';
  document.body.appendChild(safeProbe);
  function safeBottom() { return parseFloat(getComputedStyle(safeProbe).paddingBottom) || 0; }

  function updateBottomStack() {
    var body = document.body;
    if (!isMobile()) {
      body.style.removeProperty('--ui-bottom-bar-h');
      body.style.removeProperty('--sp-player-h');
      return;
    }
    var safe = safeBottom();
    var player = $('playerBar');
    var playerH = player.hidden ? 0 : player.offsetHeight;
    body.style.setProperty('--sp-player-h', playerH + 'px');
    var stack = playerH ? playerH - safe : 0;
    var bar = $('topicActions');
    if (!bar.hidden) stack += bar.offsetHeight - (playerH ? 0 : safe);
    var fab = $('composerFab');
    if (getComputedStyle(fab).display !== 'none') stack += fab.offsetHeight + (playerH ? 12 : 16);
    if (state.composerOpen) {
      // 面板开着时提示条要浮在「生成音频」上面
      var cta = composer.querySelector('.sp-composer__cta');
      stack = (cta ? cta.offsetHeight - safe : 72) + (parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sp-kb')) || 0);
    }
    body.style.setProperty('--ui-bottom-bar-h', Math.max(0, Math.round(stack)) + 'px');
  }

  // ==================== 视图切换 ====================
  // 当前地址对应的视图已经显示过就不再重画：返回键会同时触发 popstate 和 hashchange，
  // 以前同一个地址会被处理两次（找不到话题时提示弹两遍）。
  var lastRouteHash = null;

  function showLibrary(skipHash, restoreY) {
    state.view = 'library';
    state.topicKey = null;
    state.expanded = null;
    state.openClips = {};
    state.autoOpenKey = null;
    $('viewLibrary').hidden = false;
    $('viewTopic').hidden = true;
    document.body.classList.remove('on-topic');
    var danger = $('topicDanger');
    if (danger) danger.remove();
    renderLibrary();
    placeComposer();
    renderActionBar();
    if (!skipHash && location.hash) history.replaceState(null, '', location.pathname);
    lastRouteHash = location.hash;
    // 从话题页回来时回到进去前的位置（翻了几十个话题再回来，不用从头翻）
    window.scrollTo(0, restoreY || 0);
    onScroll();
  }

  function showTopic(folder, file, skipHash) {
    var topic = topicByKey(folder);
    if (!topic) { toast('找不到话题：' + folder, 'error'); return; }
    // 先压历史记录、再换视图：浏览器在 pushState 那一刻记下当前滚动位置，返回时会按它恢复。
    // 要是先换成（可能很短的）话题页，记下的就是被截短后的位置。spY 是自己再记一份，返回时主动恢复。
    if (!skipHash) {
      var hash = '#folder=' + encodeURIComponent(folder) + (file ? '&file=' + encodeURIComponent(file) : '');
      if (location.hash !== hash) {
        if (state.view === 'library') {
          try { history.replaceState(Object.assign({}, history.state || {}, { spY: window.scrollY }), '', location.href); } catch (e) { /* 忽略 */ }
        }
        // fromLibrary：上一条历史就是音频库，「‹ 音频库」可以直接退一步（话题跳话题时不行）
        history.pushState({ spTopic: true, fromLibrary: state.view === 'library' }, '', hash);
      }
    }
    state.view = 'topic';
    state.topicKey = folder;
    state.expanded = null;
    state.openClips = {};
    state.autoOpenKey = null;
    state.cueOpen = false;
    var key = file ? folder + '__' + file : null;
    // 手机上从搜索结果点进来：那一条直接展开（短文），要读的字马上能看到
    if (key && isMobile()) {
      state.openClips[key] = true;
      fetchText(folder, file).then(function (text) {
        if (state.topicKey !== folder || !state.openClips[key]) return;
        if (text.length > LONG_TEXT) { delete state.openClips[key]; renderTopic(); openReader(folder, file); return; }
        renderTopic();
        markLinkedClip(key);
      });
    }
    $('viewLibrary').hidden = true;
    $('viewTopic').hidden = false;
    document.body.classList.add('on-topic');
    renderTopic();
    placeComposer();
    lastRouteHash = location.hash;
    window.scrollTo(0, 0);
    onScroll();
    if (file) setTimeout(function () { markLinkedClip(key); }, 60);
  }

  function markLinkedClip(key) {
    var node = $('clipList').querySelector('[data-clip="' + (window.CSS && CSS.escape ? CSS.escape(key) : key) + '"]');
    if (!node) return;
    node.classList.add('is-linked');
    if (isMobile()) scrollClipIntoView(node, true);
    else node.scrollIntoView({ behavior: 'smooth', block: 'center' });
    setTimeout(function () { node.classList.remove('is-linked'); }, 3000);
  }

  // 手机：把一条滚到顶栏下面（被顶栏或底部一摞挡住时才滚）
  function scrollClipIntoView(node, force) {
    var rect = node.getBoundingClientRect();
    var top = ($('topicBar').getBoundingClientRect().bottom || 104) + 8;
    var bottomLimit = window.innerHeight - (parseFloat(document.body.style.getPropertyValue('--ui-bottom-bar-h')) || 0) - 40;
    if (!force && rect.top >= top && rect.top < bottomLimit - 60) return;
    window.scrollTo({ top: Math.max(0, window.scrollY + rect.top - top), behavior: 'smooth' });
  }

  // 返回音频库：是从音频库点进来的就退一步历史（恢复滚动位置，iOS 侧滑返回也走这条路），否则直接换视图
  function backToLibrary() {
    if (history.state && history.state.fromLibrary) history.back();
    else showLibrary();
  }

  // ==================== 手机：浮层与返回键 ====================
  // 手机上每打开一层（新建音频、⋯ 菜单、确认框、完整播放器、全屏阅读）就压一条同地址的历史记录，
  // 侧滑返回 / 安卓返回键先关掉最上面那层，而不是离开页面。桌面不压记录，行为和以前一样。
  var layers = [];
  function pushLayer(name, hide) {
    if (!isMobile()) return;
    layers.push({ name: name, hide: hide, resolve: null });
    history.pushState({ spLayer: name }, '', location.href);
  }
  function hasLayer(name) {
    return layers.length > 0 && layers[layers.length - 1].name === name;
  }
  // 由界面上的按钮关闭：有对应的历史记录就退一步，由 popstate 真正关闭；Promise 在关好之后兑现，
  // 这样「关掉菜单再打开别的」不会和退历史的异步顺序打架。
  function closeLayer(name, hide) {
    if (hasLayer(name)) {
      return new Promise(function (resolve) {
        layers[layers.length - 1].resolve = resolve;
        history.back();
      });
    }
    for (var i = layers.length - 1; i >= 0; i--) {
      if (layers[i].name === name) layers.splice(i, 1);
    }
    hide();
    return Promise.resolve();
  }
  window.addEventListener('popstate', function (event) {
    if (layers.length) {
      var top = layers.pop();
      top.hide();
      if (top.resolve) top.resolve();
      return;
    }
    routeFromHash(true, event.state);
  });

  var lockCount = 0;
  function lockScroll(on) {
    lockCount = Math.max(0, lockCount + (on ? 1 : -1));
    document.documentElement.classList.toggle('sp-lock', lockCount > 0);
  }

  // 键盘弹出时可见区域变矮：面板和确认框跟着可见区域走，「生成音频」和输入框都留在键盘上面
  function fitViewport() {
    if (!isMobile()) return;
    var vv = window.visualViewport;
    var height = vv ? vv.height : window.innerHeight;
    var keyboard = vv ? Math.max(0, window.innerHeight - vv.height - vv.offsetTop) : 0;
    document.documentElement.style.setProperty('--sp-vvh', Math.round(height) + 'px');
    document.documentElement.style.setProperty('--sp-kb', Math.round(keyboard) + 'px');
    if (state.composerOpen) updateBottomStack();
  }

  // ==================== 生成面板 ====================
  var composer = $('composer');

  function currentPart() {
    var active = $('partSeg').querySelector('.is-active');
    return active ? active.dataset.part : 'P2';
  }
  function setPart(part) {
    Array.prototype.forEach.call($('partSeg').children, function (btn) {
      btn.classList.toggle('is-active', btn.dataset.part === part);
    });
    onTopicFieldChange();
  }
  // 挑中已有话题时记住它的真实文件夹名：库里有「P1 -  Shoes」这种双空格的历史命名，
  // 按 Part + 名字重新拼会拼出一个新文件夹。
  var pinnedFolder = null;
  // 手机上从话题页打开时，「存到哪」已经定了，只显示一行摘要（点「更改」才展开 Part 和话题名）
  var destFixed = false;

  function composedFolder() {
    if (pinnedFolder) return pinnedFolder;
    var name = $('topicInput').value.trim();
    if (!name) return '';
    var part = currentPart();
    if (part === 'other') return name;
    return part + ' - ' + name;
  }

  function placeComposer() {
    var mobile = isMobile();
    if (mobile) {
      if (composer.parentNode !== document.body) document.body.appendChild(composer);
      composer.hidden = false;
      composer.classList.toggle('is-open', state.composerOpen);
      // 收起时只是移到屏幕外，用 inert 让里面的输入框不能被 Tab / 读屏碰到
      composer.inert = !state.composerOpen;
      if (state.composerOpen) composer.removeAttribute('aria-hidden'); else composer.setAttribute('aria-hidden', 'true');
      composer.classList.toggle('is-dest-fixed', destFixed);
      $('sheetBackdrop').hidden = !state.composerOpen;
      $('composerHead').hidden = true;
    } else {
      composer.inert = false;
      composer.removeAttribute('aria-hidden');
      composer.classList.remove('is-dest-fixed');
      composer.classList.remove('is-open');
      $('sheetBackdrop').hidden = true;
      $('composerHead').hidden = false;
      var slot = state.view === 'topic' ? $('slotTopic') : $('slotLibrary');
      if (composer.parentNode !== slot) slot.appendChild(composer);
      composer.hidden = state.view === 'topic' && !state.composerOpen;
    }
    renderDest();
  }

  function renderDest() {
    var show = destFixed && isMobile();
    $('composerDest').hidden = !show;
    if (show) $('composerDestName').textContent = composedFolder();
  }

  function openComposer(folder) {
    var wasOpen = state.composerOpen;
    state.composerOpen = true;
    if (folder) {
      pinnedFolder = folder;
      var topic = topicByKey(folder);
      setPart(topic ? (topic.part === '其他' ? 'other' : topic.part.replace('Part', 'P')) : 'other');
      $('topicInput').value = topic ? displayName(topic) : folder;
    }
    destFixed = !!folder && isMobile();
    placeComposer();
    onTopicFieldChange();
    if (isMobile() && !wasOpen) {
      fitViewport();
      lockScroll(true);
      pushLayer('composer', hideComposer);
      composer.scrollTop = 0;
      growText();
    }
    updateBottomStack();
    setTimeout(function () { $('textInput').focus(); }, 60);
  }

  function hideComposer() {
    if (!state.composerOpen) return;
    state.composerOpen = false;
    placeComposer();
    if (isMobile()) lockScroll(false);
    updateBottomStack();
  }
  function closeComposer() {
    if (!state.composerOpen) return Promise.resolve();
    return closeLayer('composer', hideComposer);
  }

  // 手机上英文框跟着内容长高（至少 6 行，最多 40% 屏高），贴进一整段 Part 2 也能从头看到尾
  function growText() {
    var el = $('textInput');
    if (!isMobile()) { el.style.height = ''; return; }
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight + 2, Math.round(window.innerHeight * 0.4)) + 'px';
  }

  function updateWordCount() {
    var text = $('textInput').value.trim();
    var words = text ? text.split(/\s+/).length : 0;
    // OpenAI tts-1 在 nova 音色下大约每分钟 165 词，够做一个「大概多长」的预期
    $('wordCount').textContent = words + ' 词 · 约 ' + fmtTime(words / 165 * 60);
  }

  function renderSuggest() {
    var box = $('topicSuggest');
    if (!state.suggestOpen) { box.hidden = true; return; }
    var typed = $('topicInput').value.trim().toLowerCase();
    var part = currentPart();
    var matches = state.topics.filter(function (t) {
      if (part !== 'other' && t.part !== part.replace('P', 'Part')) return false;
      if (part === 'other' && t.part !== '其他') return false;
      return !typed || t.folder.toLowerCase().indexOf(typed) >= 0;
    }).slice(0, 6);
    var folder = composedFolder();
    var exists = matches.some(function (t) { return t.folder === folder; });
    var html = matches.map(function (t) {
      return '<button type="button" data-action="pick-topic" data-folder="' + esc(t.folder) + '">' +
        '<span class="sp-grow sp-truncate">' + esc(displayName(t)) + '</span>' +
        '<span class="sp-hint sp-num">' + t.files.length + ' 条</span></button>';
    }).join('');
    if (typed && !exists) {
      html += '<button type="button" class="sp-suggest__new" data-action="new-topic">' + ICON.plus +
        '<span class="sp-truncate">新建话题「' + esc(folder) + '」</span></button>';
    }
    box.innerHTML = html;
    box.hidden = !html;
  }

  var checkPart2 = debounce(function (folder) {
    if (!/^P2/.test(folder)) { $('part2Wrap').hidden = true; $('part2Known').hidden = true; return; }
    fetch('/has_part2_question?folder=' + encodeURIComponent(folder))
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (composedFolder() !== folder) return;
        var topic = topicByKey(folder);
        if (data.exists) {
          $('part2Wrap').hidden = true;
          $('part2Known').hidden = false;
          $('part2Known').innerHTML = '<div class="sp-grow" style="min-width:0;">' +
            '<span class="sp-question__label">题卡问题 · 已填写</span>' +
            '<p class="sp-question__text sp-truncate" style="font-size:13px;">' +
            esc(topic && topic.question ? topic.question : '（已存在）') + '</p></div>';
        } else {
          $('part2Wrap').hidden = false;
          $('part2Known').hidden = true;
        }
      }).catch(function () { $('part2Wrap').hidden = false; $('part2Known').hidden = true; });
  }, 250);

  function onTopicFieldChange() {
    var folder = composedFolder();
    $('folderHint').innerHTML = folder
      ? '将存入 <b>' + esc(folder) + '</b>'
      : '选一个 Part，再填话题名';
    var topic = topicByKey(folder);
    $('partHint').textContent = (currentPart() === 'P1' || currentPart() === 'P3')
      ? '首行可以写问题，会和答案一起存进文本'
      : (topic ? '这个话题已有 ' + topic.files.length + ' 条' : '');
    if (folder) checkPart2(folder); else { $('part2Wrap').hidden = true; $('part2Known').hidden = true; }
    renderSuggest();
    renderDest();
  }

  function renderQueue() {
    var box = $('queueBox');
    if (!state.queue.length) { box.hidden = true; return; }
    box.hidden = false;
    var folder = state.queue[0].folder;
    box.innerHTML = '<div class="sp-queue__head"><span class="sp-label sp-grow">本次生成 · ' + esc(folder) + '</span>' +
      '<button type="button" class="sp-hint" data-action="open-topic" data-folder="' + esc(folder) +
      '" style="border:none;background:none;color:var(--sp-accent);cursor:pointer;">查看话题</button></div>' +
      state.queue.map(function (item, index) {
        if (item.status === 'pending') {
          return '<div class="sp-queue__row"><span class="sp-spinner"></span>' +
            '<span class="sp-grow sp-truncate sp-en" style="color:var(--sp-ink-3);">' + esc(item.text) + '</span>' +
            '<span class="sp-hint">生成中</span></div>';
        }
        if (item.status === 'error') {
          // 失败要说清楚为什么，并且能原样再试一次（文本、话题都还在这一条里）
          return '<div class="sp-queue__row sp-queue__row--error"><span class="sp-hint" style="color:var(--sp-danger);">失败</span>' +
            '<span class="sp-grow sp-truncate sp-en">' + esc(item.text) + '</span>' +
            '<button type="button" class="sp-btn sp-btn--sm" data-action="retry-generate" data-index="' + index + '">重试</button>' +
            '<span class="sp-queue__why">' + esc(item.reason || '生成失败') + '</span></div>';
        }
        return '<div class="sp-queue__row"><span class="sp-done">' + ICON.check + '</span>' +
          '<button type="button" class="sp-play" style="width:32px;height:32px;" data-action="play-clip" data-folder="' +
          esc(item.folder) + '" data-file="' + esc(item.file) + '" aria-label="播放这一条">' + ICON.play + '</button>' +
          '<span class="sp-grow sp-truncate sp-en">' + esc(item.text) + '</span>' +
          '<span class="sp-hint sp-num">' + fmtTime(item.duration) + '</span></div>';
      }).join('');
  }

  // 后端把 TTS 的原始异常（「TTS API错误: 401, 响应: …」「HTTPSConnectionPool…」）原样返回，
  // 给人看的换成一句能照着做的话；原文打到控制台，排查时还能看到
  function friendlyError(error) {
    var message = (error && error.message) || '';
    if (/Invalid folder name/i.test(message)) return '话题名里不能有 / 或 \\，改一下再试';
    if (/Missing text or folder/i.test(message)) return '英文和话题名都要填';
    if (error && error.name === 'TypeError') return '网络连不上，文本已保留，稍后点重试';
    return '语音服务暂时不可用，文本已保留，稍后点重试';
  }

  function setGenerating(busy) {
    state.busy = busy;
    // 只换按钮里的字，图标留着（以前用 textContent 整个替换，生成一次后「＋」就没了）
    $('generateBtn').disabled = busy;
    $('generateLabel').textContent = busy ? '生成中…' : '生成音频';
  }

  function generate() {
    if (state.busy) return;
    var text = $('textInput').value.trim();
    var folder = composedFolder();
    if (!text) { toast('先粘贴要生成的英文', 'error'); $('textInput').focus(); return; }
    if (!folder) { toast('先填话题名', 'error'); $('topicInput').focus(); return; }
    var body = { text: text, folder: folder };
    if (/^P2/.test(folder) && !$('part2Wrap').hidden) {
      var question = $('part2Question').value.trim();
      if (!question) { toast('Part 2 话题请先填题卡问题', 'error'); $('part2Question').focus(); return; }
      body.question = question;
    }
    var item = { folder: folder, text: text, body: body, status: 'pending', duration: 0, reason: '' };
    state.queue.unshift(item);
    sendGenerate(item);
  }

  // 手机上结果列表在面板下半截，生成 / 失败时把它滚进视野（按钮钉在底部，挡不住它）
  function revealQueue() {
    if (!isMobile() || !state.composerOpen) return;
    var box = $('queueBox');
    if (!box.hidden) composer.scrollTop = Math.max(0, box.offsetTop - composer.clientHeight * 0.35);
  }

  function sendGenerate(item) {
    item.status = 'pending';
    item.reason = '';
    renderQueue();
    revealQueue();
    setGenerating(true);

    fetch('/generate_audio', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(item.body)
    }).then(function (r) { return r.json(); }).then(function (data) {
      if (data.error) throw new Error(data.error);
      item.status = 'done';
      item.file = data.filename;
      item.folder = data.folder;
      // 重试成功时，输入框里可能已经是新写的一段了，只有还是这一条的文本才清掉
      var stillHere = $('textInput').value.trim() === item.text;
      if (stillHere) $('part2Question').value = '';
      if ($('stayCheck').checked) {
        if (stillHere) $('textInput').value = '';
        pinnedFolder = data.folder;
        updateWordCount();
        growText();
        $('textInput').focus();
      } else if (stillHere) {
        resetComposer();
      }
      return loadTopics().then(function () {
        var topic = topicByKey(item.folder);
        if (topic) {
          topic.files.forEach(function (f) { if (f.name === item.file) item.duration = f.duration; });
        }
        renderQueue();
        if (state.view === 'topic' && state.topicKey === item.folder) renderTopic();
        else renderLibrary();
        onTopicFieldChange();
        toast('已生成 · ' + fmtTime(item.duration), 'success');
      });
    }).catch(function (error) {
      item.status = 'error';
      item.reason = friendlyError(error);
      if (window.console) console.warn('生成音频失败：', error && error.message);
      renderQueue();
      revealQueue();
      // 手机上面板开着时，失败那一行（原因 + 重试）已经滚到眼前了，不再叠一条提示把它盖住
      if (!(isMobile() && state.composerOpen)) toast('生成失败：' + item.reason, 'error');
    }).then(function () {
      setGenerating(false);
      renderQueue();
    });
  }

  function resetComposer() {
    $('textInput').value = '';
    $('part2Question').value = '';
    pinnedFolder = null;
    updateWordCount();
    growText();
    onTopicFieldChange();
  }

  // ==================== 播放器 ====================
  function playlistFor(folder) {
    var topic = topicByKey(folder);
    return topic ? topic.files.map(function (f) { return f.name; }) : [];
  }

  function playClip(folder, file) {
    var player = state.player;
    if (player.folder === folder && player.file === file) {
      if (audio.paused) audio.play(); else audio.pause();
      return;
    }
    player.folder = folder;
    player.file = file;
    player.list = playlistFor(folder);
    player.index = player.list.indexOf(file);
    resetProgress();
    audio.src = '/audio/' + encodeURIComponent(folder) + '/' + encodeURIComponent(file);
    audio.playbackRate = player.rate;
    audio.play().catch(function () { /* 用户还没交互过时浏览器会拒绝，忽略即可 */ });
    renderPlayer();
    followCurrentClip();
  }

  function playTopic(folder) {
    var player = state.player;
    if (player.folder === folder && player.playing) { audio.pause(); return; }
    var list = playlistFor(folder);
    if (!list.length) { toast('这个话题下还没有音频', 'error'); return; }
    if (player.folder === folder && player.file) { audio.play(); return; }
    playClip(folder, list[0]);
  }

  function step(delta) {
    var player = state.player;
    if (!player.list.length) return;
    var next = player.index + delta;
    if (next < 0 || next >= player.list.length) return;
    playClip(player.folder, player.list[next]);
  }

  function stopPlayer() {
    audio.pause();
    state.player.file = null;
    renderPlayer();
    refreshClipStates();
  }

  function renderPlayer() {
    var player = state.player;
    var bar = $('playerBar');
    if (!player.file) {
      bar.hidden = true;
      document.body.classList.remove('has-player');
      if (state.fpOpen) closeFullPlayer();
      updateMediaSession();
      renderActionBar();
      return;
    }
    bar.hidden = false;
    document.body.classList.add('has-player');
    $('toggleBtn').innerHTML = player.playing ? ICON.pause : ICON.play;
    $('toggleBtn').setAttribute('aria-label', player.playing ? '暂停' : '播放');
    var topic = topicByKey(player.folder);
    var info = $('playerTitle').parentNode;
    if (isMobile()) {
      // 手机：标题是这一条在说什么（问题或答案开头），下面是「话题 · 第几条」；点这块打开完整播放器
      $('playerTitle').textContent = clipTitle(topic, fileInfo(player.folder, player.file));
      $('playerSub').textContent = (topic ? displayName(topic) : player.folder) + ' · ' + (player.index + 1) + '/' + player.list.length;
      info.setAttribute('role', 'button');
      info.setAttribute('tabindex', '0');
      info.setAttribute('aria-label', '打开播放器：' + $('playerTitle').textContent);
    } else {
      $('playerTitle').textContent = String(player.index + 1).padStart(2, '0') + ' · ' +
        (topic ? displayName(topic) : player.folder);
      $('playerSub').textContent = (topic ? topic.part.replace('Part', 'Part ') : '') +
        ' · ' + (player.index + 1) + ' / ' + player.list.length;
      info.removeAttribute('role');
      info.removeAttribute('tabindex');
      info.removeAttribute('aria-label');
    }
    $('prevBtn').disabled = player.index <= 0;
    $('nextBtn').disabled = player.index >= player.list.length - 1;
    $('rateBtn').textContent = player.rate.toFixed(2).replace(/0$/, '') + '×';
    updateFullPlayer();
    updateMediaSession();
    renderActionBar();
  }

  // 进度：迷你条、桌面条、完整播放器的进度条一起画
  function paintProgress(ratio) {
    var pct = (Math.max(0, Math.min(1, ratio)) * 100) + '%';
    Array.prototype.forEach.call(document.querySelectorAll('.sp-seek__fill'), function (fill) { fill.style.width = pct; });
    $('fpSeek').setAttribute('aria-valuenow', String(Math.round(ratio * 100)));
  }
  function paintTimes() {
    $('curTime').textContent = fmtTime(audio.currentTime);
    $('fpCur').textContent = fmtTime(audio.currentTime);
  }
  function resetProgress() {
    var fills = document.querySelectorAll('.sp-seek__fill');
    Array.prototype.forEach.call(fills, function (fill) { fill.style.transition = 'none'; });
    paintProgress(0);
    $('curTime').textContent = '0:00';
    $('durTime').textContent = '0:00';
    $('fpCur').textContent = '0:00';
    $('fpDur').textContent = '0:00';
    setTimeout(function () {
      Array.prototype.forEach.call(fills, function (fill) { fill.style.transition = ''; });
    }, 50);
  }

  audio.addEventListener('play', function () { state.player.playing = true; renderPlayer(); refreshClipStates(); updatePositionState(); });
  audio.addEventListener('pause', function () { state.player.playing = false; renderPlayer(); refreshClipStates(); updatePositionState(); });
  audio.addEventListener('ended', function () { step(1); });
  audio.addEventListener('loadedmetadata', function () {
    $('durTime').textContent = fmtTime(audio.duration);
    $('fpDur').textContent = fmtTime(audio.duration);
    updatePositionState();
  });
  audio.addEventListener('ratechange', updatePositionState);
  audio.addEventListener('seeked', updatePositionState);
  audio.addEventListener('timeupdate', function () {
    if (seeking) return;
    paintTimes();
    paintProgress(audio.duration ? audio.currentTime / audio.duration : 0);
  });
  audio.addEventListener('error', function () {
    if (audio.src) toast('这条音频加载失败', 'error');
  });

  function refreshClipStates() {
    if (state.view === 'topic') renderTopic();
    else { renderRecent(); renderTopicList(); if (isMobile()) renderHits(); }
    if (state.readerKey) renderReaderFoot();
  }

  // 手机：连播换到下一条时，把这一条展开（上一条自动展开的收回去）；用户几秒内没自己滚动时才跟着滚
  var lastUserScroll = 0;
  function followCurrentClip() {
    var player = state.player;
    if (!isMobile() || state.view !== 'topic' || state.topicKey !== player.folder || !player.file) return;
    var key = player.folder + '__' + player.file;
    if (state.autoOpenKey && state.autoOpenKey !== key) {
      delete state.openClips[state.autoOpenKey];
      state.autoOpenKey = null;
    }
    if (state.openClips[key]) return;
    var folder = player.folder, file = player.file;
    fetchText(folder, file).then(function (text) {
      if (state.player.file !== file || state.topicKey !== folder || state.openClips[key]) return;
      if (text.length > LONG_TEXT) return;
      state.openClips[key] = true;
      state.autoOpenKey = key;
      renderTopic();
      if (Date.now() - lastUserScroll > 4000) {
        var node = $('clipList').querySelector('[data-clip="' + (window.CSS && CSS.escape ? CSS.escape(key) : key) + '"]');
        if (node) scrollClipIntoView(node, false);
      }
    });
  }

  // ==================== 手机：完整播放器 ====================
  function openFullPlayer() {
    if (!isMobile() || !state.player.file || state.fpOpen) return;
    state.fpOpen = true;
    $('fullPlayer').hidden = false;
    $('fpBackdrop').hidden = false;
    $('fpBody').dataset.key = '';
    lockScroll(true);
    updateFullPlayer();
    $('fpCur').textContent = fmtTime(audio.currentTime);
    $('fpDur').textContent = fmtTime(audio.duration);
    pushLayer('fullplayer', hideFullPlayer);
  }
  function hideFullPlayer() {
    if (!state.fpOpen) return;
    state.fpOpen = false;
    $('fullPlayer').hidden = true;
    $('fpBackdrop').hidden = true;
    $('fullPlayer').style.transform = '';
    $('fullPlayer').style.transition = '';
    lockScroll(false);
  }
  function closeFullPlayer() { return closeLayer('fullplayer', hideFullPlayer); }

  function updateFullPlayer() {
    if (!state.fpOpen) return;
    var player = state.player;
    if (!player.file) return;
    var topic = topicByKey(player.folder);
    var file = fileInfo(player.folder, player.file);
    $('fpTopic').textContent = topic ? displayName(topic) : player.folder;
    $('fpIndex').textContent = (topic ? PART_LABEL[topic.part] + ' · ' : '') + '第 ' + (player.index + 1) + ' / ' + player.list.length + ' 条';
    $('fpToggle').innerHTML = player.playing ? ICON.pause : ICON.play;
    $('fpToggle').setAttribute('aria-label', player.playing ? '暂停' : '播放');
    $('fullPlayer').querySelector('[data-action="prev"]').disabled = player.index <= 0;
    $('fullPlayer').querySelector('[data-action="next"]').disabled = player.index >= player.list.length - 1;
    Array.prototype.forEach.call($('fpRate').children, function (btn) {
      btn.classList.toggle('is-active', Number(btn.dataset.rate) === player.rate);
    });
    // 正文只在换了一条或刚读到原文时重画，播放 / 暂停不打断阅读位置
    var key = player.folder + '__' + player.file;
    var text = state.textCache[key];
    var body = $('fpBody');
    var stamp = key + (text === undefined ? '' : '#loaded');
    if (body.dataset.key === stamp) return;
    body.dataset.key = stamp;
    var question = asksQuestion(topic) && file && file.question ? file.question : '';
    body.innerHTML = (question ? '<p class="sp-fp__q">' + esc(question) + '</p>' : '') +
      '<p class="sp-fp__text">' + (text === undefined ? '加载中…' : esc(answerOnly(text, question))) + '</p>';
    body.scrollTop = 0;
    if (text === undefined) {
      fetchText(player.folder, player.file).then(function () { updateFullPlayer(); });
    }
  }

  // 往下拖顶部把手（或标题行）收起完整播放器
  (function () {
    var sheet = $('fullPlayer');
    var startY = null, dy = 0;
    function down(event) {
      if (event.target.closest('button')) return;
      startY = event.clientY; dy = 0;
      sheet.style.transition = 'none';
      try { event.currentTarget.setPointerCapture(event.pointerId); } catch (e) { /* 忽略 */ }
    }
    function move(event) {
      if (startY === null) return;
      dy = Math.max(0, event.clientY - startY);
      sheet.style.transform = dy ? 'translateY(' + dy + 'px)' : '';
    }
    function up() {
      if (startY === null) return;
      startY = null;
      if (dy > 110) { closeFullPlayer(); return; }
      sheet.style.transition = 'transform .2s ease';
      sheet.style.transform = '';
    }
    [$('fpGrab'), $('fpHead')].forEach(function (el) {
      el.addEventListener('pointerdown', down);
      el.addEventListener('pointermove', move);
      el.addEventListener('pointerup', up);
      el.addEventListener('pointercancel', up);
    });
  })();

  function setRate(rate) {
    state.player.rate = rate;
    audio.playbackRate = rate;
    renderPlayer();
  }

  // ==================== 锁屏 / 耳机控制（Media Session） ====================
  // 锁屏、控制中心、AirPods 上能看到这一条的标题，能播放 / 暂停 / 上一条 / 下一条 / 拖进度
  var media = ('mediaSession' in navigator) ? navigator.mediaSession : null;
  var mediaKey = null;
  function updateMediaSession() {
    if (!media) return;
    var player = state.player;
    try {
      if (!player.file) {
        media.metadata = null;
        mediaKey = null;
        media.playbackState = 'none';
        return;
      }
      var key = player.folder + '__' + player.file;
      if (key !== mediaKey && window.MediaMetadata) {
        var topic = topicByKey(player.folder);
        media.metadata = new MediaMetadata({
          title: clipTitle(topic, fileInfo(player.folder, player.file)) || player.file,
          artist: (topic ? displayName(topic) : player.folder) + ' · ' + (player.index + 1) + '/' + player.list.length,
          album: '口语音频库',
          artwork: [{ src: '/static/apple-touch-icon.png', sizes: '180x180', type: 'image/png' }]
        });
        mediaKey = key;
      }
      media.playbackState = player.playing ? 'playing' : 'paused';
    } catch (e) { /* 老浏览器不支持某些字段，忽略 */ }
  }
  function updatePositionState() {
    if (!media || !media.setPositionState || !audio.duration || !isFinite(audio.duration)) return;
    try {
      media.setPositionState({
        duration: audio.duration,
        playbackRate: audio.playbackRate || 1,
        position: Math.min(audio.currentTime, audio.duration)
      });
    } catch (e) { /* 忽略 */ }
  }
  if (media) {
    var mediaHandlers = {
      play: function () { audio.play(); },
      pause: function () { audio.pause(); },
      previoustrack: function () { step(-1); },
      nexttrack: function () { step(1); },
      seekto: function (details) {
        if (details && details.seekTime != null && audio.duration) {
          audio.currentTime = Math.min(details.seekTime, audio.duration);
          updatePositionState();
        }
      },
      stop: stopPlayer
    };
    Object.keys(mediaHandlers).forEach(function (action) {
      try { media.setActionHandler(action, mediaHandlers[action]); } catch (e) { /* 这个动作不支持 */ }
    });
  }

  // ==================== 弹窗 ====================
  function hideDialog() {
    if ($('dialog').hidden) return;
    $('dialog').hidden = true;
    $('dialogBackdrop').hidden = true;
    $('dialog').innerHTML = '';
    if (isMobile()) lockScroll(false);
  }
  function closeDialog() { return closeLayer('dialog', hideDialog); }
  function showDialog() {
    var wasHidden = $('dialog').hidden;
    $('dialog').hidden = false;
    $('dialogBackdrop').hidden = false;
    if (wasHidden && isMobile()) {

  function confirmDialog(options) {
    var dialog = $('dialog');
    dialog.innerHTML =
      '<h2>' + esc(options.title) + '</h2>' +
      (options.body ? '<p>' + options.body + '</p>' : '') +
      (options.warn ? '<p class="sp-dialog__warn">' + esc(options.warn) + '</p>' : '') +
      '<div class="sp-dialog__actions">' +
      '<button type="button" class="sp-btn" data-dialog="cancel">取消</button>' +
      '<button type="button" class="sp-btn ' + (options.danger ? 'sp-btn--danger-solid' : 'sp-btn--primary') +
      '" data-dialog="ok">' + esc(options.confirmText || '确定') + '</button>' +
      '</div>';
    showDialog();
    dialog.querySelector('[data-dialog="cancel"]').onclick = closeDialog;
    dialog.querySelector('[data-dialog="ok"]').onclick = function () { closeDialog().then(options.onConfirm); };
  }

  function questionDialog(topic) {
    var dialog = $('dialog');
    dialog.innerHTML =
      '<h2>' + (topic.question ? '编辑题卡问题' : '填写题卡问题') + '</h2>' +
      '<p>' + esc(topic.folder) + '</p>' +
      '<textarea class="sp-textarea" id="dialogQuestion" rows="5" style="min-height:120px;font-size:15px;"></textarea>' +
      '<div class="sp-dialog__actions">' +
      '<button type="button" class="sp-btn" data-dialog="cancel">取消</button>' +
      '<button type="button" class="sp-btn sp-btn--primary" data-dialog="ok">保存</button>' +
      '</div>';
    showDialog();
    $('dialogQuestion').value = topic.question || '';
    $('dialogQuestion').focus();
    dialog.querySelector('[data-dialog="cancel"]').onclick = closeDialog;
    dialog.querySelector('[data-dialog="ok"]').onclick = function () {
      var value = $('dialogQuestion').value.trim();
      if (!value) { toast('问题不能为空', 'error'); return; }
      fetch('/set_part2_question', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ folder: topic.folder, question: value })
      }).then(function (r) { return r.json(); }).then(function (data) {
        if (!data.success) throw new Error(data.error || '保存失败');
        closeDialog();
        toast('问题已保存', 'success');
        return loadTopics().then(function () { renderTopic(); });
      }).catch(function (error) { toast(error.message, 'error'); });
    };
  }

  function deleteClip(folder, file) {
    fetch('/delete_audio', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ folder: folder, filename: file })
    }).then(function (r) { return r.json(); }).then(function (data) {
      if (!data.success) throw new Error(data.error || '删除失败');
      toast('音频已删除', 'success');
      if (state.player.folder === folder && state.player.file === file) {
        audio.pause();
        state.player.file = null;
        renderPlayer();
      }
      return loadTopics().then(function () {
        var topic = topicByKey(folder);
        if (!topic) showLibrary(); else renderTopic();
      });
    }).catch(function (error) { toast(error.message, 'error'); });
  }

  function deleteFolder(folder) {
    fetch('/delete_folder', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ folder: folder })
    }).then(function (r) { return r.json(); }).then(function (data) {
      if (!data.success) throw new Error(data.error || '删除失败');
      toast('话题已删除', 'success');
      if (state.player.folder === folder) { audio.pause(); state.player.file = null; renderPlayer(); }
      return loadTopics().then(function () { showLibrary(); });
    }).catch(function (error) { toast(error.message, 'error'); });
  }

  function fetchText(folder, file) {
    var key = folder + '__' + file;
    if (state.textCache[key] !== undefined) return Promise.resolve(state.textCache[key]);
    return fetch('/text/' + encodeURIComponent(folder) + '/' + encodeURIComponent(file))
      .then(function (r) { return r.json(); })
      .then(function (data) {
        state.textCache[key] = data.error ? '（找不到原文）' : data.text;
        return state.textCache[key];
      });
  }

  // 复制：没有 navigator.clipboard（非 https、老浏览器）时退回 execCommand，失败要告诉用户
  function copyText(text) {
    function fallback() {
      return new Promise(function (resolve, reject) {
        var area = document.createElement('textarea');
        area.value = text;
        area.setAttribute('readonly', '');
        area.style.cssText = 'position:fixed;top:0;left:0;opacity:0;';
        document.body.appendChild(area);
        area.select();
        var ok = false;
        try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
        area.remove();
        if (ok) resolve(); else reject(new Error('copy failed'));
      });
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).catch(fallback);
    }
    return fallback();
  }
