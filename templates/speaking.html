  function toggleLibraryManage() {
    state.manage = !state.manage;
    $('manageToggle').textContent = state.manage ? '退出管理' : '管理';
    toast(state.manage ? '管理模式已开，进入话题后可以删除' : '已退出管理模式');
  }

  function libraryMenu() {
    openSheet('口语音频库', [
      { label: state.manage ? '退出管理模式' : '管理音频', sub: '打开后，进到话题里可以删单条或整个话题', icon: ICON.gear, on: state.manage,
        run: toggleLibraryManage },
      { label: '合集播放页', sub: '把一个话题的音频拼成一整条播放', icon: ICON.layers,
        run: function () { location.href = '/combined'; } }
    ]);
  }

  function topicMenu() {
    var topic = topicByKey(state.topicKey);
    if (!topic) return;
    var allOpen = topic.files.every(function (f) { return state.openClips[topic.folder + '__' + f.name]; });
    var items = [
      { label: '添加音频到这个话题', icon: ICON.plusLg, run: function () { openComposer(topic.folder); } }
    ];
    if (topic.part === 'Part2') {
      items.push({ label: topic.question ? '编辑题卡问题' : '填写题卡问题', icon: ICON.edit, run: function () { questionDialog(topic); } });
    }
    items.push(
      { label: allOpen ? '全部收起' : '全部展开', sub: allOpen ? '' : '一次看完每一条的原文（特别长的除外）', icon: ICON.expand,
        run: function () { expandAll(topic, !allOpen); } },
      { label: state.manage ? '退出管理' : '管理（删除音频）', icon: ICON.gear, on: state.manage,
        run: function () { state.manage = !state.manage; renderTopic(); } },
      { label: '合集播放页', sub: '这个话题拼成一整条播放', icon: ICON.layers,
        run: function () { location.href = '/combined#folder=' + encodeURIComponent(topic.folder); } },
      { label: '删除整个话题…', sub: topic.files.length + ' 条音频和原文都会删掉', icon: ICON.trashLg, danger: true,
        run: function () { confirmDeleteFolder(topic); } }
    );
    openSheet(displayName(topic), items);
  }

  function expandAll(topic, open) {
    if (!open) { state.openClips = {}; state.autoOpenKey = null; renderTopic(); return; }
    Promise.all(topic.files.map(function (f) { return fetchText(topic.folder, f.name); })).then(function (texts) {
      if (state.topicKey !== topic.folder) return;
      topic.files.forEach(function (f, i) {
        if (texts[i].length <= LONG_TEXT) state.openClips[topic.folder + '__' + f.name] = true;
      });
      renderTopic();
    });
  }

  function confirmDeleteFolder(topic) {
    confirmDialog({
      title: '删除整个话题？',
      body: esc(topic.folder) + ' · ' + topic.files.length + ' 条音频',
      warn: '这个话题下所有音频和原文都会被删除，无法恢复。',
      confirmText: '删除话题',
      danger: true,
      onConfirm: function () { deleteFolder(topic.folder); }
    });
  }

  // ==================== 手机：长文全屏阅读 ====================
  function openReader(folder, file) {
    var key = folder + '__' + file;
    var topic = topicByKey(folder);
    var index = topic ? topic.files.map(function (f) { return f.name; }).indexOf(file) : -1;
    state.readerKey = key;
    $('reader').dataset.folder = folder;
    $('reader').dataset.file = file;
    $('readerTitle').textContent = (topic ? displayName(topic) : folder) + (index >= 0 ? ' · 第 ' + (index + 1) + ' 条' : '');
    $('readerText').textContent = state.textCache[key] === undefined ? '加载中…' : state.textCache[key];
    if (state.textCache[key] === undefined) {
      fetchText(folder, file).then(function (text) { if (state.readerKey === key) $('readerText').textContent = text; });
    }
    renderReaderFoot();
    var wasHidden = $('reader').hidden;
    $('reader').hidden = false;
    $('reader').querySelector('.sp-reader__body').scrollTop = 0;
    document.body.classList.add('sp-reading');
    if (wasHidden) { lockScroll(true); pushLayer('reader', hideReader); }
  }
  function renderReaderFoot() {
    var folder = $('reader').dataset.folder, file = $('reader').dataset.file;
    if (!folder) return;
    var playing = isClipPlaying(folder, file);
    $('readerFoot').innerHTML =
      '<button type="button" class="sp-btn sp-btn--primary" data-action="play-clip" data-folder="' + esc(folder) + '" data-file="' + esc(file) + '">' +
      (playing ? ICON.pause + ' 暂停' : ICON.play + ' 播放') + '</button>' +
      '<button type="button" class="sp-btn" data-action="copy-text" data-key="' + esc(folder + '__' + file) + '">复制原文</button>' +
      '<a class="sp-btn" href="/audio/' + encodeURIComponent(folder) + '/' + encodeURIComponent(file) + '" download style="text-decoration:none;">下载</a>';
  }
  function hideReader() {
    if ($('reader').hidden) return;
    $('reader').hidden = true;
    state.readerKey = null;
    document.body.classList.remove('sp-reading');
    lockScroll(false);
  }
  function closeReader() { return closeLayer('reader', hideReader); }

  // 手机上点一条：短文就地展开（可以同时展开几条），长文进全屏阅读
  function toggleClipPhone(folder, file) {
    var key = folder + '__' + file;
    if (state.openClips[key]) {
      delete state.openClips[key];
      if (state.autoOpenKey === key) state.autoOpenKey = null;
      renderTopic();
      return;
    }
    var cached = state.textCache[key];
    if (cached !== undefined && cached.length > LONG_TEXT) { openReader(folder, file); return; }
    state.openClips[key] = true;
    renderTopic();
    fetchText(folder, file).then(function (text) {
      if (!state.openClips[key]) return;
      if (text.length > LONG_TEXT) { delete state.openClips[key]; renderTopic(); openReader(folder, file); return; }
      renderTopic();
    });
  }

  // ==================== 事件 ====================
  document.addEventListener('click', function (event) {
    var target = event.target.closest('[data-action]');
    if (!target) return;
    var action = target.dataset.action;
    var folder = target.dataset.folder;
    var file = target.dataset.file;

    if (action === 'filter') {
      state.partFilter = target.dataset.part;
      renderChips();
      renderTopicList();
      if (isMobile()) renderRecent();
      return;
    }
    if (action === 'open-topic') {
      event.stopPropagation();
      closeComposer().then(function () { showTopic(folder); });
      return;
    }
    if (action === 'open-clip') { closeComposer().then(function () { showTopic(folder, file); }); return; }
    if (action === 'play-topic') { event.stopPropagation(); playTopic(folder); return; }
    if (action === 'play-clip') { event.stopPropagation(); playClip(folder, file); return; }
    if (action === 'back') { backToLibrary(); return; }
    if (action === 'add-here') { openComposer(state.topicKey); return; }
    if (action === 'close-composer') { closeComposer(); return; }
    if (action === 'toggle-manage') {
      state.manage = !state.manage;
      renderTopic();
      return;
    }
    if (action === 'edit-question') { questionDialog(topicByKey(state.topicKey)); return; }
    if (action === 'toggle-text') {
      if (isMobile() && target.dataset.folder) { toggleClipPhone(target.dataset.folder, target.dataset.file); return; }
      var key = target.dataset.key;
      state.expanded = state.expanded === key ? null : key;
      renderTopic();
      if (state.expanded) {
        var parts = key.split('__');
        fetchText(parts[0], parts.slice(1).join('__')).then(function () {
          if (state.expanded === key) renderTopic();
        });
      }
      return;
    }
    if (action === 'copy-text') {
      var text = state.textCache[target.dataset.key];
      if (text === undefined) { toast('原文还在加载，稍等一下', 'error'); return; }
      copyText(text).then(function () { toast('原文已复制', 'success'); },
        function () { toast('没能复制，长按文字可以手动选择', 'error'); });
      return;
    }
    if (action === 'delete-clip') {
      event.stopPropagation();
      var clipTopic = topicByKey(folder);
      confirmDialog({
        title: '删除这条音频？',
        // 手机上说这条讲的是什么（问题或答案开头），比文件名好认
        body: isMobile() ? esc(clipLabel(clipTopic, fileInfo(folder, file))) : esc(file),
        warn: '音频文件和它的英文原文会一起删除，无法恢复。',
        confirmText: '删除',
        danger: true,
        onConfirm: function () { deleteClip(folder, file); }
      });
      return;
    }
    if (action === 'delete-folder') {
      confirmDeleteFolder(topicByKey(state.topicKey));
      return;
    }
    if (action === 'pick-topic') {
      pinnedFolder = folder;
      var picked = topicByKey(folder);
      $('topicInput').value = picked ? displayName(picked) : folder;
      state.suggestOpen = false;
      onTopicFieldChange();
      $('textInput').focus();
      return;
    }
    if (action === 'new-topic') {
      pinnedFolder = null;
      state.suggestOpen = false;
      onTopicFieldChange();
      $('textInput').focus();
      return;
    }
    if (action === 'retry-generate') {
      var item = state.queue[Number(target.dataset.index)];
      if (item && item.status === 'error' && !state.busy) sendGenerate(item);
      return;
    }
    // ---- 下面这些只在手机上出现 ----
    if (action === 'lib-more') { libraryMenu(); return; }
    if (action === 'topic-more') { topicMenu(); return; }
    if (action === 'toggle-cue') { state.cueOpen = !state.cueOpen; renderTopic(); return; }
    if (action === 'new-first') { openComposer(null); return; }
    if (action === 'reload-list') { bootList(); return; }
    if (action === 'dest-change') {
      destFixed = false;
      composer.classList.remove('is-dest-fixed');
      renderDest();
      $('topicInput').focus();
      return;
    }
    if (action === 'close-fullplayer') { closeFullPlayer(); return; }
    if (action === 'fp-open-topic') {
      var playing = state.player;
      closeFullPlayer().then(function () {
        if (state.view === 'topic' && state.topicKey === playing.folder) {
          var node = $('clipList').querySelector('.sp-clip.is-current');
          if (node) scrollClipIntoView(node, true);
        } else if (playing.folder) {
          showTopic(playing.folder, playing.file);
        }
      });
      return;
    }
    if (action === 'toggle') { if (audio.paused) audio.play(); else audio.pause(); return; }
    if (action === 'prev') { step(-1); return; }
    if (action === 'next') { step(1); return; }
    if (action === 'stop-player') { closeFullPlayer().then(stopPlayer); return; }
    if (action === 'close-reader') { closeReader(); return; }
  });

  // 回车也能打开话题（列表行是 button，卡片是 div[role=button]）
  document.addEventListener('keydown', function (event) {
    if (event.key !== 'Enter' && event.key !== ' ') return;
    var target = event.target.closest('[data-action="open-topic"][role="button"]');
    if (!target) return;
    event.preventDefault();
    showTopic(target.dataset.folder);
  });

  $('searchInput').addEventListener('input', function () {
    state.query = this.value;
    renderRecent();
    renderTopicList();
    var query = this.value.trim();
    if (query.length < 2) $('hitsSection').hidden = true;
    else runTextSearch(query);
  });
  // 手机上搜索框有焦点时浮动按钮让开（安卓键盘弹起时它会浮到结果上面）
  $('searchInput').addEventListener('focus', function () {
    if (!isMobile()) return;
    document.body.classList.add('sp-search-focus');
    updateBottomStack();
  });
  $('searchInput').addEventListener('blur', function () {
    document.body.classList.remove('sp-search-focus');
    updateBottomStack();
  });
  $('sortSelect').addEventListener('change', function () { state.sort = this.value; renderTopicList(); });
  $('manageToggle').addEventListener('click', toggleLibraryManage);
  $('partSeg').addEventListener('click', function (event) {
    var btn = event.target.closest('[data-part]');
    if (!btn) return;
    pinnedFolder = null;
    setPart(btn.dataset.part);
  });
  $('topicInput').addEventListener('input', function () { pinnedFolder = null; state.suggestOpen = true; onTopicFieldChange(); });
  $('topicInput').addEventListener('focus', function () { state.suggestOpen = true; renderSuggest(); });
  $('topicInput').addEventListener('blur', function () {
    setTimeout(function () { state.suggestOpen = false; renderSuggest(); }, 160);
  });
  $('textInput').addEventListener('input', function () { updateWordCount(); growText(); });
  $('textInput').addEventListener('keydown', function (event) {
    if ((event.metaKey || event.ctrlKey) && event.key === 'Enter') { event.preventDefault(); generate(); }
  });
  $('generateBtn').addEventListener('click', generate);
  $('composerFab').addEventListener('click', function () {
    openComposer(state.view === 'topic' ? state.topicKey : null);
  });
  $('sheetBackdrop').addEventListener('click', closeComposer);
  $('dialogBackdrop').addEventListener('click', closeDialog);
  $('moreBackdrop').addEventListener('click', closeSheet);
  $('fpBackdrop').addEventListener('click', closeFullPlayer);
  $('moreSheet').addEventListener('click', function (event) {
    if (event.target.closest('[data-sheet-cancel]')) { closeSheet(); return; }
    var btn = event.target.closest('[data-sheet-index]');
    if (!btn) return;
    var item = sheetItems[Number(btn.dataset.sheetIndex)];
    closeSheet().then(function () { if (item && item.run) item.run(); });
  });
  document.addEventListener('keydown', function (event) {
    if (event.key !== 'Escape') return;
    if (layers.length) { history.back(); return; }
    if (!$('dialog').hidden) closeDialog();
    else if (state.composerOpen && isMobile()) closeComposer();
  });

  $('toggleBtn').addEventListener('click', function () { if (audio.paused) audio.play(); else audio.pause(); });
  $('prevBtn').addEventListener('click', function () { step(-1); });
  $('nextBtn').addEventListener('click', function () { step(1); });
  $('closePlayer').addEventListener('click', stopPlayer);
  $('rateBtn').addEventListener('click', function () {
    var rates = [1, 1.25, 1.5, 0.75];
    var next = rates[(rates.indexOf(state.player.rate) + 1) % rates.length];
    state.player.rate = next;
    audio.playbackRate = next;
    renderPlayer();
  });
  $('fpRate').addEventListener('click', function (event) {
    var btn = event.target.closest('[data-rate]');
    if (btn) setRate(Number(btn.dataset.rate));
  });
  // 手机：点迷你播放条中间（标题那块）打开完整播放器
  $('playerTitle').parentNode.addEventListener('click', function () { if (isMobile()) openFullPlayer(); });
  $('playerTitle').parentNode.addEventListener('keydown', function (event) {
    if (isMobile() && (event.key === 'Enter' || event.key === ' ')) { event.preventDefault(); openFullPlayer(); }
  });

  // ---- 拖动进度条 ----
  var seeking = null;   // 正在拖的那根进度条
  function seekTo(bar, clientX) {
    if (!audio.duration) return;
    var rect = bar.getBoundingClientRect();
    var ratio = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
    // 手动跳转时关掉过渡，否则往回拖会看到指针慢慢“滑”回去
    var fills = document.querySelectorAll('.sp-seek__fill');
    Array.prototype.forEach.call(fills, function (fill) { fill.style.transition = 'none'; });
    paintProgress(ratio);
    audio.currentTime = ratio * audio.duration;
    paintTimes();
    setTimeout(function () {
      Array.prototype.forEach.call(fills, function (fill) { fill.style.transition = ''; });
    }, 50);
  }
  function bindSeek(bar) {
    bar.addEventListener('pointerdown', function (event) {
      seeking = bar;
      try { bar.setPointerCapture(event.pointerId); } catch (e) { /* 忽略 */ }
      seekTo(bar, event.clientX);
    });
    bar.addEventListener('pointermove', function (event) {
      if (seeking === bar) seekTo(bar, event.clientX);
    });
    function end(event) {
      if (seeking !== bar) return;
      seeking = null;
      try { bar.releasePointerCapture(event.pointerId); } catch (e) { /* 忽略 */ }
      paintTimes();
      paintProgress(audio.duration ? audio.currentTime / audio.duration : 0);
    }
    bar.addEventListener('pointerup', end);
    // 触屏上浏览器接管手势时只发 pointercancel，不发 pointerup。以前没接这个事件，
    // seeking 一直是 true，timeupdate 从此直接 return，进度和时间就冻住了。
    bar.addEventListener('pointercancel', end);
    bar.addEventListener('lostpointercapture', end);
  }
  bindSeek($('seekBar'));
  bindSeek($('fpSeek'));
  $('fpSeek').addEventListener('keydown', function (event) {
    if (!audio.duration) return;
    if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
      event.preventDefault();
      audio.currentTime = Math.min(audio.duration, Math.max(0, audio.currentTime + (event.key === 'ArrowLeft' ? -5 : 5)));
    }
  });

  // ---- 滚动：浮动按钮缩成圆的、话题页顶栏显示标题 ----
  function onScroll() {
    if (!isMobile()) return;
    var y = window.scrollY;
    document.body.classList.toggle('sp-scrolled', y > 160);
    var bar = $('topicBar');
    if (state.view === 'topic') {
      var head = $('topicHead').getBoundingClientRect();
      bar.classList.toggle('is-stuck', head.bottom < bar.getBoundingClientRect().bottom);
    }
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  ['touchmove', 'wheel'].forEach(function (type) {
    window.addEventListener(type, function () { lastUserScroll = Date.now(); }, { passive: true });
  });

  window.addEventListener('resize', debounce(function () { placeComposer(); updateBottomStack(); growText(); }, 150));
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', fitViewport);
    window.visualViewport.addEventListener('scroll', fitViewport);
  }
  window.addEventListener('hashchange', function () { routeFromHash(true); });

  function routeFromHash(skipHash, historyState) {
    if (location.hash === lastRouteHash) return;
    var hash = location.hash.replace(/^#/, '');
    var restoreY = historyState && historyState.spY;
    if (!hash) { showLibrary(true, restoreY); return; }
    var params = new URLSearchParams(hash);
    var folder = params.get('folder');
    if (!folder) { showLibrary(true, restoreY); return; }
    lastRouteHash = location.hash;
    showTopic(folder, params.get('file'), skipHash);
  }

  // 跨过 820px（转屏、拖窗口）时按另一套重画
  function onModeChange() {
    placeComposer();
    setSearchPlaceholder();
    if (state.view === 'topic') renderTopic(); else { renderLibrary(); renderHits(); }
    renderPlayer();
    updateBottomStack();
  }
  if (PHONE.addEventListener) PHONE.addEventListener('change', onModeChange);
  else if (PHONE.addListener) PHONE.addListener(onModeChange);

  function setSearchPlaceholder() {
    $('searchInput').placeholder = isMobile() ? '搜话题名或英文原文' : '搜话题名，或搜音频里的英文原文…';
  }

  // ==================== 启动 ====================
  function verifyToken() {
    var token = localStorage.getItem('authToken');
    if (!token) return Promise.resolve(false);
    return fetch('/verify_token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: token })
    }).then(function (r) { return r.json(); }).then(function (data) {
      // 只有服务器明确回答"无效"才清掉凭证、去登录页
      if (data && data.valid === false) {
        localStorage.removeItem('authToken');
        return false;
      }
      return true;
    }).catch(function () {
      // 断网、服务器重启时的 502 页面：说明不了凭证失效，按已登录继续
      return true;
    });
  }

  function bootList() {
    state.listError = false;
    return loadTopics().then(function () {
      renderLibrary();
      routeFromHash(true);
    }).catch(function () {
      state.listError = true;
      $('libStats').textContent = '音频列表加载失败';
      if (isMobile()) renderTopicList();
      toast('音频列表加载失败', 'error');
    });
  }

  verifyToken().then(function (valid) {
    if (!valid) { window.location.href = '/login'; return; }
    setSearchPlaceholder();
    updateWordCount();
    onTopicFieldChange();
    placeComposer();
    updateBottomStack();
    bootList();
  });

})();
</script>
</body>
</html>
