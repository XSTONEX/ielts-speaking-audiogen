<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script>
    (function () {
      try {
        var preference = localStorage.getItem('ui-theme');
        if (preference !== 'light' && preference !== 'dark' && preference !== 'system') preference = 'system';
        var isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = preference === 'system' ? (isDark ? 'dark' : 'light') : preference;
        var root = document.documentElement;
        root.dataset.themePreference = preference;
        root.dataset.theme = theme;
        root.style.colorScheme = theme;
        root.classList.toggle('dark', theme === 'dark');
      } catch (error) {
        document.documentElement.dataset.themePreference = 'system';
        document.documentElement.dataset.theme = 'light';
        document.documentElement.style.colorScheme = 'light';
      }
    })();
  </script>

  <style>
/* ==================== 精读 · 设计令牌 ====================
   和写作逻辑训练同一套：系统字体、近白纸面 + 白卡、一个主色、无阴影、小圆角。
   令牌挂在 body.page-intensive 上：theme.css 在本页样式之后加载，:root 同名变量会被它盖掉。
   组件类名一律 ir- 前缀，避开 theme.css 给旧版 .card / .section / .viewer 写的暗色 !important 规则。 */
* { box-sizing: border-box; }

body.page-intensive {
  --w-cn: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
  --w-en: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif;

  --w-paper: #F7F7F5;
  --w-surface: #FFFFFF;
  --w-sunken: #F3F3F1;
  --w-line: #E3E3DF;
  --w-line-strong: #CFCFCA;

  --w-ink: #1F1F1F;
  --w-ink2: #555555;
  --w-ink3: #8A8A85;
  --w-zh: #77776F;        /* 译文：比正文淡一档，退到英文后面，但仍然读得清 */

  --w-accent: #2F5D9E; --w-accent-soft: #EEF3FA; --w-accent-line: #B7C8E2;
  --w-err: #B3261E;    --w-err-soft: #FBEFEE; --w-err-line: #EFCFCC;
  --w-ok: #2E7D4F;     --w-ok-soft: #EDF6F0;  --w-ok-line: #C9E2D2;
  /* AI 讲解的划词：定位词蓝、题眼红、特别的字紫、辅助灰、答案绿 */
  --xp-loc: #2F5D9E; --xp-loc-bg: rgba(47, 93, 158, .13); --xp-eye: #B3261E; --xp-eye-bg: rgba(179, 38, 30, .13);
  --xp-sp: #6D3FC0;  --xp-sp-bg: rgba(109, 63, 192, .13); --xp-aux: #8A8A85; --xp-ans: #2E7D4F; --xp-ans-bg: rgba(46, 125, 79, .2);
  --xp-hot: rgba(240, 180, 0, .4);

  /* 荧光笔：只用一种黄。比以前浓一档，底下再压一条深一点的黄线，大字号下一眼就能找到划过的词 */
  --w-hl: #FAE39A; --w-hl-hover: #F4D46E; --w-hl-line: #E0B53A;
  /* 划词时的选区：比浏览器默认的淡蓝深，在白纸和黄色高亮上都看得清 */
  --w-sel: rgba(47, 93, 158, .26);

  /* 阅读排版：正文字号 / 行高 / 译文字号 / 正文卡片宽度（含内边距）。手机、横屏、窄桌面在下面各自覆盖 */
  --ir-en: 20px; --ir-en-lh: 1.8;
  --ir-zh: 16.5px; --ir-zh-lh: 1.75;
  --ir-line-gap: 22px;
  --ir-reader-w: 840px;
  --w-tip-bg: #2B2B2B; --w-tip-ink: #FFFFFF;

  --w-r-card: 8px; --w-r-sm: 6px;
  --w-shadow-lg: 0 4px 16px rgba(0, 0, 0, .08);
  --w-ring: 0 0 0 3px rgba(47, 93, 158, .15);
  --w-bar-h: 56px;

  /* 站点令牌对齐：theme.css 的通用输入框、链接、页面底色规则读这些名字 */
  --accent: var(--w-accent);
  --accent-hover: #244A80;
  --accent-soft: var(--w-accent-soft);
  --accent-contrast: #FFFFFF;
  --bg-page: var(--w-paper);
  --bg-surface: var(--w-surface);
  --bg-elevated: var(--w-surface);
  --bg-muted: var(--w-sunken);
  --bg-subtle: var(--w-sunken);
  --text-primary: var(--w-ink);
  --text-secondary: var(--w-ink2);
  --text-muted: var(--w-ink3);
  --border-default: var(--w-line);
  --border-strong: var(--w-line-strong);
  --page-gradient: var(--w-paper);
  --surface-gradient: var(--w-surface);

  margin: 0;
  background: var(--w-paper);
  color: var(--w-ink);
  font-family: var(--w-cn);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

html[data-theme="dark"] body.page-intensive {
  --w-paper: #161616;
  --w-surface: #1E1E1E;
  --w-sunken: #1A1A1A;
  --w-line: #2F2F2F;
  --w-line-strong: #404040;
  --w-ink: #ECECEA;
  --w-ink2: #ADADA8;
  --w-ink3: #7C7C77;
  --w-zh: #96968F;
  --w-accent: #8AB0E6; --w-accent-soft: rgba(138, 176, 230, .13); --w-accent-line: rgba(138, 176, 230, .35);
  --w-err: #EC8379;    --w-err-soft: rgba(236, 131, 121, .12); --w-err-line: rgba(236, 131, 121, .32);
  --w-ok: #7CC293;     --w-ok-soft: rgba(124, 194, 147, .11);  --w-ok-line: rgba(124, 194, 147, .30);
  --xp-loc: #8AB0E6; --xp-loc-bg: rgba(138, 176, 230, .2); --xp-eye: #EC8379; --xp-eye-bg: rgba(236, 131, 121, .22);
  --xp-sp: #B79CF0;  --xp-sp-bg: rgba(183, 156, 240, .2);  --xp-aux: #7C7C77; --xp-ans: #7CC293; --xp-ans-bg: rgba(124, 194, 147, .24);
  --xp-hot: rgba(255, 210, 80, .32);
  --w-hl: rgba(247, 215, 110, .26); --w-hl-hover: rgba(247, 215, 110, .40); --w-hl-line: rgba(247, 215, 110, .70);
  --w-sel: rgba(138, 176, 230, .40);
  --w-tip-bg: #ECECEA; --w-tip-ink: #1F1F1F;
  --w-shadow-lg: 0 4px 16px rgba(0, 0, 0, .45);
  --w-ring: 0 0 0 3px rgba(138, 176, 230, .22);
  --accent-hover: #A7C4EE;
  --accent-contrast: #161616;
}

/* ==================== 按钮 ==================== */
.ir-btn {
  display: inline-flex; align-items: center; gap: 6px;
  height: 36px; padding: 0 14px;
  border: 1px solid var(--w-line); border-radius: var(--w-r-sm);
  background: var(--w-surface); color: var(--w-ink);
  font: 500 14px/1 var(--w-cn); text-decoration: none; white-space: nowrap;
  cursor: pointer; transition: background .15s, border-color .15s;
}
.ir-btn:hover { background: var(--w-sunken); border-color: var(--w-line-strong); }
.ir-btn-primary { background: var(--w-accent); border-color: var(--w-accent); color: var(--accent-contrast); }
.ir-btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.ir-btn svg { width: 16px; height: 16px; flex: none; }

.ir-icon-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 34px; min-width: 34px; padding: 0 9px;
  border: none; border-radius: var(--w-r-sm);
  background: transparent; color: var(--w-ink2);
  font: 500 14px/1 var(--w-cn); white-space: nowrap;
  cursor: pointer; transition: background .15s, color .15s;
}
.ir-icon-btn:hover { background: var(--w-sunken); color: var(--w-ink); }
.ir-icon-btn.is-on { background: var(--w-accent-soft); color: var(--w-accent); }
.ir-icon-btn svg { width: 18px; height: 18px; flex: none; }
.ir-icon-btn:disabled { opacity: .5; cursor: default; }
.ir-btn:focus-visible, .ir-icon-btn:focus-visible, .ir-card:focus-visible { outline: none; box-shadow: var(--w-ring); }
.ir-badge { font: 400 12px/1 var(--w-cn); color: var(--w-ink3); font-variant-numeric: tabular-nums; }
.ir-icon-btn.is-on .ir-badge { color: inherit; opacity: .75; }

.ir-spin {
  width: 14px; height: 14px; flex: none;
  border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%;
  animation: ir-spin .8s linear infinite;
}
@keyframes ir-spin { to { transform: rotate(360deg); } }

/* ==================== 文章列表 ==================== */
.ir-home { max-width: 1080px; margin: 0 auto; padding: 36px 24px 64px; }
.ir-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 28px; }
.ir-eyebrow { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--w-ink3); }
.ir-h1 { margin: 6px 0 4px; font-size: 22px; font-weight: 600; line-height: 1.3; color: var(--w-ink); }
.ir-sub { font-size: 14px; color: var(--w-ink2); }
.ir-head-actions { display: flex; gap: 8px; flex: none; padding-top: 4px; }

.ir-tabs { display: flex; gap: 24px; border-bottom: 1px solid var(--w-line); margin-bottom: 20px; }
.ir-tabs button {
  appearance: none; background: none; border: none; border-bottom: 2px solid transparent;
  margin-bottom: -1px; padding: 0 0 10px;
  font: 500 15px/1.2 var(--w-cn); color: var(--w-ink3); cursor: pointer;
}
.ir-tabs button:hover { color: var(--w-ink); }
.ir-tabs button.active { color: var(--w-ink); border-bottom-color: var(--w-accent); }
.ir-count { margin-left: 6px; font-size: 13px; font-weight: 400; color: var(--w-ink3); font-variant-numeric: tabular-nums; }

.ir-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.ir-card {
  position: relative; display: flex; flex-direction: column; justify-content: space-between; gap: 14px;
  min-height: 100px; padding: 18px 20px 16px;
  background: var(--w-surface); border: 1px solid var(--w-line); border-radius: var(--w-r-card);
  cursor: pointer; transition: border-color .15s;
}
.ir-card:hover { border-color: var(--w-line-strong); }
.ir-card h3 { margin: 0; padding-right: 28px; font: 600 17px/1.4 var(--w-en); color: var(--w-ink); }
.ir-meta { display: flex; align-items: center; gap: 12px; font-size: 14px; color: var(--w-ink3); font-variant-numeric: tabular-nums; }
.ir-audio-tag { display: inline-flex; align-items: center; gap: 4px; color: var(--w-ink2); }
.ir-audio-tag svg { width: 14px; height: 14px; }
.ir-card-del {
  position: absolute; top: 12px; right: 12px;
  width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
  border: none; border-radius: var(--w-r-sm); background: transparent; color: var(--w-ink3);
  opacity: 0; cursor: pointer; transition: opacity .15s, background .15s, color .15s;
}
.ir-card-del svg { width: 16px; height: 16px; }
.ir-card:hover .ir-card-del, .ir-card-del:focus-visible { opacity: 1; }
.ir-card-del:hover { background: var(--w-err-soft); color: var(--w-err); }
.ir-empty { padding: 56px 16px; text-align: center; font-size: 14px; color: var(--w-ink3); border: 1px dashed var(--w-line); border-radius: var(--w-r-card); }

/* ==================== 阅读视图 ==================== */
.ir-viewer { position: fixed; inset: 0; z-index: 1300; display: none; flex-direction: column; background: var(--w-paper); }
.ir-viewer.active { display: flex; }

.ir-bar {
  flex: none; height: var(--w-bar-h);
  display: flex; align-items: center; gap: 8px; padding: 0 12px;
  background: var(--w-surface); border-bottom: 1px solid var(--w-line);
}
.ir-title-wrap { flex: 1; min-width: 0; display: flex; align-items: center; gap: 2px; }
.ir-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 600 16px/1.3 var(--w-en); color: var(--w-ink); }
.ir-edit-title { opacity: 0; }
.ir-title-wrap:hover .ir-edit-title, .ir-edit-title:focus-visible { opacity: 1; }
.ir-edit-title svg { width: 16px; height: 16px; }
.ir-title-edit { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; }
.ir-title-edit input {
  flex: 1; min-width: 0; height: 34px; padding: 0 10px;
  border: 1px solid var(--w-line); border-radius: var(--w-r-sm);
  background: var(--w-surface); color: var(--w-ink); font: 600 15px var(--w-en); outline: none;
}
.ir-title-edit input:focus { border-color: var(--w-accent); box-shadow: var(--w-ring); }
.ir-title-edit .ir-btn { height: 34px; padding: 0 12px; }
.ir-tools { flex: none; display: flex; align-items: center; gap: 2px; }

/* ⋯ 是顶栏的直接子元素（手机上工具栏挪到底部，它留在顶栏），桌面上和工具栏按钮照旧只隔 2px */
.ir-more { position: relative; }
.ir-bar > .ir-more { margin-left: -6px; }
.ir-menu {
  position: absolute; top: calc(100% + 6px); right: 0; z-index: 30;
  display: none; min-width: 188px; padding: 4px;
  background: var(--w-surface); border: 1px solid var(--w-line); border-radius: var(--w-r-card); box-shadow: var(--w-shadow-lg);
}
.ir-menu.open { display: block; }
.ir-menu-item {
  display: flex; align-items: center; gap: 10px; width: 100%;
  height: 36px; padding: 0 10px; border: none; border-radius: var(--w-r-sm);
  background: transparent; color: var(--w-ink); font: 14px/1 var(--w-cn); text-align: left; white-space: nowrap; cursor: pointer;
}
.ir-menu-item:hover { background: var(--w-sunken); }
.ir-menu-item svg { width: 16px; height: 16px; flex: none; color: var(--w-ink2); }
.ir-menu-item .ir-spin { width: 12px; height: 12px; }
body.page-intensive .ir-menu select.ir-select {
  margin-left: auto; height: 28px; padding: 0 4px;
  border: 1px solid var(--w-line); border-radius: var(--w-r-sm);
  background: var(--w-surface); color: var(--w-ink); font: 13px var(--w-cn); cursor: pointer;
}

.ir-body { flex: 1; min-height: 0; display: flex; position: relative; }
.ir-content { flex: 1; min-width: 0; overflow-y: auto; overflow-x: hidden; padding: 40px 24px 120px; transition: margin-right .2s ease; }
.ir-content.panel-open { margin-right: var(--panel-width, 320px); }

.ir-images { max-width: 720px; margin: 0 auto 16px; }
.ir-images-head { margin-bottom: 8px; font-size: 13px; color: var(--w-ink3); }
.images-grid { display: flex; flex-wrap: wrap; gap: 8px; }
.image-item {
  position: relative; width: 112px; height: 112px; overflow: hidden;
  border: 1px solid var(--w-line); border-radius: var(--w-r-sm); background: var(--w-sunken); cursor: zoom-in;
}
.image-item img { display: block; width: 100%; height: 100%; object-fit: cover; }
.image-delete-btn {
  position: absolute; top: 4px; right: 4px; z-index: 1;
  width: 22px; height: 22px; display: flex; align-items: center; justify-content: center;
  border: none; border-radius: 50%; background: rgba(0, 0, 0, .55); color: #fff; font-size: 11px;
  opacity: 0; cursor: pointer; transition: opacity .15s;
}
.image-item:hover .image-delete-btn { opacity: 1; }

/* 正文：一行原文一个 <p>。英文是主角；译文小一号、淡一档，紧贴在它的英文下面；段落标记做成小标题。
   字号 / 行高 / 宽度都读上面的 --ir-* 令牌：桌面 20px、一行 70–75 个字母，适合长时间精读 */
.ir-content .reader {
  max-width: var(--ir-reader-w); margin: 0 auto; padding: 56px 64px 64px;
  background: var(--w-surface); border: 1px solid var(--w-line); border-radius: var(--w-r-card);
  font-family: var(--w-en); color: var(--w-ink);
  font-kerning: normal; text-rendering: optimizeLegibility; overflow-wrap: break-word;
}
.reader p { margin: var(--ir-line-gap) 0 0; }
.reader p:first-child { margin-top: 0; }
.reader p.en { font-size: var(--ir-en); line-height: var(--ir-en-lh); }
.reader p.zh { font: var(--ir-zh)/var(--ir-zh-lh) var(--w-cn); color: var(--w-zh); }
.reader p.en + p.zh { margin-top: 4px; }
.reader p.hd { margin-top: 40px; font: 600 14px/1.5 var(--w-cn); letter-spacing: .06em; color: var(--w-ink3); }
.reader p.hd + p { margin-top: 10px; }
.reader p:first-child.hd { margin-top: 0; }
.ir-viewer.hide-zh .reader p.zh { display: none; }

/* 高亮只画背景和底线（box-shadow），不加左右内边距，不改变文字位置 */
.reader mark.hl, .ir-exam mark.hl {
  position: relative; padding: 2px 0 1px; border-radius: 3px 3px 1px 1px;
  background: var(--w-hl); color: inherit; cursor: pointer;
  box-shadow: inset 0 -2px 0 var(--w-hl-line);
  -webkit-box-decoration-break: clone; box-decoration-break: clone;
  transition: background .15s, box-shadow .15s;
}
.reader mark.hl:hover, .ir-exam mark.hl:hover { background: var(--w-hl-hover); }
.reader mark.hl.active, .ir-exam mark.hl.active { box-shadow: inset 0 -2px 0 var(--w-hl-line), 0 0 0 2px var(--w-accent); }
/* 划词选区：原文和题目栏都用主色的浅蓝，比系统默认的更显眼；选到高亮上时叠在黄色上面照样看得出范围 */
.reader ::selection, .ir-exam ::selection { background: var(--w-sel); color: inherit; }
.reader mark.hl::selection, .ir-exam mark.hl::selection, .reader mark.hl ::selection, .ir-exam mark.hl ::selection { background: rgba(47, 93, 158, .34); }
html[data-theme="dark"] .reader mark.hl::selection, html[data-theme="dark"] .ir-exam mark.hl::selection { background: rgba(138, 176, 230, .50); }
.reader mark.hl .tooltip, .ir-exam mark.hl .tooltip {
  display: none; position: absolute; left: 50%; bottom: calc(100% + 8px); z-index: 20;
  width: max-content; max-width: 300px; padding: 7px 11px; border-radius: var(--w-r-sm);
  background: var(--w-tip-bg); color: var(--w-tip-ink);
  font: 400 14px/1.55 var(--w-cn); letter-spacing: 0; white-space: pre-line; text-align: left;
  transform: translateX(calc(-50% + var(--tip-dx, 0px)));
  pointer-events: none; user-select: none; -webkit-user-select: none;
}
.reader mark.hl.tip-below .tooltip, .ir-exam mark.hl.tip-below .tooltip { bottom: auto; top: calc(100% + 8px); }
.reader mark.hl:hover .tooltip, .reader mark.hl.tip-on .tooltip, .ir-exam mark.hl:hover .tooltip, .ir-exam mark.hl.tip-on .tooltip { display: block; }
.reader mark.hl .tooltip:empty, .ir-exam mark.hl .tooltip:empty { display: none !important; }

/* 划词浮层：白底小卡片，浮在选区上方（手机放在下方，让开系统的复制菜单） */
.floating {
  position: fixed; z-index: 1500; display: none; padding: 4px;
  background: var(--w-surface); border: 1px solid var(--w-line); border-radius: var(--w-r-card); box-shadow: var(--w-shadow-lg);
  font-family: var(--w-cn); white-space: nowrap;
}
.floating button {
  height: 32px; padding: 0 12px; border: none; border-radius: var(--w-r-sm);
  background: transparent; color: var(--w-ink2); font: 500 14px/1 var(--w-cn); cursor: pointer; vertical-align: middle;
}
.floating button:hover { background: var(--w-sunken); color: var(--w-ink); }
.floating .ir-pop-main { color: var(--w-accent); }
.floating .ir-pop-main:hover { color: var(--w-accent); }
.floating .ir-pop-danger { color: var(--w-err); }
.floating .ir-pop-danger:hover { background: var(--w-err-soft); color: var(--w-err); }
.floating button:disabled { color: var(--w-ink3); background: transparent; cursor: not-allowed; }
/* 写释义框里的「AI」：按语境让 AI 写；等结果时转圈、输入框只读 */
.floating .ir-pop-ai { display: inline-flex; align-items: center; gap: 4px; padding: 0 10px; color: var(--w-accent); }
.floating .ir-pop-ai:hover { background: var(--w-accent-soft); color: var(--w-accent); }
.ir-ai-btn svg { width: 15px; height: 15px; flex: none; }
.ir-ai-btn.is-busy svg { animation: ir-spin 1s linear infinite; }
#meaningBox.is-ai textarea { color: var(--w-ink3); }
/* 三击查词等 AI 的时候：词上一道蓝光来回扫，上方一个深色小气泡「AI 释义 ···」。
   画在词所在的块里（绝对定位、正片叠底），不改正文 DOM；写好后高亮从蓝变黄、外圈闪一下 */
/* 挂扫光的块要是定位元素。别给 .ir-group 加：题目跳转按 .ir-q 的 offsetTop（相对题目栏）算滚动位置 */
.reader, .ir-gopts, .ir-layout-body { position: relative; }
.ir-ai-wait {
  position: absolute; pointer-events: none; border-radius: 4px; mix-blend-mode: multiply;
  background: linear-gradient(100deg, rgba(47, 93, 158, .10) 30%, rgba(47, 93, 158, .30) 50%, rgba(47, 93, 158, .10) 70%);
  background-size: 260% 100%; box-shadow: inset 0 -2px 0 rgba(47, 93, 158, .55);
  animation: ir-ai-sweep 1.15s linear infinite, ir-ai-in .2s ease-out;
}
html[data-theme="dark"] .ir-ai-wait { mix-blend-mode: screen; background-image: linear-gradient(100deg, rgba(138, 176, 230, .12) 30%, rgba(138, 176, 230, .34) 50%, rgba(138, 176, 230, .12) 70%); box-shadow: inset 0 -2px 0 rgba(138, 176, 230, .6); }
@keyframes ir-ai-sweep { from { background-position: 130% 0; } to { background-position: -30% 0; } }
@keyframes ir-ai-in { from { opacity: 0; } to { opacity: 1; } }
.ir-ai-badge {
  position: absolute; z-index: 25; pointer-events: none; transform: translate(-50%, -100%);
  display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px 0 11px; border-radius: 13px;
  background: var(--w-tip-bg); color: var(--w-tip-ink); font: 600 12px/1 var(--w-cn); letter-spacing: .02em; white-space: nowrap;
  box-shadow: 0 4px 14px rgba(0, 0, 0, .16); animation: ir-ai-badge-in .22s cubic-bezier(.2, .9, .3, 1.3);
}
.ir-ai-badge::after { content: ''; position: absolute; left: 50%; bottom: -4px; margin-left: -4px; border: 4px solid transparent; border-bottom: none; border-top-color: var(--w-tip-bg); }
@keyframes ir-ai-badge-in { from { opacity: 0; transform: translate(-50%, calc(-100% + 6px)) scale(.9); } to { opacity: 1; transform: translate(-50%, -100%); } }
.ir-ai-dots { display: inline-flex; gap: 3px; }
.ir-ai-dots i { width: 4px; height: 4px; border-radius: 50%; background: currentColor; opacity: .35; animation: ir-ai-dot 1s ease-in-out infinite; }
.ir-ai-dots i:nth-child(2) { animation-delay: .15s; }
.ir-ai-dots i:nth-child(3) { animation-delay: .3s; }
@keyframes ir-ai-dot { 0%, 70%, 100% { opacity: .35; transform: none; } 35% { opacity: 1; transform: translateY(-3px); } }
.ir-ai-wait.is-fail { animation: none; background: var(--w-err-soft); box-shadow: inset 0 -2px 0 var(--w-err-line); transition: opacity .4s .4s; opacity: 0; }
.ir-ai-badge.is-fail { background: var(--w-err); animation: none; transition: opacity .4s .4s; opacity: 0; }
.ir-ai-badge.is-fail .ir-ai-dots { display: none; }
.reader mark.hl.ir-hl-new, .ir-exam mark.hl.ir-hl-new { animation: ir-hl-pop .7s ease-out; }
@keyframes ir-hl-pop {
  0% { background: rgba(47, 93, 158, .28); box-shadow: inset 0 -2px 0 var(--w-accent), 0 0 0 0 rgba(224, 181, 58, .55); }
  60% { box-shadow: inset 0 -2px 0 var(--w-hl-line), 0 0 0 6px rgba(224, 181, 58, 0); }
  100% { background: var(--w-hl); box-shadow: inset 0 -2px 0 var(--w-hl-line), 0 0 0 0 rgba(224, 181, 58, 0); }
}
@media (prefers-reduced-motion: reduce) { .ir-ai-wait, .ir-ai-badge, .ir-ai-dots i, mark.hl.ir-hl-new { animation: none !important; } }
#meaningBox { padding: 6px; }
body.page-intensive #meaningBox textarea {
  display: inline-block; width: 260px; height: 34px; max-height: 150px; padding: 6px 10px; margin: 0 2px 0 0; vertical-align: middle;
  border: 1px solid var(--w-line); border-radius: var(--w-r-sm); box-sizing: border-box; resize: none; overflow-y: auto;
  background: var(--w-surface); color: var(--w-ink); font: 15px/20px var(--w-cn); outline: none;
}
body.page-intensive #meaningBox textarea:focus { border-color: var(--w-accent); box-shadow: var(--w-ring); }
.ir-toast {
  position: fixed; z-index: 1600; max-width: 280px; padding: 6px 10px; border-radius: var(--w-r-sm);
  background: var(--w-tip-bg); color: var(--w-tip-ink); font: 13px/1.5 var(--w-cn);
  pointer-events: none; animation: ir-toast 2s ease-out forwards;
}
@keyframes ir-toast { 0%, 75% { opacity: 1; } 100% { opacity: 0; } }

/* ==================== 词汇面板：桌面在右侧，手机从底部拉出 ==================== */
.ir-panel {
  position: absolute; top: 0; right: 0; bottom: 0; z-index: 10;
  width: 320px; min-width: 280px; max-width: 60vw;
  display: flex; flex-direction: column;
  background: var(--w-surface); border-left: 1px solid var(--w-line);
  transform: translateX(100%); visibility: hidden; transition: transform .2s ease, visibility .2s;
}
.ir-panel.active { transform: none; visibility: visible; }
.ir-panel-head { flex: none; display: flex; align-items: center; gap: 8px; padding: 10px 8px 10px 16px; border-bottom: 1px solid var(--w-line); }
.ir-panel-title { font-size: 15px; font-weight: 600; white-space: nowrap; }
body.page-intensive .ir-panel-head input {
  flex: 1; min-width: 0; height: 32px; padding: 0 10px;
  border: 1px solid var(--w-line); border-radius: var(--w-r-sm);
  background: var(--w-sunken); color: var(--w-ink); font: 13px var(--w-cn); outline: none;
}
body.page-intensive .ir-panel-head input:focus { border-color: var(--w-accent); background: var(--w-surface); }
.ir-panel-body { flex: 1; overflow-y: auto; }
.ir-panel-empty { padding: 24px 16px; font-size: 13px; color: var(--w-ink3); }
.ir-vi { display: flex; align-items: flex-start; gap: 8px; padding: 10px 8px 10px 16px; border-bottom: 1px solid var(--w-line); cursor: pointer; }
.ir-vi:hover { background: var(--w-sunken); }
.ir-vi-text { flex: 1; min-width: 0; }
.ir-vi-word { font: 600 15px/1.4 var(--w-en); color: var(--w-ink); }
.ir-vi-tag { display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 4px; background: var(--w-sunken); font: 500 11px/18px var(--w-cn); color: var(--w-ink3); vertical-align: 2px; }
.ir-vi-mean { margin-top: 2px; font-size: 13px; line-height: 1.5; color: var(--w-ink2); white-space: pre-line; }
.ir-vi-actions { flex: none; display: flex; }
.ir-vi-actions .ir-icon-btn { height: 28px; min-width: 28px; padding: 0 5px; color: var(--w-ink3); }
.ir-vi-actions .ir-icon-btn svg { width: 16px; height: 16px; }
.resize-handle { position: absolute; left: -3px; top: 0; bottom: 0; width: 6px; cursor: col-resize; }
.resize-handle:hover, .resize-handle.dragging { background: var(--w-accent-line); }

/* ==================== 朗读音频条 ==================== */
.ir-audio {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 5;
  padding: 8px 16px calc(8px + env(safe-area-inset-bottom));
  background: var(--w-surface); border-top: 1px solid var(--w-line);
}
.ir-audio-row { max-width: 720px; margin: 0 auto; display: flex; align-items: center; gap: 4px; }
.ir-audio audio { flex: 1; min-width: 0; height: 36px; }

/* ==================== 大图查看 ==================== */
.ir-modal { position: fixed; inset: 0; z-index: 2000; display: none; background: rgba(0, 0, 0, .88); opacity: 0; transition: opacity .2s; }
.ir-modal.active { opacity: 1; }
.image-modal-overlay { position: absolute; inset: 0; cursor: zoom-out; }
.image-modal-content { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
.image-modal-content > * { pointer-events: auto; }
#modalImage { max-width: 88vw; max-height: 80vh; object-fit: contain; border-radius: 4px; }
.image-modal-close, .image-modal-nav button {
  position: absolute; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
  border: none; border-radius: 50%; background: rgba(255, 255, 255, .12); color: #fff; font-size: 20px; cursor: pointer;
}
.image-modal-close { top: 16px; right: 16px; font-size: 16px; }
.image-modal-close:hover, .image-modal-nav button:hover { background: rgba(255, 255, 255, .22); }
.image-modal-nav button { top: 50%; margin-top: -20px; font-size: 26px; }
#prevImageBtn { left: 16px; }
#nextImageBtn { right: 16px; }
.image-modal-nav button:disabled { opacity: .25; cursor: default; }
.image-modal-info { position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%); }
.counter-and-delete { display: flex; align-items: center; gap: 12px; font-size: 13px; color: rgba(255, 255, 255, .8); }
#deleteImageBtn { height: 28px; padding: 0 12px; border: 1px solid rgba(255, 255, 255, .3); border-radius: var(--w-r-sm); background: transparent; color: #fff; font: 13px var(--w-cn); cursor: pointer; }
#deleteImageBtn:hover { background: rgba(236, 131, 121, .25); border-color: rgba(236, 131, 121, .6); }

/* ==================== 题目（九分学长导入的文章）：桌面在原文右边，窄屏用「原文 / 题目」切换 ==================== */
.reader .ir-ptitle { margin: 0 0 28px; font: 600 26px/1.3 var(--w-en); color: var(--w-ink); }
.reader p.para { margin-top: 32px; }
.reader .ir-ptitle + p { margin-top: 0; }
.reader p.ir-ev { background: var(--w-accent-soft); box-shadow: -10px 0 0 var(--w-accent-soft), 10px 0 0 var(--w-accent-soft); border-radius: 2px; transition: background .3s; }
::highlight(jiufen) { text-decoration-line: underline; text-decoration-color: var(--w-accent); text-decoration-thickness: 2px; text-decoration-style: solid; text-underline-offset: 4px; }

.ir-seg { display: none; }
.ir-exam { display: none; flex: 0 0 var(--exam-w, min(46%, 540px)); min-width: 0; overflow-y: auto; padding: 28px 26px 120px; background: var(--w-surface); border-left: 1px solid var(--w-line); }
.ir-body.has-exam .ir-exam { display: block; }
.ir-body.has-exam .ir-content.panel-open { margin-right: 0; }
/* 原文和题目栏之间的分割条：拖动改宽度（记在本机），双击恢复默认，键盘 ← → 也能调。
   平时只是题目栏的左边线 + 中间一个小把手；指上去 / 拖动时线和把手变成主题色 */
.ir-split { display: none; }
.ir-body.has-exam .ir-split { display: block; position: relative; z-index: 4; flex: none; width: 0; outline: none; touch-action: none; }
.ir-split::before { content: ''; position: absolute; top: 0; bottom: 0; left: -3px; width: 10px; cursor: col-resize; }
.ir-split::after { content: ''; position: absolute; top: 0; bottom: 0; left: 0; width: 1px; background: transparent; transition: background .15s, width .15s; pointer-events: none; }
.ir-split-grip {
  position: absolute; top: 50%; left: -4px; width: 9px; height: 36px; margin-top: -18px; pointer-events: none;
  border: 1px solid var(--w-line-strong); border-radius: 5px; background: var(--w-surface);
  box-shadow: 0 1px 2px rgba(0, 0, 0, .06); transition: border-color .15s, background .15s;
}
.ir-split-grip::before { content: ''; position: absolute; left: 3px; top: 11px; width: 1px; height: 12px; border-left: 1px solid var(--w-ink3); }
.ir-split:hover::after, .ir-split:focus-visible::after, .ir-split.is-dragging::after { background: var(--w-accent); }
.ir-split.is-dragging::after { width: 2px; left: -1px; }
.ir-split:hover .ir-split-grip, .ir-split:focus-visible .ir-split-grip, .ir-split.is-dragging .ir-split-grip { border-color: var(--w-accent); background: var(--w-accent-soft); }
.ir-split:hover .ir-split-grip::before, .ir-split:focus-visible .ir-split-grip::before, .ir-split.is-dragging .ir-split-grip::before { border-color: var(--w-accent); }
body.ir-splitting, body.ir-splitting * { cursor: col-resize !important; -webkit-user-select: none !important; user-select: none !important; }
@media (pointer: coarse) { .ir-split::before { left: -12px; width: 24px; } }
.ir-body.has-exam .ir-content .reader { padding: 48px 52px 56px; }

.ir-exam-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding-bottom: 16px; border-bottom: 1px solid var(--w-line); }
.ir-exam-part { font-size: 14px; color: var(--w-ink3); }
.ir-exam-score { margin-top: 4px; font-size: 16px; font-weight: 600; color: var(--w-ink); font-variant-numeric: tabular-nums; }
.ir-exam-score span { margin-left: 8px; font-size: 14px; font-weight: 400; color: var(--w-ink3); }
.ir-exam-tools { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px; }
.ir-exam-tools .ir-icon-btn { height: 30px; padding: 0 10px; font-size: 13px; }

.ir-group { padding: 24px 0 8px; }
.ir-group + .ir-group { border-top: 1px solid var(--w-line); }
.ir-group-range { margin: 0 0 8px; font-size: 17px; font-weight: 600; color: var(--w-ink); }
.ir-group-inst { font-size: 15px; line-height: 1.65; color: var(--w-ink2); }
.ir-group-inst strong { color: var(--w-ink); font-weight: 600; }
.ir-group-img { display: block; max-width: 100%; margin: 12px 0 0; border: 1px solid var(--w-line); border-radius: var(--w-r-sm); }
.ir-gopts { margin: 12px 0 0; padding: 10px 12px; list-style: none; background: var(--w-sunken); border-radius: var(--w-r-sm); font: 16px/1.65 var(--w-en); }
.ir-gopts b { display: inline-block; min-width: 22px; }
.ir-layout { margin-top: 12px; font-size: 14px; color: var(--w-ink2); }
.ir-layout summary { cursor: pointer; color: var(--w-ink3); }
.ir-layout-body { margin-top: 8px; padding: 10px 12px; overflow-x: auto; background: var(--w-sunken); border-radius: var(--w-r-sm); font: 16px/1.7 var(--w-en); color: var(--w-ink); }
.ir-layout-body table { border-collapse: collapse; }
.ir-layout-body td, .ir-layout-body th { padding: 4px 8px; vertical-align: top; text-align: left; }
.ir-layout-body p { margin: 0 0 6px; }
.ir-blank { display: inline-block; min-width: 28px; padding: 0 6px; border: 1px solid var(--w-line-strong); border-radius: 4px; background: var(--w-surface); font: 600 13px/22px var(--w-cn); text-align: center; color: var(--w-ink2); cursor: pointer; }

.ir-q { position: relative; margin-top: 14px; padding: 14px 16px 12px 50px; border: 1px solid var(--w-line); border-radius: var(--w-r-card); transition: border-color .15s, box-shadow .15s; }
.ir-q.is-active { border-color: var(--w-accent-line); box-shadow: var(--w-ring); }
.ir-q-num { position: absolute; left: 13px; top: 15px; width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font: 600 13px/1 var(--w-cn); background: var(--w-sunken); color: var(--w-ink2); font-variant-numeric: tabular-nums; }
.ir-q.is-right .ir-q-num { background: var(--w-ok-soft); color: var(--w-ok); }
.ir-q.is-wrong .ir-q-num { background: var(--w-err-soft); color: var(--w-err); }
.ir-q-text { font: 17px/1.65 var(--w-en); color: var(--w-ink); }
.ir-q-zh { margin-top: 3px; font: 14px/1.65 var(--w-cn); color: var(--w-zh); }
.ir-viewer.hide-zh .ir-q-zh { display: none; }
.ir-opts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; padding: 0; list-style: none; }
.ir-opts.is-list { display: block; }
.ir-opt { display: inline-flex; align-items: baseline; gap: 6px; padding: 3px 10px; border: 1px solid var(--w-line); border-radius: var(--w-r-sm); font: 15px/1.6 var(--w-en); color: var(--w-ink2); }
.ir-opts.is-list .ir-opt { display: flex; margin-top: 6px; }
.ir-opt b { font-weight: 600; }
.ir-opt .ir-q-zh { margin: 0; font-size: 13px; }
.ir-ans { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 14px; color: var(--w-ink3); }
.ir-ans b { font: 500 15px/1.5 var(--w-en); color: var(--w-ink); }
.ir-q.is-wrong .ir-ans .mine b { color: var(--w-err); text-decoration: line-through; }
.ir-q.is-right .ir-ans .mine b, .ir-ans .right b { color: var(--w-ok); }
.ir-exam:not(.hide-ans) .ir-opt.is-answer { border-color: var(--w-ok-line); background: var(--w-ok-soft); color: var(--w-ok); }
.ir-exam:not(.hide-ans) .ir-opt.is-mine:not(.is-answer) { border-color: var(--w-err-line); background: var(--w-err-soft); color: var(--w-err); text-decoration: line-through; }
.ir-q-actions { display: flex; gap: 2px; margin: 6px 0 0 -8px; }
.ir-q-actions .ir-icon-btn { height: 30px; padding: 0 8px; font-size: 14px; color: var(--w-accent); }
.ir-q-actions .ir-icon-btn svg { width: 14px; height: 14px; }
.ir-exam.hide-ans .ir-q .ir-q-num { background: var(--w-sunken); color: var(--w-ink2); }
.ir-exam.hide-ans .ir-ans, .ir-exam.hide-ans .ir-q-actions { display: none !important; }
.ir-exam.only-wrong .ir-q:not(.is-wrong):not(.is-blank) { display: none; }
.ir-exam-empty { display: none; padding: 32px 0; text-align: center; font-size: 14px; color: var(--w-ink3); }
.ir-exam.only-wrong.no-wrong .ir-exam-empty { display: block; }

/* ==================== AI 讲解：题目栏顶上的页签，按 Lewis 方法重讲每道题（数据来自 /intensive_explain，见 utils/reading_explain.py） ====================
   划词不改 DOM，用 CSS Custom Highlight 画（和九分学长的划线一样），所以自己的高亮、划词下标都不受影响。 */
.ir-xtabs { display: flex; gap: 2px; margin: 14px 0 0; padding: 3px; border-radius: 10px; background: var(--w-sunken); border: 1px solid var(--w-line); }
.ir-xtabs button { flex: 1; min-width: 0; height: 32px; padding: 0 4px; border: none; border-radius: 8px; background: transparent; color: var(--w-ink2); font: 500 14px/1 var(--w-cn); white-space: nowrap; cursor: pointer; }
.ir-xtabs button.is-on { background: var(--w-surface); color: var(--w-ink); font-weight: 600; box-shadow: 0 0 0 1px var(--w-line); }
.ir-exam.hide-ans .ir-xtabs button:not([data-x="q"]) { opacity: .45; }
.ir-xp-status { display: none; margin-top: 14px; font-size: 14px; line-height: 1.65; color: var(--w-ink2); }
.ir-exam:not([data-x="q"]) .ir-xp-status:not(:empty) { display: block; }
.ir-xp-box { padding: 14px 16px; border-radius: var(--w-r-sm); background: var(--w-sunken); }
.ir-xp-box p { margin: 0 0 10px; }
.ir-xp-box p:last-child { margin-bottom: 0; }
.ir-xp-box .ir-spin { display: inline-block; width: 13px; height: 13px; margin-right: 8px; vertical-align: -2px; }
.ir-xp-box.is-err { background: var(--w-err-soft); color: var(--w-err-ink, var(--w-ink2)); }
.ir-xp-legend { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; font-size: 13px; color: var(--w-ink3); }
.ir-xp-legend span { padding: 0 3px; border-radius: 3px; color: var(--w-ink); }
.ir-xp-legend .loc { background: var(--xp-loc-bg); box-shadow: inset 0 -2px 0 var(--xp-loc); }
.ir-xp-legend .eye { background: var(--xp-eye-bg); box-shadow: inset 0 -2px 0 var(--xp-eye); }
.ir-xp-legend .sp { background: var(--xp-sp-bg); box-shadow: inset 0 -2px 0 var(--xp-sp); }
.ir-xp-legend .aux { box-shadow: inset 0 -1px 0 var(--xp-aux); }
.ir-xp-legend .ans { background: var(--xp-ans-bg); color: var(--xp-ans); }
.ir-xp-legend button { margin-left: auto; padding: 4px 0; border: none; background: none; color: var(--w-ink3); font: 13px/1 var(--w-cn); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.ir-xp-legend button:hover { color: var(--w-accent); }

::highlight(xp-aux) { text-decoration-line: underline; text-decoration-style: dashed; text-decoration-color: var(--xp-aux); text-decoration-thickness: 1.5px; text-underline-offset: 4px; }
::highlight(xp-loc) { background-color: var(--xp-loc-bg); text-decoration-line: underline; text-decoration-color: var(--xp-loc); text-decoration-thickness: 2px; text-underline-offset: 4px; }
::highlight(xp-sp) { background-color: var(--xp-sp-bg); text-decoration-line: underline; text-decoration-color: var(--xp-sp); text-decoration-thickness: 2px; text-underline-offset: 4px; }
::highlight(xp-eye) { background-color: var(--xp-eye-bg); text-decoration-line: underline; text-decoration-color: var(--xp-eye); text-decoration-thickness: 2.5px; text-underline-offset: 4px; }
::highlight(xp-miss) { text-decoration-line: underline; text-decoration-style: wavy; text-decoration-color: var(--xp-eye); text-decoration-thickness: 1.5px; text-underline-offset: 4px; }
::highlight(xp-ans) { background-color: var(--xp-ans-bg); color: var(--xp-ans); text-decoration-line: underline; text-decoration-color: var(--xp-ans); text-decoration-thickness: 2.5px; text-underline-offset: 4px; }
::highlight(xp-hot) { background-color: var(--xp-hot); }

/* 原文：AI 讲解页签下，每句左边露出句号（讲解里的 [14] 指的就是它），是某道题证据的句子末尾带上题号 */
.ir-viewer.xp-on .reader p[data-s] { position: relative; }
.ir-viewer.xp-on .reader p[data-s]::before { content: attr(data-s); position: absolute; left: -28px; top: .5em; width: 22px; text-align: right; font: 500 11px/1 var(--w-cn); color: var(--w-ink3); font-variant-numeric: tabular-nums; opacity: .75; }

@media (min-width: 821px) and (max-width: 900px) and (min-height: 541px), (min-width: 821px) and (max-width: 900px) and (pointer: fine), (min-width: 821px) and (max-width: 900px) and (pointer: none) {

   划词、写释义、看词、⋯ 菜单、改标题、题目都是从底部升起的面板；系统返回键先关最上面一层。 */

  <script>
    let currentToken=null; let currentArticle=null; let selectionRange=null; let highlights=[]; let lastSelectionRect=null;
    let currentImages=[]; let currentImageIndex=0;

    // 动态插入的图标（静态按钮的图标直接写在 HTML 里）
    const SVG = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
    const IC = {
      volume: SVG('<path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/>'),
      redo: SVG('<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>'),
      trash: SVG('<path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/>'),
      jump: SVG('<path d="M7 17 17 7"/><path d="M8 7h9v9"/>'),
      spin: '<span class="ir-spin"></span>',
      more: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg>',
      play: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5Z"/></svg>',
      pause: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6.5" y="5" width="4" height="14" rx="1"/><rect x="13.5" y="5" width="4" height="14" rx="1"/></svg>',
      chevUp: SVG('<path d="m6 15 6-6 6 6"/>'),
      close: SVG('<path d="M18 6 6 18M6 6l12 12"/>'),
    };

    // ===== 手机（≤820px）：判断、弹层和系统返回键 =====
    const phoneMQ = window.IELTSPhone.mq; // 窄屏或横着拿的手机，见 static/theme.js
    function isPhone(){ return !!phoneMQ.matches; }
    const $id = id => document.getElementById(id);
    // 手机上每打开一层（底部面板、大图、题目面板）就往历史里压一条：系统返回 / iOS 侧滑先关最上面这一层，
    // 不会一下子离开精读页。界面自己关掉一层（✕、点遮罩、保存）时同步收起，再 history.go(-n) 把条目退掉，
    // 那次 popstate 由 skipPops 吃掉。退历史是异步的，退的途中又要压新条目（关单词卡、马上开词汇表）就先排队。
    const layers = [];   // [{ name, hide, modal }]，最上面一层在最后
    let skipPops = 0, afterPop = null; const queuedHistory = [];
    function withHistory(fn){ if(skipPops > 0) queuedHistory.push(fn); else { try{ fn(); }catch(e){} } }
    function historyBack(n, after){
      if(n <= 0){ if(after) after(); return; }
      skipPops++; afterPop = after || null; history.go(-n);
    }
    function hasLayer(name){ return layers.some(l => l.name === name); }
    function openLayer(name, hide, modal){
      if(!isPhone() || hasLayer(name)) return;
      layers.push({ name, hide, modal: !!modal });
      const state = Object.assign({}, history.state, { irLayer: name, irDepth: layers.length });
      withHistory(() => history.pushState(state, ''));
      syncScrim();
    }
    function closeLayer(name, after){
      const i = layers.findIndex(l => l.name === name);
      if(i < 0){ if(after) after(); return; }
      const removed = layers.splice(i);
      removed.reverse().forEach(l => l.hide());
      syncScrim();
      historyBack(removed.length, after);
    }
    // 从一层直接换到另一层（⋯ 菜单 →「修改标题」）：历史条目不动，只换名字
    function swapLayer(oldName, name, hide, modal){
      const l = layers.find(x => x.name === oldName);
      if(!l){ openLayer(name, hide, modal); return; }
      l.hide(); Object.assign(l, { name, hide, modal: !!modal });
      const state = Object.assign({}, history.state, { irLayer: name });
      withHistory(() => history.replaceState(state, ''));
      syncScrim();
    }
    function closeAllLayers(){ const n = layers.length; layers.splice(0).reverse().forEach(l => l.hide()); syncScrim(); return n; }
    function closeTopModalLayer(){ const top = layers.slice().reverse().find(l => l.modal); if(top) closeLayer(top.name); }
    function syncScrim(){ const s = $id('irScrim'); if(s) s.hidden = !layers.some(l => l.modal); }
    window.addEventListener('popstate', function(e){
      if(skipPops > 0){
        skipPops--; const f = afterPop; afterPop = null; if(f) f();
        if(!skipPops) queuedHistory.splice(0).forEach(fn => { try{ fn(); }catch(err){} });
        return;
      }
      const depth = (e.state && e.state.irDepth) || 0;
      while(layers.length > depth){ layers.pop().hide(); }

    function checkStoredToken(){

    function initPageState(){
      const hash = window.location.hash;

      if(hash && hash.startsWith('#article-')){
        // 如果有文章hash，获取文章信息并设置正确的分类，然后打开文章
        const articleId = hash.replace('#article-', '');
        if(articleId){
          // 先获取文章信息以确定分类
          fetch(`/intensive_article/${articleId}`)
            .then(r => r.json())
            .then(d => {
              if(d.success){
                const articleCategory = d.article.category || 'Reading';
                // 设置正确的分类状态
                activeCat = articleCategory;
                localStorage.setItem('activeCategory', articleCategory);
                // 更新UI显示
                ['Reading','Listening','Writing'].forEach(c => {
                  const el = document.getElementById('tab-'+c);
                  if(el) el.className = (c === activeCat ? 'active' : '');
                });
                // 然后打开文章（不设置hash，因为已经有了）。这条历史不是我们压的：系统返回回到来的地方（比如词汇汇总）
                readerPushed = false;
                openArticleDirect(articleId, d.article);
              } else {
                // 文章不存在，清除hash并恢复分类状态
                window.location.hash = '';
                initCategoryState();
              }
            })
            .catch(() => {
              // 获取失败，清除hash并恢复分类状态
              window.location.hash = '';
              initCategoryState();
            });
        }
      } else {
        // 没有文章hash，从localStorage恢复分类状态
        initCategoryState();
      }
    }

    function createArticle(){ const title=document.getElementById('title').value.trim(); const category=document.getElementById('category').value; const content=document.getElementById('content').value; if(!content.trim()){ showCreateMsg('请粘贴文章内容', true); return; } fetch('/intensive_create',{method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({title, category, content})}).then(r=>r.json()).then(d=>{ if(d.success){ showCreateMsg('创建成功', false); document.getElementById('content').value=''; document.getElementById('title').value=''; loadList(); openArticle(d.id); } else { showCreateMsg(d.error||'创建失败', true); } }); }

    // ===== 打开 / 关上文章：网址带 #article-<id>，系统返回关掉阅读页回到列表 =====

    function loadArticle(id){
      // 前进 / 后退会直接从一篇换到另一篇：上一篇的播放条和「继续生成」先收掉
      if(currentArticle && currentArticle.id !== id){ closeAudioPanel(); currentAudioInfo = null; document.getElementById('resumeAudioBtn').style.display = 'none'; }
      fetch(`/intensive_article/${id}`).then(r=>r.json()).then(d=>{ if(!d.success){ alert(d.error||'加载失败'); return; } const art=d.article; currentArticle=art; highlights = art.highlights||[]; currentImages = art.images||[]; document.getElementById('vTitle').textContent = `${art.title||'未命名'}`; document.getElementById('vCategory').value = art.category||'Reading'; const contentDiv=document.getElementById('vContent'); contentDiv.innerHTML = `<div id="articleImages" class="ir-images" style="display: none;"><div class="ir-images-head">文章图片</div><div class="images-grid" id="imagesGrid"></div></div><div class=\"reader\"></div>`; renderReader(contentDiv.querySelector('.reader'), art); setupExam(art); document.getElementById('viewer').classList.add('active'); enterReader(); loadArticleImages(); restoreHighlights(contentDiv, art); closeHighlightsPanel(); checkForJumpHighlight();

    function checkForJumpHighlight(){ const targetHighlightId = sessionStorage.getItem('jumpToHighlight'); if(targetHighlightId){ sessionStorage.removeItem('jumpToHighlight'); setTimeout(()=>{ scrollToHighlight(targetHighlightId); }, 300); } }
    function renderHighlightsPanel(){
      const searchVal=(document.getElementById('hpSearch').value||'').toLowerCase(); const body=document.getElementById('hpBody'); body.innerHTML='';
      const wordOf = h => h.text || (h.qk ? '' : (currentArticle.content_text||'').substring(h.start, h.end));
      const say = h => { const w = wordOf(h); if(w && window.playWordPronunciation){ window.playWordPronunciation(w.trim(), currentArticle?.id); } };
      // 同一个范围存了两条（旧版本留下的）只列一次，和正文、词数一致。正文里的词在前，题目里的按题目顺序排在后面
      const qOrder = examBlockOrder();
      const rank = h => h.qk ? 1e9 + (qOrder.has(h.qk) ? qOrder.get(h.qk) : qOrder.size) * 1e5 + h.start : h.start;
      const wkey = h => (wordOf(h) || '').trim().toLowerCase() || hlKey(h);
      // 同一个词只列一条（本文里它出现的地方都已经自动标上了）
      let list=(highlights||[]).slice().sort((a,b)=>rank(a)-rank(b)).filter((h,i,all)=>all.findIndex(x=>hlKey(x)===hlKey(h) || wkey(x)===wkey(h))===i);
      if(searchVal){ list=list.filter(h=> wordOf(h).toLowerCase().includes(searchVal) || (h.meaning||'').toLowerCase().includes(searchVal)); }
      if(!list.length){ body.innerHTML=`<div class="ir-panel-empty">${searchVal?'没有匹配的词':'还没有高亮。在正文里选中单词或短语，就能记下释义。'}</div>`; return; }
      list.forEach(h=>{
        const item=document.createElement('div'); item.className='ir-vi'; item.dataset.hid=h.id;
        item.innerHTML=`<div class="ir-vi-text"><div class="ir-vi-word"></div><div class="ir-vi-mean"></div></div><div class="ir-vi-actions"><button class="ir-icon-btn" title="播放发音" aria-label="播放发音">${IC.volume}</button><button class="ir-icon-btn" title="跳到原文" aria-label="跳到原文">${IC.jump}</button></div>`;
        item.querySelector('.ir-vi-word').textContent = wordOf(h);
        if(h.qk){ const tag=document.createElement('span'); tag.className='ir-vi-tag'; tag.textContent=qkLabel(h.qk); item.querySelector('.ir-vi-word').appendChild(tag); }
        item.querySelector('.ir-vi-mean').textContent = h.meaning || '';
        const [playBtn, jumpBtn] = item.querySelectorAll('button');
        playBtn.onclick=function(e){ e.stopPropagation(); say(h); };
        // 手机上面板会挡住正文，跳过去之前先收起
        jumpBtn.onclick=function(e){ e.stopPropagation(); if(isPhone()){ hideHighlightsPanel(); closeLayer('vocab', () => scrollToHighlight(h.id)); return; } scrollToHighlight(h.id); };
        item.onclick=function(){ say(h); };
        body.appendChild(item);
      });
    }

    // --panel-width 也写在 .ir-body 上：821–900px 的题目栏（正文的兄弟元素）要按它让位
    function updatePanelWidth(){ const panel=document.getElementById('highlightsPanel'); const content=document.getElementById('vContent'); if(panel && content){ panel.style.width = panelWidth + 'px'; content.style.setProperty('--panel-width', panelWidth + 'px'); content.parentNode.style.setProperty('--panel-width', panelWidth + 'px'); } }
    function scrollToHighlight(hid){ try{ const container=document.getElementById('vContent'); const mark=container.querySelector(`mark.hl:not(.hl-echo)[data-hid="${CSS.escape(hid)}"]`); if(mark){ mark.scrollIntoView({behavior:'smooth', block:'center'}); flashMarks(container, hid); return; } scrollToExamHighlight(hid); }catch(e){} }
    function flashMarks(root, hid){ const marks = root.querySelectorAll(`mark.hl[data-hid="${CSS.escape(hid)}"]`); marks.forEach(m => m.classList.add('active')); setTimeout(()=>{ marks.forEach(m => m.classList.remove('active')); }, 1200); }
    // 题目里的词：把题目栏翻出来（窄屏切到「题目」，手机升起题目面板），再滚到这个词
    function scrollToExamHighlight(hid){
      const pane = document.getElementById('examPane');
      const mark = pane.querySelector(`mark.hl:not(.hl-echo)[data-hid="${CSS.escape(hid)}"]`) || pane.querySelector(`mark.hl[data-hid="${CSS.escape(hid)}"]`); if(!mark) return;
      const qEl = mark.closest('.ir-q');
      if(pane.classList.contains('only-wrong') && qEl && !qEl.classList.contains('is-wrong') && !qEl.classList.contains('is-blank')) setOnlyWrong(false);
      const det = mark.closest('details'); if(det) det.open = true;
      if(isPhone()){
        if(qEl){ setCurrentQuestion(qEl); if(pane.classList.contains('is-full')) setQuestionsFull(false); else openQuestionsSheet(); }
        else setQuestionsFull(true);
      } else if(window.innerWidth <= 900) showExamTab('questions');
      if(qEl && !isPhone()) markActiveQuestion(qEl);
      requestAnimationFrame(() => { const r = mark.getBoundingClientRect(), pr = pane.getBoundingClientRect(); pane.scrollTop += (r.top + r.height / 2) - (pr.top + pr.height / 2); flashMarks(pane, hid); });
    }
    // ‹ 返回：关掉阅读页。文章那条历史是我们压的就退回去（以前是再写一个空 hash，又多压一条，
    // 之后按系统返回「什么都没发生」）；是从链接直接进来的，就把网址里的 #article- 去掉
    function closeViewer(){
      const n = closeAllLayers();
      closeViewerUi();
      const clearHash = () => { if(hashArticleId()) history.replaceState(null, '', location.pathname + location.search); };
      historyBack(n + (readerPushed ? 1 : 0), clearHash);
      readerPushed = false;
    }
    function closeViewerUi(){
      closeAllLayers();
      document.getElementById('viewer').classList.remove('active');
      currentArticle=null;
      selectionRange=null;
      highlights=[];
      cancelFloat();
      cancelMeaning();
      closeMoreMenu();
      closeHighlightsPanel();
      closeAudioPanel();
      setupExam(null);
      currentAudioInfo=null;
      updateAudioButton(false);
      document.getElementById('resumeAudioBtn').style.display = 'none';
      if(isPhone() && document.getElementById('titleEditContainer').style.display !== 'none') cancelTitleEdit();
      document.body.classList.remove('ir-reading');
      if(isPhone()) window.scrollTo(0, listScrollY);
      updateDock();
    }

    // 拖拽调整侧边栏宽度
    function initResizeHandle(){ 
      const resizeHandle = document.getElementById('resizeHandle'); 
      const panel = document.getElementById('highlightsPanel'); 
      let isResizing = false; 
      let startX = 0; 
      let startWidth = 0;
      
      resizeHandle.addEventListener('mousedown', function(e) { 
        if(window.innerWidth <= 768) return; // 移动端禁用
        isResizing = true; 
        startX = e.clientX; 
        startWidth = panelWidth; 
        resizeHandle.classList.add('dragging');
        document.body.style.cursor = 'col-resize'; 
        document.body.style.userSelect = 'none'; 
        e.preventDefault(); 
      }); 
      
      document.addEventListener('mousemove', function(e) { 
        if (!isResizing) return; 
        const diff = startX - e.clientX; 
        const newWidth = Math.max(280, Math.min(window.innerWidth * 0.6, startWidth + diff)); 
        panelWidth = newWidth; 
        updatePanelWidth(); 
      }); 
      
      document.addEventListener('mouseup', function() { 
        if (isResizing) { 
          isResizing = false; 
          resizeHandle.classList.remove('dragging');
          document.body.style.cursor = ''; 
          document.body.style.userSelect = ''; 
          // 保存宽度到localStorage
          localStorage.setItem('panelWidth', panelWidth);
        } 
      }); 
      
      // 恢复保存的宽度
      const savedWidth = localStorage.getItem('panelWidth');
      if(savedWidth) {
        panelWidth = Math.max(280, Math.min(window.innerWidth * 0.6, parseInt(savedWidth)));
      }
      
      // 窗口大小变化时调整面板宽度
      window.addEventListener('resize', function() {
        if (panelWidth > window.innerWidth * 0.6) {
          panelWidth = Math.max(280, window.innerWidth * 0.6);
          updatePanelWidth();
        }
      });
    }

    // 原文和题目栏之间的分割条（桌面 >900px）：拖动改题目栏宽度，记在本机；双击恢复默认；聚焦后 ← → 每次 24px
    const EXAM_W_KEY = 'intensiveExamWidth';
    let examWidth = null;   // 题目栏宽度（px），null = 默认 min(46%, 540px)
    function clampExamWidth(w){
      const total = document.querySelector('#viewer .ir-body').clientWidth;
      if(!total) return Math.round(w);   // 阅读页还没打开，量不出来；打开文章时（enterReader）再算一次
      return Math.round(Math.max(320, Math.min(Math.max(320, total - 400), w)));   // 原文至少留 400px，题目栏至少 320px
    }
    function applyExamWidth(){
      const body = document.querySelector('#viewer .ir-body'), split = document.getElementById('examSplit');
      if(examWidth == null) body.style.removeProperty('--exam-w'); else body.style.setProperty('--exam-w', clampExamWidth(examWidth) + 'px');
      const pane = document.getElementById('examPane');
      if(pane.offsetWidth) split.setAttribute('aria-valuenow', String(Math.round(pane.offsetWidth / body.clientWidth * 100)));
    }
    function initExamSplit(){
      const split = document.getElementById('examSplit'), body = document.querySelector('#viewer .ir-body');
      try{ const v = parseInt(localStorage.getItem(EXAM_W_KEY), 10); if(v > 0) examWidth = v; }catch(e){}
      split.setAttribute('aria-valuemin', '0'); split.setAttribute('aria-valuemax', '100');
      applyExamWidth();
      const save = () => { try{ if(examWidth == null) localStorage.removeItem(EXAM_W_KEY); else localStorage.setItem(EXAM_W_KEY, String(examWidth)); }catch(e){} };
      let dragging = null;   // { id, frame }
      split.addEventListener('pointerdown', function(e){
        if(e.button !== 0 || isPhone()) return;
        e.preventDefault();
        cancelFloat();
        dragging = { id: e.pointerId, frame: 0 };
        try{ split.setPointerCapture(e.pointerId); }catch(err){}
        split.classList.add('is-dragging'); document.body.classList.add('ir-splitting');
      });
      split.addEventListener('pointermove', function(e){
        if(!dragging || e.pointerId !== dragging.id) return;
        const x = e.clientX;
        cancelAnimationFrame(dragging.frame);
        dragging.frame = requestAnimationFrame(() => { examWidth = clampExamWidth(body.getBoundingClientRect().right - x); applyExamWidth(); });
      });
      const end = function(e){
        if(!dragging || e.pointerId !== dragging.id) return;
        cancelAnimationFrame(dragging.frame);
        if(e.type === 'pointerup'){ examWidth = clampExamWidth(body.getBoundingClientRect().right - e.clientX); applyExamWidth(); }
        dragging = null;
        split.classList.remove('is-dragging'); document.body.classList.remove('ir-splitting');
        save();
      };
      split.addEventListener('pointerup', end);
      split.addEventListener('pointercancel', end);
      split.addEventListener('dblclick', function(){ examWidth = null; applyExamWidth(); save(); });
      split.addEventListener('keydown', function(e){
        if(e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
        e.preventDefault();
        const cur = document.getElementById('examPane').offsetWidth;
        examWidth = clampExamWidth(cur + (e.key === 'ArrowLeft' ? 24 : -24)); applyExamWidth(); save();
      });
      // 窗口变窄时题目栏跟着收，原文不会被挤没
      window.addEventListener('resize', applyExamWidth);
    }

    // 文本选择与悬浮操作
    // 只在页面初始化时绑定一次：#vContent 一直是同一个元素，换文章只换里面的内容。
    // 每打开一篇就再绑一个的话，旧监听会拿上一篇文章的原文去算，算不出来就把选区清掉，当前文章就划不出词。
    // 鼠标划词在 mouseup 时处理。手机长按选词、拖选区手柄都不会触发 mouseup，改为等选区停下来再处理。
    let lastPointerType = 'mouse';
    let floatPressed = false;
    document.addEventListener('pointerdown', function(e){
      lastPointerType = e.pointerType || 'mouse';
      floatPressed = !!(e.target.closest && e.target.closest('.floating'));
    }, true);
    function bindSelection(container){
      const pane = document.getElementById('examPane');
      // 三击一个词 = 直接标注：第三下不让浏览器扩成整段，选区还是前两下（双击）选中的那个词，
      // 照常算出下标后交给 tripleClickAnnotate()：念一遍，AI 按这句话的语境写释义并直接存成高亮
      [container, pane].forEach(el => el.addEventListener('mousedown', function(e){
        if(e.detail >= 3 && e.button === 0 && lastPointerType === 'mouse' && !e.target.closest('.floating')) e.preventDefault();
      }));
      // 写释义的框开着时别处的点击不算重新划词（不然选区被清掉，「保存」就没东西可存）
      container.addEventListener('mouseup', function(e){ if(lastPointerType === 'mouse' && !isVisible('meaningBox')){ if(e.detail === 3) selectWordAt(e.clientX, e.clientY); handleReaderSelection(container); if(e.detail === 3) tripleClickAnnotate(); } });
      pane.addEventListener('mouseup', function(e){ if(lastPointerType === 'mouse' && !isVisible('meaningBox')){ if(e.detail === 3) selectWordAt(e.clientX, e.clientY); handleExamSelection(); if(e.detail === 3) tripleClickAnnotate(); } });
      let timer = null;
      document.addEventListener('selectionchange', function(){
        if(lastPointerType === 'mouse') return;
        clearTimeout(timer);
        timer = setTimeout(function(){
          if(isVisible('meaningBox')) return;
          const sel = window.getSelection();
          if(!sel || sel.isCollapsed || !sel.rangeCount){
            // 点浮层上的按钮时系统会先收起选区，这时浮层不能跟着关，否则按钮点不到
            if(isVisible('floatBox') && !floatPressed) cancelFloat();
            return;
          }
          const anc = sel.getRangeAt(0).commonAncestorContainer;
          if(container.contains(anc)) handleReaderSelection(container, true);
          else if(pane.contains(anc)) handleExamSelection(true);
        }, 350);
      });
    }
    function handleReaderSelection(container, soft){
      // soft：手机上选区还在调整，失败时只收起浮层，不清掉用户的选区
      const fail = soft ? hideFloat : cancelFloat;
        const art=currentArticle; const reader=container.querySelector('.reader');
        const sel=window.getSelection(); if(!art || !reader || !sel || sel.isCollapsed || !sel.rangeCount){ fail(); return; }
        const range=sel.getRangeAt(0); if(!container.contains(range.commonAncestorContainer)){ fail(); return; }
        const covered = selectionToOriginal(reader, range);
        if(!covered){ fail(); return; }

        // 检查是否选中了已经高亮的词汇
        if(covered.mark){
          // 如果选中了已高亮的词汇，显示移除选项
          const hid = covered.mark.getAttribute('data-hid');
          selectionRange = { existingHighlight: hid, text: ((highlights||[]).find(h => h.id === hid) || {}).text || '' };
          lastSelectionRect = range.getBoundingClientRect();
          showFloatAtRect(lastSelectionRect, true);
          return;
        }

        // 去掉选区两端的空白（双击、拖过头都会带上空格）
        const original = art.content_text || '';
        let start = covered.start, end = covered.end;
        while(start < end && /\s/.test(original[start])) start++;
        while(end > start && /\s/.test(original[end-1])) end--;
        if(end <= start){ fail(); return; }
        const text = original.slice(start, end);

        // 限制只能在同一段落（同一行）内高亮，避免跨块包裹导致错误
        if(text.includes('\n')){ showTempTooltip('请在同一段内进行高亮', range.getBoundingClientRect()); fail(); return; }

        selectionRange = { start, end, text };
        lastSelectionRect = range.getBoundingClientRect();
        showFloatAtRect(lastSelectionRect, false);
    }

    // 题目栏里划词：只能在同一段题目文字（题干、一个选项、原题版式）里划，存的是这段文字里的下标
    function handleExamSelection(soft){
      const fail = soft ? hideFloat : cancelFloat;
      const pane = document.getElementById('examPane');
      const sel = window.getSelection(); if(!currentArticle || !currentArticle.exam || !sel || sel.isCollapsed || !sel.rangeCount){ fail(); return; }
      const range = sel.getRangeAt(0); if(!pane.contains(range.commonAncestorContainer)){ fail(); return; }
      const hits = [];
      pane.querySelectorAll('[data-hk]').forEach(b => { if(range.intersectsNode(b)){ const c = hkSelection(b, range); if(c) hits.push({ b, c }); } });
      if(!hits.length){ fail(); return; }
      const mark = hits.map(x => x.c.mark).find(Boolean);
      if(mark){
        const hid = mark.getAttribute('data-hid');
        selectionRange = { existingHighlight: hid, text: ((highlights||[]).find(h => h.id === hid) || {}).text || '' };
        lastSelectionRect = range.getBoundingClientRect();
        showFloatAtRect(lastSelectionRect, true);
        return;
      }
      if(hits.length > 1){ showTempTooltip('请在同一句题目里划', range.getBoundingClientRect()); fail(); return; }
      const { b, c } = hits[0];
      const whole = hkText(b);
      let start = c.start, end = c.end;
      while(start < end && /\s/.test(whole[start])) start++;
      while(end > start && /\s/.test(whole[end-1])) end--;
      if(end <= start){ fail(); return; }
      const text = whole.slice(start, end);
      if(/\n/.test(text)){ showTempTooltip('请在同一句题目里划', range.getBoundingClientRect()); fail(); return; }
      selectionRange = { qk: b.dataset.hk, start, end, text };
      lastSelectionRect = range.getBoundingClientRect();
      showFloatAtRect(lastSelectionRect, false);
    }

    // ===== 三击查词 / AI 释义（后端 /intensive_lookup，提示词在 prompts/intensive_lookup.yaml） =====
    // 三击时选区要是鼠标下的那一个词：双击已经选好了就用它；选区是空的或不止一个词（第三下点到了别处），按鼠标位置取词
    function selectWordAt(x, y){
      const sel = window.getSelection();
      const cur = sel && sel.rangeCount ? String(sel).trim() : '';
      if(cur && !/\s/.test(cur)) return;
      let node = null, off = 0;
      if(document.caretPositionFromPoint){ const p = document.caretPositionFromPoint(x, y); if(p){ node = p.offsetNode; off = p.offset; } }
      else if(document.caretRangeFromPoint){ const r = document.caretRangeFromPoint(x, y); if(r){ node = r.startContainer; off = r.startOffset; } }
      if(!node || node.nodeType !== 3 || (node.parentNode && node.parentNode.closest('.tooltip'))) return;
      const t = node.nodeValue, isW = c => /[A-Za-z0-9\u00C0-\u024F'’-]/.test(c);
      let a = off, b = off;
      while(a > 0 && isW(t[a-1])) a--;
      while(b < t.length && isW(t[b])) b++;
      while(a < b && /['’-]/.test(t[a])) a++;
      while(b > a && /['’-]/.test(t[b-1])) b--;
      if(b <= a) return;
      const r = document.createRange(); r.setStart(node, a); r.setEnd(node, b);
      sel.removeAllRanges(); sel.addRange(r);
    }
    // 三击：先念一遍，词上扫光 + 「AI 释义 ···」小气泡，不弹释义框；AI 写好直接存成高亮，亮一下、把释义气泡露两秒
    const aiPending = new Set();   // 正在查的词（hlKey），同一个词连点只查一次
    function tripleClickAnnotate(){
      if(!currentArticle || !selectionRange || selectionRange.existingHighlight) return;   // 点在已有高亮上：照常给「删除高亮」
      const sr = selectionRange, rect = lastSelectionRect, word = (sr.text || '').trim();
      if(!word || word.length > 40 || !/[A-Za-z]/.test(word)) return;
      if(window.playWordPronunciation) window.playWordPronunciation(word, currentArticle.id);
      const sel = window.getSelection(); const range = sel && sel.rangeCount ? sel.getRangeAt(0).cloneRange() : null;
      aiAnnotate(sr, rect, range);
    }
    // 划词浮层上的「AI 释义」：三击选不全的（短语、带连字符的、半个词）自己划好再点它，和三击一样直接标好
    function aiAnnotateSelection(){
      if(!currentArticle || !selectionRange || selectionRange.existingHighlight) return;
      const sr = selectionRange, rect = lastSelectionRect, text = (sr.text || '').trim();
      const at = rect || { left: 0, top: 80, width: 0, bottom: 80 };
      if(!/[A-Za-z]/.test(text)){ showTempTooltip('选中的不是英文，AI 释义只查英文单词和短语', at); return; }
      if(text.length > 80){ showTempTooltip('选得太长了，AI 释义只查单词和短语', at); return; }
      // 浮层按钮点下去时系统选区可能已经收起，扫光按存好的下标重新算位置
      const range = sr.qk ? (hkBlock(sr.qk) && hkDomRange(hkBlock(sr.qk), sr.start, sr.end))
        : originalToDomRange(document.querySelector('#vContent .reader'), sr.start, sr.end);
      aiAnnotate(sr, rect, range);
    }
    // 三击和浮层「AI 释义」共用：词上扫光 + 「AI 释义 ···」小气泡，AI 写好直接存成高亮
    function aiAnnotate(sr, rect, range){
      const key = hlKey(sr); if(aiPending.has(key)){ cancelFloat(); return; }
      cancelFloat();
      const fx = showAiPending(range);
      aiPending.add(key);
      const articleId = currentArticle.id;
      const body = { id: articleId, start: sr.start, end: sr.end, text: sr.text };
      if(sr.qk) body.qk = sr.qk;
      fetch('/intensive_lookup', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
        .then(r => r.json().catch(() => ({})).then(d => {
          if(!r.ok || !d.meaning) throw new Error(d.error || 'AI 释义暂时取不到');
          if(!currentArticle || currentArticle.id !== articleId) return null;
          return storeHighlight(sr, d.meaning);
        }))
        .then(h => { fx.done(); if(h) celebrateHighlight(h.id); })
        .catch(e => { fx.fail(); showTempTooltip(((e && e.message) || 'AI 释义没取到') + '，可以双击后自己写', rect || { left: 0, top: 80, width: 0, bottom: 80 }); })
        .finally(() => aiPending.delete(key));
    }
    // 等 AI 时的样子：画在词所在的那块（原文卡片 / 一道题 / 题组公共选项 / 原题版式）里，跟着正文一起滚；不改正文的 DOM，下标不受影响
    function showAiPending(range){
      const nop = { done(){}, fail(){} };
      if(!range) return nop;
      const startEl = range.startContainer.nodeType === 1 ? range.startContainer : range.startContainer.parentNode;
      const host = startEl && startEl.closest('.reader, .ir-q, .ir-gopts, .ir-layout-body');
      if(!host) return nop;
      const hr = host.getBoundingClientRect(), els = [];
      const rects = [...range.getClientRects()].filter(r => r.width > 0 && r.height > 0);
      rects.forEach(r => {
        const w = document.createElement('span'); w.className = 'ir-ai-wait';
        w.style.left = (r.left - hr.left - host.clientLeft - 2) + 'px'; w.style.top = (r.top - hr.top - host.clientTop) + 'px';
        w.style.width = (r.width + 4) + 'px'; w.style.height = r.height + 'px';
        host.appendChild(w); els.push(w);
      });
      if(rects.length){
        const r0 = rects[0];
        const badge = document.createElement('span'); badge.className = 'ir-ai-badge'; badge.setAttribute('role', 'status');
        badge.innerHTML = 'AI 释义<span class="ir-ai-dots"><i></i><i></i><i></i></span>';
        badge.style.left = (r0.left + r0.width / 2 - hr.left - host.clientLeft) + 'px'; badge.style.top = (r0.top - hr.top - host.clientTop - 6) + 'px';
        host.appendChild(badge); els.push(badge);
      }
      const remove = () => els.forEach(e => e.remove());
      return {
        done: remove,
        fail(){ els.forEach(e => e.classList.add('is-fail')); setTimeout(remove, 900); },
      };
    }
    // 新标好的词：从蓝过渡到黄、外圈闪一下，释义气泡露 2.6 秒（鼠标指着就一直在）
    function celebrateHighlight(hid){
      const marks = [...document.querySelectorAll(`mark.hl[data-hid="${CSS.escape(hid)}"]`)];
      if(!marks.length) return;
      marks.forEach(m => m.classList.add('ir-hl-new'));
      const tipMark = marks.find(m => !m.classList.contains('hl-echo') && m.querySelector('.tooltip')) || marks.find(m => m.querySelector('.tooltip')) || marks[marks.length - 1];
      fitTip(tipMark); tipMark.classList.add('tip-on');
      setTimeout(() => { marks.forEach(m => m.classList.remove('ir-hl-new')); tipMark.classList.remove('tip-on'); }, 2600);
    }
    let aiLookup = null;   // 释义框里点「AI」那一次；取消释义框或换了词就作废
    function setAiBusy(on){
      const box = document.getElementById('meaningBox'), input = document.getElementById('meaningInput');
      box.classList.toggle('is-ai', on); input.readOnly = on;
      input.placeholder = on ? 'AI 正在按语境写释义…' : '写下中文释义，回车保存';
      box.querySelectorAll('.ir-ai-btn').forEach(b => { b.classList.toggle('is-busy', on); b.disabled = on; });
    }
    // 释义框里的「AI」：只填进框里，自己看过再存
    function aiFillMeaning(){
      if(!currentArticle || !selectionRange || selectionRange.existingHighlight || aiLookup) return;
      if(!isVisible('meaningBox')) confirmHighlight();
      if(!isVisible('meaningBox')) return;
      const sr = selectionRange, me = {};
      aiLookup = me; setAiBusy(true);
      const body = { id: currentArticle.id, start: sr.start, end: sr.end, text: sr.text };
      if(sr.qk) body.qk = sr.qk;

    function restoreHighlights(container, art){ // 去重并清理已存在的 mark（释义气泡一起删掉，否则会作为孤儿节点留在段落里）
      container.querySelectorAll('mark.hl').forEach(function(n){ const p=n.parentNode; if(!p) return; n.querySelectorAll('.tooltip').forEach(t=>t.remove()); while(n.firstChild) p.insertBefore(n.firstChild, n); p.removeChild(n); p.normalize(); });
      const uniq=[]; (art.highlights||[]).forEach(function(h){ if(h.qk) return; if(!uniq.some(x=>x.start===h.start&&x.end===h.end)){ uniq.push(h); } });
      uniq.sort((a,b)=>a.start-b.start).forEach(h=>{ applyOneHighlight(container, h); }); paintExamHighlights(art.highlights||[]); paintEchoes(container, art.highlights||[]); updateVocabCount(); paintExamMarks(); paintXp(); }
    function applyOneHighlight(container, h){ try{ const reader=container.querySelector('.reader'); if(!reader || !(h.end > h.start)) return; // 已存在则跳过
      if(container.querySelector(`mark.hl[data-hid="${h.id}"]`)) return; wrapOriginalRange(reader, h.start, h.end, h); }catch(e){} }
    // 划过的词，本文里别处一模一样的（不分大小写、整词）也画上，原文和题目栏都算：同一条高亮（同一个 data-hid），
    // 悬停看同一条释义、点了念、右键删的是那一条（所有地方一起消失）。只在页面上画，不存，下标不受影响。
    // 长的先画（划了 the fish 又划了 fish，"the fish" 出现处画成整段）；和已有高亮重叠的地方跳过
    function echoRegex(text){
      const t = (text || '').trim(); if(!t || !/[A-Za-z]/.test(t)) return null;
      const body = t.split(/\s+/).map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('[ \\t\\u00A0]+');
      return new RegExp('(^|[^A-Za-z0-9\\u00C0-\\u024F])(' + body + ')(?![A-Za-z0-9\\u00C0-\\u024F])', 'gi');
    }
    function echoMatches(str, re){ const out = []; re.lastIndex = 0; let m; while((m = re.exec(str))){ const s = m.index + m[1].length; out.push([s, s + m[2].length]); re.lastIndex = s + 1; } return out; }
    function paintEchoes(container, list){
      const seen = new Set(), src = [];
      list.forEach(h => { const k = (h.text || '').trim().toLowerCase(); if(k && !seen.has(k)){ seen.add(k); src.push(h); } });
      src.sort((a, b) => b.text.trim().length - a.text.trim().length);
      const overlaps = (used, a, b) => used.some(([x, y]) => a < y && b > x);
      // 原文：按 content_text 下标找，已有高亮的范围先占上
      const reader = container.querySelector('.reader'), content = (currentArticle && currentArticle.content_text) || '';
      if(reader && content){
        const used = list.filter(h => !h.qk).map(h => [h.start, h.end]);
        src.forEach(h => { const re = echoRegex(h.text); if(!re) return;
          echoMatches(content, re).forEach(([a, b]) => { if(overlaps(used, a, b)) return; used.push([a, b]); try{ const m = wrapOriginalRange(reader, a, b, h); if(m) m.classList.add('hl-echo'); }catch(e){} }); });
      }
      // 题目栏：每段题目文字各自从 0 数

        document.querySelectorAll('#examPane [data-hk]').forEach(b => {

          const used = list.filter(h => h.qk === qk).map(h => [h.start, h.end]);
          src.forEach(h => { const re = echoRegex(h.text); if(!re) return;
            echoMatches(txt, re).forEach(([a, e]) => { if(overlaps(used, a, e)) return; used.push([a, e]);
              const pieces = hkPieces(b, a, e); if(!pieces.length || pieces.some(p => p.node.parentNode.closest('mark.hl'))) return;
              const marks = pieces.reverse().map(p => { const r = document.createRange(); r.setStart(p.node, p.s); r.setEnd(p.node, p.e); const m = document.createElement('mark'); m.className = 'hl hl-echo'; m.setAttribute('data-hid', h.id); r.surroundContents(m); return m; }).reverse();
              const tip = document.createElement('span'); tip.className = 'tooltip'; tip.textContent = h.meaning || ''; marks[marks.length-1].appendChild(tip);
              marks.forEach(m => bindMark(m, h, tip)); }); });
        });
      }
    }

    function escapeHtml(s){ return (s||'').replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c])); }
    // ===== 九分学长导入的文章：题目、作答、定位证据句、做题时的划线 =====

    function examQuestions(exam){ return (exam.groups || []).flatMap(g => g.questions || []); }
    function fmtDuration(sec){ const m = Math.floor(sec / 60), s = sec % 60; return `${m}:${String(s).padStart(2, '0')}`; }
    function examHtml(exam){

      let h = `<div class="ir-qs-head" data-act="qs-toggle"><div class="ir-qs-title" id="qsTitle">题目</div><button type="button" class="ir-qs-more" data-act="qs-toggle"><span id="qsMoreLabel">全部题目</span>${IC.chevUp}</button><button type="button" class="ir-x" data-act="qs-close" aria-label="收起题目">${IC.close}</button></div>`;

        + `<button type="button" class="ir-qs-switch" data-act="qs-answers" role="switch" aria-checked="true">显示答案<span class="ir-switch"></span></button></div></div>`;

      return h + `<div class="ir-qs-nav"><button type="button" data-act="qs-prev">‹ 上一题</button><button type="button" data-act="qs-locate">定位</button><button type="button" data-act="qs-analysis">解析</button><button type="button" data-act="qs-next">下一题 ›</button></div>`;
    }
    // 能划词的题目文字都带 data-hk（块名），和 routers/intensive_reading.py 的 _exam_text_blocks 一一对应
    const hkAttr = key => ` data-hk="${escapeHtml(key)}"`;
    function groupHtml(g, gi){
      let h = `<section class="ir-group">`;
      if(g.range) h += `<h3 class="ir-group-range">${escapeHtml(g.range.replace(/(\d)\s*-\s*(\d)/, '$1–$2'))}</h3>`;
      if(g.instruction_html) h += `<div class="ir-group-inst">${g.instruction_html}</div>`;
      if(g.image) h += `<img class="ir-group-img" src="${escapeHtml(g.image)}" alt="" loading="lazy">`;
      if((g.options || []).length) h += `<ul class="ir-gopts">` + g.options.map(o => `<li><b>${escapeHtml(o.key)}</b> ${o.text ? `<span${hkAttr(`g${gi}.o${o.key}`)}>${escapeHtml(o.text)}</span>` : ''}${o.zh ? `<div class="ir-q-zh">${escapeHtml(o.zh)}</div>` : ''}</li>`).join('') + `</ul>`;
      // 原题版式（表格 / 笔记 / 摘要）：每题都取到了像样的题干就先收起，不然展开
      if(g.content_html){

        h += `<details class="ir-layout"${stemsOk ? '' : ' open'}><summary>原题版式</summary><div class="ir-layout-body"${hkAttr(`g${gi}.layout`)}>${g.content_html}</div></details>`;

    // 各自标自己的对错（对的绿、选错的红色划掉）。和 routers/intensive_reading.py 的 _question_options 一致
    function questionOptions(g, q){
      if((q.options || []).length || g.kind !== 'choice') return q.options || [];
      const src = (g.questions || []).find(x => (x.options || []).length);

    function questionHtml(g, q, gi){
      const cls = { right: ' is-right', wrong: ' is-wrong', blank: ' is-blank' }[q.state] || '';

      if(q.text) h += `<div class="ir-q-text"${hkAttr(`g${gi}.q${q.num}`)}>${escapeHtml(q.text)}</div>`;
      if(q.zh) h += `<div class="ir-q-zh">${escapeHtml(q.zh)}</div>`;
      if(options.length){
        const list = g.kind === 'choice';

    function lineKind(line){
