<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script>
    (function () {
      try {
        var preference = localStorage.getItem('ui-theme');
        if (preference !== 'light' && preference !== 'dark' && preference !== 'system') preference = 'system';
        var isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = preference === 'system' ? (isDark ? 'dark' : 'light') : preference;
        var root = document.documentElement;
        root.dataset.themePreference = preference;
        root.dataset.theme = theme;
        root.style.colorScheme = theme;
        root.classList.toggle('dark', theme === 'dark');
      } catch (error) {
        document.documentElement.dataset.themePreference = 'system';
        document.documentElement.dataset.theme = 'light';
        document.documentElement.style.colorScheme = 'light';
      }
    })();
  </script>
  <meta charset="UTF-8">

  <style>
/* ==================== 精读 · 设计令牌 ====================
   和写作逻辑训练同一套：系统字体、近白纸面 + 白卡、一个主色、无阴影、小圆角。
   令牌挂在 body.page-intensive 上：theme.css 在本页样式之后加载，:root 同名变量会被它盖掉。
   组件类名一律 ir- 前缀，避开 theme.css 给旧版 .card / .section / .viewer 写的暗色 !important 规则。 */
* { box-sizing: border-box; }

body.page-intensive {
  --w-cn: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
  --w-en: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif;

  --w-paper: #F7F7F5;
  --w-surface: #FFFFFF;
  --w-sunken: #F3F3F1;
  --w-line: #E3E3DF;
  --w-line-strong: #CFCFCA;

  --w-ink: #1F1F1F;
  --w-ink2: #555555;
  --w-ink3: #8A8A85;
  --w-zh: #77776F;        /* 译文：比正文淡一档，退到英文后面，但仍然读得清 */

  --w-accent: #2F5D9E; --w-accent-soft: #EEF3FA; --w-accent-line: #B7C8E2;
  --w-err: #B3261E;    --w-err-soft: #FBEFEE; --w-err-line: #EFCFCC;
  --w-ok: #2E7D4F;     --w-ok-soft: #EDF6F0;  --w-ok-line: #C9E2D2;

  /* 荧光笔：只用一种黄，和写作页的 --w-hl-yellow 同色 */
  --w-hl: #F7E6A8; --w-hl-hover: #F0D984;
  --w-tip-bg: #2B2B2B; --w-tip-ink: #FFFFFF;

  --w-r-card: 8px; --w-r-sm: 6px;
  --w-shadow-lg: 0 4px 16px rgba(0, 0, 0, .08);
  --w-ring: 0 0 0 3px rgba(47, 93, 158, .15);
  --w-bar-h: 56px;

  /* 站点令牌对齐：theme.css 的通用输入框、链接、页面底色规则读这些名字 */
  --accent: var(--w-accent);
  --accent-hover: #244A80;
  --accent-soft: var(--w-accent-soft);
  --accent-contrast: #FFFFFF;
  --bg-page: var(--w-paper);
  --bg-surface: var(--w-surface);
  --bg-elevated: var(--w-surface);
  --bg-muted: var(--w-sunken);
  --bg-subtle: var(--w-sunken);
  --text-primary: var(--w-ink);
  --text-secondary: var(--w-ink2);
  --text-muted: var(--w-ink3);
  --border-default: var(--w-line);
  --border-strong: var(--w-line-strong);
  --page-gradient: var(--w-paper);
  --surface-gradient: var(--w-surface);

  margin: 0;
  background: var(--w-paper);
  color: var(--w-ink);
  font-family: var(--w-cn);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

html[data-theme="dark"] body.page-intensive {
  --w-paper: #161616;
  --w-surface: #1E1E1E;
  --w-sunken: #1A1A1A;
  --w-line: #2F2F2F;
  --w-line-strong: #404040;
  --w-ink: #ECECEA;
  --w-ink2: #ADADA8;
  --w-ink3: #7C7C77;
  --w-zh: #96968F;
  --w-accent: #8AB0E6; --w-accent-soft: rgba(138, 176, 230, .13); --w-accent-line: rgba(138, 176, 230, .35);
  --w-err: #EC8379;    --w-err-soft: rgba(236, 131, 121, .12); --w-err-line: rgba(236, 131, 121, .32);
  --w-ok: #7CC293;     --w-ok-soft: rgba(124, 194, 147, .11);  --w-ok-line: rgba(124, 194, 147, .30);
  --w-hl: rgba(247, 230, 168, .24); --w-hl-hover: rgba(247, 230, 168, .36);
  --w-tip-bg: #ECECEA; --w-tip-ink: #1F1F1F;
  --w-shadow-lg: 0 4px 16px rgba(0, 0, 0, .45);
  --w-ring: 0 0 0 3px rgba(138, 176, 230, .22);
  --accent-hover: #A7C4EE;
  --accent-contrast: #161616;
}

/* ==================== 按钮 ==================== */
.ir-btn {
  display: inline-flex; align-items: center; gap: 6px;
  height: 36px; padding: 0 14px;
  border: 1px solid var(--w-line); border-radius: var(--w-r-sm);
  background: var(--w-surface); color: var(--w-ink);
  font: 500 14px/1 var(--w-cn); text-decoration: none; white-space: nowrap;
  cursor: pointer; transition: background .15s, border-color .15s;
}
.ir-btn:hover { background: var(--w-sunken); border-color: var(--w-line-strong); }
.ir-btn-primary { background: var(--w-accent); border-color: var(--w-accent); color: var(--accent-contrast); }
.ir-btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.ir-btn svg { width: 16px; height: 16px; flex: none; }

.ir-icon-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 34px; min-width: 34px; padding: 0 9px;
  border: none; border-radius: var(--w-r-sm);
  background: transparent; color: var(--w-ink2);
  font: 500 14px/1 var(--w-cn); white-space: nowrap;
  cursor: pointer; transition: background .15s, color .15s;
}
.ir-icon-btn:hover { background: var(--w-sunken); color: var(--w-ink); }
.ir-icon-btn.is-on { background: var(--w-accent-soft); color: var(--w-accent); }
.ir-icon-btn svg { width: 18px; height: 18px; flex: none; }
.ir-icon-btn:disabled { opacity: .5; cursor: default; }
.ir-btn:focus-visible, .ir-icon-btn:focus-visible, .ir-card:focus-visible { outline: none; box-shadow: var(--w-ring); }
.ir-badge { font: 400 12px/1 var(--w-cn); color: var(--w-ink3); font-variant-numeric: tabular-nums; }
.ir-icon-btn.is-on .ir-badge { color: inherit; opacity: .75; }

.ir-spin {
  width: 14px; height: 14px; flex: none;
  border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%;
  animation: ir-spin .8s linear infinite;
}
@keyframes ir-spin { to { transform: rotate(360deg); } }

/* ==================== 文章列表 ==================== */
.ir-home { max-width: 1080px; margin: 0 auto; padding: 36px 24px 64px; }
.ir-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 28px; }
.ir-eyebrow { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--w-ink3); }
.ir-h1 { margin: 6px 0 4px; font-size: 22px; font-weight: 600; line-height: 1.3; color: var(--w-ink); }
.ir-sub { font-size: 14px; color: var(--w-ink2); }
.ir-head-actions { display: flex; gap: 8px; flex: none; padding-top: 4px; }

.ir-tabs { display: flex; gap: 24px; border-bottom: 1px solid var(--w-line); margin-bottom: 20px; }
.ir-tabs button {
  appearance: none; background: none; border: none; border-bottom: 2px solid transparent;
  margin-bottom: -1px; padding: 0 0 10px;
  font: 500 15px/1.2 var(--w-cn); color: var(--w-ink3); cursor: pointer;
}
.ir-tabs button:hover { color: var(--w-ink); }
.ir-tabs button.active { color: var(--w-ink); border-bottom-color: var(--w-accent); }
.ir-count { margin-left: 6px; font-size: 13px; font-weight: 400; color: var(--w-ink3); font-variant-numeric: tabular-nums; }

.ir-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.ir-card {
  position: relative; display: flex; flex-direction: column; justify-content: space-between; gap: 14px;
  min-height: 100px; padding: 18px 20px 16px;
  background: var(--w-surface); border: 1px solid var(--w-line); border-radius: var(--w-r-card);
  cursor: pointer; transition: border-color .15s;
}
.ir-card:hover { border-color: var(--w-line-strong); }
.ir-card h3 { margin: 0; padding-right: 28px; font: 600 16px/1.4 var(--w-en); color: var(--w-ink); }
.ir-meta { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--w-ink3); font-variant-numeric: tabular-nums; }
.ir-audio-tag { display: inline-flex; align-items: center; gap: 4px; color: var(--w-ink2); }
.ir-audio-tag svg { width: 14px; height: 14px; }
.ir-card-del {
  position: absolute; top: 12px; right: 12px;
  width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
  border: none; border-radius: var(--w-r-sm); background: transparent; color: var(--w-ink3);
  opacity: 0; cursor: pointer; transition: opacity .15s, background .15s, color .15s;
}
.ir-card-del svg { width: 16px; height: 16px; }
.ir-card:hover .ir-card-del, .ir-card-del:focus-visible { opacity: 1; }
.ir-card-del:hover { background: var(--w-err-soft); color: var(--w-err); }
.ir-empty { padding: 56px 16px; text-align: center; font-size: 14px; color: var(--w-ink3); border: 1px dashed var(--w-line); border-radius: var(--w-r-card); }

/* ==================== 阅读视图 ==================== */
.ir-viewer { position: fixed; inset: 0; z-index: 1300; display: none; flex-direction: column; background: var(--w-paper); }
.ir-viewer.active { display: flex; }

.ir-bar {
  flex: none; height: var(--w-bar-h);
  display: flex; align-items: center; gap: 8px; padding: 0 12px;
  background: var(--w-surface); border-bottom: 1px solid var(--w-line);
}
.ir-title-wrap { flex: 1; min-width: 0; display: flex; align-items: center; gap: 2px; }
.ir-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 600 16px/1.3 var(--w-en); color: var(--w-ink); }
.ir-edit-title { opacity: 0; }
.ir-title-wrap:hover .ir-edit-title, .ir-edit-title:focus-visible { opacity: 1; }
.ir-edit-title svg { width: 16px; height: 16px; }
.ir-title-edit { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; }
.ir-title-edit input {
  flex: 1; min-width: 0; height: 34px; padding: 0 10px;
  border: 1px solid var(--w-line); border-radius: var(--w-r-sm);
  background: var(--w-surface); color: var(--w-ink); font: 600 15px var(--w-en); outline: none;
}
.ir-title-edit input:focus { border-color: var(--w-accent); box-shadow: var(--w-ring); }
.ir-title-edit .ir-btn { height: 34px; padding: 0 12px; }
.ir-tools { flex: none; display: flex; align-items: center; gap: 2px; }

.ir-more { position: relative; }
.ir-menu {
  position: absolute; top: calc(100% + 6px); right: 0; z-index: 30;
  display: none; min-width: 188px; padding: 4px;
  background: var(--w-surface); border: 1px solid var(--w-line); border-radius: var(--w-r-card); box-shadow: var(--w-shadow-lg);
}
.ir-menu.open { display: block; }
.ir-menu-item {
  display: flex; align-items: center; gap: 10px; width: 100%;
  height: 36px; padding: 0 10px; border: none; border-radius: var(--w-r-sm);
  background: transparent; color: var(--w-ink); font: 14px/1 var(--w-cn); text-align: left; white-space: nowrap; cursor: pointer;
}
.ir-menu-item:hover { background: var(--w-sunken); }
.ir-menu-item svg { width: 16px; height: 16px; flex: none; color: var(--w-ink2); }
.ir-menu-item .ir-spin { width: 12px; height: 12px; }
body.page-intensive .ir-menu select.ir-select {
  margin-left: auto; height: 28px; padding: 0 4px;
  border: 1px solid var(--w-line); border-radius: var(--w-r-sm);
  background: var(--w-surface); color: var(--w-ink); font: 13px var(--w-cn); cursor: pointer;
}

.ir-body { flex: 1; min-height: 0; display: flex; position: relative; }
.ir-content { flex: 1; min-width: 0; overflow-y: auto; overflow-x: hidden; padding: 40px 24px 120px; transition: margin-right .2s ease; }
.ir-content.panel-open { margin-right: var(--panel-width, 320px); }

.ir-images { max-width: 720px; margin: 0 auto 16px; }
.ir-images-head { margin-bottom: 8px; font-size: 13px; color: var(--w-ink3); }
.images-grid { display: flex; flex-wrap: wrap; gap: 8px; }
.image-item {
  position: relative; width: 112px; height: 112px; overflow: hidden;
  border: 1px solid var(--w-line); border-radius: var(--w-r-sm); background: var(--w-sunken); cursor: zoom-in;
}
.image-item img { display: block; width: 100%; height: 100%; object-fit: cover; }
.image-delete-btn {
  position: absolute; top: 4px; right: 4px; z-index: 1;
  width: 22px; height: 22px; display: flex; align-items: center; justify-content: center;
  border: none; border-radius: 50%; background: rgba(0, 0, 0, .55); color: #fff; font-size: 11px;
  opacity: 0; cursor: pointer; transition: opacity .15s;
}
.image-item:hover .image-delete-btn { opacity: 1; }

/* 正文：一行原文一个 <p>。英文是主角；译文小一号、淡一档，紧贴在它的英文下面；段落标记做成小标题 */
.ir-content .reader {
  max-width: 720px; margin: 0 auto; padding: 48px 56px 56px;
  background: var(--w-surface); border: 1px solid var(--w-line); border-radius: var(--w-r-card);
  font-family: var(--w-en); color: var(--w-ink);
}
.reader p { margin: 14px 0 0; }
.reader p:first-child { margin-top: 0; }
.reader p.en { font-size: 17px; line-height: 1.75; }
.reader p.zh { font: 15px/1.75 var(--w-cn); color: var(--w-zh); }
.reader p.en + p.zh { margin-top: 2px; }
.reader p.hd { margin-top: 32px; font: 600 13px/1.5 var(--w-cn); letter-spacing: .04em; color: var(--w-ink3); }
.reader p.hd + p { margin-top: 8px; }
.reader p:first-child.hd { margin-top: 0; }
.ir-viewer.hide-zh .reader p.zh { display: none; }

.reader mark.hl {
  position: relative; padding: 1px 0; border-radius: 3px;
  background: var(--w-hl); color: inherit; cursor: pointer;
  -webkit-box-decoration-break: clone; box-decoration-break: clone;
  transition: background .15s, box-shadow .15s;
}
.reader mark.hl:hover { background: var(--w-hl-hover); }
.reader mark.hl.active { box-shadow: 0 0 0 2px var(--w-accent); }
.reader mark.hl .tooltip {
  display: none; position: absolute; left: 50%; bottom: calc(100% + 8px); z-index: 20;
  width: max-content; max-width: 260px; padding: 6px 10px; border-radius: var(--w-r-sm);
  background: var(--w-tip-bg); color: var(--w-tip-ink);
  font: 400 13px/1.5 var(--w-cn); letter-spacing: 0; white-space: normal; text-align: left;
  transform: translateX(calc(-50% + var(--tip-dx, 0px)));
  pointer-events: none; user-select: none; -webkit-user-select: none;
}
.reader mark.hl.tip-below .tooltip { bottom: auto; top: calc(100% + 8px); }
.reader mark.hl:hover .tooltip, .reader mark.hl.tip-on .tooltip { display: block; }
.reader mark.hl .tooltip:empty { display: none !important; }

/* 划词浮层：白底小卡片，浮在选区上方（手机放在下方，让开系统的复制菜单） */
.floating {
  position: fixed; z-index: 1500; display: none; padding: 4px;
  background: var(--w-surface); border: 1px solid var(--w-line); border-radius: var(--w-r-card); box-shadow: var(--w-shadow-lg);
  font-family: var(--w-cn); white-space: nowrap;
}
.floating button {
  height: 32px; padding: 0 12px; border: none; border-radius: var(--w-r-sm);
  background: transparent; color: var(--w-ink2); font: 500 14px/1 var(--w-cn); cursor: pointer; vertical-align: middle;
}
.floating button:hover { background: var(--w-sunken); color: var(--w-ink); }
.floating .ir-pop-main { color: var(--w-accent); }
.floating .ir-pop-main:hover { color: var(--w-accent); }
.floating .ir-pop-danger { color: var(--w-err); }
.floating .ir-pop-danger:hover { background: var(--w-err-soft); color: var(--w-err); }
.floating button:disabled { color: var(--w-ink3); background: transparent; cursor: not-allowed; }
#meaningBox { padding: 6px; }
body.page-intensive #meaningBox input {
  width: 240px; height: 32px; padding: 0 10px; margin-right: 2px; vertical-align: middle;
  border: 1px solid var(--w-line); border-radius: var(--w-r-sm);
  background: var(--w-surface); color: var(--w-ink); font: 14px var(--w-cn); outline: none;
}
body.page-intensive #meaningBox input:focus { border-color: var(--w-accent); box-shadow: var(--w-ring); }
.ir-toast {
  position: fixed; z-index: 1600; max-width: 280px; padding: 6px 10px; border-radius: var(--w-r-sm);
  background: var(--w-tip-bg); color: var(--w-tip-ink); font: 13px/1.5 var(--w-cn);
  pointer-events: none; animation: ir-toast 2s ease-out forwards;
}
@keyframes ir-toast { 0%, 75% { opacity: 1; } 100% { opacity: 0; } }

/* ==================== 词汇面板：桌面在右侧，手机从底部拉出 ==================== */
.ir-panel {
  position: absolute; top: 0; right: 0; bottom: 0; z-index: 10;
  width: 320px; min-width: 280px; max-width: 60vw;
  display: flex; flex-direction: column;
  background: var(--w-surface); border-left: 1px solid var(--w-line);
  transform: translateX(100%); visibility: hidden; transition: transform .2s ease, visibility .2s;
}
.ir-panel.active { transform: none; visibility: visible; }
.ir-panel-head { flex: none; display: flex; align-items: center; gap: 8px; padding: 10px 8px 10px 16px; border-bottom: 1px solid var(--w-line); }
.ir-panel-title { font-size: 15px; font-weight: 600; white-space: nowrap; }
body.page-intensive .ir-panel-head input {
  flex: 1; min-width: 0; height: 32px; padding: 0 10px;
  border: 1px solid var(--w-line); border-radius: var(--w-r-sm);
  background: var(--w-sunken); color: var(--w-ink); font: 13px var(--w-cn); outline: none;
}
body.page-intensive .ir-panel-head input:focus { border-color: var(--w-accent); background: var(--w-surface); }
.ir-panel-body { flex: 1; overflow-y: auto; }
.ir-panel-empty { padding: 24px 16px; font-size: 13px; color: var(--w-ink3); }
.ir-vi { display: flex; align-items: flex-start; gap: 8px; padding: 10px 8px 10px 16px; border-bottom: 1px solid var(--w-line); cursor: pointer; }
.ir-vi:hover { background: var(--w-sunken); }
.ir-vi-text { flex: 1; min-width: 0; }
.ir-vi-word { font: 600 15px/1.4 var(--w-en); color: var(--w-ink); }
.ir-vi-mean { margin-top: 2px; font-size: 13px; line-height: 1.5; color: var(--w-ink2); }
.ir-vi-actions { flex: none; display: flex; }
.ir-vi-actions .ir-icon-btn { height: 28px; min-width: 28px; padding: 0 5px; color: var(--w-ink3); }
.ir-vi-actions .ir-icon-btn svg { width: 16px; height: 16px; }
.resize-handle { position: absolute; left: -3px; top: 0; bottom: 0; width: 6px; cursor: col-resize; }
.resize-handle:hover, .resize-handle.dragging { background: var(--w-accent-line); }

/* ==================== 朗读音频条 ==================== */
.ir-audio {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 5;
  padding: 8px 16px calc(8px + env(safe-area-inset-bottom));
  background: var(--w-surface); border-top: 1px solid var(--w-line);
}
.ir-audio-row { max-width: 720px; margin: 0 auto; display: flex; align-items: center; gap: 4px; }
.ir-audio audio { flex: 1; min-width: 0; height: 36px; }

/* ==================== 大图查看 ==================== */
.ir-modal { position: fixed; inset: 0; z-index: 2000; display: none; background: rgba(0, 0, 0, .88); opacity: 0; transition: opacity .2s; }
.ir-modal.active { opacity: 1; }
.image-modal-overlay { position: absolute; inset: 0; cursor: zoom-out; }
.image-modal-content { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
.image-modal-content > * { pointer-events: auto; }
#modalImage { max-width: 88vw; max-height: 80vh; object-fit: contain; border-radius: 4px; }
.image-modal-close, .image-modal-nav button {
  position: absolute; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
  border: none; border-radius: 50%; background: rgba(255, 255, 255, .12); color: #fff; font-size: 20px; cursor: pointer;
}
.image-modal-close { top: 16px; right: 16px; font-size: 16px; }
.image-modal-close:hover, .image-modal-nav button:hover { background: rgba(255, 255, 255, .22); }

    // 拖拽调整侧边栏宽度
    function initResizeHandle(){ 
      const resizeHandle = document.getElementById('resizeHandle'); 
      const panel = document.getElementById('highlightsPanel'); 
      let isResizing = false; 
      let startX = 0; 
      let startWidth = 0;
      
      resizeHandle.addEventListener('mousedown', function(e) { 
        if(window.innerWidth <= 768) return; // 移动端禁用
        isResizing = true; 
        startX = e.clientX; 
        startWidth = panelWidth; 
        resizeHandle.classList.add('dragging');
        document.body.style.cursor = 'col-resize'; 
        document.body.style.userSelect = 'none'; 
        e.preventDefault(); 
      }); 
      
      document.addEventListener('mousemove', function(e) { 
        if (!isResizing) return; 
        const diff = startX - e.clientX; 
        const newWidth = Math.max(280, Math.min(window.innerWidth * 0.6, startWidth + diff)); 
        panelWidth = newWidth; 
        updatePanelWidth(); 
      }); 
      
      document.addEventListener('mouseup', function() { 
        if (isResizing) { 
          isResizing = false; 
          resizeHandle.classList.remove('dragging');
          document.body.style.cursor = ''; 
          document.body.style.userSelect = ''; 
          // 保存宽度到localStorage
          localStorage.setItem('panelWidth', panelWidth);
        } 
      }); 
      
      // 恢复保存的宽度
      const savedWidth = localStorage.getItem('panelWidth');
      if(savedWidth) {
        panelWidth = Math.max(280, Math.min(window.innerWidth * 0.6, parseInt(savedWidth)));
      }
      
      // 窗口大小变化时调整面板宽度
      window.addEventListener('resize', function() {
        if (panelWidth > window.innerWidth * 0.6) {
          panelWidth = Math.max(280, window.innerWidth * 0.6);
          updatePanelWidth();
        }
      });
    }

    // 文本选择与悬浮操作
    // 只在页面初始化时绑定一次：#vContent 一直是同一个元素，换文章只换里面的内容。
    // 每打开一篇就再绑一个的话，旧监听会拿上一篇文章的原文去算，算不出来就把选区清掉，当前文章就划不出词。
    // 鼠标划词在 mouseup 时处理。手机长按选词、拖选区手柄都不会触发 mouseup，改为等选区停下来再处理。
    let lastPointerType = 'mouse';
    let floatPressed = false;
    document.addEventListener('pointerdown', function(e){
      lastPointerType = e.pointerType || 'mouse';
      floatPressed = !!(e.target.closest && e.target.closest('.floating'));
    }, true);
    function bindSelection(container){
      container.addEventListener('mouseup', function(){ if(lastPointerType === 'mouse') handleReaderSelection(container); });
      let timer = null;
      document.addEventListener('selectionchange', function(){
        if(lastPointerType === 'mouse') return;
        clearTimeout(timer);
        timer = setTimeout(function(){
          if(isVisible('meaningBox')) return;
          const sel = window.getSelection();
          if(!sel || sel.isCollapsed || !sel.rangeCount){
            // 点浮层上的按钮时系统会先收起选区，这时浮层不能跟着关，否则按钮点不到
            if(isVisible('floatBox') && !floatPressed) cancelFloat();
            return;
          }
          if(!container.contains(sel.getRangeAt(0).commonAncestorContainer)) return;
          handleReaderSelection(container, true);
        }, 350);
      });
    }
    function handleReaderSelection(container, soft){
      // soft：手机上选区还在调整，失败时只收起浮层，不清掉用户的选区
      const fail = soft ? hideFloat : cancelFloat;
        const art=currentArticle; const reader=container.querySelector('.reader');
        const sel=window.getSelection(); if(!art || !reader || !sel || sel.isCollapsed || !sel.rangeCount){ fail(); return; }
        const range=sel.getRangeAt(0); if(!container.contains(range.commonAncestorContainer)){ fail(); return; }
        const covered = selectionToOriginal(reader, range);
        if(!covered){ fail(); return; }

        // 检查是否选中了已经高亮的词汇
        if(covered.mark){
          // 如果选中了已高亮的词汇，显示移除选项
          const hid = covered.mark.getAttribute('data-hid');
          selectionRange = { existingHighlight: hid, text: ((highlights||[]).find(h => h.id === hid) || {}).text || '' };
          lastSelectionRect = range.getBoundingClientRect();
          showFloatAtRect(lastSelectionRect, true);
          return;
        }

        // 去掉选区两端的空白（双击、拖过头都会带上空格）
        const original = art.content_text || '';
        let start = covered.start, end = covered.end;
        while(start < end && /\s/.test(original[start])) start++;
        while(end > start && /\s/.test(original[end-1])) end--;
        if(end <= start){ fail(); return; }
        const text = original.slice(start, end);

        // 限制只能在同一段落（同一行）内高亮，避免跨块包裹导致错误
        if(text.includes('\n')){ showTempTooltip('请在同一段内进行高亮', range.getBoundingClientRect()); fail(); return; }

        // 检查是否为重复词汇
        const isDuplicate = (highlights||[]).some(h => h.text && h.text.toLowerCase() === text.toLowerCase());

        selectionRange = { start, end, text, isDuplicate };
        lastSelectionRect = range.getBoundingClientRect();
        showFloatAtRect(lastSelectionRect, false, isDuplicate);
    }

    function showFloatAtRect(rect, isExisting = false, isDuplicate = false){
      const box=document.getElementById('floatBox');
      const highlightBtn = box.querySelector('button[onclick="confirmHighlight()"]');
      const removeBtn = box.querySelector('button[onclick="removeCurrentHighlight()"]');
      highlightBtn.style.display = isExisting ? 'none' : '';
      removeBtn.style.display = isExisting ? '' : 'none';
      // 本文已经高亮过的词不能再划一次
      highlightBtn.disabled = !isExisting && isDuplicate;
      highlightBtn.textContent = highlightBtn.disabled ? '已划过' : '高亮';
      highlightBtn.title = highlightBtn.disabled ? '这个词在本文里已经高亮过了' : '';
      box.style.display='block';
      positionBoxAtRect(box, rect);
    }
    // 浮层是 position:fixed，直接用选区在视口里的坐标（以前加了 window.scrollY，列表往下翻过再打开文章，浮层就跑到屏幕外）。
    // 鼠标划词放在选区上方；手机放在下方，让开系统的复制菜单；哪边放不下就翻到另一边。
    function positionBoxAtRect(el, rect){
      const below = lastPointerType !== 'mouse';
      const w = el.offsetWidth, h = el.offsetHeight, gap = below ? 14 : 8, minTop = 64;
      const x = Math.max(8, Math.min(window.innerWidth - w - 8, rect.left + rect.width/2 - w/2));
      let y = below ? rect.bottom + gap : rect.top - h - gap;
      if(!below && y < minTop) y = rect.bottom + gap;
      if(below && y + h > window.innerHeight - 8) y = Math.max(minTop, rect.top - h - gap);
      el.style.left = x + 'px'; el.style.top = y + 'px';
    }
    // 显示临时提示
    function showTempTooltip(message, rect){
      const tip = document.createElement('div');
      tip.className = 'temp-tooltip ir-toast';
      tip.textContent = message;
      document.body.appendChild(tip);
      const x = Math.max(8, Math.min(window.innerWidth - tip.offsetWidth - 8, rect.left + rect.width/2 - tip.offsetWidth/2));
      const y = rect.top - tip.offsetHeight - 8;
      tip.style.left = x + 'px';
      tip.style.top = (y < 64 ? rect.bottom + 8 : y) + 'px';
      setTimeout(() => { if(tip.parentNode) tip.parentNode.removeChild(tip); }, 2000);
    }
    // 只收起浮层、不动选区（手机拖选区手柄的过程中用）
    function hideFloat(){
      const box=document.getElementById('floatBox');
      const highlightBtn = box.querySelector('button[onclick="confirmHighlight()"]');
      highlightBtn.disabled = false; highlightBtn.textContent = '高亮'; highlightBtn.title = '';
      box.style.display='none';
      selectionRange=null;
    }
    function cancelFloat(){ hideFloat(); window.getSelection().removeAllRanges(); }
    function confirmHighlight(){
      if(!currentArticle||!selectionRange){ cancelFloat(); return; }
      if(selectionRange.isDuplicate){ return; } // 重复词汇不允许高亮
      floatPressed = false;
      const mBox=document.getElementById('meaningBox');
      const mInput=document.getElementById('meaningInput');
      mInput.value='';
      document.getElementById('floatBox').style.display='none';
      mBox.style.display='block';
      if(lastSelectionRect){ positionBoxAtRect(mBox, lastSelectionRect); }
      mInput.focus();

      const tip = mark.querySelector('.tooltip'); const box = document.getElementById('vContent');
      if(!tip || !tip.textContent || !box) return;
      mark.style.setProperty('--tip-dx', '0px'); mark.classList.remove('tip-below');
      const prev = tip.style.display; tip.style.display = 'block';
      const t = tip.getBoundingClientRect(); const b = box.getBoundingClientRect();
      tip.style.display = prev;
      let dx = 0;
      if(t.left < b.left + 8) dx = b.left + 8 - t.left;
      else if(t.right > b.right - 8) dx = b.right - 8 - t.right;
      mark.style.setProperty('--tip-dx', dx + 'px');
      if(t.top < b.top + 8) mark.classList.add('tip-below');
    }
    // 音频生成相关功能
    let currentAudioUrl = null;
    let currentAudioInfo = null;
    
    function extractEnglishText(text) {
      if (!text) return '';
      
      // 移除HTML标签
      const tempDiv = document.createElement('div');
      tempDiv.innerHTML = text;
      const plainText = tempDiv.textContent || tempDiv.innerText || '';
      
      // 使用正则表达式提取英文内容（包括标点符号、数字）
      // 排除中文字符（Unicode范围 \u4e00-\u9fff）和中文标点符号
      const englishParts = plainText.match(/[^\u4e00-\u9fff\uFF00-\uFFEF\u3000-\u303F]+/g);
      
      if (!englishParts) return '';
      
      // 清理和连接英文部分，移除只包含标点符号的部分
      return englishParts
        .map(part => part.trim())
        .filter(part => part.length > 0 && /[a-zA-Z0-9]/.test(part)) // 必须包含字母或数字
        .join(' ')
        .replace(/\s+/g, ' ')
        .trim();
    }

    async function generateSegmentsSequentially(taskId, segmentsInfo, originalText, btn, originalContent) {
      const totalSegments = segmentsInfo.length;
      let completedSegments = 0;
      
      try {
        // 重新分割文本以获取实际的分段内容
        const segments = await getSegmentTexts(originalText, totalSegments);
        
        // 首先检查已存在的分片状态
        btn.innerHTML = btnLabel('spin', `检查已存在分片...`);
        const statusResult = await checkSegmentStatus(taskId, totalSegments);
        
        if (statusResult.success) {
          completedSegments = statusResult.completed_segments.length;
          const missingSegments = statusResult.missing_segments;
          
          if (completedSegments > 0) {
            console.log(`发现 ${completedSegments} 个已完成的分片，将跳过这些分片`);
            btn.innerHTML = btnLabel('spin', `发现 ${completedSegments} 个已完成分片...`);
            await new Promise(resolve => setTimeout(resolve, 1000)); // 显示状态1秒
          }
          
          // 只生成缺失的分段
          for (const segmentIndex of missingSegments) {
            btn.innerHTML = btnLabel('spin', `生成第${segmentIndex+1}段... (${completedSegments}/${totalSegments})`);
            
            const success = await generateSingleSegmentWithRetry(
              taskId, 
              segmentIndex, 
              segments[segmentIndex], 
              3 // 最大重试次数
            );
            
            if (!success) {
              throw new Error(`第${segmentIndex+1}段生成失败，已重试多次`);
            }
            
            completedSegments++;
            btn.innerHTML = btnLabel('spin', `已完成 ${completedSegments}/${totalSegments} 段`);
            
            console.log(`第${segmentIndex+1}段生成完成 (${segments[segmentIndex].length}字符)`);
          }
        } else {
          // 如果状态检查失败，按原逻辑逐个生成
          for (let i = 0; i < segments.length; i++) {
            btn.innerHTML = btnLabel('spin', `生成第${i+1}段... (${completedSegments}/${totalSegments})`);
            
            const success = await generateSingleSegmentWithRetry(
              taskId, 
              i, 
              segments[i], 
              3 // 最大重试次数
            );
            
            if (!success) {
              throw new Error(`第${i+1}段生成失败，已重试多次`);
            }
            
            completedSegments++;
            btn.innerHTML = btnLabel('spin', `已完成 ${completedSegments}/${totalSegments} 段`);
            
            console.log(`第${i+1}段生成完成 (${segments[i].length}字符)`);
          }
        }
        
        // 所有分段完成，开始合并
        btn.innerHTML = btnLabel('spin', `合并音频...`);
        
        const combineResponse = await fetch('/combine_audio_segments', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            article_id: currentArticle.id,
            task_id: taskId,
            segments_count: totalSegments,
            original_text: originalText
          })
        });
        
        const combineResult = await combineResponse.json();
        
        if (combineResult.success) {
          showAudioPlayer(combineResult.audio_url, combineResult.filename);
          currentAudioUrl = combineResult.audio_url;
          updateAudioButton(true);
          console.log(`音频生成成功！共${combineResult.segments_count}段，总长度${combineResult.text_length}字符`);
        } else {
          throw new Error(combineResult.error || '合并失败');
        }
        
      } catch (error) {
        console.error('分批生成错误:', error);
        alert(`音频生成失败: ${error.message}`);
      } finally {
        resetAudioButton(btn, originalContent);
      }
    }
    
    async function getSegmentTexts(text, targetSegments) {
      // 在前端重新分割文本，确保与后端一致（增加40%冗余）
      const MAX_CHARS = 2200;  // 进一步降低字符限制
      if (text.length <= MAX_CHARS) {
        return [text];
      }
      
      // 智能分割逻辑，按句号分割并确保平均分配
      const sentences = text.split(/(?<=[.!?])\s+/);
      const idealLength = text.length / targetSegments;
      
      const segments = [];
      let currentSegment = '';
      
      for (const sentence of sentences) {
        const testSegment = currentSegment + (currentSegment ? ' ' : '') + sentence;
        
        // 更严格的分割条件，确保段落更短（40%冗余策略）
        const shouldSplit = (
          testSegment.length > idealLength * 0.9 &&  // 更早分割
          currentSegment && 
          segments.length < targetSegments - 1 &&
          testSegment.length > MAX_CHARS * 0.5  // 避免过小段落
        );
        
        if (shouldSplit) {
          segments.push(currentSegment.trim());
          currentSegment = sentence;
        } else {
          currentSegment = testSegment;
        }
      }
      
      if (currentSegment) {
        segments.push(currentSegment.trim());
      }
      
      // 如果某个段落仍然过长，进行二次分割
      const finalSegments = [];
      for (const segment of segments) {
        if (segment.length <= MAX_CHARS) {
          finalSegments.push(segment);
        } else {
          // 对过长段落按句子进一步分割
          const subSentences = segment.split(/(?<=[.!?])\s+/);
          let currentSub = '';
          
          for (const subSentence of subSentences) {
            const testSub = currentSub + (currentSub ? ' ' : '') + subSentence;
            if (testSub.length > MAX_CHARS && currentSub) {
              finalSegments.push(currentSub.trim());
              currentSub = subSentence;
            } else {
              currentSub = testSub;
            }
          }
          
          if (currentSub) {
            finalSegments.push(currentSub.trim());
          }
        }
      }
      
      return finalSegments;
    }

    // 单个分片生成（带重试）的辅助函数
    async function generateSingleSegmentWithRetry(taskId, segmentIndex, text, maxRetries = 3) {
      let lastError = null;
      
      for (let attempt = 0; attempt < maxRetries; attempt++) {
        try {
          console.log(`正在生成分片 ${segmentIndex}，尝试 ${attempt + 1}/${maxRetries}`);
          
          const response = await fetch('/generate_audio_segment', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              article_id: currentArticle.id,
              task_id: taskId,
              segment_index: segmentIndex,
              text: text
            })
          });
          
          const result = await response.json();
          
          if (result.success) {
            console.log(`分片 ${segmentIndex} 生成成功`);
            return true;
          } else {
            throw new Error(result.error || '生成失败');
          }
          
        } catch (error) {
          lastError = error;
          console.error(`分片 ${segmentIndex} 第 ${attempt + 1} 次尝试失败:`, error.message);
          
          if (attempt < maxRetries - 1) {
            // 指数退避：等待 2^attempt 秒，最少1秒
            const waitTime = Math.max(1000, Math.min(8000, Math.pow(2, attempt) * 1000));
            console.log(`等待 ${waitTime/1000} 秒后重试...`);
            await new Promise(resolve => setTimeout(resolve, waitTime));
          }
        }
      }
      
      console.error(`分片 ${segmentIndex} 生成失败，已重试 ${maxRetries} 次。最后错误:`, lastError?.message);
      return false;
    }
    
    // 恢复音频生成功能

        return;

    function showAudioPlayer(audioUrl, filename, isExisting = false) {
      const audioPanel = document.getElementById('audioPanel');
      const audio = document.getElementById('articleAudio');
      const downloadBtn = document.getElementById('downloadAudioBtn');
      
      // 设置音频源
      audio.src = audioUrl;
      
      // 如果是已存在的音频，添加预加载
      if (isExisting) {
        audio.preload = 'metadata';
        audio.addEventListener('loadedmetadata', function() {
          console.log(`音频加载完成，时长: ${Math.round(audio.duration)}秒`);
        }, { once: true });
      }
      
      // 设置下载链接
      downloadBtn.onclick = function() {
        const link = document.createElement('a');
        link.href = audioUrl;
        link.download = filename || 'article_audio.mp3';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };
      
      // 显示音频面板
      audioPanel.style.display = 'block';
      
      // 调整内容区域，为音频面板留出空间
      const content = document.getElementById('vContent');
      if (content) {
        content.style.paddingBottom = '80px';
      }
      
      // 如果是已存在的音频，添加一个淡入效果
      if (isExisting) {
        audioPanel.style.opacity = '0';
        audioPanel.style.transition = 'opacity 0.3s ease-in';
        setTimeout(() => {
          audioPanel.style.opacity = '1';
        }, 100);
      }
    }
    
    function closeAudioPanel() {
      const audioPanel = document.getElementById('audioPanel');
      const audio = document.getElementById('articleAudio');
      const content = document.getElementById('vContent');
      
      // 停止播放
      audio.pause();
      audio.src = '';
      
      // 隐藏面板
      audioPanel.style.display = 'none';
      
      // 恢复内容区域
      if (content) {
        content.style.paddingBottom = '';
      }
      
      currentAudioUrl = null;
    }
    
    function downloadAudio() {
      if (currentAudioUrl) {
        const link = document.createElement('a');
        link.href = currentAudioUrl;
        link.download = `${currentArticle.title || 'article'}_audio.mp3`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      }
    }
    
    // 图片相关功能
    function triggerImageUpload() {
      if (!currentArticle) {
        alert('请先打开一篇文章');
        return;
      }
      document.getElementById('imageUpload').click();
    }
    
    function handleImageUpload(event) {
      const files = event.target.files;
      if (!files || files.length === 0) return;
      
      if (!currentArticle) {
        alert('请先打开一篇文章');
        return;
      }
      
      const uploadBtn = document.getElementById('uploadImageBtn');
      const originalContent = uploadBtn.innerHTML;
      
      // 显示上传状态
      uploadBtn.disabled = true;
      uploadBtn.innerHTML = btnLabel('spin', '上传中...');
      uploadBtn.style.opacity = '0.7';
      
      const promises = Array.from(files).map(file => {
        const formData = new FormData();
        formData.append('image', file);
        formData.append('article_id', currentArticle.id);
        
        return fetch('/intensive_upload_image', {
          method: 'POST',
          body: formData
        }).then(response => response.json());
      });
      
      Promise.all(promises)
        .then(results => {
          const successResults = results.filter(r => r.success);
          const errorResults = results.filter(r => !r.success);
          
          if (successResults.length > 0) {
            // 更新当前图片列表
            successResults.forEach(result => {
              currentImages.push(result.image);
            });
            
            // 重新渲染图片
            loadArticleImages();
            
            if (errorResults.length > 0) {
              alert(`成功上传 ${successResults.length} 张图片，${errorResults.length} 张失败`);
            }
          } else {
            alert('图片上传失败');
          }
        })
        .catch(error => {
          console.error('上传错误:', error);
          alert('图片上传失败');
        })
        .finally(() => {
          // 重置按钮状态
          uploadBtn.disabled = false;
          uploadBtn.innerHTML = originalContent;
          uploadBtn.style.opacity = '1';
          
          // 清空文件选择
          event.target.value = '';
        });
    }
    
    function loadArticleImages() {
      const imagesContainer = document.getElementById('articleImages');
      const imagesGrid = document.getElementById('imagesGrid');
      
      if (!currentImages || currentImages.length === 0) {
        imagesContainer.style.display = 'none';
        return;
      }
      
      imagesContainer.style.display = 'block';
      imagesGrid.innerHTML = '';
      
      currentImages.forEach((image, index) => {
        const imageItem = document.createElement('div');
        imageItem.className = 'image-item';
        
        const img = document.createElement('img');
        img.src = `/intensive_image/${currentArticle.id}/${image.filename}`;
        img.alt = image.original_name || '文章图片';
        img.loading = 'lazy';
        
        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'image-delete-btn';
        deleteBtn.innerHTML = '✕';
        deleteBtn.title = '删除图片';
        deleteBtn.onclick = (e) => {
          e.stopPropagation();
          deleteImage(image.id, index);
        };
        
        imageItem.appendChild(img);
        imageItem.appendChild(deleteBtn);
        
        // 点击图片查看大图
        imageItem.onclick = () => {
          showImageModal(index);
        };
        
        imagesGrid.appendChild(imageItem);
      });
    }
    
    function deleteImage(imageId, index) {
      if (!confirm('确定删除这张图片吗？')) return;
      
      fetch('/intensive_delete_image', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          article_id: currentArticle.id,
          image_id: imageId
        })
      })
      .then(response => response.json())
      .then(data => {
        if (data.success) {
          // 从当前图片列表中移除
          currentImages.splice(index, 1);
          // 重新渲染图片
          loadArticleImages();
        } else {
          alert(data.error || '删除失败');
        }
      })
      .catch(error => {
        console.error('删除错误:', error);
        alert('删除失败');
      });
    }
    
    function showImageModal(index) {
      const modal = document.getElementById('imageModal');
      const modalImage = document.getElementById('modalImage');
      const imageCounter = document.getElementById('imageCounter');
      const prevBtn = document.getElementById('prevImageBtn');
      const nextBtn = document.getElementById('nextImageBtn');
      const deleteBtn = document.getElementById('deleteImageBtn');
      
      currentImageIndex = index;
      
      // 显示当前图片
      updateModalImage();
      
      // 更新导航按钮状态
      prevBtn.disabled = currentImageIndex === 0;
      nextBtn.disabled = currentImageIndex === currentImages.length - 1;
      
      // 显示模态框
      modal.classList.add('active');
      modal.style.display = 'block';
      
      // 阻止背景滚动
      document.body.style.overflow = 'hidden';
    }
    
    function updateModalImage() {
      const modalImage = document.getElementById('modalImage');
      const imageCounter = document.getElementById('imageCounter');
      const deleteBtn = document.getElementById('deleteImageBtn');
      
      if (currentImages[currentImageIndex]) {
        const image = currentImages[currentImageIndex];
        modalImage.src = `/intensive_image/${currentArticle.id}/${image.filename}`;
        imageCounter.textContent = `${currentImageIndex + 1} / ${currentImages.length}`;
        
        // 更新删除按钮
        deleteBtn.onclick = () => {
          deleteCurrentImage();
        };
      }
    }
    
    function showPreviousImage() {
      if (currentImageIndex > 0) {
        currentImageIndex--;
        updateModalImage();
        
        const prevBtn = document.getElementById('prevImageBtn');
        const nextBtn = document.getElementById('nextImageBtn');
        prevBtn.disabled = currentImageIndex === 0;
        nextBtn.disabled = false;
      }
    }
    
    function showNextImage() {
      if (currentImageIndex < currentImages.length - 1) {
        currentImageIndex++;
        updateModalImage();
        
        const prevBtn = document.getElementById('prevImageBtn');
        const nextBtn = document.getElementById('nextImageBtn');
        prevBtn.disabled = false;
        nextBtn.disabled = currentImageIndex === currentImages.length - 1;
      }
    }
    
    function deleteCurrentImage() {
      if (!currentImages[currentImageIndex]) return;
      
      const image = currentImages[currentImageIndex];
      const wasLastImage = currentImages.length === 1;
      
      if (!confirm('确定删除这张图片吗？')) return;
      
      fetch('/intensive_delete_image', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          article_id: currentArticle.id,
          image_id: image.id
        })
      })
      .then(response => response.json())
      .then(data => {
        if (data.success) {
          // 从当前图片列表中移除
          currentImages.splice(currentImageIndex, 1);
          
          if (wasLastImage || currentImages.length === 0) {
            // 如果是最后一张图片，关闭模态框
            closeImageModal();
          } else {
            // 调整当前索引
            if (currentImageIndex >= currentImages.length) {
              currentImageIndex = currentImages.length - 1;
            }
            
            // 更新模态框
            updateModalImage();
            
            // 更新导航按钮
            const prevBtn = document.getElementById('prevImageBtn');
            const nextBtn = document.getElementById('nextImageBtn');
            prevBtn.disabled = currentImageIndex === 0;
            nextBtn.disabled = currentImageIndex === currentImages.length - 1;
          }
          
          // 重新渲染图片网格
          loadArticleImages();
        } else {
          alert(data.error || '删除失败');
        }
      })
      .catch(error => {
        console.error('删除错误:', error);
        alert('删除失败');
      });
    }
    
    function closeImageModal() {
      const modal = document.getElementById('imageModal');
      modal.classList.remove('active');
      
      setTimeout(() => {
        modal.style.display = 'none';
        document.body.style.overflow = '';
      }, 300);
    }
    
    // 键盘导航支持
    document.addEventListener('keydown', function(e) {
      const modal = document.getElementById('imageModal');
      if (modal.classList.contains('active')) {
        switch(e.key) {
          case 'Escape':
            closeImageModal();
            break;
          case 'ArrowLeft':
            showPreviousImage();
            break;
          case 'ArrowRight':
            showNextImage();
            break;
        }
      }
      
      // 标题编辑键盘快捷键
      const titleEditContainer = document.getElementById('titleEditContainer');
      if (titleEditContainer && titleEditContainer.style.display !== 'none') {
        switch(e.key) {
          case 'Enter':
            e.preventDefault();
            saveTitleEdit();
            break;
          case 'Escape':
            e.preventDefault();
            cancelTitleEdit();
            break;
        }
      }
    });
    
    // 标题编辑功能
    function startEditTitle() {
      if (!currentArticle) return;
      
      const titleElement = document.getElementById('vTitle');
      const editBtn = document.getElementById('editTitleBtn');
      const editContainer = document.getElementById('titleEditContainer');
      const editInput = document.getElementById('titleEditInput');
      
      // 隐藏标题和编辑按钮，显示编辑界面
      titleElement.style.display = 'none';
      editBtn.style.display = 'none';
      editContainer.style.display = 'flex';
      
      // 设置当前标题作为初始值
      editInput.value = currentArticle.title || '未命名';
      editInput.focus();
      editInput.select();
    }
    
    function cancelTitleEdit() {
      const titleElement = document.getElementById('vTitle');
      const editBtn = document.getElementById('editTitleBtn');
      const editContainer = document.getElementById('titleEditContainer');
      
      // 恢复显示
      titleElement.style.display = 'block';
      editBtn.style.display = 'block';
      editContainer.style.display = 'none';
    }
    
    function saveTitleEdit() {
      if (!currentArticle) return;
      
      const editInput = document.getElementById('titleEditInput');
      const newTitle = editInput.value.trim();
      
      if (!newTitle) {
        alert('标题不能为空');
        editInput.focus();
        return;
      }
      
      if (newTitle === currentArticle.title) {
        cancelTitleEdit();
        return;
      }
      
      const saveBtn = document.querySelector('.title-edit-save');
      const originalContent = saveBtn.innerHTML;
      
      // 显示保存状态
      saveBtn.disabled = true;
      saveBtn.innerHTML = '⏳';
      saveBtn.style.opacity = '0.7';
      
      fetch('/intensive_update_title', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          article_id: currentArticle.id,
          new_title: newTitle
        })
      })
      .then(response => response.json())
      .then(data => {
        if (data.success) {
          // 更新当前文章对象
          const oldArticleId = currentArticle.id;
          currentArticle.title = newTitle;
          currentArticle.id = data.new_article_id;
          
          // 更新显示的标题
          document.getElementById('vTitle').textContent = newTitle;
          
          // 如果文件被重命名，显示详细信息
          if (data.renamed_files) {
            console.log('标题更新成功，相关文件已重命名：');
            console.log('文件:', data.details.files);
            console.log('目录:', data.details.directories);
            
            // 更新浏览器URL（如果有hash）
            if (window.location.hash === `#article-${oldArticleId}`) {
              window.location.hash = `#article-${data.new_article_id}`;
            }
          }
          
          // 刷新文章列表以显示新标题
          if (typeof loadList === 'function') {
            loadList();
          }
          
          cancelTitleEdit();
        } else {
          alert(data.error || '标题更新失败');
        }
      })
      .catch(error => {
        console.error('标题更新错误:', error);
        alert('标题更新失败，请稍后重试');
      })
      .finally(() => {
        // 重置按钮状态
        saveBtn.disabled = false;
        saveBtn.innerHTML = originalContent;
        saveBtn.style.opacity = '1';
      });
    }
    
  </script>
</body>
</html>
