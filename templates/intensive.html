      if(t.length <= 24 && /^(Paragraph\s+[A-Z0-9]+\b|第\s*[0-9一二三四五六七八九十]+\s*段|段落\S{0,6}题|(题目|范文|原文|译文)\s*[:：]?$|[A-Z]$)/.test(t)) return 'hd';
      // 括号、书名号里的内容不算：「幻形虫（Hallucigenia）」「刊登在《High School Reporter》上」都是译文
      const core = t.replace(/[(（《][^()（）《》]*[)）》]/g, '').trim() || t;
      const cjk = (core.match(/[㐀-鿿豈-﫿]/g) || []).length;
      if(!cjk) return 'en';
      const latin = (core.match(/[A-Za-z]/g) || []).length;
      return cjk * 2 >= latin ? 'zh' : 'en';
    }
    // 一行里属于正文的文本节点（跳过高亮的释义气泡 .tooltip）
    function lineTextNodes(p){ const out=[]; const walker=document.createTreeWalker(p, NodeFilter.SHOW_TEXT, { acceptNode: n => n.parentNode.closest('.tooltip') ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT }); let n; while(n=walker.nextNode()) out.push(n); return out; }
    // 选区真正覆盖到的正文字符 -> 原文下标 {start, end, mark}。只看被覆盖的字符，不看端点落在哪个节点上，
    // 所以端点在元素上、在上一行末尾、在下一行开头都不影响结果。mark 是被覆盖到的已有高亮（有的话）。
    // 选区碰到的高亮：优先报真高亮；只碰到自动标出的（hl-echo）且还选了它外面的字（短语里带着这个词），partial 为真，照常算新划的
    function noteMark(acc, n, s, e){ const mk = n.parentNode.closest('mark.hl'); if(!mk){ if(/\S/.test(n.nodeValue.slice(s, e))) acc.partial = true; return; } if(!acc.mark || (acc.mark.classList.contains('hl-echo') && !mk.classList.contains('hl-echo'))) acc.mark = mk; }
    function selectionToOriginal(reader, range){
      let start=null, end=null; const acc={ mark: null, partial: false };
      reader.querySelectorAll('p[data-o]').forEach(function(p){
        if(!range.intersectsNode(p)) return;
        let o = Number(p.dataset.o);
        lineTextNodes(p).forEach(function(n){
          const s = n === range.startContainer ? range.startOffset : 0;
          const e = n === range.endContainer ? range.endOffset : n.length;
          if(range.intersectsNode(n) && e > s){
            if(start === null) start = o + s;
            end = o + e;
            noteMark(acc, n, s, e);
          }
          o += n.length;
        });
      });
      return start === null ? null : { start, end, mark: acc.mark && !(acc.mark.classList.contains('hl-echo') && acc.partial) ? acc.mark : null };
    }
    // 原文下标 -> 页面上的 (文本节点, 偏移)。atEnd 为真时，正好落在两个节点交界处取前一个节点的末尾，
    // 否则取后一个节点的开头，这样新高亮不会和紧挨着的已有 <mark> 搅在一起
    function originalToDomPoint(reader, o, atEnd){
      for(const p of reader.querySelectorAll('p[data-o]')){
        let k = o - Number(p.dataset.o); if(k < 0) break;
        const nodes = lineTextNodes(p);
        if(k > nodes.reduce((s, n) => s + n.length, 0)) continue;
        for(let i = 0; i < nodes.length; i++){
          const n = nodes[i];
          if(k < n.length || (k === n.length && (atEnd || i === nodes.length - 1))) return { node: n, offset: k };
          k -= n.length;
        }
      }
      return null;
    }
    function originalToDomRange(reader, start, end){ const s=originalToDomPoint(reader, start, false), e=originalToDomPoint(reader, end, true); if(!s || !e) return null; const r=document.createRange(); r.setStart(s.node, s.offset); r.setEnd(e.node, e.offset); return r; }
    function wrapOriginalRange(reader, start, end, meta){ const r=originalToDomRange(reader, start, end); if(!r || r.collapsed) return; const mark=document.createElement('mark'); mark.className='hl'; mark.setAttribute('data-hid', meta.id); const tip=document.createElement('span'); tip.className='tooltip'; tip.textContent=meta.meaning||''; r.surroundContents(mark); mark.appendChild(tip); bindMark(mark, meta, tip); return mark; }
    // 高亮上的交互（正文、题目栏一样）：桌面悬停看释义、右键删除；手机点开单词卡；点一下都会读出来
    function bindMark(mark, meta, tip){
      const tipMark = tip.parentNode;
      mark.addEventListener('mouseenter', function(){ fitTip(tipMark); });
      // 手机长按是在选词，安卓还会顺带触发 contextmenu，这时不能弹删除确认
      mark.addEventListener('contextmenu', function(ev){ if(lastPointerType !== 'mouse') return; ev.preventDefault(); if(confirm(document.querySelectorAll(`mark.hl[data-hid="${CSS.escape(meta.id)}"]`).length > 1 ? '删除这个词的高亮？本文里所有出现的地方会一起取消。' : '删除该高亮/笔记？')){ deleteHighlight(meta.id); } });
      mark.addEventListener('click', function(ev){ ev.preventDefault(); ev.stopPropagation();
        // 手机：底部弹出单词卡（释义、发音、删除）；平板等触屏宽屏：点一下显示释义气泡，再点一下收起
        if(isPhone()){ openWordCard(meta.id); }
        else if(lastPointerType !== 'mouse'){ document.querySelectorAll('mark.hl.tip-on').forEach(m => { if(m !== tipMark) m.classList.remove('tip-on'); }); fitTip(tipMark); tipMark.classList.toggle('tip-on'); }
        const word = meta.text || mark.textContent.replace(tip.textContent, '').trim(); if(word && window.playWordPronunciation){ window.playWordPronunciation(word, currentArticle?.id); } }); }
    // 释义气泡默认在高亮正上方居中；靠近正文左右边缘时往里挪，上方被顶栏挡住时翻到下面
    function fitTip(mark){
      const tip = mark.querySelector('.tooltip'); const box = mark.closest('#vContent, #examPane');
      if(!tip || !tip.textContent || !box) return;
      mark.style.setProperty('--tip-dx', '0px'); mark.classList.remove('tip-below');
      const prev = tip.style.display; tip.style.display = 'block';
      const t = tip.getBoundingClientRect(); const b = box.getBoundingClientRect();
      tip.style.display = prev;
      let dx = 0;
      if(t.left < b.left + 8) dx = b.left + 8 - t.left;
      else if(t.right > b.right - 8) dx = b.right - 8 - t.right;
      mark.style.setProperty('--tip-dx', dx + 'px');
      if(t.top < b.top + 8) mark.classList.add('tip-below');
    }
    // 音频生成相关功能
    let currentAudioUrl = null;
    let currentAudioInfo = null;
    
    function extractEnglishText(text) {
      if (!text) return '';
      
      // 移除HTML标签
      const tempDiv = document.createElement('div');
      tempDiv.innerHTML = text;
      const plainText = tempDiv.textContent || tempDiv.innerText || '';
      
      // 使用正则表达式提取英文内容（包括标点符号、数字）
      // 排除中文字符（Unicode范围 \u4e00-\u9fff）和中文标点符号
      const englishParts = plainText.match(/[^\u4e00-\u9fff\uFF00-\uFFEF\u3000-\u303F]+/g);
      
      if (!englishParts) return '';
      
      // 清理和连接英文部分，移除只包含标点符号的部分
      return englishParts
        .map(part => part.trim())
        .filter(part => part.length > 0 && /[a-zA-Z0-9]/.test(part)) // 必须包含字母或数字
        .join(' ')
        .replace(/\s+/g, ' ')
        .trim();
    }

            proceedWithAudioGeneration();
          }

    function generateAudioBatch(englishText, btn, originalContent) {

      fetch('/prepare_article_audio', {

    async function generateSegmentsSequentially(taskId, segmentsInfo, originalText, btn, originalContent) {
      const totalSegments = segmentsInfo.length;
      let completedSegments = 0;
      
      try {
        // 重新分割文本以获取实际的分段内容
        const segments = await getSegmentTexts(originalText, totalSegments);
        
        // 首先检查已存在的分片状态
        btn.innerHTML = btnLabel('spin', `检查已存在分片...`);
        const statusResult = await checkSegmentStatus(taskId, totalSegments);
        
        if (statusResult.success) {
          completedSegments = statusResult.completed_segments.length;
          const missingSegments = statusResult.missing_segments;
          
          if (completedSegments > 0) {
            console.log(`发现 ${completedSegments} 个已完成的分片，将跳过这些分片`);
            btn.innerHTML = btnLabel('spin', `发现 ${completedSegments} 个已完成分片...`);
            await new Promise(resolve => setTimeout(resolve, 1000)); // 显示状态1秒
          }
          
          // 只生成缺失的分段
          for (const segmentIndex of missingSegments) {
            btn.innerHTML = btnLabel('spin', `生成第${segmentIndex+1}段... (${completedSegments}/${totalSegments})`);
            
            const success = await generateSingleSegmentWithRetry(
              taskId, 
              segmentIndex, 
              segments[segmentIndex], 
              3 // 最大重试次数
            );
            
            if (!success) {
              throw new Error(`第${segmentIndex+1}段生成失败，已重试多次`);
            }
            
            completedSegments++;
            btn.innerHTML = btnLabel('spin', `已完成 ${completedSegments}/${totalSegments} 段`);
            
            console.log(`第${segmentIndex+1}段生成完成 (${segments[segmentIndex].length}字符)`);
          }
        } else {
          // 如果状态检查失败，按原逻辑逐个生成
          for (let i = 0; i < segments.length; i++) {
            btn.innerHTML = btnLabel('spin', `生成第${i+1}段... (${completedSegments}/${totalSegments})`);
            
            const success = await generateSingleSegmentWithRetry(
              taskId, 
              i, 
              segments[i], 
              3 // 最大重试次数
            );
            
            if (!success) {
              throw new Error(`第${i+1}段生成失败，已重试多次`);
            }
            
            completedSegments++;
            btn.innerHTML = btnLabel('spin', `已完成 ${completedSegments}/${totalSegments} 段`);
            
            console.log(`第${i+1}段生成完成 (${segments[i].length}字符)`);
          }
        }
        
        // 所有分段完成，开始合并
        btn.innerHTML = btnLabel('spin', `合并音频...`);
        
        const combineResponse = await fetch('/combine_audio_segments', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            article_id: currentArticle.id,
            task_id: taskId,
            segments_count: totalSegments,
            original_text: originalText
          })
        });
        
        const combineResult = await combineResponse.json();
        
        if (combineResult.success) {
          showAudioPlayer(combineResult.audio_url, combineResult.filename);
          currentAudioUrl = combineResult.audio_url;
          updateAudioButton(true);
          console.log(`音频生成成功！共${combineResult.segments_count}段，总长度${combineResult.text_length}字符`);
        } else {
          throw new Error(combineResult.error || '合并失败');
        }
        
      } catch (error) {
        console.error('分批生成错误:', error);
        alert(`音频生成失败: ${error.message}`);
      } finally {
        resetAudioButton(btn, originalContent);
      }
    }
    
    async function getSegmentTexts(text, targetSegments) {
      // 在前端重新分割文本，确保与后端一致（增加40%冗余）
      const MAX_CHARS = 2200;  // 进一步降低字符限制
      if (text.length <= MAX_CHARS) {
        return [text];
      }
      
      // 智能分割逻辑，按句号分割并确保平均分配
      const sentences = text.split(/(?<=[.!?])\s+/);
      const idealLength = text.length / targetSegments;
      
      const segments = [];
      let currentSegment = '';
      
      for (const sentence of sentences) {
        const testSegment = currentSegment + (currentSegment ? ' ' : '') + sentence;
        
        // 更严格的分割条件，确保段落更短（40%冗余策略）
        const shouldSplit = (
          testSegment.length > idealLength * 0.9 &&  // 更早分割
          currentSegment && 
          segments.length < targetSegments - 1 &&
          testSegment.length > MAX_CHARS * 0.5  // 避免过小段落
        );
        
        if (shouldSplit) {
          segments.push(currentSegment.trim());
          currentSegment = sentence;
        } else {
          currentSegment = testSegment;
        }
      }
      
      if (currentSegment) {
        segments.push(currentSegment.trim());
      }
      
      // 如果某个段落仍然过长，进行二次分割
      const finalSegments = [];
      for (const segment of segments) {
        if (segment.length <= MAX_CHARS) {
          finalSegments.push(segment);
        } else {
          // 对过长段落按句子进一步分割
          const subSentences = segment.split(/(?<=[.!?])\s+/);
          let currentSub = '';
          
          for (const subSentence of subSentences) {
            const testSub = currentSub + (currentSub ? ' ' : '') + subSentence;
            if (testSub.length > MAX_CHARS && currentSub) {
              finalSegments.push(currentSub.trim());
              currentSub = subSentence;
            } else {
              currentSub = testSub;
            }
          }
          
          if (currentSub) {
            finalSegments.push(currentSub.trim());
          }
        }
      }
      
      return finalSegments;
    }

    async function checkSegmentStatus(taskId, segmentsCount) {

    // 单个分片生成（带重试）的辅助函数
    async function generateSingleSegmentWithRetry(taskId, segmentIndex, text, maxRetries = 3) {
      let lastError = null;
      
      for (let attempt = 0; attempt < maxRetries; attempt++) {
        try {
          console.log(`正在生成分片 ${segmentIndex}，尝试 ${attempt + 1}/${maxRetries}`);
          
          const response = await fetch('/generate_audio_segment', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              article_id: currentArticle.id,
              task_id: taskId,
              segment_index: segmentIndex,
              text: text
            })
          });
          
          const result = await response.json();
          
          if (result.success) {
            console.log(`分片 ${segmentIndex} 生成成功`);
            return true;
          } else {
            throw new Error(result.error || '生成失败');
          }
          
        } catch (error) {
          lastError = error;
          console.error(`分片 ${segmentIndex} 第 ${attempt + 1} 次尝试失败:`, error.message);
          
          if (attempt < maxRetries - 1) {
            // 指数退避：等待 2^attempt 秒，最少1秒
            const waitTime = Math.max(1000, Math.min(8000, Math.pow(2, attempt) * 1000));
            console.log(`等待 ${waitTime/1000} 秒后重试...`);
            await new Promise(resolve => setTimeout(resolve, waitTime));
          }
        }
      }
      
      console.error(`分片 ${segmentIndex} 生成失败，已重试 ${maxRetries} 次。最后错误:`, lastError?.message);
      return false;
    }
    
    // 恢复音频生成功能
    async function resumeAudioGeneration() {
      if (!currentArticle) {
        alert('请先打开一篇文章');
        return;
      }
      
      // 查找未完成的音频任务
      const unfinishedTask = await findUnfinishedAudioTask();
      
      if (!unfinishedTask) {
        alert('没有找到未完成的音频生成任务');
        return;
      }
      
      if (!confirm(`发现未完成的音频生成任务（${unfinishedTask.completion_rate.toFixed(1)}% 完成）。\n\n是否继续完成该任务？`)) {
        return;
      }
      
      const btn = document.getElementById('generateAudioBtn');
      const resumeBtn = document.getElementById('resumeAudioBtn');
      const originalContent = btn.innerHTML;
      
      try {
        // 禁用按钮
        btn.disabled = true;
        resumeBtn.disabled = true;
        resumeBtn.style.display = 'none';
        
        // 提取英文文本
        const englishText = extractEnglishText(currentArticle.content_text);
        
        if (!englishText || englishText.trim().length === 0) {
          alert('未找到英文内容可生成音频');
          return;
        }
        
        // 继续生成剩余分片
        await continueSegmentGeneration(unfinishedTask, englishText, btn, originalContent);
        
      } catch (error) {
        console.error('恢复音频生成错误:', error);
        alert(`恢复失败: ${error.message}`);
      } finally {
        resetAudioButton(btn, originalContent);
        resumeBtn.disabled = false;
      }
    }
    
    // 查找未完成的音频任务
    async function findUnfinishedAudioTask() {
      if (!currentArticle) return null;
      
      try {
        // 检查文章音频目录中的临时任务目录
        const response = await fetch(`/find_unfinished_audio_tasks/${currentArticle.id}`);
        const data = await response.json();
        
        if (data.success && data.unfinished_tasks.length > 0) {
          // 返回最新的未完成任务
          return data.unfinished_tasks[0];
        }
        
        return null;
      } catch (error) {
        console.error('查找未完成任务失败:', error);
        return null;
      }
    }
    
    // 继续分片生成
    async function continueSegmentGeneration(taskInfo, originalText, btn, originalContent) {
      const { task_id, segments_count, completed_segments, missing_segments } = taskInfo;
      
      // 重新分割文本
      const segments = await getSegmentTexts(originalText, segments_count);
      let completedCount = completed_segments.length;
      
      btn.innerHTML = btnLabel('spin', `恢复生成 (${completedCount}/${segments_count})...`);
      
      // 生成缺失的分段
      for (const segmentIndex of missing_segments) {
        btn.innerHTML = btnLabel('spin', `恢复第${segmentIndex+1}段... (${completedCount}/${segments_count})`);
        
        const success = await generateSingleSegmentWithRetry(
          task_id,
          segmentIndex,
          segments[segmentIndex],
          3
        );
        
        if (!success) {
          throw new Error(`第${segmentIndex+1}段恢复生成失败`);
        }
        
        completedCount++;
        btn.innerHTML = btnLabel('spin', `已完成 ${completedCount}/${segments_count} 段`);
        
        console.log(`第${segmentIndex+1}段恢复生成完成`);
      }
      
      // 合并音频
      btn.innerHTML = btnLabel('spin', `合并音频...`);
      
      const combineResponse = await fetch('/combine_audio_segments', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          article_id: currentArticle.id,
          task_id: task_id,
          segments_count: segments_count,
          original_text: originalText
        })
      });
      
      const combineResult = await combineResponse.json();
      
      if (combineResult.success) {
        showAudioPlayer(combineResult.audio_url, combineResult.filename);
        currentAudioUrl = combineResult.audio_url;
        updateAudioButton(true);
        console.log(`音频恢复成功！共${combineResult.segments_count}段`);
      } else {
        throw new Error(combineResult.error || '合并失败');
      }
    }
    
    // 检查未完成的音频任务
    async function checkForUnfinishedAudioTasks() {
      if (!currentArticle) return;
      
      try {
        const unfinishedTask = await findUnfinishedAudioTask();
        const resumeBtn = document.getElementById('resumeAudioBtn');
        
        if (unfinishedTask && unfinishedTask.completion_rate < 1.0) {
          // 显示恢复按钮
          resumeBtn.style.display = 'inline-block';
          resumeBtn.title = `恢复未完成的音频生成任务 (${(unfinishedTask.completion_rate * 100).toFixed(1)}% 完成)`;
          console.log(`发现未完成的音频任务: ${unfinishedTask.task_id} (${(unfinishedTask.completion_rate * 100).toFixed(1)}% 完成)`);
        } else {
          resumeBtn.style.display = 'none';
        }
      } catch (error) {
        console.error('检查未完成任务失败:', error);
        document.getElementById('resumeAudioBtn').style.display = 'none';
      }
    }
    
    function showAudioPlayer(audioUrl, filename, isExisting = false) {
      const audioPanel = document.getElementById('audioPanel');
      const audio = document.getElementById('articleAudio');
      const downloadBtn = document.getElementById('downloadAudioBtn');
      
      // 设置音频源
      audio.src = audioUrl;
      
      // 如果是已存在的音频，添加预加载
      if (isExisting) {
        audio.preload = 'metadata';
        audio.addEventListener('loadedmetadata', function() {
          console.log(`音频加载完成，时长: ${Math.round(audio.duration)}秒`);
        }, { once: true });
      }
      
      // 设置下载链接
      downloadBtn.onclick = function() {
        const link = document.createElement('a');
        link.href = audioUrl;
        link.download = filename || 'article_audio.mp3';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };
      
      // 显示音频面板
      audioPanel.style.display = 'block';
      audioPanel.classList.remove('is-collapsed');
      syncAudioUi();
      
      // 调整内容区域，为音频面板留出空间
      const content = document.getElementById('vContent');
      if (content) {
        content.style.paddingBottom = '80px';
      }
      
      // 如果是已存在的音频，添加一个淡入效果
      if (isExisting) {
        audioPanel.style.opacity = '0';
        audioPanel.style.transition = 'opacity 0.3s ease-in';
        setTimeout(() => {
          audioPanel.style.opacity = '1';
        }, 100);
      }
    }
    
    function closeAudioPanel() {
      const audioPanel = document.getElementById('audioPanel');
      const audio = document.getElementById('articleAudio');
      const content = document.getElementById('vContent');
      
      // 停止播放
      audio.pause();
      audio.src = '';
      
      // 隐藏面板
      audioPanel.style.display = 'none';
      audioPanel.classList.remove('is-collapsed');
      
      // 恢复内容区域

    // 图片相关功能
    function triggerImageUpload() {
      if (!currentArticle) {
        alert('请先打开一篇文章');
        return;
      }
      document.getElementById('imageUpload').click();
    }
    
    function handleImageUpload(event) {
      const files = event.target.files;
      if (!files || files.length === 0) return;
      
      if (!currentArticle) {
        alert('请先打开一篇文章');
        return;
      }
      
      const uploadBtn = document.getElementById('uploadImageBtn');
      const originalContent = uploadBtn.innerHTML;
      
      // 显示上传状态
      uploadBtn.disabled = true;
      uploadBtn.innerHTML = btnLabel('spin', '上传中...');
      uploadBtn.style.opacity = '0.7';
      
      const promises = Array.from(files).map(file => {
        const formData = new FormData();
        formData.append('image', file);
        formData.append('article_id', currentArticle.id);
        
        return fetch('/intensive_upload_image', {
          method: 'POST',
          body: formData
        }).then(response => response.json());
      });
      
      Promise.all(promises)
        .then(results => {
          const successResults = results.filter(r => r.success);
          const errorResults = results.filter(r => !r.success);
          
          if (successResults.length > 0) {
            // 更新当前图片列表
            successResults.forEach(result => {
              currentImages.push(result.image);
            });
            
            // 重新渲染图片
            loadArticleImages();
            
            if (errorResults.length > 0) {
              alert(`成功上传 ${successResults.length} 张图片，${errorResults.length} 张失败`);
            }
          } else {
            alert('图片上传失败');
          }
        })
        .catch(error => {
          console.error('上传错误:', error);
          alert('图片上传失败');
        })
        .finally(() => {
          // 重置按钮状态
          uploadBtn.disabled = false;
          uploadBtn.innerHTML = originalContent;
          uploadBtn.style.opacity = '1';
          
          // 清空文件选择
          event.target.value = '';
        });
    }
    
    function loadArticleImages() {
      const imagesContainer = document.getElementById('articleImages');
      const imagesGrid = document.getElementById('imagesGrid');
      
      if (!currentImages || currentImages.length === 0) {
        imagesContainer.style.display = 'none';
        return;
      }
      
      imagesContainer.style.display = 'block';

        deleteBtn.onclick = (e) => {
          e.stopPropagation();
          deleteImage(image.id, index);

    function deleteImage(imageId, index) {
      if (!confirm('确定删除这张图片吗？')) return;
      
      fetch('/intensive_delete_image', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          article_id: currentArticle.id,
          image_id: imageId
        })
      })
      .then(response => response.json())
      .then(data => {
        if (data.success) {
          // 从当前图片列表中移除
          currentImages.splice(index, 1);
          // 重新渲染图片
          loadArticleImages();
        } else {
          alert(data.error || '删除失败');
        }
      })
      .catch(error => {
        console.error('删除错误:', error);
        alert('删除失败');
      });

    function showImageModal(index) {
      const modal = document.getElementById('imageModal');
      const modalImage = document.getElementById('modalImage');
      const imageCounter = document.getElementById('imageCounter');
      const prevBtn = document.getElementById('prevImageBtn');
      const nextBtn = document.getElementById('nextImageBtn');
      const deleteBtn = document.getElementById('deleteImageBtn');
      
      currentImageIndex = index;
      
      // 显示当前图片
      updateModalImage();
      
      // 更新导航按钮状态
      prevBtn.disabled = currentImageIndex === 0;
      nextBtn.disabled = currentImageIndex === currentImages.length - 1;
      
      // 显示模态框
      modal.classList.add('active');
      modal.style.display = 'block';
      
      // 阻止背景滚动
      document.body.style.overflow = 'hidden';
      openLayer('image', hideImageModal, false);
    }
    
    function updateModalImage() {
      const modalImage = document.getElementById('modalImage');
      const imageCounter = document.getElementById('imageCounter');
      const deleteBtn = document.getElementById('deleteImageBtn');
      
      if (currentImages[currentImageIndex]) {
        const image = currentImages[currentImageIndex];
        modalImage.classList.remove('is-zoomed');
        modalImage.src = `/intensive_image/${currentArticle.id}/${image.filename}`;
        imageCounter.textContent = `${currentImageIndex + 1} / ${currentImages.length}`;
        
        // 更新删除按钮
        deleteBtn.onclick = () => {
          deleteCurrentImage();
        };
      }
    }
    
    function showPreviousImage() {
      if (currentImageIndex > 0) {
        currentImageIndex--;
        updateModalImage();
        
        const prevBtn = document.getElementById('prevImageBtn');
        const nextBtn = document.getElementById('nextImageBtn');
        prevBtn.disabled = currentImageIndex === 0;
        nextBtn.disabled = false;
      }
    }
    
    function showNextImage() {
      if (currentImageIndex < currentImages.length - 1) {
        currentImageIndex++;
        updateModalImage();
        
        const prevBtn = document.getElementById('prevImageBtn');
        const nextBtn = document.getElementById('nextImageBtn');
        prevBtn.disabled = false;
        nextBtn.disabled = currentImageIndex === currentImages.length - 1;
      }
    }
    
    function deleteCurrentImage() {
      if (!currentImages[currentImageIndex]) return;
      
      const image = currentImages[currentImageIndex];
      const wasLastImage = currentImages.length === 1;
      
      if (!confirm('确定删除这张图片吗？')) return;
      
      fetch('/intensive_delete_image', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          article_id: currentArticle.id,
          image_id: image.id
        })
      })
      .then(response => response.json())
      .then(data => {
        if (data.success) {
          // 从当前图片列表中移除
          currentImages.splice(currentImageIndex, 1);
          
          if (wasLastImage || currentImages.length === 0) {
            // 如果是最后一张图片，关闭模态框
            closeImageModal();
          } else {
            // 调整当前索引
            if (currentImageIndex >= currentImages.length) {
              currentImageIndex = currentImages.length - 1;
            }
            
            // 更新模态框
            updateModalImage();
            
            // 更新导航按钮
            const prevBtn = document.getElementById('prevImageBtn');
            const nextBtn = document.getElementById('nextImageBtn');
            prevBtn.disabled = currentImageIndex === 0;
            nextBtn.disabled = currentImageIndex === currentImages.length - 1;
          }
          
          // 重新渲染图片网格
          loadArticleImages();
        } else {
          alert(data.error || '删除失败');
        }
      })
      .catch(error => {
        console.error('删除错误:', error);
        alert('删除失败');
      });
    }
    
    function closeImageModal() { hideImageModal(); closeLayer('image'); }
    function hideImageModal() {
      const modal = document.getElementById('imageModal');
      modal.classList.remove('active');
      document.getElementById('modalImage').classList.remove('is-zoomed');
      
      setTimeout(() => {
        modal.style.display = 'none';
        document.body.style.overflow = '';
      }, 300);
    }
    
    // 键盘导航支持
    document.addEventListener('keydown', function(e) {
      const modal = document.getElementById('imageModal');
      if (modal.classList.contains('active')) {
        switch(e.key) {
          case 'Escape':
            closeImageModal();
            break;
          case 'ArrowLeft':
            showPreviousImage();
            break;
          case 'ArrowRight':

            break;

            saveTitleEdit();

            e.preventDefault();
            cancelTitleEdit();
            break;

    function saveTitleEdit() {
      if (!currentArticle) return;
      
      const editInput = document.getElementById('titleEditInput');
      const newTitle = editInput.value.trim();
      
      if (!newTitle) {
        alert('标题不能为空');
        editInput.focus();
        return;
      }
      
      if (newTitle === currentArticle.title) {
        cancelTitleEdit();
        return;
      }
      
      const saveBtn = document.querySelector('.title-edit-save');
      const originalContent = saveBtn.innerHTML;
      
      // 显示保存状态
      saveBtn.disabled = true;
      saveBtn.innerHTML = '⏳';
      saveBtn.style.opacity = '0.7';
      
      fetch('/intensive_update_title', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          article_id: currentArticle.id,
          new_title: newTitle
        })
      })
      .then(response => response.json())
      .then(data => {
        if (data.success) {
          // 更新当前文章对象
          const oldArticleId = currentArticle.id;
          currentArticle.title = newTitle;
          currentArticle.id = data.new_article_id;
          
          // 更新显示的标题
          document.getElementById('vTitle').textContent = newTitle;
          
          // 如果文件被重命名，显示详细信息
          if (data.renamed_files) {
            console.log('标题更新成功，相关文件已重命名：');
            console.log('文件:', data.details.files);
            console.log('目录:', data.details.directories);
            
          }
          // 更新浏览器URL（如果有hash）：换掉当前这条，不再多压一条历史（以前中文 ID 的文章比较不上，网址也不改）。
          // 手机上要等改标题面板那条历史退掉以后再换，不然退回去又是旧 ID
          const fixHash = () => {
            if (data.renamed_files && hashArticleId() === oldArticleId) {
              history.replaceState(Object.assign({}, history.state, { irReader: data.new_article_id }), '', articleHash(data.new_article_id));
            }
          };
          
          // 刷新文章列表以显示新标题
          if (typeof loadList === 'function') {
            loadList();
          }
          
          cancelTitleEdit(fixHash);
        } else {
          alert(data.error || '标题更新失败');
        }
      })
      .catch(error => {
        console.error('标题更新错误:', error);
        alert('标题更新失败，请稍后重试');
      })
      .finally(() => {
        // 重置按钮状态
        saveBtn.disabled = false;
        saveBtn.innerHTML = originalContent;
        saveBtn.style.opacity = '1';
      });
    }

    function regenerateAudioPhone(){
      if(!currentArticle) return;
      const when = currentAudioInfo && currentAudioInfo.created_time ? `（生成时间：${new Date(currentAudioInfo.created_time).toLocaleString()}）` : '';
      if(!confirm(`此文章已有音频文件${when}。\n\n是否要重新生成音频？这将覆盖原有文件，并重新调用语音合成。`)) return;
      cleanupExistingAudio().then(() => proceedWithAudioGeneration()).catch(error => {
        console.error('清理音频文件失败:', error);
        alert('清理旧音频文件时出现问题，但将继续生成新音频');
        proceedWithAudioGeneration();
      });

    function collapseAudioPanel(){ document.getElementById('audioPanel').classList.add('is-collapsed'); syncAudioUi(); }
    function toggleAudioPlay(){ const a = document.getElementById('articleAudio'); if(a.paused){ const p = a.play(); if(p && p.catch) p.catch(() => {}); } else a.pause(); }
    function syncAudioUi(){
      const panel = document.getElementById('audioPanel');
      const shown = panel.style.display === 'block' && !panel.classList.contains('is-collapsed');
      const btn = document.getElementById('generateAudioBtn');
      if(isPhone()) btn.classList.toggle('is-on', shown); else btn.classList.remove('is-on');
      updateDock();
    }
    (function(){
      const a = document.getElementById('articleAudio'), play = document.getElementById('apPlay'), seek = document.getElementById('apSeek'), time = document.getElementById('apTime');
      const fmt = s => (isFinite(s) && s >= 0) ? Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0') : '0:00';
      let seeking = false;
      const paint = () => {
        play.innerHTML = a.paused ? IC.play : IC.pause; play.setAttribute('aria-label', a.paused ? '播放' : '暂停');
        const d = a.duration;
        if(!seeking) seek.value = isFinite(d) && d > 0 ? Math.round(a.currentTime / d * 1000) : 0;
        time.textContent = fmt(a.currentTime) + ' / ' + fmt(d);
      };
      ['play', 'pause', 'timeupdate', 'loadedmetadata', 'durationchange', 'ended', 'emptied'].forEach(ev => a.addEventListener(ev, paint));
      seek.addEventListener('input', () => { seeking = true; const d = a.duration; if(isFinite(d)) time.textContent = fmt(seek.value / 1000 * d) + ' / ' + fmt(d); });
      seek.addEventListener('change', () => { const d = a.duration; if(isFinite(d) && d > 0) a.currentTime = seek.value / 1000 * d; seeking = false; paint(); });
      paint();
    })();

    // 横着拿的手机上题目面板在右边一栏（见样式表「横着拿的手机」），不压在正文下面
    function examPaneBeside(){ const r = document.getElementById('examPane').getBoundingClientRect(); return r.width > 0 && r.left > 1; }
    // ===== 手机：底部占了多高（工具栏 + 播放条，或者题目面板），正文留出这么多、划词操作栏贴在它上面 =====
    function updateDock(){
      const b = document.body;
      if(!isPhone() || !document.getElementById('viewer').classList.contains('active')){ b.style.removeProperty('--ir-dock-h'); b.style.removeProperty('--ui-bottom-bar-h'); return; }
      const tools = document.querySelector('#viewer .ir-tools'), ap = document.getElementById('audioPanel'), qs = document.getElementById('examPane');
      let h = (tools ? tools.offsetHeight : 0) + (ap.offsetHeight || 0);
      if(qs.classList.contains('is-peek') && !examPaneBeside()) h = qs.offsetHeight;
      b.style.setProperty('--ir-dock-h', h + 'px');
      b.style.setProperty('--ui-bottom-bar-h', h + 'px');
    }
    if(window.ResizeObserver){ const ro = new ResizeObserver(() => updateDock()); ['audioPanel', 'examPane'].forEach(id => ro.observe(document.getElementById(id))); ro.observe(document.querySelector('#viewer .ir-tools')); }
    // 键盘弹起时（iOS 只缩可视区域，不缩布局视口）把写释义、改标题的面板托在键盘上面
    if(window.visualViewport){
      const vv = window.visualViewport;
      const onVV = () => { if(!isPhone()){ document.body.style.removeProperty('--ir-kb'); return; } document.body.style.setProperty('--ir-kb', Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop)) + 'px'); };
      vv.addEventListener('resize', onVV); vv.addEventListener('scroll', onVV);
    }

    // ===== 手机：⋯ 面板和改标题面板挪出顶栏 =====
    // 顶栏在手机上是 sticky，自成一个层叠上下文，留在里面的面板永远盖不过遮罩；宽屏时放回原位
    const chromeHomes = new Map();
    function placePhoneChrome(){
      const dock = document.getElementById('irDock');
      ['moreMenu', 'titleEditContainer'].forEach(id => {
        const el = document.getElementById(id);
        if(!chromeHomes.has(el)) chromeHomes.set(el, { parent: el.parentNode, next: el.nextSibling });
        const home = chromeHomes.get(el);
        if(isPhone()){ if(el.parentNode !== dock) dock.appendChild(el); }
        else if(el.parentNode !== home.parent){ home.parent.insertBefore(el, home.next); }
      });
    }
    placePhoneChrome();

    // ===== 手机：大图左右滑换张、双击放大 =====
    (function(){
      const modal = document.getElementById('imageModal'); let x0 = null, y0 = 0, lastTap = 0;
      modal.addEventListener('touchstart', e => { if(e.touches.length !== 1){ x0 = null; return; } x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
      modal.addEventListener('touchend', e => {
        if(x0 === null || !isPhone()) return;
        const t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0; x0 = null;
        const img = document.getElementById('modalImage');
        if(Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5 && !img.classList.contains('is-zoomed')){ if(dx < 0) showNextImage(); else showPreviousImage(); lastTap = 0; return; }
        if(Math.abs(dx) < 10 && Math.abs(dy) < 10 && e.target === img){
          const now = Date.now();
          if(now - lastTap < 320){
            const r = img.getBoundingClientRect();
            if(!img.classList.contains('is-zoomed')) img.style.transformOrigin = `${((t.clientX - r.left) / r.width * 100).toFixed(1)}% ${((t.clientY - r.top) / r.height * 100).toFixed(1)}%`;
            img.classList.toggle('is-zoomed'); lastTap = 0; e.preventDefault();
          } else lastTap = now;
        }
      });
    })();

    // 跨过 820px（转屏、拉窗口）：收掉手机上的各种面板，挪回原位，按新宽度重画工具栏
    function onPhoneChange(){
      historyBack(closeAllLayers());
      hideFloat();
      syncScrollRestoration();
      placePhoneChrome();
      const gen = document.getElementById('generateAudioBtn');
      if(!gen.disabled) updateAudioButton(!!currentAudioInfo);
      syncAudioUi();
    }
    if(phoneMQ.addEventListener) phoneMQ.addEventListener('change', onPhoneChange); else if(phoneMQ.addListener) phoneMQ.addListener(onPhoneChange);
    if(isPhone()) updateAudioButton(false);

  </script>
</body>
