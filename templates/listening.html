    (function () {
      try {
        var preference = localStorage.getItem('ui-theme');
        if (preference !== 'light' && preference !== 'dark' && preference !== 'system') preference = 'system';
        var isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = preference === 'system' ? (isDark ? 'dark' : 'light') : preference;
        var root = document.documentElement;
        root.dataset.themePreference = preference;
        root.dataset.theme = theme;
        root.style.colorScheme = theme;
        root.classList.toggle('dark', theme === 'dark');
      } catch (error) {
        document.documentElement.dataset.themePreference = 'system';
        document.documentElement.dataset.theme = 'light';
        document.documentElement.style.colorScheme = 'light';
      }
    })();
  </script>

<script>
// ===================================================================
//  State
// ===================================================================
const state = {
  view: 'list',
  projects: [],
  listFilter: 'all',
  currentProject: null,
  currentData: null,
  activeSegmentId: -1,
  playbackRate: 1.0,
  pollingTimer: null,
  showTranslations: true,
  sideOpen: false,
  pickerSeg: null,        // 正在展开听错原因选择的句子
  pendingDelete: null,    // 删除确认弹窗里的项目 id
  pendingVocab: null,     // { segmentId, word, startOffset, endOffset } — pending text selection
  viewingAnnot: null,     // { id, segmentId } — 正在看的生词
  editingAnnot: null,     // 正在改释义的生词对象
  notePending: null,      // { segmentId, word, startOffset, endOffset } — selection awaiting a new note
  viewingNote: null,      // the note object currently shown in the popover
  editingNote: null,      // the note object currently being edited
  notesFilter: 'all',
  lastPointer: 'mouse',
  vocabAudioPauseActive: false,
  vocabAudioWasPlaying: false,
  vocabAudioManualOverride: false
};

const ERROR_TAGS = [
  { id: 'locate',     label: 'A 定位跟丢', hint: '不知道答案在哪句，音频过去了才反应' },
  { id: 'vocab',      label: 'B 生词障碍', hint: '听到了声音但不认识这个词' },
  { id: 'phonetic',   label: 'C 辨音失误', hint: '认识但听错：连读弱读、相似音、数字字母听混' },
  { id: 'spelling',   label: 'D 拼写失误', hint: '听懂了但拼错、超字数、单复数、格式错' },
  { id: 'distractor', label: 'E 干扰误选', hint: '选择题被干扰项带走，或说话人改口后没改' }
];

const ICONS = {
  star: '<svg class="lr-ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M8 2.2l1.8 3.7 4 .6-2.9 2.8.7 4L8 11.4l-3.6 1.9.7-4L2.2 6.5l4-.6z"/></svg>',
  starOn: '<svg class="lr-ico" viewBox="0 0 16 16" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M8 2.2l1.8 3.7 4 .6-2.9 2.8.7 4L8 11.4l-3.6 1.9.7-4L2.2 6.5l4-.6z"/></svg>',
  play: '<svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M5 3.5v9l7.5-4.5z"/></svg>',
  pause: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5.5 3.5v9M10.5 3.5v9"/></svg>',
  trash: '<svg class="lr-ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.6 8.5h5.8l.6-8.5"/></svg>',
  edit: '<svg class="lr-ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 2.5 13.5 5 5.5 13H3v-2.5z"/></svg>',
  retry: '<svg class="lr-ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 8a5 5 0 1 1-1.5-3.5M13 3v2.5h-2.5"/></svg>',
  check: '<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8.5 6.5 11.5 12.5 4.5"/></svg>'
};

const audioEl = document.getElementById('audioEl');
const LAST_KEY = 'listening-last-position';

function beginVocabAudioPause() {
  if (state.vocabAudioPauseActive) {
    if (!state.vocabAudioManualOverride && !audioEl.paused) audioEl.pause();
    return;
  }

  state.vocabAudioWasPlaying = !audioEl.paused;
  state.vocabAudioPauseActive = true;
  state.vocabAudioManualOverride = false;

  if (!audioEl.paused) audioEl.pause();
}

function markVocabAudioManualOverride() {
  if (state.vocabAudioPauseActive) state.vocabAudioManualOverride = true;
}

function endVocabAudioPause() {
  const shouldResume = state.vocabAudioPauseActive && state.vocabAudioWasPlaying && !state.vocabAudioManualOverride;

  state.vocabAudioPauseActive = false;
  state.vocabAudioWasPlaying = false;
  state.vocabAudioManualOverride = false;

  if (shouldResume && audioEl.paused) audioEl.play().catch(() => {});
}

// ===================================================================
//  API Helper
// ===================================================================
const API = {
  _headers(json) {
    const h = {};
    const tk = localStorage.getItem('authToken');
    if (tk) h['Authorization'] = 'Bearer ' + tk;
    if (json) h['Content-Type'] = 'application/json';
    return h;
  },
  async get(url)          { return (await fetch(url, { headers: this._headers() })).json(); },
  async post(url, body)   { return (await fetch(url, { method: 'POST',   headers: this._headers(true), body: JSON.stringify(body) })).json(); },
  async put(url, body)    { return (await fetch(url, { method: 'PUT',    headers: this._headers(true), body: JSON.stringify(body) })).json(); },
  async del(url)          { return (await fetch(url, { method: 'DELETE', headers: this._headers() })).json(); },
  async upload(url, fd)   {
    const h = {};
    const tk = localStorage.getItem('authToken');
    if (tk) h['Authorization'] = 'Bearer ' + tk;
    return (await fetch(url, { method: 'POST', headers: h, body: fd })).json();
  }
};

// ===================================================================
//  Init
// ===================================================================
(async function init() {
  const tk = localStorage.getItem('authToken');
  if (!tk) { location.href = '/login'; return; }
  // 只有服务器明确回答"无效"才清掉凭证、跳登录页；断网、服务器重启时的 502 页面说明不了凭证失效，按已登录继续
  let d = null;
  try {
    const r = await fetch('/verify_token', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: tk }) });
    d = await r.json();
  } catch { d = null; }
  if (d && d.valid === false) { localStorage.removeItem('authToken'); location.href = '/login'; return; }
  setPlayIcon(false);
  setNotesFilter('all');
  await loadProjects();
  await maybeDeepLinkFromUrl();
})();

// Deep-link support: /listening_review?project=<id>&seg=<segId> opens a project and jumps to a segment.
async function maybeDeepLinkFromUrl() {
  const params = new URLSearchParams(location.search);
  const pid = params.get('project');
  if (!pid) return;
  history.replaceState(null, '', '/listening_review'); // avoid re-triggering on refresh
  await openProject(pid);
  if (state.view !== 'detail') return; // openProject bailed (still processing / error)
  const segParam = params.get('seg');
  if (segParam === null) return;
  const segId = parseInt(segParam);
  const seg = state.currentData?.segments.find(s => s.id === segId);
  if (!seg) return;
  seekWhenReady(seg.start);
  state.activeSegmentId = segId;
  highlightSegment(segId);
}

function seekWhenReady(t, then) {
  const apply = () => { audioEl.currentTime = t; if (then) then(); };
  if (audioEl.readyState >= 1) apply();
  else audioEl.addEventListener('loadedmetadata', apply, { once: true });
}

//  View Switching

function switchView(view) {
  state.view = view;
  document.getElementById('listView').hidden = view !== 'list';
  document.getElementById('detailView').hidden = view !== 'detail';
  document.getElementById('lrPlayer').hidden = view !== 'detail';
  window.scrollTo(0, 0);
}

// ===================================================================
//  List View
// ===================================================================
async function loadProjects() {
  const r = await API.get('/api/listening_review/list');
  if (r.error) { showToast(r.error, 'error'); return; }
  state.projects = r.projects || [];
  renderListView();

  const hasInProgress = state.projects.some(p => p.status === 'processing' || p.status === 'translating');
  if (hasInProgress && !state.pollingTimer) {
    state.pollingTimer = setInterval(async () => {
      if (state.view !== 'list') return;
      const r2 = await API.get('/api/listening_review/list');
      if (r2.projects) {
        state.projects = r2.projects;
        renderListView();
        if (!r2.projects.some(p => p.status === 'processing' || p.status === 'translating')) {
          clearInterval(state.pollingTimer);
          state.pollingTimer = null;
        }
      }
    }, 3000);
  } else if (!hasInProgress && state.pollingTimer) {
    clearInterval(state.pollingTimer);
    state.pollingTimer = null;
  }
}

function listFilterMatch(p, f) {
  if (f === 'done') return !!p.mastered;
  if (f === 'todo') return !p.mastered;
  return true;
}

function renderListView() {
  const projects = state.projects;
  document.getElementById('projCount').textContent = projects.length ? `${projects.length} 篇` : '';
  const notesTotal = projects.reduce((s, p) => s + (p.vocab_count || 0) + (p.note_count || 0), 0);
  document.getElementById('allNotesCount').textContent = notesTotal ? String(notesTotal) : '';

  const toolbar = document.getElementById('listToolbar');
  toolbar.hidden = projects.length === 0;
  ['all', 'todo', 'done'].forEach(f => {
    toolbar.querySelector(`[data-count="${f}"]`).textContent = projects.filter(p => listFilterMatch(p, f)).length;
  });
  toolbar.querySelectorAll('.list-filter').forEach(b => {
    const on = b.dataset.filter === state.listFilter;
    b.classList.toggle('is-on', on);
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
  });

  renderContinue();

  const grid = document.getElementById('projectGrid');
  if (projects.length === 0) {
    grid.innerHTML = `
      <section class="ui-card" style="grid-column: 1 / -1; padding: 8px 24px;">
        <div class="ui-empty">
          <p class="ui-empty__title">还没有听力项目</p>
          <p class="ui-empty__text">上传一段听力音频，转录完成后就能逐句精听、记生词和笔记。</p>
          <button class="ui-btn ui-btn--md ui-btn--primary" type="button" onclick="openUploadModal()">上传音频</button>
        </div>
      </section>`;
    return;
  }
  const shown = projects.filter(p => listFilterMatch(p, state.listFilter));
  if (shown.length === 0) {
    const name = state.listFilter === 'done' ? '已掌握' : '未掌握';
    grid.innerHTML = `
      <section class="ui-card" style="grid-column: 1 / -1; padding: 8px 24px;">
        <div class="ui-empty"><p class="ui-empty__title">没有${name}的项目</p><p class="ui-empty__text">在精听页右侧点「标熟」，项目就会归到「已掌握」。</p></div>
      </section>`;
    return;
  }
  grid.innerHTML = shown.map(projectCardHtml).join('');
}

function projectCardHtml(p) {
  const busy = p.status !== 'completed';
  const title = esc(p.title);
  const date = p.created_at ? formatDate(p.created_at) : '';
  const dur = p.duration ? `<span class="lr-dot">${formatTime(p.duration)}</span>` : '';
  let tag = '', body = '';
  if (p.status === 'processing') {
    tag = '<span class="ui-tag ui-tag--warn">转录中</span>';
    body = '<div class="lr-proj__status">正在转成字幕，完成后这里自动刷新</div>';
  } else if (p.status === 'translating') {
    tag = '<span class="ui-tag ui-tag--warn">翻译中</span>';
    body = '<div class="lr-proj__status">字幕已出，正在润色和翻译</div>';
  } else if (p.status === 'error') {
    tag = '<span class="ui-tag ui-tag--err">失败</span>';
    body = `<div class="lr-proj__status is-err"><span>${esc(errorPhaseText(p))}</span><button class="ui-btn ui-btn--sm" type="button" data-act="retry" data-id="${esc(p.id)}">${ICONS.retry}重试</button></div>`;
  } else {
    if (p.mastered) tag = `<span class="ui-tag ui-tag--ok">${ICONS.check}已掌握</span>`;
    const stat = (n, label) => `<div class="lr-proj__stat"><span class="lr-proj__num">${n}</span><span class="lr-proj__label">${label}</span></div>`;
    body = `<div class="lr-proj__stats">${stat(p.checkin_count || 0, '打卡')}${stat(p.vocab_count || 0, '生词')}${stat(p.note_count || 0, '笔记')}</div>`;
  }
  const openAttrs = busy ? '' : ` role="link" tabindex="0" aria-label="打开 ${title}" data-act="open" data-id="${esc(p.id)}"`;
  return `
    <div class="lr-proj${busy ? ' is-busy' : ''}"${openAttrs}>
      <div class="lr-proj__head"><h2 class="lr-proj__title">${title}</h2><button class="lr-icon lr-icon--danger" type="button" data-act="delete" data-id="${esc(p.id)}" aria-label="删除 ${title}">${ICONS.trash}</button></div>
      <div class="lr-proj__meta"><span>${date}</span>${dur}${tag}</div>
      ${body}
    </div>`;
}

function errorPhaseText(p) {
  const phase = { transcribe: '转录失败：', polish: '润色翻译失败：' }[p.error_phase] || '处理失败：';
  return phase + (p.error || '未知错误');
}

document.getElementById('projectGrid').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  const id = btn.dataset.id;
  if (btn.dataset.act === 'delete') { e.stopPropagation(); openDeleteDialog(id); }
  else if (btn.dataset.act === 'retry') { e.stopPropagation(); retryProject(id); }
  else if (btn.dataset.act === 'open') openProject(id);
});
document.getElementById('projectGrid').addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const card = e.target.closest('[data-act="open"]');
  if (card && e.target === card) { e.preventDefault(); openProject(card.dataset.id); }
});
document.querySelectorAll('.list-filter').forEach(b => b.addEventListener('click', () => {
  state.listFilter = b.dataset.filter;
  renderListView();
}));

// --- 删除确认 ---
function openDeleteDialog(id) {
  const p = state.projects.find(x => x.id === id);
  if (!p) return;
  state.pendingDelete = id;
  const extras = [];
  if (p.vocab_count) extras.push(`${p.vocab_count} 个生词`);
  if (p.note_count) extras.push(`${p.note_count} 条笔记`);
  const what = extras.length ? `音频、字幕、${extras.join('和 ')}` : '音频和字幕';
  document.getElementById('deleteText').textContent = `「${p.title}」的${what}会一起删除，删了不能恢复。`;
  document.getElementById('deleteModal').hidden = false;
  document.getElementById('deleteConfirmBtn').focus();
}

function closeDeleteDialog() {
  document.getElementById('deleteModal').hidden = true;
  state.pendingDelete = null;
}

async function confirmDelete() {
  const id = state.pendingDelete;
  if (!id) return;
  const btn = document.getElementById('deleteConfirmBtn');
  btn.disabled = true;
  try {
    await deleteProject(id);
  } finally {
    btn.disabled = false;
    closeDeleteDialog();
  }
}

async function deleteProject(id) {
  const r = await API.del('/api/listening_review/project/' + id);
  if (r.success) { showToast('已删除', 'success'); await loadProjects(); }
  else showToast(r.error || '删除失败', 'error');
}

async function retryProject(id) {
  const r = await API.post('/api/listening_review/project/' + id + '/retry', {});
  if (r.success) { showToast(r.phase === 'polish' ? '字幕还在，已重新开始翻译' : '已重新开始转录'); await loadProjects(); }
  else showToast(r.error || '重试失败', 'error');
}

// --- 继续上次（只存在这台设备的浏览器里） ---
function readLastPosition() {
  try { return JSON.parse(localStorage.getItem(LAST_KEY) || 'null'); } catch { return null; }
}

function saveLastPosition() {
  if (!state.currentProject || !state.currentData || state.activeSegmentId < 0) return;
  const segs = state.currentData.segments || [];
  const idx = segs.findIndex(s => s.id === state.activeSegmentId);
  if (idx < 0) return;
  const record = {
    pid: state.currentProject.id,
    title: state.currentProject.title,
    seg: state.activeSegmentId,
    idx,
    total: segs.length,
    t: Math.round(audioEl.currentTime * 10) / 10
  };
  try { localStorage.setItem(LAST_KEY, JSON.stringify(record)); } catch {}
}

function renderContinue() {
  const card = document.getElementById('continueCard');
  const last = readLastPosition();
  const proj = last && state.projects.find(p => p.id === last.pid && p.status === 'completed');
  if (!proj) { card.hidden = true; return; }
  card.hidden = false;
  document.getElementById('continueTitle').textContent = proj.title;
  const n = (last.idx || 0) + 1, total = last.total || n;
  document.getElementById('continueBar').style.width = Math.min(100, Math.round(n / total * 100)) + '%';
  document.getElementById('continueNum').textContent = `第 ${n} 句 / ${total} · ${formatTime(last.t)}`;
}

async function continueLast() {
  const last = readLastPosition();
  if (!last) return;
  await openProject(last.pid);
  if (state.view !== 'detail') return;
  const seg = state.currentData?.segments.find(s => s.id === last.seg);
  const t = typeof last.t === 'number' ? last.t : (seg ? seg.start : 0);
  seekWhenReady(t, () => { audioEl.play().catch(() => {}); });
  if (seg) { state.activeSegmentId = seg.id; highlightSegment(seg.id); }
}

//  Upload Modal
// ===================================================================
const FILE_DROP_TEXT = '点这里选音频文件，或把文件拖进来';
const FILE_DROP_META = 'MP3、WAV、M4A、FLAC、OGG、MP4、WebM';

function openUploadModal() {
  document.getElementById('uploadModal').hidden = false;
  document.getElementById('fileTitle').value = '';
  document.getElementById('urlTitle').value = '';
  document.getElementById('urlInput').value = '';
  document.getElementById('fileInput').value = '';
  document.getElementById('fileDropText').textContent = FILE_DROP_TEXT;
  document.getElementById('fileDropMeta').textContent = FILE_DROP_META;
  document.getElementById('uploadFileBtn').disabled = true;
  switchTab('file');
}

function closeUploadModal() { document.getElementById('uploadModal').hidden = true; }

function switchTab(tab) {
  document.querySelectorAll('.modal-tab').forEach(t => {
    const on = t.dataset.tab === tab;
    t.classList.toggle('is-on', on);
    t.setAttribute('aria-selected', on ? 'true' : 'false');
  });
  document.getElementById('tabFile').hidden = tab !== 'file';
  document.getElementById('tabUrl').hidden = tab !== 'url';
  document.getElementById('uploadFileBtn').hidden = tab !== 'file';
  document.getElementById('uploadUrlBtn').hidden = tab !== 'url';
}

function onFileSelected(input) {
  const file = input.files[0];
  if (!file) return;
  if (file.size > 25 * 1024 * 1024) { showToast('文件超过 25 MB，换一个小一点的', 'error'); input.value = ''; return; }
  document.getElementById('fileDropText').textContent = file.name;
  document.getElementById('fileDropMeta').textContent = `${formatSize(file.size)} · 点这里换一个文件`;
  document.getElementById('uploadFileBtn').disabled = false;
}

async function doUploadFile() {
  const file = document.getElementById('fileInput').files[0];
  if (!file) return;
  const btn = document.getElementById('uploadFileBtn');
  btn.disabled = true; btn.textContent = '上传中…';
  const fd = new FormData();
  fd.append('file', file);
  fd.append('title', document.getElementById('fileTitle').value.trim());
  try {
    const r = await API.upload('/api/listening_review/upload', fd);
    if (r.success) { showToast('上传成功，正在转录', 'success'); closeUploadModal(); await loadProjects(); }
    else showToast(r.error || '上传失败', 'error');
  } catch (e) { showToast('上传失败：' + e.message, 'error'); }
  btn.disabled = false; btn.textContent = '上传并转录';
}

async function doUploadUrl() {
  const urlVal = document.getElementById('urlInput').value.trim();
  if (!urlVal) { showToast('请填写音频链接', 'error'); document.getElementById('urlInput').focus(); return; }
  const btn = document.getElementById('uploadUrlBtn');
  btn.disabled = true; btn.textContent = '下载中…';
  try {
    const r = await API.post('/api/listening_review/url', { url: urlVal, title: document.getElementById('urlTitle').value.trim() });
    if (r.success) { showToast('下载成功，正在转录', 'success'); closeUploadModal(); await loadProjects(); }
    else showToast(r.error || '下载失败', 'error');
  } catch (e) { showToast('请求失败：' + e.message, 'error'); }
  btn.disabled = false; btn.textContent = '下载并转录';
}

document.getElementById('urlInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') doUploadUrl(); });

// 点弹窗外的遮罩关闭
['uploadModal', 'deleteModal'].forEach(id => {
  const el = document.getElementById(id);
  el.addEventListener('click', (e) => {
    if (e.target !== el) return;
    if (id === 'uploadModal') closeUploadModal(); else closeDeleteDialog();
  });
});

// Drag & drop on file label
(function initDragDrop() {
  const label = document.getElementById('fileDropLabel');
  ['dragenter', 'dragover'].forEach(ev => {
    label.addEventListener(ev, (e) => { e.preventDefault(); label.classList.add('is-over'); });
  });
  ['dragleave', 'drop'].forEach(ev => {
    label.addEventListener(ev, (e) => { e.preventDefault(); label.classList.remove('is-over'); });
  });
  label.addEventListener('drop', (e) => {
    const file = e.dataTransfer.files[0];
    if (file) {
      const input = document.getElementById('fileInput');
      const dt = new DataTransfer();
      dt.items.add(file);
      input.files = dt.files;
      onFileSelected(input);
    }
  });
})();

// ===================================================================
//  Detail View
// ===================================================================
async function openProject(id) {
  const proj = state.projects.find(p => p.id === id);
  if (!proj) return;
  if (proj.status === 'processing') { showToast('还在转录，稍等一会儿'); return; }
  if (proj.status === 'translating') { showToast('还在润色翻译，稍等一会儿'); return; }
  if (proj.status === 'error') { showToast(errorPhaseText(proj), 'error'); return; }

  const r = await API.get('/api/listening_review/project/' + id);
  if (r.error) { showToast(r.error, 'error'); return; }

  state.currentProject = r.project;
  state.currentData = r.data;
  state.activeSegmentId = -1;
  state.pickerSeg = null;

  switchView('detail');
  document.getElementById('detailTitle').textContent = r.project.title;
  const segCount = (r.data?.segments || []).length;
  const metaParts = [];
  if (r.project.duration) metaParts.push(formatTime(r.project.duration));
  if (segCount) metaParts.push(`${segCount} 句`);
  document.getElementById('detailMeta').textContent = metaParts.join(' · ');
  document.getElementById('sideUploaded').textContent = r.project.created_at ? `${formatDate(r.project.created_at)}上传` : '';
  updateMasteredBtn(!!r.project.mastered);
  updateCheckinBtn(r.project.checkin_count || 0);
  toggleSide(window.matchMedia('(min-width: 1100px)').matches);

  const tk = localStorage.getItem('authToken');
  audioEl.src = `/api/listening_review/audio/${id}/${r.project.audio_filename}?token=${encodeURIComponent(tk)}`;
  audioEl.load();
  updateProgressBar(0);
  renderLyrics();
  renderNotesView();
  updateNotesButton();
}

function backToList() {
  hideNotePopover({ resumeAudio: false });
  hideVocabPopover({ resumeAudio: false });
  hideSelectionToolbar({ resumeAudio: false });
  closeErrorPicker({ resumeAudio: false });
  saveLastPosition();
  audioEl.pause();
  audioEl.removeAttribute('src');
  audioEl.load();
  state.currentProject = null;
  state.currentData = null;
  state.activeSegmentId = -1;
  switchView('list');
  loadProjects();
}

function toggleTranslations() {
  state.showTranslations = !state.showTranslations;
  document.getElementById('lyricsContainer').classList.toggle('lr-hide-zh', !state.showTranslations);
  const btn = document.getElementById('toggleTransBtn');

}

// 右侧「本篇」栏：宽屏收起 / 展开，窄屏是抽屉
function toggleSide(force) {
  state.sideOpen = typeof force === 'boolean' ? force : !state.sideOpen;

function isDrawerMode() { return !window.matchMedia('(min-width: 1100px)').matches; }

// ===================================================================
//  Lyrics Rendering
// ===================================================================
function renderLyrics() {
  const container = document.getElementById('lyricsContainer');
  if (!state.currentData || !state.currentData.segments) {
    container.innerHTML = '<div class="ui-empty"><p class="ui-empty__title">这篇没有字幕数据</p></div>';
    return;
  }
  container.innerHTML = state.currentData.segments.map(lineHtml).join('');
  renderSideNums();
}

function lineHtml(seg) {
  const starred = (state.currentData.starred_segments || []).includes(seg.id);
  const segAnnots = (state.currentData.vocab_annotations || []).filter(a => a.segment_id === seg.id);
  const segNotes = (state.currentData.notes || []).filter(n => n.segment_id === seg.id);
  const cls = 'lr-line' + (seg.id === state.activeSegmentId ? ' is-active' : '') + (starred ? ' is-starred' : '');
  const translation = seg.translation ? `<div class="lr-line__zh">${esc(seg.translation)}</div>` : '';
  return `
    <div class="${cls}" data-seg-id="${seg.id}" data-start="${seg.start}" data-end="${seg.end}">
      <button class="lr-line__time" type="button" tabindex="-1">${formatTime(seg.start)}</button>
      <button class="lr-line__star star-btn${starred ? ' is-on' : ''}" type="button" data-seg-id="${seg.id}" aria-label="${starred ? '取消收藏' : '收藏这句'}" aria-pressed="${starred}">${starred ? ICONS.starOn : ICONS.star}</button>
      <div class="lr-line__body">
        <div class="lr-line__en line-text" data-seg-id="${seg.id}">${renderAnnotatedText(seg.text, segAnnots, segNotes)}</div>
        ${translation}
        <div class="lr-why-slot" data-seg-id="${seg.id}">${starred ? whyHtml(seg.id) : ''}</div>
      </div>
    </div>`;
}

function getSegmentErrorTags(segId) {
  const all = (state.currentData && state.currentData.error_tags) || {};
  return all[String(segId)] || all[segId] || [];
}

function errorTagLabel(id) {
  const found = ERROR_TAGS.find(tag => tag.id === id);
  return found ? found.label : id;
}

function renderRestChips(tagIds) {
  return tagIds.map(id => `<span class="ui-tag error-rest-chip" data-tag="${esc(id)}">${esc(errorTagLabel(id))}</span>`).join('');
}

// 收藏句下面的「听错原因」：平时只列已选标签，点「改」展开 A–E 五个标签（可多选）
function whyHtml(segId) {
  const selected = getSegmentErrorTags(segId);
  if (state.pickerSeg === segId) {
    const chips = ERROR_TAGS.map(tag => {
      const on = selected.includes(tag.id);
      return `<button class="ui-chip error-bubble${on ? ' is-on' : ''}" type="button" data-tag="${tag.id}" data-seg-id="${segId}" aria-pressed="${on}" title="${esc(tag.hint)}">${tag.label}</button>`;
    }).join('');
    return `<div class="lr-why__picker" role="group" aria-label="听错原因，可多选">
      <span class="lr-why__hint">这句为什么没听出来？可多选，再点一次取消。展开时音频暂停。</span>
      ${chips}
      <button class="ui-btn ui-btn--sm" type="button" data-act="close-picker">完成</button>
    </div>`;
  }
  const btnText = selected.length ? '改' : '选原因';
  return `<div class="lr-why"><span class="lr-why__label">听错原因</span>${renderRestChips(selected)}<button class="lr-why__add" type="button" data-act="open-picker" data-seg-id="${segId}">${btnText}</button></div>`;

// Render a segment's text with overlap-safe vocab underlines + note highlights.
// Both annotation types can coexist on the same characters; we split the text at
// every annotation boundary so the markup never breaks, even when ranges overlap.
function renderAnnotatedText(text, vocabAnnots, noteAnnots) {
  const ranges = [];
  (vocabAnnots || []).forEach(a => ranges.push({ start: a.start_offset, end: a.end_offset, type: 'vocab', id: a.id, meaning: a.meaning, segId: a.segment_id }));
  (noteAnnots  || []).forEach(n => ranges.push({ start: n.start_offset, end: n.end_offset, type: 'note',  id: n.id }));
  if (ranges.length === 0) return esc(text);

  const bounds = new Set([0, text.length]);
  ranges.forEach(r => {
    if (r.start >= 0 && r.start <= text.length) bounds.add(r.start);
    if (r.end   >= 0 && r.end   <= text.length) bounds.add(r.end);
  });
  const points = [...bounds].sort((a, b) => a - b);

  let html = '';
  for (let i = 0; i < points.length - 1; i++) {
    const b0 = points[i], b1 = points[i + 1];
    if (b1 <= b0) continue;
    const slice = text.substring(b0, b1);
    const covering = ranges.filter(r => r.start <= b0 && r.end >= b1);
    if (covering.length === 0) { html += esc(slice); continue; }

    const vocab = covering.find(r => r.type === 'vocab');
    const note  = covering.find(r => r.type === 'note');
    const cls = [];
    let attrs = '';
    if (vocab) { cls.push('lr-vocab'); attrs += ` data-aid="${esc(vocab.id)}" data-seg-id="${vocab.segId}" data-meaning="${esc(vocab.meaning)}"`; }
    if (note)  { cls.push('lr-note');  attrs += ` data-note-id="${esc(note.id)}"`; }
    html += `<span class="${cls.join(' ')}"${attrs}>${esc(slice)}</span>`;
  }
  return html;
}

function hasTextSelection() {

  if (act && act.dataset.act === 'close-picker') { e.stopPropagation(); closeErrorPicker(); return; }

  if (e.target.closest('.lr-why, .lr-why__picker')) { e.stopPropagation(); return; }

lyricsContainer.addEventListener('mouseup', (e) => {
  if (state.lastPointer === 'touch') return;
  handleSelection(e.target.closest('.line-text'));
});

// Touch: long-press selection never fires a useful mouseup, so watch selectionchange instead
let touchSelTimer = null;
document.addEventListener('selectionchange', () => {
  if (state.lastPointer !== 'touch' || state.view !== 'detail') return;
  clearTimeout(touchSelTimer);
  touchSelTimer = setTimeout(() => {
    const sel = window.getSelection();
    if (!sel || sel.isCollapsed || !sel.rangeCount) return;
    const node = sel.getRangeAt(0).startContainer;
    const el = node.nodeType === 1 ? node : node.parentElement;
    const lineText = el && el.closest ? el.closest('.line-text') : null;
    if (lineText && lyricsContainer.contains(lineText)) handleSelection(lineText);
  }, 450);
});

function handleSelection(lineText) {
  if (!lineText) return;

  const sel = window.getSelection();
  if (!sel || sel.isCollapsed || !sel.toString().trim()) return;

  const segId = parseInt(lineText.dataset.segId);
  const seg = state.currentData?.segments.find(s => s.id === segId);
  if (!seg) return;

  const range = sel.getRangeAt(0);
  if (!lineText.contains(range.startContainer) || !lineText.contains(range.endContainer)) return;

  const rawText = sel.toString();
  const trimmed = rawText.trim();
  // Allow selecting a single word up to a full sentence within one segment.
  if (!trimmed || trimmed.length > 600) return;

  // Calculate plain-text offset by walking text nodes
  const rawStart = getTextOffset(lineText, range.startContainer, range.startOffset);
  if (rawStart === -1) return;

  const leadingSpaces = rawText.indexOf(trimmed);
  const startOffset = rawStart + leadingSpaces;
  const endOffset = startOffset + trimmed.length;

  if (seg.text.substring(startOffset, endOffset) !== trimmed) {
    const fb = seg.text.indexOf(trimmed);
    if (fb === -1) return;
    state.pendingVocab = { segmentId: segId, word: trimmed, startOffset: fb, endOffset: fb + trimmed.length };
  } else {
    state.pendingVocab = { segmentId: segId, word: trimmed, startOffset, endOffset };
  }

  beginVocabAudioPause();
  showSelectionToolbar(range.getBoundingClientRect());
}

/** Walk text nodes inside `root` and return the plain-text offset of `(node, offset)`. */
function getTextOffset(root, node, offset) {
  let pos = 0;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  let cur;
  while ((cur = walker.nextNode())) {
    if (cur === node) return pos + offset;
    pos += cur.textContent.length;
  }
  return -1;
}

function navHeight() {
  const nav = document.querySelector('.app-shell-nav');
  return nav ? nav.getBoundingClientRect().bottom : 0;

// --- Toolbar: "释义 / 笔记" shown on text selection ---
function showSelectionToolbar(rect) {
  hideSelectionToolbar({ resumeAudio: false }); // clear any previous toolbar
  const tb = document.getElementById('selectionToolbar');
  tb.hidden = false;
  const cx = rect.left + window.scrollX + rect.width / 2;
  const w = tb.offsetWidth;
  let left = cx - w / 2;
  left = Math.max(6, Math.min(left, document.documentElement.clientWidth - w - 6));
  // 手机上系统的「拷贝」菜单在选区上方，工具条放到选区下方免得被盖住
  let top = state.lastPointer === 'touch'
    ? rect.bottom + window.scrollY + 12
    : rect.top + window.scrollY - tb.offsetHeight - 8;
  if (top < window.scrollY + navHeight() + 6) top = rect.bottom + window.scrollY + 8;
  tb.style.left = left + 'px';
  tb.style.top  = top  + 'px';
}

function hideSelectionToolbar({ resumeAudio = true } = {}) {
  document.getElementById('selectionToolbar').hidden = true;
  if (resumeAudio) endVocabAudioPause();

function positionPopover(pop, rect) {
  pop.style.left = '-9999px';
  pop.style.top  = '-9999px';
  requestAnimationFrame(() => {
    const pw = pop.offsetWidth, ph = pop.offsetHeight;
    const cx = rect.left + window.scrollX + rect.width / 2;
    const cy = rect.top  + window.scrollY;
    let left = cx - pw / 2;
    let top  = cy - ph - 8;
    left = Math.max(8, Math.min(left, document.documentElement.clientWidth - pw - 8));
    if (top < window.scrollY + navHeight() + 8) top = rect.bottom + window.scrollY + 8;
    pop.style.left = left + 'px';
    pop.style.top  = top  + 'px';
  });
}

async function saveVocab() {
  const meaning = document.getElementById('vpInput').value.trim();
  if (!meaning) return;
  let payload;
  if (state.editingAnnot) {
    const a = state.editingAnnot;
    payload = { id: a.id, segment_id: a.segment_id, word: a.word, meaning, start_offset: a.start_offset, end_offset: a.end_offset };
  } else if (state.pendingVocab) {
    const pv = state.pendingVocab;
    payload = { segment_id: pv.segmentId, word: pv.word, meaning, start_offset: pv.startOffset, end_offset: pv.endOffset };
  } else {
    return;
  }
  const r = await API.put(`/api/listening_review/project/${state.currentProject.id}/vocab`, payload);
  if (r.success && r.data) {
    state.currentData = r.data;
    renderLyrics();
    refreshNotesView();
    updateNotesButton();
    showToast(payload.id ? '释义已更新' : '生词已保存', 'success');
  } else if (r.error) {
    showToast(r.error, 'error');
  }
  hideVocabPopover();
}

async function deleteVocab() {
  if (!state.viewingAnnot) return;
  const r = await API.del(`/api/listening_review/project/${state.currentProject.id}/vocab/${state.viewingAnnot.id}`);
  if (r.success && r.data) {
    state.currentData = r.data;
    renderLyrics();

}

// Render a sentence with one entry's span highlighted (no tooltip — for reading).
function renderSentenceWithSpan(text, start, end, kind) {
  if (text == null) return '';
  const s = Math.max(0, Math.min(start ?? 0, text.length));
  const e = Math.max(s, Math.min(end ?? 0, text.length));
  const cls = kind === 'note' ? 'lr-note' : 'lr-vocab';
  return esc(text.substring(0, s)) + `<span class="${cls}">` + esc(text.substring(s, e)) + '</span>' + esc(text.substring(e));
}

function renderNotesView() {
  const body = document.getElementById('notesViewBody');
  const countEl = document.getElementById('notesViewCount');
  if (!state.currentData) { body.innerHTML = ''; countEl.textContent = ''; return; }

  const segMap = {};
  (state.currentData.segments || []).forEach(s => { segMap[s.id] = s; });

  const mk = (kind, a) => {
    const seg = segMap[a.segment_id] || {};
    return {
      kind, id: a.id, segId: a.segment_id,
      quote: kind === 'note' ? a.quote : a.word,
      body:  kind === 'note' ? a.note  : a.meaning,
      startOff: a.start_offset, endOff: a.end_offset,
      start: seg.start ?? 0, sentence: seg.text || ''
    };
  };
  const notes = (state.currentData.notes || []).map(n => mk('note', n));
  const vocab = (state.currentData.vocab_annotations || []).map(v => mk('vocab', v));

  const all = [...notes, ...vocab].sort((a, b) => a.start - b.start || a.startOff - b.startOff);
  countEl.textContent = `${notes.length} 笔记 · ${vocab.length} 生词`;

  const f = state.notesFilter;
  const items = all.filter(it => f === 'all' || it.kind === f);

  if (items.length === 0) {
    const tip = f === 'vocab' ? '还没有生词' : f === 'note' ? '还没有笔记' : '还没有笔记和生词';
    body.innerHTML = `<div class="ui-empty"><p class="ui-empty__title">${tip}</p><p class="ui-empty__text">在左边字幕里选中词或句子，就能加释义或写笔记。</p></div>`;
    return;
  }

  body.innerHTML = items.map(it => {
    const isNote = it.kind === 'note';
    const tag = isNote ? '<span class="ui-tag">笔记</span>' : '<span class="ui-tag ui-tag--accent">生词</span>';
    const what = isNote ? '这条笔记' : '这个生词';
    return `
      <article class="lr-entry">
        <div class="lr-entry__top">${tag}<button class="lr-entry__time" type="button" data-act="jump" data-seg-id="${it.segId}" aria-label="跳到 ${formatTime(it.start)}">${formatTime(it.start)}</button>
          <div class="lr-entry__acts">
            <button class="lr-icon" type="button" data-act="edit" data-kind="${it.kind}" data-id="${esc(it.id)}" aria-label="${isNote ? '编辑这条笔记' : '改这个生词的释义'}">${ICONS.edit}</button>
            <button class="lr-icon lr-icon--danger" type="button" data-act="delete" data-kind="${it.kind}" data-id="${esc(it.id)}" aria-label="删除${what}">${ICONS.trash}</button>
          </div>
        </div>
        <div class="lr-entry__en">${renderSentenceWithSpan(it.sentence, it.startOff, it.endOff, it.kind)}</div>
        <div class="lr-entry__body">${esc(it.body)}</div>
      </article>`;
  }).join('');
}

document.getElementById('notesViewBody').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  if (btn.dataset.act === 'jump') jumpToNote(parseInt(btn.dataset.segId));
  else if (btn.dataset.act === 'edit') {
    if (btn.dataset.kind === 'note') editNoteFromView(btn.dataset.id);
    else editVocabFromView(btn.dataset.id);
  } else if (btn.dataset.act === 'delete') deleteFromView(btn.dataset.kind, btn.dataset.id);
});

function jumpToNote(segId) {
  if (isDrawerMode()) toggleSide(false);
  const seg = state.currentData?.segments.find(s => s.id === segId);
  if (!seg) return;
  audioEl.currentTime = seg.start;
  state.activeSegmentId = segId;
  highlightSegment(segId);
}

function scrollThen(el, fn) {
  if (isDrawerMode()) toggleSide(false);
  el.scrollIntoView({ block: 'center', behavior: 'smooth' });
  setTimeout(fn, 360);
}

function editNoteFromView(noteId) {
  const el = document.querySelector(`.lr-note[data-note-id="${CSS.escape(noteId)}"]`);
  if (!el) return;
  scrollThen(el, () => { openNoteView(el); editCurrentNote(); });
}

function editVocabFromView(vocabId) {
  const el = document.querySelector(`.lr-vocab[data-aid="${CSS.escape(vocabId)}"]`);
  if (!el) return;
  scrollThen(el, () => { showViewPopover(el); editVocabMeaning(); });
}

async function deleteFromView(kind, id) {
  const url = kind === 'note'
    ? `/api/listening_review/project/${state.currentProject.id}/note/${id}`
    : `/api/listening_review/project/${state.currentProject.id}/vocab/${id}`;
  const r = await API.del(url);
  if (r.success && r.data) {
    state.currentData = r.data;
    renderLyrics();
    renderNotesView();
    updateNotesButton();
    showToast('已删除');
  }
}

// ===================================================================
//  Audio Player
// ===================================================================
let lastSavedAt = 0;
audioEl.addEventListener('timeupdate', () => {
  if (!state.currentData) return;
  const t = audioEl.currentTime;
  updateProgressBar(t);

  const segs = state.currentData.segments;
  let newActive = -1;
  for (const seg of segs) {
    if (t >= seg.start && t < seg.end) { newActive = seg.id; break; }
  }
  if (newActive === -1 && segs.length > 0) {
    for (let i = segs.length - 1; i >= 0; i--) {
      if (t >= segs[i].start) { newActive = segs[i].id; break; }
    }
  }

  if (newActive !== state.activeSegmentId && newActive >= 0) {
    state.activeSegmentId = newActive;
    highlightSegment(newActive);
  }
  // 只在真正播放时记「上次听到哪」，光打开看一眼不算
  if (!audioEl.paused && Date.now() - lastSavedAt > 3000) {
    lastSavedAt = Date.now();
    saveLastPosition();
  }
});

function setPlayIcon(playing) {
  const btn = document.getElementById('playBtn');
  btn.innerHTML = playing ? ICONS.pause : ICONS.play;
  btn.setAttribute('aria-label', playing ? '暂停' : '播放');
}

audioEl.addEventListener('play',  () => setPlayIcon(true));
audioEl.addEventListener('pause', () => { setPlayIcon(false); saveLastPosition(); });
audioEl.addEventListener('loadedmetadata', () => {
  document.getElementById('totTime').textContent = formatTime(audioEl.duration);
  audioEl.playbackRate = state.playbackRate;
});

function togglePlay() {
  markVocabAudioManualOverride();
  audioEl.paused ? audioEl.play().catch(() => {}) : audioEl.pause();
}

function updateProgressBar(t) {
  const dur = audioEl.duration || 0;
  const pct = dur ? Math.min(100, (t / dur) * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressThumb').style.left = pct + '%';
  document.getElementById('curTime').textContent = formatTime(t);
  const wrap = document.getElementById('progressWrap');
  wrap.setAttribute('aria-valuemin', '0');
  wrap.setAttribute('aria-valuemax', String(Math.round(dur)));
  wrap.setAttribute('aria-valuenow', String(Math.round(t)));
}

function highlightSegment(segId) {
  const container = document.getElementById('lyricsContainer');
  container.querySelectorAll('.lr-line.is-active').forEach(el => el.classList.remove('is-active'));
  const lineEl = container.querySelector(`.lr-line[data-seg-id="${segId}"]`);
  if (!lineEl) return;

  lineEl.classList.add('is-active');

  // 滚到导航栏和播放条之间的正中间
  const topH = navHeight();
  const bottomH = document.getElementById('lrPlayer').offsetHeight;
  const visibleH = window.innerHeight - topH - bottomH;
  const targetY = lineEl.getBoundingClientRect().top + window.scrollY - topH - visibleH / 2 + lineEl.offsetHeight / 2;
  window.scrollTo({ top: Math.max(0, targetY), behavior: 'smooth' });
}

function seekToSegment(segId) {
  const seg = state.currentData.segments.find(s => s.id === segId);
  if (!seg) return;
  audioEl.currentTime = seg.start;
  if (audioEl.paused) audioEl.play().catch(() => {});
  state.activeSegmentId = segId;
  highlightSegment(segId);
}

// Progress bar interaction (mouse, touch and pen)
(function initProgressBar() {
  const wrap = document.getElementById('progressWrap');
  let dragging = false;

  function seekFromEvent(e) {
    const rect = wrap.getBoundingClientRect();
    const ratio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    if (audioEl.duration) audioEl.currentTime = ratio * audioEl.duration;
  }

  wrap.addEventListener('pointerdown', (e) => { dragging = true; wrap.setPointerCapture(e.pointerId); seekFromEvent(e); });
  wrap.addEventListener('pointermove', (e) => { if (dragging) seekFromEvent(e); });
  wrap.addEventListener('pointerup', () => { dragging = false; });
  wrap.addEventListener('pointercancel', () => { dragging = false; });
  wrap.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') e.stopPropagation();
    if (e.key === 'ArrowLeft') audioEl.currentTime = Math.max(0, audioEl.currentTime - 3);
    if (e.key === 'ArrowRight') audioEl.currentTime = Math.min(audioEl.duration || 0, audioEl.currentTime + 3);
  });
})();

// Speed control
function setSpeed(rate) {
  state.playbackRate = rate;
  audioEl.playbackRate = rate;
  document.querySelectorAll('.speed-btn').forEach(b => {
    const on = parseFloat(b.dataset.rate) === rate;
    b.classList.toggle('is-on', on);
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
}

// ===================================================================
//  Star Toggle & error reasons
// ===================================================================
async function toggleStar(segId) {
  if (!state.currentProject) return;
  const r = await API.put(`/api/listening_review/project/${state.currentProject.id}/star`, { segment_id: segId });
  if (!r.success) { showToast(r.error || '收藏失败', 'error'); return; }

  state.currentData.starred_segments = r.starred_segments;
  const lineEl = document.querySelector(`.lr-line[data-seg-id="${segId}"]`);
  if (!lineEl) return;

  const isStarred = r.starred_segments.includes(segId);
  if (!isStarred && state.pickerSeg === segId) closeErrorPicker();
  lineEl.classList.toggle('is-starred', isStarred);
  const btn = lineEl.querySelector('.star-btn');
  if (btn) {
    btn.innerHTML = isStarred ? ICONS.starOn : ICONS.star;
    btn.classList.toggle('is-on', isStarred);
    btn.setAttribute('aria-pressed', isStarred ? 'true' : 'false');
    btn.setAttribute('aria-label', isStarred ? '取消收藏' : '收藏这句');
  }
  syncErrorTagUi(segId);
  renderSideNums();
}

async function toggleErrorTag(segId, tag) {
  if (!state.currentProject || !state.currentData) return;
  const r = await API.put(`/api/listening_review/project/${state.currentProject.id}/error_tag`, {
    segment_id: segId,
    tag
  });
  if (!r.success) { showToast(r.error || '分类失败', 'error'); return; }
  state.currentData.error_tags = r.error_tags || {};
  syncErrorTagUi(segId);
}

// ===================================================================
//  Mastered & Check-in
// ===================================================================
async function toggleMastered() {
  if (!state.currentProject) return;
  const r = await API.put(`/api/listening_review/project/${state.currentProject.id}/mastered`, {});
  if (!r.success) { showToast(r.error || '操作失败', 'error'); return; }
  state.currentProject.mastered = r.mastered;
  const proj = state.projects.find(p => p.id === state.currentProject.id);
  if (proj) proj.mastered = r.mastered;
  updateMasteredBtn(r.mastered);
  showToast(r.mastered ? '已标记为掌握' : '已取消标熟', 'success');
}

function updateMasteredBtn(mastered) {
  const btn = document.getElementById('masteredBtn');
  btn.classList.toggle('is-mastered', !!mastered);
  btn.setAttribute('aria-pressed', mastered ? 'true' : 'false');
  btn.innerHTML = mastered ? `${ICONS.check}已掌握` : '标熟';
  btn.title = mastered ? '再点一次取消标熟' : '标记为已掌握';
}

async function doCheckin() {
  if (!state.currentProject) return;
  const r = await API.post(`/api/listening_review/project/${state.currentProject.id}/checkin`, {});
  if (!r.success) { showToast(r.error || '操作失败', 'error'); return; }
  state.currentProject.checkin_count = r.checkin_count;
  const proj = state.projects.find(p => p.id === state.currentProject.id);
  if (proj) proj.checkin_count = r.checkin_count;
  updateCheckinBtn(r.checkin_count);
  showToast(`打卡成功，已打卡 ${r.checkin_count} 次`, 'success');
}

function updateCheckinBtn(count) {
  document.getElementById('sideCheckinNum').textContent = count || 0;
}

// ===================================================================
//  Keyboard Shortcuts
// ===================================================================
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (!document.getElementById('uploadModal').hidden) { closeUploadModal(); return; }
    if (!document.getElementById('deleteModal').hidden) { closeDeleteDialog(); return; }
    if (!document.getElementById('vocabPopover').hidden) { hideVocabPopover(); return; }
    if (!document.getElementById('notePopover').hidden) { hideNotePopover(); return; }
    if (!document.getElementById('selectionToolbar').hidden) { hideSelectionToolbar(); state.pendingVocab = null; return; }
    if (state.pickerSeg !== null) { closeErrorPicker(); return; }
    if (state.view === 'detail' && state.sideOpen && isDrawerMode()) { toggleSide(false); return; }
    return;
  }
  if (state.view !== 'detail') return;
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.code === 'Space')      { e.preventDefault(); togglePlay(); }
  else if (e.code === 'ArrowLeft')  { e.preventDefault(); audioEl.currentTime = Math.max(0, audioEl.currentTime - 3); }
  else if (e.code === 'ArrowRight') { e.preventDefault(); audioEl.currentTime = Math.min(audioEl.duration || 0, audioEl.currentTime + 3); }
});

// ===================================================================
//  Utilities
// ===================================================================
// 文本和属性值都会经过这里，所以引号也要转义（生词释义里有英文双引号时不会弄坏那一句）
function esc(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function formatTime(s) {
  if (!s || isNaN(s)) return '0:00';
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return m + ':' + (sec < 10 ? '0' : '') + sec;
}

function formatDate(value) {
  const d = new Date(value);
  if (isNaN(d)) return '';
  const now = new Date();
  const md = `${d.getMonth() + 1} 月 ${d.getDate()} 日`;
  return d.getFullYear() === now.getFullYear() ? md : `${d.getFullYear()} 年 ${md}`;
}

function formatSize(bytes) {
  if (bytes >= 1024 * 1024) return (bytes / 1024 / 1024).toFixed(1) + ' MB';
  return Math.max(1, Math.round(bytes / 1024)) + ' KB';
}

function showToast(msg, type) {
  if (window.IELTSUI && IELTSUI.toast) IELTSUI.toast(msg, type || 'info');
  else console.log(msg);
}
